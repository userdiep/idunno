  /* Utilise optPick.n (voir pickOptimalAvgSessions) plutôt que le simple
     milieu de fourchette avgSessionsPerWeek(profile) — la fréquence
     réellement appliquée à chaque machine tient maintenant compte à la fois
     de la fourchette séances/semaine ET de la fourchette temps/séance
     réglées dans Options, pas juste de la première. */
  function reapplyGoalToProgram(){ persistConfig(exercises, applyGoalToProgram(program, exercises, profile.goal, optPick.n, muscleFocus, profile), {reoptimize:false}); setReapplyPrompt(false); }
  /* Ajouté le 6 sept. 2026 — remplace setReapplyPrompt(true) pour les
     changements d'équilibrage (muscleFocus) et de temps/nombre de séances
     (sessionsMin/Max, sessionMinutesMin/Max) : contrairement à applyGoal, ces
     réglages n'ont pas d'effet nutrition, et l'utilisateur a explicitement
     demandé qu'ils s'appliquent immédiatement aux séances déjà en place, sans
     bandeau "Optimiser mes séances" à confirmer.

     `patch` est appliqué au profil AVANT de recalculer optPick (contrairement
     à reapplyGoalToProgram ci-dessus, qui lit optPick/muscleFocus déjà
     calculés dans le rendu précédent) : sans ça, le premier changement après
     un rendu utiliserait encore l'ancienne fourchette séances/temps ou
     l'ancien équilibrage pour choisir la fréquence optimale, un cran en
     retard sur ce que l'utilisateur vient de régler. */
  function applyBalanceOrTimeChange(patch) {
    var newProfile = Object.assign({}, profile, patch);
    var mf = ("muscleFocus" in patch) ? patch.muscleFocus : muscleFocus;
    /* Le NOUVEL objectif, pas l'ancien — sans ça, changer d'objectif
       d'entraînement recalculait le programme avec les repères du précédent
       (corrigé le 6 sept. 2026 en même temps que l'application immédiate du
       changement d'objectif, voir applyGoal). */
    var goalTarget = newProfile.goal || goalNow;
    var pick = pickOptimalAvgSessions(program, exercises, goalTarget,
      newProfile.sessionsMin, newProfile.sessionsMax,
      newProfile.sessionMinutesMin||0, newProfile.sessionMinutesMax||90, mf);
    setProfile(newProfile);
    /* newProfile (et pas `profile`) est passé à applyGoalToProgram : c'est ce
       qui fait que changer l'ORDRE DE PRIORITÉ réajuste les séances dans le
       même geste, sans bandeau à confirmer — demande du 6 sept. 2026 ("il faut
       que les séances s'ajustent à chaque fois que je change la priorité"). */
    /* reoptimize:false : le programme est DÉJÀ calculé ici avec newProfile.
       persistConfig, lui, relirait state.profile — encore l'ANCIEN à cet
       instant (setProfile ci-dessus n'est pas encore appliqué au rendu), et
       écraserait donc ce calcul par un calcul basé sur le réglage précédent. */
    persistConfig(exercises, applyGoalToProgram(program, exercises, goalTarget, pick.n, mf, newProfile), {reoptimize:false});
  }
  var totalItems = program.reduce(function(a,d){return a+d.items.length;},0);
  /* "Priorité par muscle" (demande du 5 sept. 2026 : "choisir la proportion
     de chaque muscle travaillé ou choisir de tout équilibrer") — liste
     seulement les muscles réellement présents dans le matériel déjà ajouté
     (voir allMuscles), pas la liste MUSCLES en entier : pas d'intérêt à
     régler la priorité d'un muscle sans aucune machine dessus. */
  var usedMuscles = MUSCLES.filter(function(mu){ return exercises.some(function(e){ return allMuscles(e).indexOf(mu)>=0; }); });
  var muscleFocusCustomized = Object.keys(muscleFocus).length > 0;
  function setMuscleFocusFor(mu, v) {
    var mf = Object.assign({}, muscleFocus);
    if (v == null || Math.abs(v-1) < 0.001) { delete mf[mu]; } else { mf[mu] = Math.max(0.25, Math.min(3, v)); }
    applyBalanceOrTimeChange({ muscleFocus: mf });
  }
  function resetMuscleFocus() { applyBalanceOrTimeChange({ muscleFocus: {} }); }
  /* Voir PRIORITY_KEYS et la section "Ordre de priorité" du rendu. Passe par
     applyBalanceOrTimeChange, donc le nouvel ordre est appliqué aux séances
     dans le même geste (pas de bandeau à confirmer). */
  var priorityOrder = priorityOrderOf(profile);
  function movePriority(i, dir) {
    var j = i + dir;
    if (j < 0 || j >= priorityOrder.length) return;
    var next = priorityOrder.slice();
    var tmp = next[i]; next[i] = next[j]; next[j] = tmp;
    applyBalanceOrTimeChange({ priorityOrder: next });
  }

function HistoriqueTab(props){
  var sessions=props.sessions, exMap=props.exMap, program=props.program, deleteSession=props.deleteSession;
  var _o = useState(null), open=_o[0], setOpen=_o[1];
  var done = sessions.filter(function(s){return s.done;}).slice().reverse();
  if (done.length===0) {
    return h("div",{style:{borderRadius:10,padding:24,textAlign:"center",background:C.shroudDeep,border:"1px dashed "+C.taupeDim}},
      h("div",{style:{fontFamily:sansCond,fontSize:17,fontWeight:600,marginBottom:6}}, "Rien d'enregistré"),
      h("div",{style:{fontSize:14,color:C.taupe,lineHeight:1.5}}, "Enregistre une séance et elle apparaîtra ici. C'est aussi ce qui alimente la progression automatique."));
  }
  return h(Section, {title: done.length+" séance"+(done.length>1?"s":"")+" enregistrée"+(done.length>1?"s":"")}, done.map(function(s){
    var day = program.find(function(d){return d.key===s.dayKey;});
    var tonnage = s.entries.reduce(function(a,e){ return a + e.sets.reduce(function(b,x){ return b + (x.weight||0)*(x.reps||0); },0); },0);
    var rirs = []; s.entries.forEach(function(e){ e.sets.forEach(function(x){ if (x.rir!=null) rirs.push(x.rir); }); });
    var avgRir = rirs.length ? (rirs.reduce(function(a,b){return a+b;},0)/rirs.length) : null;
    var effortWord = effortLabelForRir(avgRir);
    var isOpen = open===s.id;
    return h("div",{key:s.id, style:{marginBottom:8,borderRadius:10,overflow:"hidden",border:"1px solid "+C.taupeDim}},
      h("button",{onClick:function(){setOpen(isOpen?null:s.id);}, style:{width:"100%",padding:"12px",display:"flex",alignItems:"center",justifyContent:"space-between",background:C.shroudDeep,border:"none",textAlign:"left"}},
        h("div",null,
          h("div",{style:{fontFamily:sansCond,fontSize:16,fontWeight:600,color:day?day.accent:C.bone}}, (day?day.label:s.dayKey)+(s.deload?" · décharge":"")),
          h("div",{style:{fontFamily:sansCond,fontSize:12,color:C.taupe}},
            new Date(s.date).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}) + " · " + Math.round(tonnage).toLocaleString("fr-FR") + " kg" + (effortWord?" · ressenti "+effortWord:""))),
        h(Icon,{name:isOpen?"chevronDown":"chevronRight", size:17, color:C.taupe})),
      isOpen ? h("div",{style:{background:C.shroud}},
        s.entries.map(function(e,i){ var ex=exMap[e.ex]; return h("div",{key:i, style:{padding:"8px 12px",borderTop:"1px solid "+C.shroudDeep}},
          h("div",{style:{fontSize:14,fontWeight:600}}, ex?ex.name:"Machine supprimée"),
          h("div",{style:{fontSize:13.5,color:C.taupe,fontVariantNumeric:"tabular-nums"}},
            e.sets.map(function(x){ return x.weight+"×"+x.reps+(ex&&ex.trackBy==="time"?"s":"")+(x.rir!=null?" ("+effortLabelForRir(x.rir)+")":"")+(x.weakSide?" ["+(x.weakSide==="L"?"G+dur":"D+dur")+"]":""); }).join("   "))); }),
        h("div",{style:{padding:"8px 12px",borderTop:"1px solid "+C.shroudDeep}},
          h("button",{onClick:function(){deleteSession(s.id);}, style:{display:"flex",alignItems:"center",gap:5,color:C.rust,fontFamily:sansCond,fontSize:13,background:"transparent",border:"none"}},
            h(Icon,{name:"trash",size:13}), "Supprimer cette séance"))
      ) : null);
  }));
}

/* Palier poly/semi/isolation : déterminé par l'app (voir inferOrderTier),
   pas demandé à l'utilisateur — ManualAdd ne montre plus ce sélecteur à la
   création. Il reste ici comme correcteur manuel, utilisable depuis le
   badge en séance et depuis "Matériel disponible" (onglet Machines), pour
   les cas où la devinette automatique tombe à côté. */
/* Sélection à choix multiples des muscles ciblés par une machine (voir
   allMuscles) — chips plutôt qu'un <select multiple> natif, peu maniable au
   doigt sur mobile. value = tableau de noms (sous-ensemble de MUSCLES),
   onChange reçoit le nouveau tableau complet. */
/* Sélection à choix multiples des muscles ciblés par une machine (voir
   allMuscles), AVEC intensité par muscle (voir muscleWeight — "Principal"
   = poids 1, "Secondaire" = 0.5). value = tableau de noms, intensity = map
   {muscle: poids}, onChange(value, intensity) reçoit les deux mis à jour
   ensemble (retirer un muscle nettoie aussi son entrée d'intensité). Chips
   plutôt qu'un <select multiple> natif, peu maniable au doigt sur mobile. */
function MusclePicker(props){
  var value = props.value || [], intensity = props.intensity || {}, onChange = props.onChange;
  /* Changé le 6 sept. 2026 suite à un signalement concret : "pourquoi y a 18
     séries pour le triceps alors que c'était censé être équilibré ?". Avant
     ce changement, cocher un 2e (ou 3e) muscle laissait sa case dans
     `intensity` non renseignée — donc "Principal" (1×) PAR DÉFAUT tant qu'on
     n'appuyait pas explicitement sur "Secondaire" (voir muscleWeight, qui
     retombe sur 1 si intensity[mu] est absent). Or le muscle ajouté après le
     premier est presque toujours un mouvement SECONDAIRE dans l'usage réel
     (ex. triceps sur un développé pectoraux) — et un muscle très répandu en
     co-sollicitation sur plusieurs machines de poussée (chest press, dips,
     shoulder press...), s'il reste par erreur à 1× partout au lieu de 0,5×,
     peut facilement dépasser sa cible hebdomadaire de plusieurs fois (voir
     applyGoalToProgram/optimizationScore) sans qu'on ait rien réglé de
     travers ailleurs — juste un clic "Secondaire" oublié à chaque ajout.
     Désormais, tout muscle coché APRÈS le premier bascule par défaut en
     Secondaire (0,5×, voir l'InfoTip "D'où vient ce 0,5×" plus bas) — le
     premier reste implicitement Principal (1×, rien à comparer). "Principal"
     reste un simple clic si un muscle ajouté est réellement co-principal
     (ex. squat : quadriceps ET fessiers). Purement additif pour les machines
     déjà configurées : voir withSecondaryMuscleDefaults plus bas pour la
     migration correspondante sur les données déjà enregistrées. */
  function toggle(m){
    var has = value.indexOf(m) >= 0;
    if (has) {
      var nextV = value.filter(function(x){return x!==m;});
      var nextI = Object.assign({}, intensity);
      delete nextI[m];
      onChange(nextV, nextI);
    } else {
      var nextV2 = value.concat([m]);
      var nextI2 = Object.assign({}, intensity);
      if (nextV2.length > 1) nextI2[m] = 0.5;
      onChange(nextV2, nextI2);
    }
  }
  function setLevel(m, w){
    var nextI = Object.assign({}, intensity);
    nextI[m] = w;
    onChange(value, nextI);
  }
  return h("div", null,
    h("div",{style:{display:"flex",flexWrap:"wrap",gap:6,marginBottom:value.length>1?8:0}}, MUSCLES.map(function(m){
      var on = value.indexOf(m) >= 0;
      return h("button",{key:m, onClick:function(){toggle(m);},
        style:{padding:"6px 10px",borderRadius:6,background:on?C.pin:C.shroud,color:on?C.ink:C.taupe,
          border:"1px solid "+(on?"transparent":C.taupeDim),fontFamily:sansCond,fontSize:12.5,fontWeight:600}}, m);
    })),
    value.length>1 ? h("div",{style:{display:"flex",flexDirection:"column",gap:4,marginBottom:6}}, value.map(function(m){
      var w = intensity[m]!=null ? intensity[m] : 1;
      return h("div",{key:m, style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,padding:"5px 8px",borderRadius:6,background:C.shroud}},
        h("span",{style:{fontSize:12.5,color:C.bone}}, m),
        h("div",{style:{display:"flex",gap:4}},
          h("button",{onClick:function(){setLevel(m,1);}, style:{padding:"4px 8px",borderRadius:5,background:w>=1?C.pin:C.shroudDeep,color:w>=1?C.ink:C.taupe,border:"1px solid "+C.taupeDim,fontFamily:sansCond,fontSize:11,fontWeight:600}}, "Principal"),
          h("button",{onClick:function(){setLevel(m,0.5);}, style:{padding:"4px 8px",borderRadius:5,background:w<1?C.pin:C.shroudDeep,color:w<1?C.ink:C.taupe,border:"1px solid "+C.taupeDim,fontFamily:sansCond,fontSize:11,fontWeight:600}}, "Secondaire")));
    })) : null,
    value.length>1 ? h("p",{style:{fontSize:11,color:C.taupe,lineHeight:1.4,marginBottom:4}},
      "\"Secondaire\" compte pour moitié dans le volume hebdomadaire de ce muscle — pour un muscle qui participe sans être la cible principale (ex. triceps sur un développé pectoraux).") : null,
    /* Ajouté le 5 sept. 2026 (demande : "comment est réparti pour
       l'équilibrage les muscles secondaires des machines ? répartis les
       selon la littérature") — recherche web du 5 sept. 2026 : il n'existe
       PAS de fraction validée par un essai contrôlé pour le volume d'un
       muscle secondaire. Les sources sérieuses divergent carrément entre
       elles : Grov.fit compte le travail direct à 1,0 et l'indirect à environ
       0,5 (ce que reproduit ce 0,5×) ; Weightology (guide "evidence-based")
       ne compte souvent QUE le moteur principal, secondaire = 0 dans le
       décompte ; RP Strength évite les fractions en ajustant directement ses
       repères de volume (MEV/MRV) pour absorber le travail indirect, plutôt

    } catch(e) {}
  }
  function releaseWakeLock(){
    try {
      if (wakeLockRef.current) { wakeLockRef.current.release().catch(function(){}); wakeLockRef.current = null; }
    } catch(e) {}
  }
  useEffect(function(){
    function onVisible(){
      if (document.visibilityState === "visible" && restTimer) acquireWakeLock();
    }
    document.addEventListener("visibilitychange", onVisible);
    return function(){ document.removeEventListener("visibilitychange", onVisible); };
  }, [restTimer]);
  function startRestTimer(seconds, label){
    restIdRef.current += 1;
    setRestTimer({ id: restIdRef.current, endTime: Date.now() + seconds*1000, duration: seconds, label: label });
    acquireWakeLock();
  }
  function adjustRestTimer(delta){
    setRestTimer(function(rt){ return rt ? Object.assign({}, rt, {endTime: rt.endTime + delta*1000}) : rt; });
  }
  function stopRestTimer(){ setRestTimer(null); releaseWakeLock(); }

  /* Réoptimisation automatique — demande du 6 sept. 2026 : "quand j'ajoute ou
     supprime ou change une machine, est-ce que mon programme se modifie dans
     l'ordre de priorité de mes objectifs ? je veux que ça le fasse tout de
     suite [...] chaque fois que je modifie un paramètre qui peut changer les
     programmes, ça le mette directement à jour."

     Réponse à la question telle qu'elle était posée : NON, ça ne le faisait
     pas. Seuls les réglages d'Options (objectif, priorité par muscle, séances,
     temps, ordre de priorité) réappliquaient la répartition. Tout ce qui passe
     par persistConfig — ajouter une machine, en supprimer une, l'échanger,
     changer ses muscles, son palier poly/isolation, son suivi reps/temps, sa
     salle, l'ajouter ou la retirer d'un jour — écrivait le programme tel quel.
     Or ce sont exactement les changements qui déplacent le volume par muscle :
     supprimer la seule machine d'abducteurs, ou passer un muscle de principal
     à secondaire, change les cibles sans que rien ne soit recalculé. Il fallait
     penser à aller cliquer "Optimiser mes séances" dans Options.

     Désormais ce point de passage unique recalcule systématiquement : il
     rechoisit la fréquence optimale dans la fourchette réglée
     (pickOptimalAvgSessions) puis réapplique applyGoalToProgram AVEC le profil,
     donc en respectant l'ordre de priorité choisi (voir PRIORITY_KEYS).

     UNE exception, `opts.reoptimize === false` : l'édition manuelle des
     séries/reps/repos d'une machine dans "Composer les séances". Réoptimiser
     là écraserait la valeur dans le même geste que la saisie — le bouton
     paraîtrait cassé. Ces réglages manuels restent donc en place jusqu'à la
     prochaine réoptimisation déclenchée par autre chose, comme avant. */
  function persistConfig(exercises, program, opts){
    if (opts && opts.reoptimize === false) { setState({exercises:exercises, program:program}); return; }
    var prof = state.profile || {};
    var mf = prof.muscleFocus || {};
    var pick = pickOptimalAvgSessions(program, exercises, prof.goal,
      prof.sessionsMin, prof.sessionsMax,
      prof.sessionMinutesMin||0, prof.sessionMinutesMax==null?90:prof.sessionMinutesMax, mf);
    var next = applyGoalToProgram(program, exercises, prof.goal, pick ? pick.n : avgSessionsPerWeek(prof), mf, prof);
    setState({exercises:exercises, program:next});
  }
  function persistSessions(sessions){ setState({sessions:sessions}); }
  function setActive(active){ if (!active) { setRestTimer(null); releaseWakeLock(); } setState({active:active}); }
  function setDeloadForNextStart(v){ setState({deloadForNextStart:v}); }
  function snoozeDeload(){ setState(function(prev){ return Object.assign({},prev,{meta:{deloadSnoozeUntil: prev.sessions.filter(function(s){return s.done;}).length + 4}}); }); }
  function finishSession(){
    var active = state.active;
    var cleaned = Object.assign({}, active, { done:true,
      entries: active.entries.map(function(e){ return Object.assign({}, e, {sets: e.sets.filter(function(s){return s.weight!=null && s.reps!=null;})}); }).filter(function(e){return e.sets.length>0;}) });
    if (cleaned.entries.length===0) { setActive(null); return; }
    setRestTimer(null);
    releaseWakeLock();
    var newSessions = state.sessions.concat([cleaned]);
    /* Recalibrage automatique et silencieux des séries prescrites (pas de la
       liste des machines — voir recalibrateProgramFromHistory) après CHAQUE
       séance terminée, libre ou programmée : les deux alimentent l'historique
       de volume réel par muscle utilisé pour ce recalibrage. */
    var recalibrated = recalibrateProgramFromHistory(state.program, state.exercises, state.profile.goal, avgSessionsPerWeek(state.profile), state.profile.muscleFocus || {}, newSessions);
    if (recalibrated !== state.program) {
      setState({ sessions: newSessions, active: null, program: recalibrated });
    } else {
      setState({ sessions: newSessions, active: null });
    }
  }
  function deleteSession(id){ setState({sessions: state.sessions.filter(function(s){return s.id!==id;})}); }
  function setProfile(p){ setState({profile:p}); }
  /* Corrige le palier poly/semi/isolation d'une machine, appelable depuis
     n'importe quel écran qui affiche son badge (pas seulement l'onglet
     Machines) — voir OrderBadge. */
  function updateExerciseOrder(exId, order){
    setState({ exercises: state.exercises.map(function(e){ return e.id===exId ? Object.assign({},e,{order:order}) : e; }) });
  }
  /* Palier de poids (plus petit incrément, en kg) d'une machine — distinct
     du palier poly/semi/isolation ci-dessus. Même schéma : appelable depuis
     n'importe quel écran (voir IncStepper). INC_CACHE se met à jour tout
     seul via le useEffect(...[state.exercises]) plus haut. */
  function updateExerciseInc(exId, inc){
    setState({ exercises: state.exercises.map(function(e){ return e.id===exId ? Object.assign({},e,{inc:inc}) : e; }) });
  }
  function addBodyEntry(entry){
    setState({ bodyLog: (state.bodyLog||[]).concat([Object.assign({id:"b"+Date.now(), date: todayISO(), source:"manuel"}, entry)]) });
  }
  var TABS = [
    { k:"seance", label:"Séance", icon:"dumbbell" },
    { k:"programme", label:"Programme", icon:"flag" },
    { k:"machines", label:"Machines", icon:"wrench" },
    { k:"historique", label:"Historique", icon:"history" },
    { k:"analyse", label:"Analyse", icon:"trending" },
    { k:"options", label:"Options", icon:"gear" },
  ];

  /* minHeight : 100dvh (hauteur RÉELLE visible, barre d'URL rétractée comprise)
     avec repli 100vh pour les navigateurs qui ne connaissent pas dvh — sans ça,
     sur mobile, 100vh compte la barre d'URL et laissait un décalage vertical au
     défilement. Retraits de zone sûre : voir la note dans <style>. */
  return h("div",{style:{background:C.shroudDeep, fontFamily:sansBody, color:C.bone, minHeight:"100vh"}},
    h("div",{style:{minHeight:"100dvh",display:"flex",flexDirection:"column"}},
    h("header",{style:{padding:"calc(16px + var(--sat)) calc(16px + var(--sar)) 12px calc(16px + var(--sal))",
        display:"flex",alignItems:"baseline",justifyContent:"space-between",borderBottom:"1px solid "+C.taupeDim}},
      h("h1",{style:{fontFamily:sansCond,fontSize:21,fontWeight:700,margin:0}}, "Sunglo sport"),
      h("div",{style:{display:"flex",alignItems:"center",gap:12}},
        h(SyncDot,{status:syncStatus}),
        h("span",{style:{fontFamily:sansCond,fontSize:12,color:C.taupe}}, state.sessions.filter(function(s){return s.done;}).length+" séances"))),
    h("main",{style:{padding:"16px",paddingLeft:"calc(16px + var(--sal))",paddingRight:"calc(16px + var(--sar))",
        paddingBottom: "calc("+(restTimer?150:88)+"px + var(--sab))", maxWidth:640, margin:"0 auto", width:"100%"}},
      tab==="seance" ? h(SeanceTab,{ program:state.program, exercises:state.exercises, exMap:exMap, sessions:state.sessions, nextDayKey:nextDayKey,
        active:state.active, setActive:setActive, finishSession:finishSession, startRestTimer:startRestTimer,
        deloadForNextStart:state.deloadForNextStart, setDeloadForNextStart:setDeloadForNextStart,
        snoozeDeload:snoozeDeload, deloadSuggested: !state.active && deloadSuggested, deloadReason:deloadReason,
        updateExerciseOrder:updateExerciseOrder, updateExerciseInc:updateExerciseInc, persistConfig:persistConfig, goal:state.profile.goal,
        profile:state.profile, setProfile:setProfile }) : null,
      tab==="programme" ? h(ProgrammeTab,{ program:state.program, exercises:state.exercises, profile:state.profile, setProfile:setProfile, persistConfig:persistConfig, goal:state.profile.goal }) : null,
      tab==="historique" ? h(HistoriqueTab,{ sessions:state.sessions, exMap:exMap, program:state.program, deleteSession:deleteSession }) : null,
      tab==="machines" ? h(MachinesTab,{ exercises:state.exercises, program:state.program, persistConfig:persistConfig, sessions:state.sessions, updateExerciseInc:updateExerciseInc, goal:state.profile.goal, profile:state.profile }) : null,
      tab==="analyse" ? h(AnalyseTab,{ sessions:state.sessions, exercises:state.exercises, exMap:exMap, program:state.program, persistConfig:persistConfig, bodyLog:state.bodyLog, addBodyEntry:addBodyEntry, goal:state.profile.goal, profile:state.profile }) : null,
      tab==="options" ? h(OptionsTab,{ profile:state.profile, setProfile:setProfile, program:state.program, exercises:state.exercises, bodyLog:state.bodyLog, persistConfig:persistConfig }) : null),
    h("div",{style:{position:"fixed",bottom:0,left:0,right:0,zIndex:20}},
      restTimer ? h(RestTimerBar,{timer:restTimer, onAdjust:adjustRestTimer, onDismiss:stopRestTimer, volume: state.profile.alertVolume}) : null,
      /* paddingBottom = retrait de zone sûre : la barre reste collée en bas
         mais ses libellés ne passent plus sous l'indicateur d'accueil iOS. */
      h("nav",{"aria-label":"Navigation principale",
        style:{display:"flex",background:C.shroudDeep,borderTop:"1px solid "+C.taupeDim,
          paddingBottom:"var(--sab)",paddingLeft:"var(--sal)",paddingRight:"var(--sar)"}},
        TABS.map(function(t){
          var on = tab===t.k;
          /* Repère visuel de l'onglet actif en plus de la couleur (liseré en
             haut) : la couleur seule n'est pas un indicateur suffisant, et
             l'ambre sur taupe passe mal en plein soleil comme pour un daltonisme
             rouge/vert. aria-current expose le même état aux lecteurs d'écran. */
          return h("button",{key:t.k, onClick:function(){setTab(t.k);},
            "aria-current": on ? "page" : null, title:t.label,
            style:{flex:1,padding:"10px 0 9px",display:"flex",flexDirection:"column",alignItems:"center",gap:3,
              background:on?C.shroud:"transparent",border:"none",borderTop:"2px solid "+(on?C.pin:"transparent"),
              color:on?C.pin:C.taupe}},
            h(Icon,{name:t.icon,size:19}), h("span",{style:{fontFamily:sansCond,fontSize:10.5,fontWeight:on?700:600}}, t.label)); })))
  ));
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
(function boot(){
  var rootEl = document.getElementById("root");
  rootEl.innerHTML = "";
  var loading = document.createElement("div");
  loading.style.cssText = "min-height:100vh;display:flex;align-items:center;justify-content:center;color:"+C.taupe+";font-family:"+sansCond+";font-size:15px;";
  loading.textContent = "Chargement du carnet…";
  rootEl.appendChild(loading);

  loadInitialState().then(function(state){
    var root = ReactDOM.createRoot(rootEl);
    root.render(h(App, {initialState: state}));
  }).catch(function(){
    var root = ReactDOM.createRoot(rootEl);
    root.render(h(App, {initialState: withAllMigrations(seedState())}));
  });
})();
</script>

<script>
// v2 (2026-09-04) : le fetch handler du service worker est déjà en
// network-first (voir service-worker.js), donc une simple réouverture de
// l'appli va normalement chercher index.html à jour sur GitHub Pages. Le
// trou restant : sur mobile, l'appli PWA n'est presque jamais "relancée à
// froid" — l'OS la garde gelée en arrière-plan quand tu changes d'appli,
// puis la ranime telle quelle (le JS déjà chargé continue de tourner) sans
// jamais refaire de navigation ni redéclencher la vérif de mise à jour du
// navigateur. Résultat vu par l'utilisateur : "je dois réinstaller l'appli
// pour voir mes changements" alors que le vrai problème est juste que la
// vérif ne se relance jamais toute seule. Deux ajouts pour ça :
// 1) reg.update() forcé à chaque retour au premier plan (visibilitychange)
//    — revérifie service-worker.js sur le réseau, indépendamment de tout
//    cache navigateur, à chaque fois que tu reviens sur l'appli ;
// 2) reload() automatique une seule fois quand un nouveau service worker
//    prend le contrôle (controllerchange) — sinon le nouveau code est bien
//    activé en arrière-plan mais la page déjà ouverte continue de tourner
//    avec l'ancien JS déjà en mémoire jusqu'à un rechargement.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("service-worker.js").then(function(reg){
      document.addEventListener("visibilitychange", function(){
        if (document.visibilityState === "visible") reg.update().catch(function(){});
      });
    }).catch(function(){});
    var reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if (reloaded) return;
      reloaded = true;
      window.location.reload();
    });
  });
}
</script>
