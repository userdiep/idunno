/* Retouché le 6 sept. 2026 après avoir regardé l'appli rendue sur un écran de
   téléphone (390 px) plutôt que dans le code :
   - le placeholder répétait le suffixe ("kg" en filigrane DANS le champ, puis
     "kg" juste à côté) — on n'affiche plus le placeholder quand il dit déjà
     la même chose que le suffixe ;
   - largeur du champ réduite (66->58 / 52->46) : avec l'ancienne, deux
     Steppers côte à côte + le sélecteur de côté dépassaient les 390 px et le
     `flexWrap` renvoyait tout à la ligne, d'où 3 lignes par série en séance ;
   - `compact` (nouveau) rétrécit encore les boutons +/- pour les usages où
     deux Steppers doivent tenir sur une seule ligne.
   Les zones tactiles restent au-dessus de 44 px de haut (minHeight ci-dessous)
   même en compact — c'est la largeur qu'on réduit, pas la hauteur. */
/* `max` ajouté le 14 sept. 2026 pendant l'audit général. Le compteur
   n'imposait son plancher qu'aux boutons − et + : une valeur TAPÉE au clavier
   n'était bornée nulle part. Conséquence mesurée en tapant 999999 dans
   "Séances par semaine" : l'appli se fige puis l'onglet meurt, parce que le
   choix de la fréquence optimale énumère les candidats de 0,5 en 0,5 entre le
   min et le max — 2 millions de programmes recalculés. L'utilisateur n'a
   aucun moyen de revenir en arrière : la valeur absurde est enregistrée, donc
   l'appli re-plante à chaque ouverture.
   Deux verrous plutôt qu'un, parce que les deux défauts sont réels et
   indépendants : ici le plafond de saisie (seul le MAX est appliqué pendant la
   frappe — appliquer aussi le min empêcherait de taper "12" dans un champ dont
   le plancher est 10), et un plafond dur dans pickOptimalAvgSessions, pour
   qu'un état déjà enregistré ou importé ne puisse pas figer l'appli. */
/* Nombres affichés à la française (virgule décimale) — ajouté le 21 sept.
   2026 : la même séance affichait "27.5" sur une ligne et "27,5" sur la
   suivante (capture "c'est mal fait"). Un <input type="number"> laisse le
   navigateur décider du séparateur, et Chrome Android ne décide pas pareil
   selon que la valeur a été tapée ou posée par un bouton. On affiche donc
   nous-mêmes, partout, avec une virgule. */
function fmtNombre(v) {
  if (v == null || v === "" || !isFinite(v)) return "";
  return String(Math.round(v * 100) / 100).replace(".", ",");
}
function lireNombre(txt) {
  var t = String(txt == null ? "" : txt).replace(/\s/g, "").replace(",", ".");
  if (t === "" || t === "." || t === "-") return null;
  var n = parseFloat(t);
  return isFinite(n) ? n : null;
}
function Stepper(props) {
  var value=props.value, onChange=props.onChange, step=props.step||1, min=props.min!=null?props.min:0,
      max=props.max!=null?props.max:null,
      suffix=props.suffix||"", wide=props.wide, compact=props.compact;
  function borne(v){ return (v!=null && max!=null && v>max) ? max : v; }
  /* Texte EN COURS DE FRAPPE, distinct de la valeur : sans lui, taper "27,"
     serait relu comme 27 et la virgule disparaîtrait sous le doigt avant qu'on
     ait tapé le 5. Remis à null dès qu'on quitte le champ ou qu'on appuie sur
     − / +, pour que l'affichage redevienne celui de la valeur. */
  var _dr = useState(null), brouillon = _dr[0], setBrouillon = _dr[1];
  var affiche = (brouillon != null) ? brouillon : fmtNombre(value);
  var ph = props.placeholder||"";
  if (ph && suffix && ph === suffix) ph = "";
  var padX = props.flex ? 6 : (compact ? 8 : 10);
  /* `flex` (7 sept. 2026) — le compteur peut RÉTRÉCIR au lieu d'imposer sa
     largeur. Signalé sur capture : "regarde la flèche à droite est rognée".
     Dans une ligne de série (S1 · poids · reps · flèche de recopie), les deux
     compteurs étaient en flexShrink:0 avec une saisie de largeur fixe : passé
     une certaine étroitesse d'écran, la ligne débordait, le marginLeft:auto de
     la flèche n'avait plus de place à distribuer, et la carte (overflow:hidden)
     coupait le bouton. Ça ne se voyait ni sur mon écran de test ni sur un
     iPhone standard, seulement sur les téléphones un peu plus étroits ou avec
     une police système agrandie. */
  var flexible = props.flex;
  var box = {display:"flex",alignItems:"stretch",borderRadius:6,overflow:"hidden",border:"1px solid "+C.taupeDim,minHeight:44};
  if (flexible) { box.flex = "1 1 0"; box.minWidth = 0; } else { box.flexShrink = 0; }
  return h("div", {className:"flex items-stretch", style:box},
    h("button", {onClick:function(){setBrouillon(null); onChange(borne(Math.max(min, arrondiPas((value||0)-step, step))));}, "aria-label":"Diminuer",
      style:{padding:"0 "+padX+"px",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",background:C.shroudDeep,color:C.taupe,border:"none"}},
      h(Icon,{name:"minus",size:14})),
    h("input", {type:"text", className:"stepper-input", inputMode:"decimal", value: affiche, placeholder:ph,
      onChange:function(e){
        /* Un point tapé (clavier anglais) devient tout de suite une virgule :
           le champ n'affiche jamais les deux formats, même pendant la frappe. */
        var txt = String(e.target.value).replace(/[^0-9.,-]/g, "").replace(/\./g, ",");
        setBrouillon(txt);
        var n = lireNombre(txt);
        if (txt === "") onChange(null);
        else if (n != null) onChange(borne(n));
      },
      onBlur:function(){ setBrouillon(null); },
      style:Object.assign({background:C.shroud, color:C.bone, fontFamily:sansBody, fontSize: flexible?16.5:18, fontWeight:600,
        fontVariantNumeric:"tabular-nums", border:"none", textAlign:"center", outline:"none", minWidth:0},
        /* minWidth sur la SAISIE : en mode flexible, c'est le chiffre qui doit
           survivre au rétrécissement, pas les décorations. Sans ce plancher, à
           320 px la case tombait à ~22 px et "42,5" disparaissait purement et
           simplement — le pire résultat possible, puisque c'est la seule chose
           qu'on vient lire. Ordre de sacrifice : le suffixe d'abord, puis rien
           d'autre. */
        flexible ? {flex:"1 1 0", width:"100%", minWidth:36, paddingRight:2} : {width: wide?58:46})}),
    /* En mode `flex`, le suffixe ("kg", "rep") est la dernière largeur
       incompressible du compteur : sur un écran de 320 px il suffisait à
       pousser le bouton "+" hors du cadre, qui le coupait (overflow:hidden).
       Il peut maintenant se réduire — au pire il s'efface, alors que le "+"
       doit toujours rester touchable. */
    suffix ? h("span",{style:Object.assign({display:"flex",alignItems:"center",paddingRight:6,background:C.shroud,color:C.taupe,fontSize:11},
      flexible ? {minWidth:0, overflow:"hidden"} : {})},suffix) : null,
    h("button", {onClick:function(){setBrouillon(null); onChange(borne(arrondiPas((value||0)+step, step)));}, "aria-label":"Augmenter",
      style:{padding:"0 "+padX+"px",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",background:C.shroudDeep,color:C.taupe,border:"none"}},
      h(Icon,{name:"plus",size:14}))
  );
}
/* Difficulté ressentie plutôt qu'un chiffre précis de reps en réserve —
   estimer "encore 5 reps possibles ou 3 ?" est quasi impossible en pratique;
   estimer "c'était facile / correct / dur" l'est beaucoup moins. Les trois
   boutons se traduisent en interne vers les mêmes seuils RIR qu'avant
   (4=facile, 1=correct, 0=dur) donc toute la logique de progression en
   dessous continue de fonctionner sans changement. Totalement optionnel :
   ne rien cocher marche tout aussi bien, la progression se base alors
   uniquement sur poids/reps. */
var EFFORT_OPTS = [
  { v:4, label:"Facile", sub:"j'aurais pu faire beaucoup plus" },
  { v:1, label:"Correct", sub:"encore 1-2 reps possibles" },
  { v:0, label:"Dur", sub:"à l'échec ou presque" },
];
/* Traduit un RIR (reps en réserve) vers le vocabulaire que l'appli utilise
   PARTOUT ailleurs — ajouté le 6 sept. 2026 : l'Historique affichait "1.0 en
   réserve", un chiffre brut que l'appli a justement choisi de ne jamais
   demander à l'utilisateur (voir la note sur RirPicker : estimer "encore 3 ou
   5 reps ?" est peu fiable, "facile / correct / dur" l'est beaucoup plus).
   Afficher le chiffre à la relecture contredisait ce choix et n'aidait
   personne. On retient le libellé dont le seuil est le plus proche. */
function effortLabelForRir(r){
  if (r == null || !isFinite(r)) return null;
  var best = null, bestD = Infinity;
  EFFORT_OPTS.forEach(function(o){ var d = Math.abs(o.v - r); if (d < bestD) { bestD = d; best = o; } });
  return best ? best.label.toLowerCase() : null;
}
function RirPicker(props) {
  var value=props.value, onChange=props.onChange;
  return h("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}}, EFFORT_OPTS.map(function(o){
    var on = value===o.v, good = o.v<=1;
    return h("button",{key:o.v, onClick:function(){onChange(on?null:o.v);}, title:o.sub,
      style:{padding:"6px 10px",borderRadius:6, background:on?(good?C.green:C.rust):C.shroudDeep,
        color:on?C.ink:C.taupe, border:"1px solid "+(on?"transparent":C.taupeDim),
        fontFamily:sansCond,fontSize:12.5,fontWeight:600}}, o.label);
  }));
}
function SideToggle(props){
  /* Optionnel — tu égalises déjà charge/reps entre les deux côtés, donc ça
     ne sert pas à loguer une performance différente, juste à noter lequel a
     semblé plus dur ce jour-là si tu veux le repérer. Rien coché = égal. */
  var value=props.value, onChange=props.onChange;
  return h("div",{style:{display:"flex",gap:4,flexShrink:0}}, [{k:"L",label:"G+"},{k:null,label:"Égal"},{k:"R",label:"D+"}].map(function(o){
    var on = value===o.k;
    return h("button",{key:String(o.k), onClick:function(){onChange(o.k);}, title:o.k?"Côté "+(o.k==="L"?"gauche":"droit")+" plus dur":"Deux côtés égaux",
      style:{padding:"5px 8px",borderRadius:6, background:on?C.steel:C.shroudDeep, color:on?C.ink:C.taupe,
        border:"1px solid "+(on?"transparent":C.taupeDim), fontFamily:sansCond, fontSize:11.5, fontWeight:700}}, o.label);
  }));
}
/* Revu le 6 sept. 2026 en regardant l'écran rendu — DEUX défauts visuels que
   la lecture du code seul ne montrait pas :
   1. HIÉRARCHIE INVERSÉE sur une machine jamais faite (state "new") : le bloc
      de gauche était peint en aplat plein (tone = C.taupe, un beige clair sur
      fond charbon) alors qu'il ne contient qu'un tiret "—". Le champ VIDE
      était donc l'élément le plus lumineux et le plus lourd de tout l'écran,
      devant le nom de la machine. Un aplat plein signale maintenant une vraie
      valeur ; sans charge connue, le bloc passe en contour discret.
   2. LARGEUR : avec ses deux minWidth (74 + 66) plus les bordures et les deux
      boutons d'action à côté, il ne restait qu'environ 140 px sur 390 pour le
      nom de la machine — "Chest Press" passait à la ligne, "Tirage Vertical
      (à vérifier)" sur trois. Les minWidth sont réduits et `block:true` (voir
      les appels dans SeanceTab) le pose sur sa propre ligne, sous le nom, qui
      récupère alors toute la largeur. */
function StackPlate(props) {
  var weight=props.weight, sets=props.sets, state=props.state, repMin=props.repMin, repMax=props.repMax, unit=props.unit||"";
  var tone = state==="up"?C.green : state==="down"?C.rust : state==="new"?C.taupe : state==="deload"?C.steel : C.pin;
  var known = weight != null;
  var repTxt = (repMin!=null && repMax!=null) ? (repMin===repMax ? String(repMin) : repMin+"-"+repMax) : String(props.reps);
  repTxt += unit;
  return h("div",{style:{display:"flex",alignItems:"stretch",borderRadius:4,overflow:"hidden",flexShrink:0,
      border:"2px solid "+(known?tone:C.taupeDim), alignSelf:props.block?"flex-start":"auto"}},
    h("div",{style:{padding:"6px 10px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
        background: known?tone:"transparent", minWidth:62}},
      h("span",{style:{fontFamily:sansBody,fontSize:23,fontWeight:700,lineHeight:1.05,
        color: known?C.ink:C.taupe, fontVariantNumeric:"tabular-nums"}}, known?fmtNombre(weight):"—"),
      h("span",{style:{fontFamily:sansCond,fontSize:10,fontWeight:600,color:known?C.ink:C.taupe,opacity:known?0.75:1}},"kg")),
    h("div",{style:{padding:"6px 10px",display:"flex",flexDirection:"column",justifyContent:"center",background:C.shroudDeep,minWidth:58}},
      h("span",{style:{fontFamily:sansBody,fontSize:17,fontWeight:600,lineHeight:1.1,color:C.bone,fontVariantNumeric:"tabular-nums"}}, sets+"×"+repTxt),
      h("span",{style:{fontFamily:sansCond,fontSize:10,color:C.taupe}},"objectif"))
  );
}
var ORDER_TIER_LABEL = { 1:"Polyarticulaire — à faire en premier", 2:"Semi-isolation", 3:"Isolation — à faire en dernier" };
function exerciseOrderTier(ex){ return (ex && ex.order) || 3; }
function stripAccents(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }
/* Devine le palier poly/semi/isolation d'une machine à partir de son nom
   (et, en repli, de son muscle) — pour que ce soit l'app qui détermine ça,
   pas l'utilisateur, à la création comme pour corriger les machines
   existantes sans palier. Validé pour reproduire exactement le classement
   des 29 machines d'origine du catalogue (SEED_EXERCISES), et élargi avec
   des synonymes FR/EN et noms de marque courants (Technogym, Life Fitness,
   Hammer Strength) pour mieux couvrir des machines ajoutées manuellement
   avec un nom différent. Les motifs les plus SPÉCIFIQUES sont testés en
   premier — ex. "leg curl" doit être reconnu comme semi-isolation (ischios)
   avant que le mot générique "curl" plus bas ne le classe à tort en
   isolation (biceps). C'est une estimation par mots-clés, pas une
   classification anatomique certifiée — reste modifiable à tout moment via
   le badge (séance) ou le sélecteur (onglet Machines) si elle tombe à côté
   pour une machine précise. */
function inferOrderTier(name, muscle){
  var n = stripAccents(name);
  // --- Motifs spécifiques d'abord, pour lever les ambiguïtés avec les
  //     motifs génériques plus bas (ex. "curl", "presse", "extension"). ---
  if (/leg curl|hamstring curl|flexion des jambes|ischio|nordic/.test(n)) return 2;
  if (/leg extension|extension.*jambe|quad.*extension/.test(n)) return 3;
  if (/calf|mollet/.test(n)) return 2;
  if (/glute|fessier|hip thrust|hip bridge/.test(n)) return 2;
  if (/lower back|lombaire|hyperextension|back extension|extension du dos/.test(n)) return 2;
  if (/rear delt|deltoide arriere|reverse fly|face pull/.test(n)) return 2;
  if (/trapez|shrug/.test(n)) return 2;
  if (/pull-?up|pull-?over|chin-?up/.test(n)) return 1;
  if (/pector|pec deck|butterfly|papillon|ecarte|\bfly\b/.test(n)) return 3;
  if (/elevation laterale|lateral raise|elevation frontale|front raise/.test(n)) return 3;
  if (/abduction|adduction/.test(n)) return 3;
  if (/crunch|abdomina|gainage|sit.?up|rotation du torse/.test(n)) return 3;
  if (/pushdown|kickback/.test(n)) return 3;
  // --- Callisthénie / street workout — mêmes paliers que leurs équivalents
  //     machine (une traction reste polyarticulaire, faite au poids du
  //     corps ou guidée) ; testés avant les motifs génériques ci-dessous
  //     pour éviter tout conflit avec eux. Les tenues statiques avancées
  //     (planche, front/back lever, drapeau) ne sont volontairement PAS
  //     reconnues ici — trop ambiguës par mots-clés ("planche" désigne
  //     aussi bien la figure que la planche abdominale) et pas vraiment
  //     compatibles avec un objectif séries×reps de toute façon ; palier à
  //     corriger à la main pour ces mouvements-là.
  //     Au passage, deux bugs trouvés en testant sur des noms de
  //     callisthénie réels : "dips" (pluriel) ne matchait pas le \bdip\b
  //     du motif générique plus bas (corrigé en \bdips?\b) — aucun exercice
  //     du catalogue d'origine ne s'appelait "dip", donc jamais remarqué
  //     avant ; et "nordic curl" tombait sur le motif générique "curl" (→
  //     isolation biceps) avant d'atteindre le repli par muscle, corrigé en
  //     l'ajoutant au motif ischio-jambiers ci-dessus (comme "leg curl"). */
  if (/muscle.?up|burpee/.test(n)) return 1;
  if (/pompe|push.?up|pushup/.test(n)) return 1;
  if (/fente|lunge/.test(n)) return 1;
  // --- Motifs génériques ensuite. ---
  if (/biceps|triceps|curl/.test(n)) return 3;
  if (/press|developpe|presse|squat|deadlift|souleve de terre|\bdips?\b/.test(n)) return 1;
  if (/tirage|traction|\brow\b|rowing|pulldown/.test(n)) return 1;
  if (/upper back|tronc/.test(n)) return 1;
  // Rien reconnu dans le nom : repli par muscle, sinon semi-isolation neutre.
  var m = stripAccents(muscle);
  if (/biceps|triceps|abdomina/.test(m)) return 3;
  if (/ischio|mollet|fessier|lombaire|deltoides post/.test(m)) return 2;
  return 2;
}
/* Ajouté le 6 sept. 2026 (demande : "pour les exos type gainage ce soit
   plutôt en fonction du nombre de temps que de répét") — certains exercices
   sont naturellement tenus en isométrie (gainage/planche, chaise murale...)
   plutôt que comptés en répétitions ; pour ceux-là, `trackBy:"time"` sur
   l'exercice fait lire/écrire le champ "reps" de chaque série comme des
   SECONDES tenues au lieu de répétitions (voir unitLabel, Stepper dans
   SeanceTab, StackPlate, prescribeBase/prescribe) — la donnée stockée
   (`sets[i].reps`) ne change pas de forme, seule son unité d'affichage
   change, pour ne rien casser dans l'historique/la logique de progression
   déjà en place. Détection par mots-clés sur le nom, même principe que
   inferOrderTier/guessMuscles ci-dessus : automatique à la création (voir
   ManualAdd), corrigible ensuite machine par machine (voir TrackByPicker,
   Machines > "Matériel disponible") sans jamais écraser un choix déjà fait
   à la main (voir withTrackingDefaults plus bas). Par défaut (rien détecté)
   reste "reps", comportement identique à avant l'ajout de ce champ. */
function inferTrackBy(name) {
  var n = stripAccents(name||"");
  return /gainage|planche|plank|hollow|chaise murale|wall.?sit|side bridge|superman|bird.?dog/.test(n) ? "time" : "reps";
}
function unitLabel(ex) { return (ex && ex.trackBy === "time") ? "s" : "rep"; }
/* Ajouté le 5 sept. 2026 (demande : "avoir une bdd pour proposer

   avant "curl") mais pour deviner QUELS muscles une machine sollicite,

var MUSCLE_GUESS_RULES = [
  /* ---------------------------------------------------------------
     ÉLARGISSEMENT du 6 sept. 2026 (demande : "il faut que l'application ait la
     base de données de toutes les machines / street workout / calisthéniques
     qui existent avec les différents résultats EMG").

     À être clair sur ce qui est possible : une base EMG EXHAUSTIVE de tous les
     exercices n'existe pas, ni ici ni ailleurs. La littérature EMG couvre
     quelques dizaines de mouvements, presque toujours en version barre ou
     haltère, rarement la machine précise d'une marque donnée — et chaque
     fabricant nomme ses machines différemment. Prétendre le contraire serait
     inventer des chiffres.

     Ce que fait cette table : reconnaître le plus grand nombre possible de
     FAMILLES de mouvements (machines, poulies, poids libres, callisthénie /

function guessMuscles(name) {
  var n = stripAccents(name||"");
  if (!n) return [];
  for (var i=0; i<MUSCLE_GUESS_RULES.length; i++) {
    if (MUSCLE_GUESS_RULES[i].test.test(n)) return MUSCLE_GUESS_RULES[i].muscles;
  }
  return [];
}
/* Trie une liste d'items/entries de séance par palier d'exercice (1
   polyarticulaire → 2 semi-isolation → 3 isolation), à égalité de palier
   l'ordre d'origine est conservé (tri stable). getExId(item) doit renvoyer
   l'id de l'exercice pour cet item. */
function sortByExerciseOrder(list, getExId, exMap) {
  return list.map(function(item, i){ return { item: item, i: i }; })
    .sort(function(a, b){
      var ta = exerciseOrderTier(exMap[getExId(a.item)]), tb = exerciseOrderTier(exMap[getExId(b.item)]);
      return ta !== tb ? ta - tb : a.i - b.i;
    })
    .map(function(w){ return w.item; });
}
function sortedDayItems(day, exMap) { return sortByExerciseOrder(day.items, function(it){return it.ex;}, exMap); }
/* Badge affiché partout où une machine apparaît (aperçu de séance, séance
   en cours, séance libre). Touchable quand onChange est fourni — un tap
   fait tourner 1→2→3→1, pour corriger le palier d'une machine directement
   là où on la voit, sans devoir aller dans l'onglet Machines. Sans
   onChange (ex. historique), reste un simple indicateur non cliquable. */
function OrderBadge(props){
  var order = props.order, onChange = props.onChange;
  if (!order) return null;
  var title = (onChange ? "Palier : " : "Ordre conseillé dans la séance : ")+order+"/3 — "+(ORDER_TIER_LABEL[order]||"")+(onChange ? " — touche pour changer" : "");
  var style = {display:"inline-flex",alignItems:"center",justifyContent:"center",width:19,height:19,borderRadius:"50%",
    flexShrink:0,marginTop:1,background:C.shroud,border:"1px solid "+(onChange?C.pin:C.taupeDim),
    fontFamily:sansCond,fontSize:11,fontWeight:700,color:C.pin};
  if (!onChange) return h("span",{title:title, style:style}, order);
  return h("button",{title:title, onClick:function(){ onChange(order>=3?1:order+1); },
    style:Object.assign({},style,{padding:0,cursor:"pointer"})}, order);
}
/* Palier de POIDS — le plus petit incrément (kg) entre deux charges d'une
   machine (2.5 kg pour la plupart, 5 kg sur certaines Leg Press, 1 kg voire
   moins sur des poids libres...). À ne pas confondre avec OrderBadge
   ci-dessus (le palier poly/semi/isolation) — deux réglages différents qui
   utilisent tous les deux le mot "palier". Affiché en compact partout où
   une machine apparaît (séance + Machines) pour pouvoir le corriger sans

/* ============================================================
   OPTIONS — réglages personnels, DER/pas/séances → calcul kcal/prot,
   et volume de la sonnerie du chrono de repos. Centralise ce qui était
   avant éparpillé dans l'onglet Programme (nutrition) + code en dur
   (le son n'était pas réglable).
   ============================================================ */
/* FRÉQUENCE RÉELLE, mesurée dans l'historique — 23 sept. 2026.

   Trouvé en analysant son export : 13 séances en 19 jours, soit ~4,4 jours
   d'entraînement par semaine, pour un réglage à 3-4. Or TOUT le calcul des
   séries passe par ce réglage : l'appli répartit la cible hebdomadaire
   (12 séries/muscle) sur le nombre de séances DÉCLARÉ. Réglée trop bas, elle
   entasse des séries dans chaque séance — c'est exactement ce qui produisait
   les séances de 35 séries, les 5 séries par machine et la fatigue au bout
   d'une heure. Réglée trop haut, l'inverse : du volume manquant.

   On compte les JOURS avec au moins une séance terminée (deux séances le même
   jour = un jour), sur les 28 derniers jours, ou depuis la première séance si
   l'historique est plus court — mais jamais sur moins de 14 jours : avant,
   une semaine chargée ou creuse ne dit rien du rythme habituel. */
function frequenceReelle(sessions, maintenant) {
  var now = maintenant || Date.now();
  var faites = (sessions || []).filter(function(s){ return s && s.done && !s.voyage && s.date && isFinite(new Date(s.date).getTime()); });
  if (faites.length < 4) return null;
  var premier = Math.min.apply(null, faites.map(function(s){ return new Date(s.date).getTime(); }));
  var anciennete = (now - premier) / 864e5;
  if (anciennete < 14) return null;
  var fenetre = Math.min(28, anciennete);
  var jours = {};
  faites.forEach(function(s){
    var t = new Date(s.date).getTime();
    if (now - t <= fenetre * 864e5) jours[new Date(s.date).toISOString().slice(0,10)] = true;
  });
  var n = Object.keys(jours).length;
  var parSemaine = n / (fenetre / 7);
  /* Fourchette proposée : celle dont le MILIEU (c'est ce milieu que l'appli
     utilise, voir avgSessionsPerWeek) tombe au plus près du rythme mesuré, au
     demi près — 4,2 -> "4", 4,3 -> "4 à 5". */
  var milieu = Math.max(1, Math.round(parSemaine * 2) / 2);
  var lo = Math.floor(milieu), hi = Math.ceil(milieu);
  return { parSemaine: parSemaine, jours: n, fenetreJours: Math.round(fenetre), min: lo, max: hi, milieu: milieu };
}

function HistoriqueTab(props){
  var sessions=props.sessions, exMap=props.exMap, program=props.program, deleteSession=props.deleteSession;
  var _o = useState(null), open=_o[0], setOpen=_o[1];
  var done = sessions.filter(function(s){return s.done;}).slice().reverse();
  if (done.length===0) {
    return h("div",{style:{borderRadius:10,padding:24,textAlign:"center",background:C.shroudDeep,border:"1px dashed "+C.taupeDim}},
      h("div",{style:{fontFamily:sansCond,fontSize:17,fontWeight:600,marginBottom:6}}, "Rien d'enregistré"),
      h("div",{style:{fontSize:14,color:C.taupe,lineHeight:1.5}}, "Enregistre une séance et elle apparaîtra ici. C'est aussi ce qui alimente la progression automatique."));
  }
  return h(Section, {title: done.length+" séance"+(done.length>1?"s":"")+" enregistrée"+(done.length>1?"s":"")}, done.map(function(s){
    var day = program.find(function(d){return d.key===s.dayKey;});
    /* Le TONNAGE (somme des kg × reps) affiché ici a été retiré le 14 sept.
       2026 sur remarque de l'utilisateur : "ça sert à rien de suivre le poids
       total par séance". Il a raison, et pas seulement par préférence :
       - il additionne des charges incomparables — 200 kg de presse à cuisses
         et 15 kg d'élévation latérale entrent dans la même somme, si bien
         qu'une séance de jambes écrase toujours une séance de haut du corps ;
       - il MONTE quand on fait plus de répétitions avec moins lourd, donc il
         peut progresser pendant que la charge, elle, stagne — exactement ce
         que la progression de l'appli surveille par ailleurs (voir prescribe
         et stallInfo) ;
       - rien d'autre dans l'appli ne s'en sert : ni le volume par muscle, ni
         le recalibrage, ni les diagnostics. C'était un chiffre décoratif.
       Remplacé par l'unité dans laquelle TOUT le reste de l'appli raisonne :
       le nombre de machines et de séries réellement faites. */
    var nbSeries = s.entries.reduce(function(a,e){ return a + e.sets.filter(function(x){ return x.reps!=null; }).length; },0);
    /* Cardio (17 sept. 2026) : une séance de cardio pur n'a ni machine ni
       série — son résumé, c'est la durée. */
    var cardioFait = sessionCardio(s);
    var minCardio = cardioFait.reduce(function(a,c){ return a + c.min; }, 0);

    h(Section, {title:"Volume prévu par semaine"},
      h("div",{style:{borderRadius:10,overflow:"hidden",border:"1px solid "+C.taupeDim}},
        /* Refait le 6 sept. 2026 — INCOHÉRENCE dans le même écran : la couleur
           de ces lignes se basait sur la bande fixe VOL_MIN–VOL_MAX (5–20
           séries), sans aucun rapport avec la cible de l'objectif choisi. Un
           muscle à 8,8 séries pour une cible de 12 s'affichait donc tout en
           VERT ici, pendant que le Score d'optimisation juste au-dessus le
           listait "En retrait" à 82% — deux lectures contradictoires de la
           même donnée à trois centimètres d'écart. La couleur suit maintenant
           la cible réelle du muscle (celle de l'objectif, ajustée par
           "Priorité par muscle"), et le repère blanc sur la barre matérialise
           cette cible. VOL_MIN reste utilisé comme plancher de sécurité
           absolu, VOL_MAX comme plafond indicatif. */
        (function(volBarMax){ return vol.map(function(v,i){
          var muTarget = (goalPreset(goal).targetSets||VOL_MIN) * focusMultiplier((profile && profile.muscleFocus)||{}, v.muscle);
          var ratio = muTarget>0 ? v.sets/muTarget : 1;
          var below = v.sets < VOL_MIN || ratio < 0.7;
          var partial = !below && ratio < 0.95;
          /* Corrigé le 7 sept. 2026 — signalé par capture : « je préfère avoir
             12 que 20, c'est too much là non ? ». Un muscle à 20 séries pour
             une cible de 12 s'affichait en VERT, c'est-à-dire "cible atteinte,
             rien à voir". La faute au seuil de dépassement, resté sur la bande
             fixe VOL_MAX=20 alors que le côté MANQUE avait déjà été passé en
             relatif à la cible le 6 sept. — la moitié du bug avait été
             corrigée, l'autre non. Le dépassement suit maintenant la même règle
             que le manque : c'est l'écart à TA cible qui compte. */
          var over = ratio > 1.15 || v.sets > VOL_MAX;
          var tone = below ? C.rust : partial ? C.steel : over ? C.pin : C.green;
          var lowFreq = v.freq < (goalPreset(goal).minFreq||1);
          /* Passé sur deux lignes le 6 sept. 2026 — sur un écran de 390 px, les
             quatre colonnes côte à côte (nom 100 + barre + chiffres 66 + fréquence
             58) ne laissaient qu'une soixantaine de pixels à la BARRE, c'est-à-dire
             au seul élément réellement visuel de la ligne : le repère de cible s'y
             confondait avec le remplissage. Le nom et les chiffres occupent
             maintenant la première ligne, la barre prend toute la largeur en
             dessous. */
          return h("div",{key:v.muscle, style:{padding:"8px 12px",background:C.shroudDeep,borderTop:i?"1px solid "+C.shroud:"none"}},
            h("div",{style:{display:"flex",alignItems:"baseline",gap:8,marginBottom:5}},
              h("span",{style:{fontSize:13.5,flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}, v.muscle),
              h("span",{style:{fontFamily:sansBody,fontSize:13.5,fontWeight:600,fontVariantNumeric:"tabular-nums",color:tone,flexShrink:0,whiteSpace:"nowrap"}},
                v.sets.toFixed(1),
                h("span",{style:{color:C.taupe,fontWeight:500}}, " / "+Math.round(muTarget*10)/10)),
              h("span",{style:{fontFamily:sansBody,fontSize:11.5,fontVariantNumeric:"tabular-nums",color:lowFreq?C.steel:C.taupe,flexShrink:0,whiteSpace:"nowrap"}}, "· "+v.freq.toFixed(1)+"×/sem")),
            h("div",{style:{display:"flex"}}, h(Bar,{value:v.sets, max:volBarMax, tone:tone, marker:muTarget})));
        }); })(volumeBarMax(vol, goal, profile))),
      h("p",{style:{fontSize:12.5,color:C.taupe,marginTop:6,lineHeight:1.5}},
        "Chaque ligne : séries prévues / cible du muscle, le trait clair sur la barre marquant cette cible. Calculé sur "+avgSessions.toFixed(1)+" séances/semaine (ton réglage actuel — voir Options > \"Séances par semaine\"). Cible pour ton objectif actuel (\""+((GOALS.find(function(g){return g.k===(goal||"loss_hyper");})||{}).label||"")+"\") : ~"+goalPreset(goal).targetSets+" séries/semaine/muscle (voir GOAL_PRESETS — basé sur Pelland et al. 2025 pour l'hypertrophie/perte de gras, Androulakis-Korakakis et al. 2021 pour la force), ajustée muscle par muscle si tu as réglé une \"Priorité par muscle\" dans Options. Vert = cible atteinte (95 à 115%), bleu = en approche, rouge = sous 70% de la cible ou sous le plancher de sécurité "+VOL_MIN+" séries, ambre = plus de 15% au-dessus de la cible — au-delà, rien ne montre de bénéfice supplémentaire (Remmert et al. 2025, Pelland et al. 2025) et ça ne coûte que du temps de séance. La colonne \"×/sem\" est une estimation du nombre de séances où ce muscle est sollicité — "+"vise au moins "+goalPreset(goal).minFreq+"×/semaine pour bien répartir ce volume ; en bleu si en dessous. Pour la prise de muscle c'est un repère pratique (à volume égal, la fréquence n'ajoute rien en soi — Pelland et al. 2025) ; pour la force, la même étude trouve en revanche un vrai effet de la fréquence, contrairement à Ralston et al. 2018 — voir la note dans Options."+" Se met à jour dès que tu ajoutes/retires une machine, changes d'objectif, ou changes ta fréquence dans Options.")),

                  h("span",{style:{color:C.taupe}}, "–"),
                  h(Stepper,{value:it.max, min:1, step:(ex && ex.trackBy==="time")?5:1, onChange:function(v){upd({max:Math.max(it.min,v)});}})));
            }),
            h(AddToDay,{day:d, exercises:exercises.filter(function(e){ return modeVoyage(profile) ? true : !estVoyage(e); }), allExercises:exercises, program:program, persistConfig:persistConfig, goal:goal})
          ) : null);

function BalanceRow(props){

  var pctA = Math.round((a/total)*100);

  var flagged = a>0 && b>0 && (ratio<0.7 || ratio>1.3);
  return h("div",{style:{marginBottom:14}},
    h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:12.5,color:C.taupe,marginBottom:4}},
      h("span",null,label), h("span",null, aLabel+" "+a.toFixed(1)+" · "+bLabel+" "+b.toFixed(1))),

function AnalyseTab(props){

    return Object.keys(m).map(function(muscle){ return {muscle:muscle, sets: Math.round((m[muscle]/4)*10)/10}; }).sort(function(a,b){return b.sets-a.sets;});
  }, [sessions]);

  var actualVol = useMemo(function(){ return setsByMuscle; }, [setsByMuscle]);
  var region = regionBalance(actualVol.length?actualVol:plannedVolume(program,exercises,avgSessions));
  var pp = pushPullBalance(actualVol.length?actualVol:plannedVolume(program,exercises,avgSessions));

  var stalls = useMemo(function(){ return exercises.map(function(e){return {ex:e, stall:stallInfo(sessions,e.id)};}).filter(function(x){return x.stall;}); }, [exercises,sessions]);
  var effortFlags = useMemo(function(){ return exercises.map(function(e){return {ex:e, eff:effortInfo(sessions,e.id)};}).filter(function(x){return x.eff;}); }, [exercises,sessions]);
  var symFlags = useMemo(function(){ return exercises.filter(function(e){return e.unilateral;}).map(function(e){return {ex:e, sym:symmetryInfo(sessions,e.id)};}).filter(function(x){return x.sym;}); }, [exercises,sessions]);

  var trend = useMemo(function(){ return done.map(function(s){ return {
    x: new Date(s.date).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}),
    y: Math.round(s.entries.reduce(function(a,e){ return a+e.sets.reduce(function(b,x){return b+(x.weight||0)*(x.reps||0);},0); },0)) }; }); }, [sessions]);

  var focusData = useMemo(function(){

  }, [focus, sessions]);

    .map(function(b,i){ return { x: b.date || ("mesure "+(i+1)), y: b.weightKg }; });

  /* IMPORT d'un programme (13 sept. 2026).

     Demande : échanger deux machines dans ses séances. Impossible à faire à sa
     place — ses données vivent dans le téléphone, pas sur un serveur que je
     pourrais toucher (la pastille dit "local"). L'export existait déjà pour que

     n'est supprimée. Un jour qui référence une machine inconnue la saute

  function applyImportedProgram(txt){
    var data;
    try { data = JSON.parse(txt); } catch (e) { setExportMsg("Fichier illisible — ce n'est pas un export de programme."); return; }
    if (!data || !Array.isArray(data.programme) || !Array.isArray(data.machines)) {
      setExportMsg("Fichier inattendu : il manque les machines ou le programme."); return;
    }
    var byId = {}; exercises.forEach(function(e){ byId[e.id] = e; });
    var nextEx = exercises.slice();
    data.machines.forEach(function(m){
      if (!m || !m.id || !m.nom || !Array.isArray(m.muscles) || !m.muscles.length) return;
      var champs = { name: m.nom, brand: m.marque || "", kind: m.type || "machine",
        order: m.palier || 2, muscle: m.muscles[0], muscles: m.muscles.slice(),
        muscleIntensity: Object.assign({}, m.intensites || {}),

        gymIds: Array.isArray(m.salles) ? m.salles.slice() : [], trackBy: m.suivi || "reps" };
      if (byId[m.id]) {
        nextEx = nextEx.map(function(e){ return e.id === m.id ? Object.assign({}, e, champs) : e; });
      } else {
        nextEx = nextEx.concat([Object.assign({ id: m.id, unilateral: false }, champs)]);
      }
    });
    var connues = {}; nextEx.forEach(function(e){ connues[e.id] = true; });
    var accents = [C.pin, C.taupe, C.pin, C.taupe, C.steel, C.green];
    var nextProg = data.programme.map(function(j, i){
      var items = (j.machines || []).filter(function(it){ return it && connues[it.id]; }).map(function(it){
        var reps = String(it.reps || "8-12").split("-");
        return { ex: it.id, sets: Math.max(1, it.series || 3),
          min: Math.max(1, parseInt(reps[0], 10) || 8),
          max: Math.max(1, parseInt(reps[1], 10) || parseInt(reps[0], 10) || 12),
          rest: Math.max(15, it.repos || 90) };
      });
      /* Cardio (17 sept. 2026) : relu s'il est présent, ignoré sinon — un
         export antérieur au cardio s'importe donc exactement comme avant. */
      var cardio = (j.cardio || []).filter(function(c){ return c && connues[c.id] && c.minutes > 0; })
        .map(function(c){
          var ligne = { ex: c.id, min: Math.max(1, Math.round(c.minutes)), zone: c.intensite || CARDIO_DEFAULT_ZONE };

      return jour;
    }).filter(function(j){ return j.items.length || dayCardio(j).length; });
    if (!nextProg.length) { setExportMsg("Aucune séance exploitable dans ce fichier."); return; }
    persistConfig(nextEx, nextProg);
    setExportMsg("Programme importé : " + nextProg.length + " séances, " + nextEx.length + " machines. Ton historique n'a pas bougé.");
  }

/* ============================================================
   MAIN APP
   ============================================================ */
function App(props){
  var initial = props.initialState;
  var _tab = useState("seance"), tab=_tab[0], setTab=_tab[1];
  /* Position de défilement mémorisée PAR ONGLET (7 sept. 2026, demande :
     "faut remettre la page où on était précédemment quand on change
     d'onglet"). Avant, le défilement était celui de la fenêtre, partagé par
     tous les onglets : on quittait Machines à 3 000 px pour arriver au milieu
     de Séance, et en revenant sur Machines on repartait d'où l'autre onglet
     s'était arrêté. Volontairement gardé en mémoire vive et pas dans
     localStorage : rouvrir l'appli le lendemain doit repartir du haut, c'est
     seulement la navigation entre onglets qu'on veut continue. */
  var scrollMemo = useRef({});
  var pendingScroll = useRef(null);
  function goToTab(k){
    var y = 0;
    try { y = window.scrollY || window.pageYOffset || 0; } catch(e){}
    /* Appuyer sur l'onglet DÉJÀ actif remonte en haut — le geste attendu sur
       mobile quand on est perdu au fond d'un écran long. */
    if (k === tab) {
      scrollMemo.current[k] = 0;
      try { window.scrollTo({top:0, behavior:"smooth"}); } catch(e){ try { window.scrollTo(0,0); } catch(e2){} }
      return;
    }
    scrollMemo.current[tab] = y;
    pendingScroll.current = scrollMemo.current[k] || 0;
    setTab(k);
  }
  useLayoutEffect(function(){
    var y = pendingScroll.current;
    pendingScroll.current = null;
    if (y == null) return;
    try { window.scrollTo(0, y); } catch(e){}
  }, [tab]);
  var _st = useState(initial), state=_st[0], setStateRaw=_st[1];
  var _sync = useState(initial ? "local" : "saving"), syncStatus=_sync[0], setSyncStatus=_sync[1];
  /* Mute l'objet C partagé AVANT tout rendu de cette passe — chaque
     composant enfant lit C.xxx pendant SON rendu, donc il faut que les
     bonnes valeurs soient déjà en place quand ils s'exécutent, pas après
     coup dans un useEffect (qui tournerait trop tard, après un premier
     rendu avec les mauvaises couleurs). Voir Options > Apparence. */
  applyTheme(state.profile.theme);
  useEffect(function(){
    try {
      var isLight = state.profile.theme === "light";
      document.documentElement.setAttribute("data-theme", isLight ? "light" : "dark");
      // Teinte de la barre système sur la version PWA (absent sur l'artifact, no-op alors).
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", isLight ? C_LIGHT.shroudDeep : C_DARK.shroudDeep);
    } catch (e) {}
  }, [state.profile.theme]);

  var setState = useCallback(function(patch){
    setStateRaw(function(prev){
      var next = typeof patch === "function" ? patch(prev) : Object.assign({}, prev, patch);
      setSyncStatus("saving");
      scheduleSave(next, setSyncStatus);
      return next;
    });
  }, []);

  useEffect(function(){
    if (initial && initial._justMigrated) {
      var clean = Object.assign({}, initial); delete clean._justMigrated;
      setState(function(){ return clean; });
    }
    // eslint-disable-next-line
  }, []);

  /* BUG CORRIGÉ le 7 sept. 2026, signalé sur capture : "la cible est 37 alors
     que je suis à 35 avec des pas de 5". 35 + 5 = 40, pas 37,5.

     INC_CACHE (le plus petit incrément de chaque machine, lu par itemInc dans
     prescribeBase) était rempli dans un useEffect, c'est-à-dire APRÈS le
     premier rendu. Or c'est pendant ce rendu que les charges du jour sont
     calculées : au tout premier affichage — donc à chaque ouverture de
     l'appli, et à chaque fois que la liste des machines change — itemInc ne
     trouvait rien et retombait sur son défaut de 2,5 kg. Toutes les machines
     à pas de 5 kg proposaient donc un demi-cran inexistant sur la colonne
     (35 -> 37,5 au lieu de 40), affiché "37" une fois le ",5" rogné par la
     largeur du bloc. Le calcul devenait correct au rendu suivant, ce qui
     rendait le défaut d'autant plus difficile à voir.

     useMemo s'exécute PENDANT le rendu, avant que les composants enfants ne
     lisent le cache : la charge affichée est donc bonne dès la première
     image. */
  useMemo(function(){ INC_CACHE = {}; state.exercises.forEach(function(e){ INC_CACHE[e.id]=e.inc; }); return null; }, [state.exercises]);

  var exMap = useMemo(function(){ var m={}; state.exercises.forEach(function(e){m[e.id]=e;}); return m; }, [state.exercises]);
  var nextDayKey = useMemo(function(){
    /* Skip freeform/kiné sessions (dayKey doesn't match a program day) so an
       occasional custom session doesn't derail the A/B rotation. */
    /* La rotation ne contient que les jours de MUSCU : les journées de cardio
       s'ajoutent à la semaine et se lancent à la main depuis la liste, elles
       ne font pas avancer le A/B/C/D (voir musculationDays). */
    var rota = musculationDays(state.program);
    if (!rota.length) return state.program[0].key;
    var keys = rota.map(function(p){return p.key;});
    var d = state.sessions.filter(function(s){return s.done && keys.indexOf(s.dayKey)!==-1;});
    if (d.length===0) return rota[0].key;
    var i = rota.findIndex(function(p){return p.key===d[d.length-1].dayKey;});
    return rota[(i+1)%rota.length].key;
  }, [state.sessions, state.program]);

  /* RECOMPOSITION AUTOMATIQUE À L'OUVERTURE (13 sept. 2026).

     Signalement : "t'as pas réglé le problème, regarde, trop de triceps et
     2 exos de triceps à chaque fois !!!!" — avec des chiffres identiques à la
     veille. C'était exact, et la faute est dans MON déclencheur : la
     recomposition automatique ajoutée hier ne tournait qu'à la FIN d'une séance
     enregistrée. Tant qu'aucune séance n'était terminée, elle ne tournait
     jamais — donc un programme déjà déréglé le restait indéfiniment, et la
     seule issue restait le bouton "Recalculer" d'Options, c'est-à-dire
     exactement ce qu'on voulait lui épargner.

     Elle tourne donc aussi À L'OUVERTURE, et après tout changement du
     programme ou du matériel. Trois précautions :
     - la DÉTECTION est gratuite (mesurée : 0 ms) et se fait à chaque passage ;
       seule la recomposition elle-même coûte (~250 ms sur ordinateur, le temps
       d'un battement de cils sur téléphone) et n'est lancée que s'il y a
       vraiment quelque chose à corriger ;
     - jamais pendant une séance en cours : on ne réorganise pas le programme
       sous les yeux de quelqu'un qui est en train de s'en servir ;
     - une signature du couple (programme, matériel) évite de recommencer en
       boucle : une fois une situation traitée, elle n'est pas retraitée, même
       si un reliquat de dépassement subsiste (il peut être arithmétiquement
       incompressible — voir structuralOvershoot). */
  var autoFixSig = useRef("");
  function programSignature(pr, exs){
    return (pr||[]).map(function(d){ return d.key+":"+d.items.map(function(it){ return it.ex+"x"+it.sets; }).join(","); }).join("|")
      + "#" + (exs||[]).map(function(e){ return e.id; }).join(",");
  }
  useEffect(function(){
    if (state.active) return;
    /* Mode voyage : le programme poids du corps est volontairement léger ;
       le "réparer" vers 12 séries par muscle serait un contresens. */
    if (modeVoyage(state.profile)) return;
    var sig = programSignature(state.program, state.exercises);
    if (autoFixSig.current === sig) return;
    autoFixSig.current = sig;
    try {
      var g = state.profile.goal, avg = avgSessionsPerWeek(state.profile), mf = state.profile.muscleFocus || {};
      if (!programHorsFourchette(state.program, state.exercises, g, avg, mf)) return;
      var reflowed = reflowStable(state.program, state.exercises, g, avg, mf, state.profile.currentGymId, state.profile);
      var diff = describeProgramDiff(state.program, reflowed, state.exercises);
      if (!diff.changed) return;
      var next = applyGoalToProgram(reflowed, state.exercises, g, avg, mf, state.profile);
      autoFixSig.current = programSignature(next, state.exercises);
      setState({ program: next, autoFix: diff });
    } catch (e) {}
    // eslint-disable-next-line
  }, [state.program, state.exercises, state.active]);

  var deloadReactive = reactiveDeloadDue(state.sessions, state.exercises);
  var deloadProactive = proactiveDeloadDue(state.sessions, state.program);
  var deloadSuggested = !modeVoyage(state.profile) && (deloadReactive || deloadProactive) && state.sessions.filter(function(s){return s.done;}).length >= (state.meta.deloadSnoozeUntil||0);
  var deloadReason = deloadReactive
    ? "Plusieurs exercices sont bloqués sur la même charge depuis 4 séances — signe classique qu'une semaine plus légère aiderait à repartir."
    : "Ça fait environ 6 tours complets du programme (~5-8 semaines selon ton rythme) — une décharge périodique aide à consolider les gains et prévenir la fatigue accumulée.";

  /* Le chrono vit maintenant DANS l'état enregistré (voir withRestTimerRestore) :
     il survit donc à une fermeture de l'appli en pleine séance. Même interface
     qu'avant pour tout le reste du code (restTimer / setRestTimer, valeur ou
     fonction), seul le lieu de stockage change. */
  var restTimer = state.restTimer || null;
  var setRestTimer = useCallback(function(v){
    setState(function(prev){
      var suivant = (typeof v === "function") ? v(prev.restTimer || null) : v;
      return Object.assign({}, prev, { restTimer: suivant });
    });
  }, [setState]);
  var restIdRef = useRef((initial && initial.restTimer && initial.restTimer.id) || 0);
  var wakeLockRef = useRef(null);
  // Screen Wake Lock: while a rest timer runs, ask the browser to keep the
  // screen on. This ONLY prevents the screen from auto-dimming/locking on
  // its own while the app stays open and visible — it does nothing once the
  // user manually locks the phone or switches to another app (the spec
  // auto-releases the lock the instant the page becomes hidden). Wrapped in
  // try/catch and feature-detected since many mobile browsers (notably
  // Safari on iOS before 16.4, and some in-app browsers) don't support it.
  /* Corrigé le 12 sept. 2026 — BUG RÉEL : la spec relâche le verrou dès que la
     page passe en arrière-plan, mais wakeLockRef.current restait non-nul (rien
     n'écoutait l'événement "release"). La garde !wakeLockRef.current rendait
     donc le rappel sur visibilitychange inopérant : il suffisait de basculer
     cinq secondes sur une autre appli pendant un repos pour que l'écran se
     remette à s'éteindre tout seul pour TOUT le reste de la séance — très
     exactement le cas que ce rappel devait couvrir. On remet la ref à null
     quand le verrou est relâché, et on traite aussi un verrou déjà marqué

  function acquireWakeLock(){

    try {
      if (wakeLockRef.current) { wakeLockRef.current.release().catch(function(){}); wakeLockRef.current = null; }
    } catch(e) {}

       sonnerie en mode silencieux). Démarrée ici, c'est-à-dire juste après un
       appui — le seul moment où iOS accepte de lancer une lecture audio. */
    silentTrackOn();

    setRestTimer(function(rt){ return rt ? Object.assign({}, rt, {endTime: rt.endTime + delta*1000}) : rt; });
  }
  function stopRestTimer(){ setRestTimer(null); releaseWakeLock(); silentTrackOff(); }

  /* Réoptimisation automatique — demande du 6 sept. 2026 : "quand j'ajoute ou
     supprime ou change une machine, est-ce que mon programme se modifie dans
     l'ordre de priorité de mes objectifs ? je veux que ça le fasse tout de
     suite [...] chaque fois que je modifie un paramètre qui peut changer les
     programmes, ça le mette directement à jour."

     Réponse à la question telle qu'elle était posée : NON, ça ne le faisait
     pas. Seuls les réglages d'Options (objectif, priorité par muscle, séances,
     temps, ordre de priorité) réappliquaient la répartition. Tout ce qui passe
     par persistConfig — ajouter une machine, en supprimer une, l'échanger,
     changer ses muscles, son palier poly/isolation, son suivi reps/temps, sa
     salle, l'ajouter ou la retirer d'un jour — écrivait le programme tel quel.
     Or ce sont exactement les changements qui déplacent le volume par muscle :
     supprimer la seule machine d'abducteurs, ou passer un muscle de principal
     à secondaire, change les cibles sans que rien ne soit recalculé. Il fallait
     penser à aller cliquer "Optimiser mes séances" dans Options.

     Désormais ce point de passage unique recalcule systématiquement : il
     rechoisit la fréquence optimale dans la fourchette réglée
     (pickOptimalAvgSessions) puis réapplique applyGoalToProgram AVEC le profil,
     donc en respectant l'ordre de priorité choisi (voir PRIORITY_KEYS).

     UNE exception, `opts.reoptimize === false` : l'édition manuelle des
     séries/reps/repos d'une machine dans "Composer les séances". Réoptimiser
     là écraserait la valeur dans le même geste que la saisie — le bouton
     paraîtrait cassé. Ces réglages manuels restent donc en place jusqu'à la
     prochaine réoptimisation déclenchée par autre chose, comme avant. */
  /* opts.reflow : remettre aussi la COMPOSITION des séances en cohérence avec
     la liste des machines (voir reflowProgramForCatalogue), pas seulement le
     nombre de séries. Activé à l'ajout et au retrait d'une machine (7 sept.
     2026). Volontairement PAS activé pour les autres appels — changer
     d'objectif ou de fourchette de séances ne doit pas se mettre à ajouter des
     machines dans les séances au passage. */
  function persistConfig(exercises, program, opts){
    /* Mode voyage : aucune réoptimisation ni recomposition — voir modeVoyage. */
    if ((opts && opts.reoptimize === false) || modeVoyage(state.profile)) { setState({exercises:exercises, program:program}); return; }
    var prof = state.profile || {};
    var mf = prof.muscleFocus || {};
    var prog = program;
    if (opts && opts.reflow) {
      prog = reflowStable(prog, exercises, prof.goal, avgSessionsPerWeek(prof), mf, prof.currentGymId, prof);
    }
    var pick = pickOptimalAvgSessions(prog, exercises, prof.goal,
      prof.sessionsMin, prof.sessionsMax,
      prof.sessionMinutesMin||0, prof.sessionMinutesMax==null?90:prof.sessionMinutesMax, mf);
    var next = applyGoalToProgram(prog, exercises, prof.goal, pick ? pick.n : avgSessionsPerWeek(prof), mf, prof);
    setState({exercises:exercises, program:next});
  }
  function persistSessions(sessions){ setState({sessions:sessions}); }
  function setActive(active){ if (!active) { setRestTimer(null); releaseWakeLock(); silentTrackOff(); } setState({active:active}); }
  function setDeloadForNextStart(v){ setState({deloadForNextStart:v}); }
  function snoozeDeload(){ setState(function(prev){ return Object.assign({},prev,{meta:{deloadSnoozeUntil: prev.sessions.filter(function(s){return s.done;}).length + 4}}); }); }
  function finishSession(){
    var active = state.active;
    var cleaned = Object.assign({}, active, { done:true, entries: cleanSessionEntries(active) });
    /* Marquée "voyage" pour que ni le recalibrage ni la fréquence réelle ne
       la comptent au retour (voir recalibrateProgramFromHistory). */
    if (modeVoyage(state.profile)) cleaned.voyage = true;
    /* RIEN À ENREGISTRER — corrigé le 14 sept. 2026 (audit général). Avant :
       la séance était fermée en silence (setActive(null)) et disparaissait de
       l'écran sans un mot, alors que l'utilisateur venait d'appuyer sur
       "Enregistrer la séance". Rien n'était perdu (il n'y avait rien à
       perdre), mais c'était impossible à distinguer d'un bug — ou pire, d'un
       enregistrement raté. Maintenant la séance RESTE ouverte et la fonction
       renvoie false : l'écran affiche pourquoi. */
    /* 17 sept. 2026 : une séance de CARDIO PUR n'a aucune série et serait
       refusée ici comme "rien à enregistrer". Elle compte pourtant bien. */
    if (cleaned.entries.length===0 && sessionCardio(cleaned).length===0) return false;
    setRestTimer(null);
    releaseWakeLock();
    silentTrackOff();
    var newSessions = state.sessions.concat([cleaned]);
    if (modeVoyage(state.profile)) { setState({ sessions: newSessions, active: null }); return; }
    /* Recalibrage automatique et silencieux des séries prescrites (pas de la
       liste des machines — voir recalibrateProgramFromHistory) après CHAQUE
       séance terminée, libre ou programmée : les deux alimentent l'historique
       de volume réel par muscle utilisé pour ce recalibrage. */
    var recalibrated = recalibrateProgramFromHistory(state.program, state.exercises, state.profile.goal, avgSessionsPerWeek(state.profile), state.profile.muscleFocus || {}, newSessions, state.profile);
    /* RECOMPOSITION AUTOMATIQUE (12 sept. 2026, demande : "je veux que l'app
       fasse elle-même le programme et ajuste elle-même").

       Jusqu'ici, seul le NOMBRE de séries se réajustait tout seul ; changer la
       COMPOSITION des séances (quelle machine dans quel jour) demandait
       d'aller cliquer "Recalculer toutes mes séances maintenant" dans Options.
       Personne ne pense à ce bouton — et c'est précisément ce qui laissait un
       programme dériver jusqu'à 22 séries de triceps pour une cible de 12.

       Déclenchée seulement quand il y a réellement quelque chose à corriger
       (un muscle dont le PLANCHER dépasse déjà sa cible, ou une séance
       au-dessus du repère de volume par muscle), et seulement à la fin d'une
       séance : c'est le moment où le programme n'est pas sous les yeux, donc
       le seul où le voir changer ne donne pas l'impression que l'appli défait
       ce qu'on est en train de faire. Le résultat n'est jamais silencieux :
       autoFix garde la liste de ce qui a bougé, affichée au retour sur
       l'onglet Séance. */
    var finalProgram = recalibrated;
    var autoFix = null;
    try {
      var goalNow = state.profile.goal, avgNow = avgSessionsPerWeek(state.profile), mfNow = state.profile.muscleFocus || {};
      if (programHorsFourchette(finalProgram, state.exercises, goalNow, avgNow, mfNow)) {
        var reflowed = reflowStable(finalProgram, state.exercises, goalNow, avgNow, mfNow, state.profile.currentGymId, state.profile);
        var diff = describeProgramDiff(finalProgram, reflowed, state.exercises);
        if (diff.changed) {
          finalProgram = applyGoalToProgram(reflowed, state.exercises, goalNow, avgNow, mfNow, state.profile);
          autoFix = diff;
        }
      }
    } catch (e) {}
    if (autoFix) {
      setState({ sessions: newSessions, active: null, program: finalProgram, autoFix: autoFix });
    } else if (finalProgram !== state.program) {
      setState({ sessions: newSessions, active: null, program: finalProgram });
    } else {
      setState({ sessions: newSessions, active: null });
    }
  }
  function deleteSession(id){ setState({sessions: state.sessions.filter(function(s){return s.id!==id;})}); }
  function setProfile(p){ setState({profile:p}); }
  /* Corrige le palier poly/semi/isolation d'une machine, appelable depuis
     n'importe quel écran qui affiche son badge (pas seulement l'onglet
     Machines) — voir OrderBadge. */
  function updateExerciseOrder(exId, order){
    setState({ exercises: state.exercises.map(function(e){ return e.id===exId ? Object.assign({},e,{order:order}) : e; }) });
  }
  /* Palier de poids (plus petit incrément, en kg) d'une machine — distinct
     du palier poly/semi/isolation ci-dessus. Même schéma : appelable depuis
     n'importe quel écran (voir IncStepper). INC_CACHE se met à jour tout
     seul via le useEffect(...[state.exercises]) plus haut. */
  function updateExerciseInc(exId, inc){
    setState({ exercises: state.exercises.map(function(e){ return e.id===exId ? Object.assign({},e,{inc:inc}) : e; }) });
  }
  /* Ajouter une machine à la séance EN COURS depuis l'onglet Machines (12
     sept. 2026) — même logique que le sélecteur "Ajouter une machine à cette
     séance" de l'onglet Séance : pour aujourd'hui seulement, séries réparties
     sur le volume déjà prévu du jour, machines déjà entamées intouchables.
     Dupliqué ici parce que la version de SeanceTab lit son état local ; les
     deux appellent les mêmes fonctions de calcul (rebalanceSessionSets,
     resizeEntrySets), donc elles ne peuvent pas diverger sur le fond. */
  function addExerciseToActiveSession(exId, exercisesList){
    var act = state.active;
    if (!exId || !act) return;
    if (act.entries.some(function(e){ return e.ex===exId; })) return;
    var list = exercisesList || state.exercises;
    var ex = list.filter(function(e){ return e.id===exId; })[0];
    var tierDef = tierDefaultsForGoal(state.profile.goal, ex ? exerciseOrderTier(ex) : 2);
    var sets = Array.from({length:tierDef.sets}, function(){ return {weight:null, reps:null, rir:null, weakSide:null}; });
    var newEntry = { ex: exId, sets: sets, adhoc: { min: tierDef.min, max: tierDef.max, rest: tierDef.rest, sets: tierDef.sets } };
    var before = sessionVolumeByMuscle(act.entries, list);
    var entries = act.entries.concat([newEntry]);
    var counts = rebalanceSessionSets(entries, list, before);
    setState({ active: Object.assign({}, act, { entries: entries.map(function(e,i){ return resizeEntrySets(e, counts[i]); }) }) });
  }
  /* Mode voyage — entrée et sortie en un geste (voir entrerModeVoyage). Jamais
     pendant une séance en cours : on ne change pas le programme sous les
     pieds de quelqu'un qui est en train de le suivre. */
  function basculerVoyage(on){
    setState(function(prev){
      if (prev.active) return prev;
      var r = on ? entrerModeVoyage(prev.profile, prev.program) : sortirModeVoyage(prev.profile, prev.program);
      return Object.assign({}, prev, { profile: r.profile, program: r.program, autoFix: null });
    });
  }
  function addBodyEntry(entry){
    setState({ bodyLog: (state.bodyLog||[]).concat([Object.assign({id:"b"+Date.now(), date: todayISO(), source:"manuel"}, entry)]) });
  }
  var TABS = [
    { k:"seance", label:"Séance", icon:"dumbbell" },
    { k:"programme", label:"Programme", icon:"flag" },
    { k:"machines", label:"Machines", icon:"wrench" },
    { k:"historique", label:"Historique", icon:"history" },
    { k:"analyse", label:"Analyse", icon:"trending" },
    { k:"options", label:"Options", icon:"gear" },
  ];

  /* minHeight : 100dvh (hauteur RÉELLE visible, barre d'URL rétractée comprise)
     avec repli 100vh pour les navigateurs qui ne connaissent pas dvh — sans ça,
     sur mobile, 100vh compte la barre d'URL et laissait un décalage vertical au
     défilement. Retraits de zone sûre : voir la note dans <style>. */
  return h("div",{style:{background:C.shroudDeep, fontFamily:sansBody, color:C.bone, minHeight:"100vh"}},
    h("div",{style:{minHeight:"100dvh",display:"flex",flexDirection:"column"}},
    h("header",{style:{padding:"calc(16px + var(--sat)) calc(16px + var(--sar)) 12px calc(16px + var(--sal))",
        display:"flex",alignItems:"baseline",justifyContent:"space-between",borderBottom:"1px solid "+C.taupeDim}},
      h("h1",{style:{fontFamily:sansCond,fontSize:21,fontWeight:700,margin:0}}, "Sunglo sport"),
      h("div",{style:{display:"flex",alignItems:"center",gap:12}},
        h(SyncDot,{status:syncStatus}),
        h("span",{style:{fontFamily:sansCond,fontSize:12,color:C.taupe}}, state.sessions.filter(function(s){return s.done;}).length+" séances"))),
    h("main",{style:{padding:"16px",paddingLeft:"calc(16px + var(--sal))",paddingRight:"calc(16px + var(--sar))",
        paddingBottom: "calc("+(restTimer?150:88)+"px + var(--sab))", maxWidth:640, margin:"0 auto", width:"100%"}},
      tab==="seance" ? h(SeanceTab,{ program:state.program, exercises:state.exercises, exMap:exMap, sessions:state.sessions, nextDayKey:nextDayKey,
        active:state.active, setActive:setActive, finishSession:finishSession, startRestTimer:startRestTimer,
        deloadForNextStart:state.deloadForNextStart, setDeloadForNextStart:setDeloadForNextStart,
        snoozeDeload:snoozeDeload, deloadSuggested: !state.active && deloadSuggested, deloadReason:deloadReason,
        autoFix: state.autoFix, clearAutoFix: function(){ setState({autoFix:null}); },
        updateExerciseOrder:updateExerciseOrder, updateExerciseInc:updateExerciseInc, persistConfig:persistConfig, goal:state.profile.goal,
        profile:state.profile, setProfile:setProfile, basculerVoyage:basculerVoyage }) : null,
      tab==="programme" ? h(ProgrammeTab,{ program:state.program, exercises:state.exercises, profile:state.profile, setProfile:setProfile, persistConfig:persistConfig, goal:state.profile.goal }) : null,
      tab==="historique" ? h(HistoriqueTab,{ sessions:state.sessions, exMap:exMap, program:state.program, deleteSession:deleteSession }) : null,
      tab==="machines" ? h(MachinesTab,{ exercises:state.exercises, program:state.program, persistConfig:persistConfig, sessions:state.sessions, updateExerciseInc:updateExerciseInc, goal:state.profile.goal, profile:state.profile,
        active:state.active, addToActiveSession:addExerciseToActiveSession }) : null,
      tab==="analyse" ? h(AnalyseTab,{ sessions:state.sessions, exercises:state.exercises, exMap:exMap, program:state.program, persistConfig:persistConfig, bodyLog:state.bodyLog, addBodyEntry:addBodyEntry, goal:state.profile.goal, profile:state.profile }) : null,
      tab==="options" ? h(OptionsTab,{ profile:state.profile, setProfile:setProfile, program:state.program, exercises:state.exercises, bodyLog:state.bodyLog, persistConfig:persistConfig, sessions:state.sessions, basculerVoyage:basculerVoyage, seanceEnCours:!!state.active }) : null),
    h("div",{style:{position:"fixed",bottom:0,left:0,right:0,zIndex:20}},
      restTimer ? h(RestTimerBar,{timer:restTimer, onAdjust:adjustRestTimer, onDismiss:stopRestTimer, volume: state.profile.alertVolume}) : null,
      /* paddingBottom = retrait de zone sûre : la barre reste collée en bas
         mais ses libellés ne passent plus sous l'indicateur d'accueil iOS. */
      h("nav",{"aria-label":"Navigation principale",
        style:{display:"flex",background:C.shroudDeep,borderTop:"1px solid "+C.taupeDim,
          paddingBottom:"var(--sab)",paddingLeft:"var(--sal)",paddingRight:"var(--sar)"}},
        TABS.map(function(t){
          var on = tab===t.k;
          /* Repère visuel de l'onglet actif en plus de la couleur (liseré en
             haut) : la couleur seule n'est pas un indicateur suffisant, et
             l'ambre sur taupe passe mal en plein soleil comme pour un daltonisme
             rouge/vert. aria-current expose le même état aux lecteurs d'écran. */
          return h("button",{key:t.k, onClick:function(){goToTab(t.k);},
            "aria-current": on ? "page" : null, title:t.label,
            style:{flex:1,padding:"10px 0 9px",display:"flex",flexDirection:"column",alignItems:"center",gap:3,
              background:on?C.shroud:"transparent",border:"none",borderTop:"2px solid "+(on?C.pin:"transparent"),
              color:on?C.pin:C.taupe}},
            h(Icon,{name:t.icon,size:19}), h("span",{style:{fontFamily:sansCond,fontSize:10.5,fontWeight:on?700:600}}, t.label)); })))
  ));
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
(function boot(){
  var rootEl = document.getElementById("root");
  rootEl.innerHTML = "";
  var loading = document.createElement("div");
  loading.style.cssText = "min-height:100vh;display:flex;align-items:center;justify-content:center;color:"+C.taupe+";font-family:"+sansCond+";font-size:15px;";
  loading.textContent = "Chargement du carnet…";
  rootEl.appendChild(loading);

  loadInitialState().then(function(state){
    var root = ReactDOM.createRoot(rootEl);
    root.render(h(App, {initialState: state}));
  }).catch(function(){
    var root = ReactDOM.createRoot(rootEl);
    root.render(h(App, {initialState: withAllMigrations(seedState())}));
  });
})();
</script>

<script>
// v2 (2026-09-04) : le fetch handler du service worker est déjà en
// network-first (voir service-worker.js), donc une simple réouverture de
// l'appli va normalement chercher index.html à jour sur GitHub Pages. Le
// trou restant : sur mobile, l'appli PWA n'est presque jamais "relancée à
// froid" — l'OS la garde gelée en arrière-plan quand tu changes d'appli,
// puis la ranime telle quelle (le JS déjà chargé continue de tourner) sans
// jamais refaire de navigation ni redéclencher la vérif de mise à jour du
// navigateur. Résultat vu par l'utilisateur : "je dois réinstaller l'appli
// pour voir mes changements" alors que le vrai problème est juste que la
// vérif ne se relance jamais toute seule. Deux ajouts pour ça :
// 1) reg.update() forcé à chaque retour au premier plan (visibilitychange)
//    — revérifie service-worker.js sur le réseau, indépendamment de tout
//    cache navigateur, à chaque fois que tu reviens sur l'appli ;
// 2) reload() automatique une seule fois quand un nouveau service worker
//    prend le contrôle (controllerchange) — sinon le nouveau code est bien
//    activé en arrière-plan mais la page déjà ouverte continue de tourner
//    avec l'ancien JS déjà en mémoire jusqu'à un rechargement.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("service-worker.js").then(function(reg){
      document.addEventListener("visibilitychange", function(){
        if (document.visibilityState === "visible") reg.update().catch(function(){});
      });
    }).catch(function(){});
    var reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if (reloaded) return;
      reloaded = true;
      window.location.reload();
    });
  });
}
</script>
