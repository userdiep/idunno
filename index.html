/* ============================================================
   PALETTE — machine shroud charcoal, taupe cap, selector-pin amber,
   stack-plate bone. Deux variantes du même "gym equipment" theme (sombre/
   clair, voir Options > Apparence), pas un thème par app système : le choix
   reste explicite plutôt que suivre l'OS.
   `C` est l'objet VIVANT lu partout dans le rendu (styles inline) — changer
   de thème MUTE ses propriétés (voir applyTheme) plutôt que de remplacer la
   référence, pour que tout composant qui lit C.xxx pendant son rendu prenne
   la nouvelle valeur sans avoir à passer le thème en prop partout.
   `ink` est un ajout : plusieurs boutons/badges posent du texte foncé sur un
   fond accent clair (pin/green/rust/steel, ex. bouton "Ajouter" en amber
   avec texte foncé) — ce texte doit rester foncé dans les DEUX thèmes pour
   garder un contraste correct sur ces fonds accent, contrairement à
   shroudDeep/bone qui inversent leur luminosité entre les deux thèmes. */
var C_DARK = {
  shroud: "#20262D", shroudDeep: "#171C21", panel: "#262D34",
  taupe: "#8A8079", taupeDim: "#5A544F",
  pin: "#F0A62E", pinDim: "#7A5A22",

  taupe: "#6B6058", taupeDim: "#D8D0C4",
  pin: "#F0A62E", pinDim: "#7A5A22",
  bone: "#20262D", green: "#6E9E6B", rust: "#C4674A", steel: "#6C93A6",

  "Pectoraux", "Dos", "Deltoïdes post.", "Épaules", "Biceps", "Triceps",
  "Quadriceps", "Ischio-jambiers", "Mollets", "Fessiers", "Adducteurs",
  "Abdominaux", "Lombaires", "Autre",
];
var SESSIONS_PER_WEEK = 3.2; /* valeur de repli si profile.sessionsMin/Max n'est pas
   disponible (voir avgSessionsPerWeek) — l'app a un vrai réglage éditable
   pour ça (Options > "Séances par semaine"), ce chiffre ne sert plus que de
   filet de sécurité. */
var VOL_MIN = 5, VOL_MAX = 20;
/* Fréquence hebdomadaire RÉELLE à utiliser pour convertir un volume "par
   séance planifiée" en volume "par semaine" (plannedVolume,
   applyGoalToProgram, proposePlacement) — corrigé le 4 sept. 2026 : ces
   trois fonctions utilisaient jusqu'ici la constante SESSIONS_PER_WEEK figée
   à 3,2, complètement déconnectée du réglage "Séances par semaine (min-max)"
   qu'on peut pourtant régler dans Options (profile.sessionsMin/sessionsMax,
   déjà utilisé pour la nutrition — voir computeNutrition). Résultat concret
   du bug : la zone verte/rouge de "Volume prévu par semaine" ne bougeait
   JAMAIS quand on changeait sa fréquence réelle d'entraînement, alors que
   c'est exactement le param qui doit piloter combien de séries programmer
   par séance pour atteindre une cible hebdomadaire (demande explicite :
   "les séances doivent être adaptées selon le nb de séances par semaine").
   Repli sur SESSIONS_PER_WEEK uniquement si le profil n'a pas encore ces
   champs (ne devrait plus arriver, ils ont une valeur par défaut à la
   création du profil). */
function avgSessionsPerWeek(profile) {
  if (!profile || profile.sessionsMin==null || profile.sessionsMax==null) return SESSIONS_PER_WEEK;
  var avg = (profile.sessionsMin + profile.sessionsMax) / 2;
  return avg > 0 ? avg : SESSIONS_PER_WEEK;
}
/* Ancien seuil d'alerte "séance trop longue" (90 min) — retiré du calcul de
   volume le 4 sept. 2026 ("les séances doivent être adaptées selon le nb de
   séances par semaine SANS se soucier du temps") : la durée estimée
   (estimateDayMinutes) reste affichée à titre indicatif partout où elle
   l'était déjà, mais ne colore plus rien en rouge ni n'affiche de ⚠ — le
   nombre de séries programmées suit maintenant uniquement les cibles de la
   littérature (GOAL_PRESETS.targetSets) et la fréquence réelle choisie
   (avgSessionsPerWeek), jamais un plafond de durée. Constante gardée
   (inutilisée en logique) au cas où un futur réglage voudrait la
   réintroduire explicitement. */
var SESSION_CAP_MIN = 90;
var REGION = {
  "Pectoraux":"haut", "Dos":"haut", "Deltoïdes post.":"haut", "Épaules":"haut", "Biceps":"haut", "Triceps":"haut",

};

};
/* Ajouté le 5 sept. 2026 : certaines machines sollicitent plusieurs muscles
   (ex. Chest Press = pectoraux ET triceps) — demande explicite pour pouvoir
   assigner plusieurs muscles à une machine, à la création comme après coup.
   Plutôt que de réécrire les 29 machines du catalogue d'origine (dont on n'a
   pas vérifié la biomécanique précise une par une), le champ historique
   `muscle` (singulier) reste la source de vérité pour les machines qui n'ont
   qu'un seul muscle ; `muscles` (tableau) s'y ajoute quand il y en a
   plusieurs. `allMuscles` centralise la lecture : tout le reste du code (volume,
   fréquence, recherche de substitut, affichage) passe par cette fonction au
   lieu de lire `.muscle` ou `.muscles` directement, pour ne jamais désynchroniser
   les deux représentations. Par défaut (sans intensité précisée, voir
   muscleWeight ci-dessous) un set d'un exercice multi-muscle compte pour la
   totalité de son volume dans CHAQUE muscle listé (une série de Chest Press
   vaut une série entière de pectoraux ET une série entière de triceps) — c'est
   la convention usuelle des outils de suivi de volume pour les mouvements
   composés, pas une charge divisée entre les muscles. */
function allMuscles(ex) {
  if (!ex) return [];
  if (ex.muscles && ex.muscles.length) return ex.muscles;
  return ex.muscle ? [ex.muscle] : [];
}
/* Ajouté le 5 sept. 2026 (demande : "selon l'intensité par machine") :
   `muscleIntensity` (optionnel, {nomMuscle: fraction 0-1}) pondère la
   contribution d'un muscle secondaire — ex. Chest Press avec Triceps à 0.5
   compte pour une demi-série de triceps par série réellement faite, contre
   une série entière de pectoraux (poids par défaut 1, muscle "principal").
   Défaut 1 pour tout muscle non précisé : un exercice créé avant cet ajout,
   ou dont l'intensité n'a jamais été touchée, se comporte EXACTEMENT comme
   avant (crédit plein pour chaque muscle listé) — voir allMuscles. */
function muscleWeight(ex, mu) {
  if (!ex || !ex.muscleIntensity || ex.muscleIntensity[mu]==null) return 1;
  return ex.muscleIntensity[mu];
}
/* Ajouté le 5 sept. 2026 (demande : "mettre les machines en fonction d'une
   salle") : `gymIds` (optionnel, tableau d'ids de profile.gyms) restreint une
   machine à une ou plusieurs salles. Tableau vide/absent = disponible PARTOUT
   — c'est le défaut pour les 29 machines du catalogue d'origine et pour tout
   ce qui a été ajouté avant cette fonctionnalité, donc rien ne disparaît pour
   qui n'utilise qu'une seule salle. gymId=null (utilisateur sans salle
   configurée, ne devrait plus arriver après la migration withGymsDefault)
   est traité comme "pas de filtre" plutôt que d'exclure les machines
   explicitement rattachées à une salle. */
function exerciseAvailableAtGym(ex, gymId) {
  if (!ex) return false;
  if (!gymId) return true;
  if (!ex.gymIds || !ex.gymIds.length) return true;
  return ex.gymIds.indexOf(gymId) >= 0;
}

   ============================================================ */
/* order: 1 = polyarticulaire (plusieurs articulations, ex. développé, tirage,
   presse à cuisses), 2 = semi-isolation (une seule articulation mais un
   muscle biarticulaire ou beaucoup de synergistes recrutés — ischios,
   mollets, fessiers, lombaires, oiseau/deltoïde arrière), 3 = isolation
   (une seule articulation, un seul muscle ciblé). Sert à trier l'ordre des
   exercices dans une séance (poly d'abord, isolation en dernier).
   Le découpage en 3 paliers (plutôt que juste poly/isolation) est une
   convention pratique, pas une catégorie validée par la littérature en
   tant que telle.

   Vérifié (re-recherché pour la question "meilleures machines par objectif") :
   Nunes et al. 2020 (European Journal of Sport Science, méta-analyse sur
   l'ORDRE des exercices) trouve que pour l'HYPERTROPHIE, l'ordre n'a
   quasiment aucun effet (taille d'effet combinée ≈0.03, "zero effect").
   Pour la FORCE en revanche, l'exercice placé EN PREMIER progresse le plus
   — et ce bénéfice de position est même un peu plus marqué pour les
   exercices d'isolation que pour les polyarticulaires (ES ≈0.58 vs 0.32)
   quand on inverse l'ordre. Autrement dit la littérature ne dit PAS
   "commencer par le polyarticulaire fait plus progresser" — le vrai levier
   est "commencer par ce qu'on veut prioriser". La règle poly-avant-
   isolation gardée ici est donc surtout une convention pratique de
   fraîcheur/technique/sécurité (mouvements pluri-articulaires plus lourds
   et plus exigeants en coordination, mieux faits frais) plutôt qu'un
   levier de performance validé par la littérature — modifiable à la main
   pour un exercice précis via le rond numéroté si tu veux prioriser
   volontairement une isolation. */

/* v3 (2026-08-31) — objectif confirmé : RECOMPOSITION (prise de muscle ET
   perte de gras en même temps), pas juste perte de gras. Ça change la cible
   de volume : la v2 avait redescendu à ~5-9 séries/semaine/muscle (volume
   d'ENTRETIEN, correct seulement si l'objectif était de préserver le muscle
   pendant un cut) — trop bas pour un vrai stimulus de croissance. La cible
   recomp est plutôt ~8-12 séries/semaine/muscle (volume de croissance
   modéré-haut — sources RP Strength / volume-landmarks, voir commit history).

   MAIS entre-temps il s'avère que quasiment tous les exercices sont faits
   bras/jambe par bras (voir `unilateral:true` dans SEED_EXERCISES) — sur un
   mécanisme bilatéral, ça double le temps réel par exercice (chaque série
   est faite deux fois, une par côté). Viser la cible recomp ET garder le
   bras par bras partout en même temps pousserait les séances à 95-134 min
   (calculé), ce qui ne rentre pas dans un créneau de salle normal.

   PLAN EN DEUX PHASES choisi avec l'utilisateur :
   Phase 1 (ACTUELLE, ce fichier) : on garde le volume d'entretien de la v2
   (~5-9 séries/semaine/muscle, sets ci-dessous) MAIS en unilatéral partout,
   le temps de vérifier objectivement où il y a un vrai déséquilibre gauche/
   droite (symmetryInfo a besoin d'un peu d'historique par côté). Séances
   ~75-100 min pendant cette phase — plus long que le plafond habituel de 90
   min, accepté temporairement.
   Phase 2 (à activer à la prochaine révision, ~12 oct. 2026, une fois les
   données de symétrie disponibles) : pour chaque exercice où les deux côtés
   sont proches (écart <8%, pas de flag symmetryInfo), repasser unilateral:
   false et REMONTER les sets vers la cible recomp ~8-12/semaine — un
   exercice bilatéral remonté en volume tient largement sous 90 min. Pour un
   exercice où un déséquilibre réel est détecté, garder l'unilatéral plus
   longtemps et appliquer la méthode "côté faible d'abord" (voir Analyse >
   Asymétrie gauche/droite) avant de repasser bilatéral.

   quasi tout, 4 sur les gros mouvements" laissait épaules/deltoïdes post./

   (sous VOL_MIN=5, flag rouge dans l'app), pendant que quadriceps/ischios/
   pecs/dos/abdos tournaient à 6.4-8. Ce n'était pas voulu : ce n'est pas un
   problème de gauche/droite ni haut/bas (ces ratios étaient bons, ~1.05 et
   1.00), juste une répartition de séries trop concentrée sur les gros
   mouvements. Correctif : ces 8 muscles passent à 4 séries (répartis sur

   remonte à 5.6-6.4 séries/semaine — aligné avec le reste. Pour limiter le
   temps ajouté, repos réduit à 60-80s sur les séries d'isolation concernées
   (justifié : petits muscles, récupération plus rapide qu'un gros mouvement
   composé). Séances UA/UB ~104-107 min (vs 97-99 avant) — accepté par
   l'utilisateur comme faisant partie du compromis temporaire de la phase 1. */

   exercice fait à mains nues. `kind` ne sert qu'à l'étiquette affichée et
   au filtrage visuel (voir KIND_LABEL plus bas) — aucune logique de séries/
   reps/repos n'en dépend, donc l'ajouter ne casse rien d'existant. Pour un

   difficile — l'app suit déjà les séries/répétitions cible par palier
   (GOAL_PRESETS) de la même façon que pour une machine. */

/* ============================================================
   ENGINE — progressive overload, stalls, effort, deload,
   symmetry, and upper/lower + push/pull volume balance.
   ============================================================ */
function historyFor(sessions, exId) {
  return sessions.filter(function(s){return s.done;})
    .map(function(s){ return { date: s.date, entry: s.entries.find(function(e){return e.ex===exId;}) }; })
    .filter(function(r){ return r.entry && r.entry.sets.some(function(x){return x.weight!=null && x.reps!=null;}); })
    .sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
}
var INC_CACHE = {};
function itemInc(item){ return INC_CACHE[item.ex] != null ? INC_CACHE[item.ex] : 2.5; }
function round(n){ return Math.round(n*2)/2; }

function prescribeBase(sessions, item) {
  var hist = historyFor(sessions, item.ex);
  if (hist.length === 0) {
    return { weight: null, targetReps: item.min, note: "Premier passage — charge que tu tiens " + item.min + " reps en gardant 2 reps en réserve.", state: "new" };
  }
  var last = hist[hist.length-1].entry.sets.filter(function(s){return s.weight!=null;});
  var w = Math.max.apply(null, last.map(function(s){return s.weight;}));
  var atW = last.filter(function(s){return s.weight===w;});
  var rirs = atW.map(function(s){return s.rir;}).filter(function(r){return r!=null;});
  var avgRir = rirs.length ? rirs.reduce(function(a,b){return a+b;},0)/rirs.length : null;

  if (avgRir != null && avgRir >= 3) {
    var jump = itemInc(item) * 2;
    return { weight: round(w+jump), targetReps: item.min, state: "up",
      note: "Tu as fini à " + avgRir.toFixed(1) + " reps en réserve — trop léger. On monte de " + jump + " kg d'un coup." };
  }
  if (atW.length >= item.sets && atW.every(function(s){return s.reps>=item.max;})) {
    return { weight: round(w+itemInc(item)), targetReps: item.min, note: "Toutes les séries au plafond — on monte la charge.", state: "up" };
  }
  if (atW.some(function(s){return s.reps<item.min;}) && hist.length >= 2) {
    var prev = hist[hist.length-2].entry.sets.filter(function(s){return s.weight!=null;});
    var pw = Math.max.apply(null, prev.map(function(s){return s.weight;}));
    if (pw === w && prev.some(function(s){return s.reps<item.min;})) {
      return { weight: round(Math.max(itemInc(item), w-itemInc(item))), targetReps: item.min, note: "Deux séances sous la fourchette — on redescend d'un cran.", state: "down" };
    }
  }
  var next = Math.min(item.max, Math.min.apply(null, atW.map(function(s){return s.reps;})) + 1);
  return { weight: w, targetReps: next, note: "Même charge — vise " + next + " reps sur chaque série.", state: "hold" };
}

function prescribe(sessions, item, deload) {
  var p = prescribeBase(sessions, item);
  if (!deload) return p;
  if (p.weight == null) return { weight: null, targetReps: item.min, state: "deload",
    note: "Décharge : première fois, reste léger et garde 3 reps en réserve." };
  var w2 = round(p.weight * 0.8);
  return { weight: w2, targetReps: item.min, state: "deload", setsOverride: Math.max(2, item.sets-1),
    note: "Semaine de décharge — environ 80% de la charge habituelle, une série de moins, technique propre." };
}

function stallInfo(sessions, exId) {
  var hist = historyFor(sessions, exId);
  if (hist.length < 4) return null;
  var weights = hist.map(function(hh){ return Math.max.apply(null, hh.entry.sets.filter(function(s){return s.weight!=null;}).map(function(s){return s.weight;})); });
  var recent = weights.slice(-4);
  return Math.max.apply(null, recent) <= recent[0] ? { sessions: recent.length, weight: recent[0] } : null;
}
function effortInfo(sessions, exId) {
  var hist = historyFor(sessions, exId).slice(-4);
  if (hist.length < 3) return null;
  var all = [];
  hist.forEach(function(hh){ hh.entry.sets.forEach(function(s){ if (s.rir!=null) all.push(s.rir); }); });
  if (all.length < 6) return null;
  var avg = all.reduce(function(a,b){return a+b;},0) / all.length;
  return avg >= 3 ? { avg: Math.round(avg*10)/10 } : null;
}
function symmetryInfo(sessions, exId) {
  /* Tu commences déjà par le côté faible et égalises la charge/reps sur le
     fort — donc comparer le poids logué des deux côtés ne révélerait jamais
     rien (il est identique par construction). Le signal vient plutôt d'un
     repérage volontaire et léger : sur chaque série tu peux, en option,
     indiquer quel côté a semblé plus dur ce jour-là. On compte juste lequel
     revient le plus souvent sur les dernières séances. */
  var hist = historyFor(sessions, exId).slice(-6);
  var flags = { L: 0, R: 0, total: 0 };
  hist.forEach(function(hh){ hh.entry.sets.forEach(function(s){
    if (s.weakSide === "L") { flags.L++; flags.total++; }
    if (s.weakSide === "R") { flags.R++; flags.total++; }
  }); });
  if (flags.total < 3) return null;
  var dominant = flags.L > flags.R ? "L" : flags.R > flags.L ? "R" : null;
  if (!dominant) return null;
  var pct = Math.round((Math.max(flags.L, flags.R) / flags.total) * 100);
  if (pct < 60) return null;
  return { weaker: dominant==="L" ? "gauche" : "droit", pct: pct, count: flags.total };
}

function stalledCount(sessions, exercises){ return exercises.filter(function(e){return stallInfo(sessions,e.id);}).length; }
function trackedCount(sessions, exercises){ return exercises.filter(function(e){return historyFor(sessions,e.id).length>=4;}).length; }
function reactiveDeloadDue(sessions, exercises){
  var tracked = trackedCount(sessions, exercises);
  if (tracked < 3) return false;
  return stalledCount(sessions, exercises) / tracked >= 0.5;
}
function cyclesCompleted(sessions, program){ return Math.floor(sessions.filter(function(s){return s.done;}).length / program.length); }
function proactiveDeloadDue(sessions, program){
  var done = sessions.filter(function(s){return s.done;}).length;
  var c = cyclesCompleted(sessions, program);
  return c > 0 && c % 6 === 0 && done % program.length === 0;
}

/* Estimated real session length: ~40s of work per set + its rest, plus ~70s
   de transition entre machines et 5 min d'échauffement/attente. Rough but
   directional — real gym time also depends on how busy it is, so treat
   this as a floor, not a promise.

   Calculé en BILATÉRAL (demandé le 4 sept. 2026) : ne double plus les
   séries pour les exercices unilatéraux (bras/jambe par bras). Avant, un
   exercice unilatéral comptait chaque série deux fois (une par côté), ce
   qui gonflait l'estimation (~96 min vu en Options) — cohérent avec la
   phase 1 (voir plus haut, unilatéral partout le temps de vérifier
   l'équilibre gauche/droite) mais plus ce que l'utilisateur veut voir
   affiché ici. `exMap` gardé en paramètre pour ne pas casser les appels
   existants, même s'il ne sert plus dans cette fonction. */
function estimateDayMinutes(day, exMap) {
  var total = 0;
  day.items.forEach(function(it) {
    total += it.sets * (40 + it.rest);
  });
  total += Math.max(0, day.items.length - 1) * 70;
  total += 300;
  return Math.round(total / 60);
}

/* Planned weekly volume, by muscle, from the program as configured.
   avgSessions = fréquence hebdomadaire réelle (voir avgSessionsPerWeek) —
   optionnel, retombe sur SESSIONS_PER_WEEK si omis (compat des rares appels
   qui n'ont pas encore le profil sous la main). Retourne aussi `freq` :
   une estimation du nombre de fois/semaine où CE muscle est entraîné
   (nb de jours du programme qui le sollicitent × assiduité réelle) — ajouté
   suite à la recherche sur la fréquence d'entraînement (Pelland et al. 2025 ;
   Ralston et al. 2018) : le volume total ne dit rien de la répartition dans
   la semaine, or ≥2×/semaine/muscle reste la recommandation pratique pour
   l'hypertrophie (voir GOAL_PRESETS.minFreq et la note plus bas). */
function plannedVolume(program, exercises, avgSessions) {
  var exMap = {}; exercises.forEach(function(e){ exMap[e.id]=e; });
  var freqFactor = (avgSessions||SESSIONS_PER_WEEK) / Math.max(1, program.length);
  var factor = freqFactor;
  var m = {}, daysWith = {};
  program.forEach(function(d){
    var musclesToday = {};
    d.items.forEach(function(it){
      var ex = exMap[it.ex]; if (!ex) return;
      allMuscles(ex).forEach(function(mu){
        m[mu] = (m[mu]||0) + it.sets * muscleWeight(ex, mu);
        musclesToday[mu] = true; // fréquence : ce muscle est sollicité ce jour-là, peu importe l'intensité
      });
    });
    Object.keys(musclesToday).forEach(function(mu){ daysWith[mu] = (daysWith[mu]||0) + 1; });
  });
  return Object.keys(m).map(function(muscle){
    return { muscle: muscle, sets: Math.round(m[muscle]*factor*10)/10,
      freq: Math.round((daysWith[muscle]||0)*freqFactor*10)/10 };
  }).sort(function(a,b){ return b.sets-a.sets; });
}
function regionBalance(vol){
  var sums = {haut:0, bas:0};
  vol.forEach(function(v){ var r=REGION[v.muscle]; if (r==="haut"||r==="bas") sums[r]+=v.sets; });
  return sums;
}
function pushPullBalance(vol){
  var sums = {push:0, pull:0};
  vol.forEach(function(v){ var c=PUSHPULL[v.muscle]; if (c) sums[c]+=v.sets; });
  return sums;
}

/* Choisit la meilleure machine de remplacement parmi des candidats pour le
   même muscle — au lieu de prendre juste la première de la liste (ordre
   d'ajout au catalogue, qui n'a aucun rapport avec la qualité de l'exercice
   pour l'objectif). Deux critères, dans cet ordre :
   1) une machine CONFIRMÉE (brand !== "?") plutôt qu'une encore "à
      vérifier" — remplacer par une machine dont on n'est même pas sûr
      qu'elle existe à la salle ne sert à rien ;
   2) le même palier polyarticulaire/semi-isolation/isolation (voir `order`
      dans SEED_EXERCISES et exerciseOrderTier) que l'exercice remplacé, pour
      ne pas casser l'ordre poly-avant-isolation de la séance (voir Séance >
      petit badge numéroté sur chaque machine).
   À égalité sur ces deux critères, l'ordre du catalogue tranche — ça reste
   déterministe et prévisible.

   Objectif d'entraînement (goal) délibérément PAS un critère ici — question
   vérifiée spécifiquement (recherche faite pour "quelles sont les
   meilleures machines pour chaque objectif") plutôt que supposée. Trois
   études trouvées comparant des machines polyarticulaires à des machines
   d'isolation pour LE MÊME muscle :
   - un essai croisé randomisé chez des hommes entraînés (International
     Journal of Exercise Science, 2020) ne trouve AUCUNE différence
     significative de gain de force (1RM développé couché, squat) entre un
     protocole polyarticulaire et un protocole en isolation ;
   - une méta-analyse dédiée à l'hypertrophie (mono- vs poly-articulaire,
     membres) ne trouve pas non plus de différence significative sur la
     croissance musculaire globale (mais suggère un possible intérêt de
     CUMULER les deux types pour le développement régional du muscle,
     piste encore peu étudiée) ;
   - une méta-analyse sur l'ORDRE des exercices (Nunes et al. 2020, voir
     note plus haut sur `order`) confirme que l'ordre n'affecte pas
     l'hypertrophie, et que pour la force c'est LA POSITION (premier de la
     séance) qui compte, pas le fait que l'exercice soit poly ou isolation.
   Conclusion retenue : pas de base solide pour préférer une machine
   polyarticulaire à une machine d'isolation ciblant le même muscle selon
   l'objectif (force/hypertrophie/perte de gras) — bestCandidate reste donc
   volontairement identique pour les 6 objectifs. Ce qui varie réellement
   par objectif, et qui est bien implémenté ailleurs, c'est le nombre de
   séries/reps/repos par palier (GOAL_PRESETS/tierDefaultsForGoal) et la
   cible kcal/protéines — pas le choix de LA machine. */
/* referenceMuscles (ajouté 5 sept. 2026, voir allMuscles) : nombre de muscles
   partagés avec l'exercice remplacé/bloqué — un candidat qui couvre PLUSIEURS
   des mêmes muscles est un meilleur substitut qu'un candidat qui n'en
   partage qu'un seul, donc ce critère passe juste après "vérifiée" et avant
   le palier. Optionnel : omis, tous les candidats sont à égalité dessus
   (comportement identique à avant l'ajout). */
function bestCandidate(candidates, referenceOrder, referenceMuscles) {
  if (!candidates.length) return null;
  var refM = referenceMuscles || [];
  var scored = candidates.map(function(e, i){
    var overlap = allMuscles(e).filter(function(mu){ return refM.indexOf(mu) >= 0; }).length;
    return { e: e, i: i, verified: e.brand !== "?" ? 1 : 0, overlap: overlap, sameTier: exerciseOrderTier(e) === referenceOrder ? 1 : 0 };
  });
  scored.sort(function(a, b){
    if (a.verified !== b.verified) return b.verified - a.verified;
    if (a.overlap !== b.overlap) return b.overlap - a.overlap;
    if (a.sameTier !== b.sameTier) return b.sameTier - a.sameTier;
    return a.i - b.i;
  });
  return scored[0].e;
}

/* Removing a machine: keep the volume by swapping in the BEST equivalent
   sharing at least one muscle (see bestCandidate), not just the first one on
   the list. Un exercice multi-muscle (voir allMuscles) est un candidat valable
   dès qu'il partage AU MOINS un muscle avec celui qu'on retire — bestCandidate
   priorise ensuite celui qui en partage le plus. */
function removeWithSubstitution(exId, exercises, program) {
  var gone = exercises.find(function(e){return e.id===exId;});
  var goneMuscles = allMuscles(gone);
  var remaining = exercises.filter(function(e){return e.id!==exId;});
  var report = [];
  var nextProgram = program.map(function(day){
    var items = [];
    day.items.forEach(function(it){
      if (it.ex !== exId) { items.push(it); return; }
      var taken = {}; day.items.forEach(function(x){taken[x.ex]=true;}); items.forEach(function(x){taken[x.ex]=true;});
      var candidates = remaining.filter(function(e){ return !taken[e.id] && allMuscles(e).some(function(mu){ return goneMuscles.indexOf(mu)>=0; }); });
      var cand = bestCandidate(candidates, exerciseOrderTier(gone), goneMuscles);
      if (cand) { items.push(Object.assign({}, it, {ex: cand.id})); report.push({day: day.label, to: cand.name, sets: it.sets}); }
      else { report.push({day: day.label, to: null, sets: it.sets}); }
    });
    return Object.assign({}, day, {items: items});
  });
  return { exercises: remaining, program: nextProgram, report: report, gone: gone };
}

/* An exercise is stalled (same weight 4+ séances) and it's the only one blocking:
   look for the BEST other machine already in the catalog, sharing at least one
   muscle (see allMuscles), that isn't already used anywhere in the program
   (see bestCandidate for what "best" means here). Returns null if nothing
   suitable exists. */
function suggestSwap(exId, exercises, program) {
  var ex = exercises.find(function(e){return e.id===exId;});
  if (!ex) return null;
  var usedIds = {};
  program.forEach(function(d){ d.items.forEach(function(it){ usedIds[it.ex]=true; }); });
  var exMuscles = allMuscles(ex);
  var candidates = exercises.filter(function(e){ return e.id!==exId && !usedIds[e.id] && allMuscles(e).some(function(mu){ return exMuscles.indexOf(mu)>=0; }); });
  return bestCandidate(candidates, exerciseOrderTier(ex), exMuscles);
}
/* Ajouté le 5 sept. 2026 (demande : "adapter les séances selon quelle salle
   où je suis") — un jour de programme peut contenir une machine non
   disponible dans la salle actuellement sélectionnée (voir
   exerciseAvailableAtGym, profile.gyms/currentGymId). Plutôt que de bloquer
   ou de faire disparaître silencieusement l'exercice, on la remplace ICI (à
   l'affichage/au démarrage de la séance, PAS dans le programme permanent —
   même logique que removeWithSubstitution/l'ajout à la volée) par la
   meilleure machine dispo dans cette salle partageant au moins un muscle
   (voir bestCandidate) ; si aucune n'existe, l'item est gardé tel quel avec
   `gymMissing:true` pour que l'UI prévienne plutôt que de faire comme si de
   rien n'était. Sans salle sélectionnée (gymId falsy) ou sans aucune machine
   avec des gymIds restreints, retourne les items inchangés — comportement
   identique à avant cette fonctionnalité pour qui n'utilise qu'une salle. */
function adaptDayItems(items, exercises, exMap, gymId) {
  if (!gymId) return items;
  return items.map(function(it){
    var ex = exMap[it.ex];
    if (!ex || exerciseAvailableAtGym(ex, gymId)) return it;
    var exM = allMuscles(ex);
    var candidates = exercises.filter(function(x){ return x.id!==ex.id && exerciseAvailableAtGym(x, gymId) && allMuscles(x).some(function(mu){ return exM.indexOf(mu)>=0; }); });
    var sub = bestCandidate(candidates, exerciseOrderTier(ex), exM);
    if (sub) return Object.assign({}, it, { ex: sub.id, gymSwappedFrom: ex.name });
    return Object.assign({}, it, { gymMissing: true });
  });
}
/* Séries/reps/repos à proposer quand on remplace oldEx par newEx dans le
   programme, quel que soit l'endroit d'où vient la demande (bouton "Changer
   de machine" en Séance, ou suggestion de remplacement sur un exercice
   bloqué en Analyse — les deux doivent s'adapter pareil, sinon un des deux
   chemins garde un ancien réglage qui ne correspond plus à la machine).
   Même palier (poly/semi/iso) que l'exercice remplacé : le réglage déjà en
   place reste pertinent, pas de raison d'y toucher. Palier différent : on
   repart des repères par palier ET par objectif (GOAL_PRESETS ci-dessus),
   plutôt que de garder des reps/repos pensés pour un autre type de
   mouvement. Le nombre de séries en cours (sampleItem.sets) est conservé
   même en cas de palier différent, seuls reps/repos changent — on ne
   réduit pas le volume programmé juste parce que la machine change. */
function swapRecommendation(oldEx, newEx, program, goal) {
  var oldTier = exerciseOrderTier(oldEx), newTier = exerciseOrderTier(newEx);
  var sampleItem = null;
  program.some(function(d){ var it = d.items.find(function(x){return x.ex===oldEx.id;}); if (it) { sampleItem = it; return true; } return false; });
  var d2 = tierDefaultsForGoal(goal, newTier);
  return (newTier === oldTier && sampleItem)
    ? { sets: sampleItem.sets, min: sampleItem.min, max: sampleItem.max, rest: sampleItem.rest }
    : { sets: sampleItem ? sampleItem.sets : d2.sets, min: d2.min, max: d2.max, rest: d2.rest };
}
/* ============================================================
   OBJECTIFS D'ENTRAÎNEMENT — presets par palier (poly/semi/iso) et
   nutrition (déficit/protéines/activité), un par combinaison choisie par
   l'utilisateur (perte de gras, hypertrophie, force, et les 3 associations
   entre deux de ces trois). "loss_hyper" reste la valeur par défaut ET
   reste EXACTEMENT ce qui était déjà en place avant ce menu (recomposition,
   voir l'audit dans la conversation) — volontairement non retouché ici,
   même si une source plus bas suggère qu'un repos un peu plus long
   profiterait aussi à ce preset (voir note repos).

   Sources vérifiées pour les 5 autres presets (recherchées et lues pour ce
   changement, pas des chiffres inventés) :
   - Force — charge/volume : mise à jour ACSM 2026 des recommandations de
     musculation (première révision en 17 ans) : force ≈ ≥80% 1RM, 2-3
     séries/exercice. ≥80% 1RM correspond conventionnellement à une zone
     d'environ 4-6 répétitions avant échec technique. Repos : la convention
     de longue date (NSCA Essentials of Strength Training, ACSM) pour des
     charges quasi-maximales reste 2-5 min, pour permettre une récupération
     quasi complète de la filière ATP-PC entre séries — pas de remise en
     cause récente trouvée sur ce point précis.
   - Hypertrophie — charge/volume : la même mise à jour ACSM 2026 constate
     que l'hypertrophie se produit sur une large plage de charges (30-100%
     1RM) tant que l'effort est suffisant (proche de l'échec) — donc le "rep
     range hypertrophie 6-12" n'est plus considéré comme une zone magique,
     plutôt une zone pratique parmi d'autres qui marchent aussi bien ;
     volume cible ≥10 séries/muscle/semaine (repère qui s'applique au volume
     hebdomadaire total, voir VOL_MIN/VOL_MAX/plannedVolume — les tiers
     ci-dessous ne fixent que le point de départ par exercice).
   - Repos et hypertrophie : une méta-analyse bayésienne récente (Robinson
     et al., Frontiers in Sports and Active Living, 2024, "Give it a Rest")
     trouve un léger avantage hypertrophique aux repos >60s, sans bénéfice
     supplémentaire net au-delà de ~90s — ce qui va à l'encontre de l'ancien
     repère NSCA "30-90s pour l'hypertrophie". Preuve qualifiée de faible
     certitude par les auteurs eux-mêmes (intervalles crédibles larges,
     seulement 9 études) — donc traité ici comme "viser plutôt ≥90s que
     60s", pas comme une règle stricte.
   - Perte de gras — déficit : revue Helms/Aragon/Fitschen 2014 (contest
     prep naturel) : viser une perte de 0,5 à 1%/semaine du poids corporel
     pour préserver au mieux la masse maigre (plus lent = mieux préservé).
     Converti en kcal/jour pour CE profil (poids actuel dans l'appli,
     ~85,1 kg) avec l'équivalence usuelle ~7700 kcal/kg de masse grasse :
     0,5%/sem ≈ 470 kcal/j, 1%/sem ≈ 935 kcal/j — une fourchette large, pas
     un chiffre validé au kg près. Le preset "Perte de gras" seule (priorité
     vitesse, pas de muscle à construire) vise le haut de cette fourchette —
     corrigé le 4 sept. 2026 de 600 à 925 kcal/j : 600 correspondait en fait
     à ~0,64%/semaine, un peu au-dessus du milieu de la fourchette, pas au
     sommet visé par le preset (erreur de calibration, pas un changement de
     stratégie). Les presets combinés à hypertrophie/force restent plus
     prudents (bas de fourchette, ~450-470 kcal/j), cohérent avec la
     recommandation "plus lent préserve mieux". Aucune étude trouvée ne
     montre qu'un rep range particulier accélère la perte de gras elle-même
     — donc les tiers ci-dessous, pour "Perte de gras" seule, restent
     proches d'un schéma hypertrophie générique plutôt que d'inventer un rep
     range "brûle-graisse" qui n'a pas de base solide.
   - Protéines en déficit : CONVERGENCE de deux sources indépendantes — la
     position de l'ISSN "Diets and Body Composition" (Aragon et al. 2017) et
     la revue Helms et al. 2014 citée ci-dessus recommandent toutes les deux
     2,3-3,1 g/kg de MASSE MAIGRE/jour pour les sujets entraînés en
     restriction calorique, l'extrémité haute étant pour un déficit plus
     important ou une masse grasse plus basse. Traduit en g/kg de POIDS
     TOTAL (l'unité du curseur Options) avec la masse maigre estimée de ce
     profil (~62,7 kg sur 85,1 kg, voir Options > repère masse maigre) :
     ≈1,7-2,3 g/kg de poids total. Les presets avec perte de gras utilisent
     le haut de cette plage traduite (2,1-2,3) ; ce repère spécifique à la
     recomposition (2,6-3,5 g/kg masse maigre, revue Barakat et al. 2020,
     déjà utilisé pour "loss_hyper") reste PLUS élevé que ce repère cutting
     général — cohérent avec le fait que la recomposition demande de
     construire ET préserver en même temps.
   - Prise de masse (Hypertrophie seule, Force seule, Hypertrophie + Force)
     — MISE À JOUR du 4 sept. 2026 : léger SURPLUS calorique plutôt que
     maintenance. La version précédente mettait ces 3 presets à déficit 0
     en expliquant qu'"une vraie prise de masse bénéficierait d'un léger
     surplus mais l'appli n'a qu'un curseur de déficit (0-600 kcal)" — ce
     n'est plus vrai : le curseur "Déficit calorique" (Options) accepte
     maintenant aussi des valeurs négatives, interprétées comme un surplus
     (computeNutrition fait déjà target = tdee - deficitKcal, donc une
     valeur négative ajoute au lieu de soustraire — aucun changement de
     formule nécessaire, juste la plage du curseur et son affichage).
     Source pour la TAILLE du surplus : Oranchuk, Helms & Spence et al.
     2023, Sports Medicine - Open, "Effect of Small and Large Energy
     Surpluses on Strength, Muscle, and Skinfold Thickness in
     Resistance-Trained Individuals: A Parallel Groups Design" — ESSAI
     CONTRÔLÉ (pas une revue) comparant maintenance, surplus modéré (~5% du
     TDEE) et gros surplus (~15% du TDEE) chez des sujets déjà entraînés.
     Résultats : le surplus MODÉRÉ a donné le MEILLEUR gain de force
     (1RM développé couché) des 3 groupes, devant la maintenance ET devant
     le gros surplus ; l'épaisseur musculaire n'a PAS différé
     significativement entre les 3 groupes (un surplus plus gros ne
     construit pas plus de muscle) ; la prise de gras (plis cutanés) était
     plus élevée dans les 2 groupes en surplus que maintenance. Conclusion
     des auteurs : une prise de poids plus rapide (donc un plus gros
     surplus) augmente surtout la vitesse de prise de poids, pas le gain de
     muscle ni de force. D'où le choix ici d'un surplus modéré (~5% du
     TDEE, ≈125 kcal/j pour ce profil à ~2430 kcal de TDEE en mode "DER +
     pas + séances") pour les 3 presets ci-dessous, plutôt que la
     maintenance d'avant ou un surplus plus large. Nuance à garder en tête :
     Slater et al. 2019 (Frontiers in Nutrition, "Is an Energy Surplus
     Required to Maximize Skeletal Muscle Hypertrophy...") notent que la
     taille de surplus qui maximiserait spécifiquement l'hypertrophie
     restait, au moment de leur revue, non validée expérimentalement — ce
     choix de 5% s'appuie donc sur l'essai contrôlé le plus direct trouvé à
     ce jour sur cette question précise (2023, postérieur à cette revue),
     pas sur un consensus ancien et large. Protéines dans ces 3 cas :
     ~1,8-1,9 g/kg de poids total, cohérent à la fois avec le seuil
     ≥1,6 g/kg validé par méta-analyse (Morton et al. 2018) pour la prise de
     masse maigre, et avec la fourchette 1,8-2,7 g/kg que Iraki et al. 2019
     (Sports, "Nutrition Recommendations for Bodybuilders in the
     Off-Season") donnent pour la phase de prise de masse SPÉCIFIQUEMENT —
     cette revue trouve la même fourchette qu'en cutting, donc pas de
     majoration "cutting" à retirer ici, elle n'existait déjà pas.
   - Activité quotidienne (activityMultiplier) : volontairement IDENTIQUE
     sur les 6 presets — c'est un reflet du mode de vie (niveau d'activité
     hors entraînement), pas de l'objectif d'entraînement ; le faire varier
     par objectif n'aurait aucune justification.
   - Nombre de SÉRIES par palier — corrigé le 4 sept. 2026 (bug remonté :
     "les muscles sont pas bien équilibrés à chaque fois que je change de
     mode d'entraînement"). Vérifié en recalculant plannedVolume sur le
     programme réel pour les 6 objectifs : "loss_hyper" (tier 3 à 4 séries
     au lieu de 3, hérité tel quel de l'ancien réglage historique
     pré-presets) et "loss_strength" (tier 1 à 4 séries au lieu de 3,
     ajouté sans vérifier cet effet de bord) donnaient 1 série de PLUS à un
     seul palier — or les muscles de ce catalogue sont chacun entraînés par
     un mélange FIXE et différent de paliers (Dos = 100% poly, Ischio-
     jambiers = 100% semi-isolation, Adducteurs = 100% isolation,
     Pectoraux/Épaules/Quadriceps = mélange) : donner un bonus à UN palier
     précis avantage mécaniquement les muscles qui tombent sur ce palier,
     UNIQUEMENT quand cet objectif est actif. Aucune source trouvée ne
     justifie de faire varier le NOMBRE DE SÉRIES selon poly/semi/isolation
     (contrairement aux reps/repos, qui en dépendent bien, voir ACSM 2026 /
     Robinson 2024 cités plus haut) — seul le nombre de séries total par
     objectif a une base dans la littérature. Les 6 presets donnent donc
     maintenant le même nombre de séries sur les 3 paliers (seuls reps et
     repos restent différents par palier, partout) : un changement
     d'objectif fait donc varier le volume de TOUS les muscles dans la
     même proportion, sans avantager tel ou tel muscle selon son mélange de
     paliers. Le déséquilibre RÉSIDUEL entre muscles qui ont plus ou moins
     d'exercices déjà programmés (indépendant de l'objectif — visible dans
     Machines > "Volume prévu par semaine") reste, lui, à corriger à la
     main en ajoutant/retirant des exercices, pas par ce système de presets.

   MISE À JOUR du 4 sept. 2026 — volume/fréquence/proximité de l'échec.
   Nouvelle recherche demandée spécifiquement sur "comment progresser le
   plus vite en hypertrophie", puis étendue à force/perte de gras/
   associations par souci de cohérence. Trois leviers regardés, dans l'ordre
   d'impact trouvé dans la littérature :
   1) VOLUME hebdomadaire par muscle — la méta-régression la plus récente et
      la plus large à ce jour (Pelland et al. 2025, Sports Medicine,
      "The Resistance Training Dose-Response") confirme une relation
      dose-réponse à rendements décroissants marqués : la plupart du gain
      d'hypertrophie est capté entre 12 et 20 séries/muscle/semaine, au-delà
      les données restent trop rares pour trancher. Ça AFFINE (sans le
      contredire) le repère ACSM "≥10 séries/semaine" déjà utilisé ici —
      d'où le nouveau champ `targetSets` par preset (utilisé par
      applyGoalToProgram et proposePlacement à la place du plancher
      générique VOL_MIN=5, qui reste lui un plancher de sécurité universel
      "ne pas perdre le muscle", pas une cible d'optimisation).
   2) FRÉQUENCE — la même méta-régression 2025 trouve qu'une fois le volume
      total contrôlé, la fréquence n'a PLUS d'effet indépendant sur
      l'hypertrophie (contrairement à une méta-analyse plus ancienne de
      Schoenfeld qui trouvait un léger avantage à 2×/semaine vs 1×/semaine à
      volume égal). Son intérêt reste pratique : répartir le volume sur
      ≥2 séances/semaine/muscle plutôt qu'une seule évite d'entasser 15+
      séries d'affilée avec une qualité d'exécution qui se dégrade en fin de
      séance — d'où `minFreq` (repère informatif affiché, pas une règle
      stricte) plutôt qu'un vrai levier de volume. Pour la FORCE, la
      fréquence par mouvement a un effet moins net et moins constant sur le
      gain de 1RM une fois le volume égalisé (Ralston et al. 2018, Sports
      Medicine - Open ; corroboré par Pelland et al. 2025) — avec une
      nuance : le haut du corps semble bénéficier un peu plus d'une
      fréquence ≥3×/semaine que le bas du corps dans cette même
      méta-analyse, mais l'effet reste trop inconsistant pour en faire une
      règle par muscle ici. D'où `minFreq` plus bas pour "strength" seul.
   3) PROXIMITÉ DE L'ÉCHEC (reps en réserve, RIR) — nouvelle méta-régression
      dédiée (Jukic et al. 2024, Sports Medicine, "Exploring the
      Dose-Response Relationship Between Estimated Resistance Training
      Proximity to Failure...") : plus une série est proche de l'échec, plus
      l'hypertrophie est importante — relation dose-réponse claire. Pour la
      FORCE en revanche, la proximité de l'échec ne change quasiment rien au
      gain de 1RM (le modèle "colle" bien à l'hypertrophie, beaucoup moins à
      la force). Nuance importante : un essai contrôlé de 8 semaines chez
      des sujets entraînés (2024, "Similar muscle hypertrophy following
      eight weeks of resistance training to momentary muscular failure or
      with repetitions-in-reserve") ne trouve PAS de différence d'hypertrophie
      entre échec strict et entraînement à 1-3 reps en réserve — donc "très
      proche de l'échec" suffit, pas besoin de l'échec technique à chaque
      série (qui ajoute de la fatigue sans bénéfice net). Voir EFFORT_ADVICE
      ci-dessous (même mécanique d'affichage que TEMPO_ADVICE, sous les
      boutons d'objectif dans Options).
   4) VOLUME PENDANT UN DÉFICIT CALORIQUE — un essai contrôlé chez des sujets
      entraînés en restriction énergétique (Roth et al. 2023, Scandinavian
      Journal of Medicine & Science in Sports, "Resistance training volume
      does not influence lean mass preservation during energy restriction")
      ne trouve AUCUNE différence de préservation de masse maigre entre un
      volume modéré (1-3 séries/exercice) et plus élevé (3-5 séries/exercice)
      sur 6 semaines de restriction. Conclusion retenue : pas de raison de
      réduire le volume en "Perte de gras" seule par rapport à
      "Hypertrophie" — d'où targetSets aligné sur celui de "hyper" pour
      "loss" (avant cette mise à jour, "loss" avait 3 séries/palier contre 4
      pour "hyper", un écart qui n'a plus de justification dans cette
      littérature). Ce qui préserve le mieux le muscle en déficit reste
      l'effort (proximité de l'échec, point 3) et les protéines (déjà
      couvert plus haut), pas un volume gonflé artificiellement.
   5) VOLUME DÉCONNECTÉ DE LA FRÉQUENCE RÉELLE CHOISIE — bug distinct trouvé
      en marge de cette recherche : plannedVolume, applyGoalToProgram et
      proposePlacement utilisaient une constante figée
      (SESSIONS_PER_WEEK=3,2) au lieu du réglage réel "Séances par semaine
      (min-max)" de Options (profile.sessionsMin/sessionsMax, déjà utilisé
      pour la nutrition mais jamais pour le volume d'entraînement).
      Concrètement : changer sa fréquence réelle dans Options ne faisait
      RIEN bouger dans "Volume prévu par semaine" ni dans les suggestions
      d'ajout de séries. Corrigé via avgSessionsPerWeek(profile), maintenant
      utilisé partout où SESSIONS_PER_WEEK l'était — voir cette fonction
      plus haut pour le détail. Répartition des séries par SÉANCE reste
      volontairement libre de toute contrainte de durée (voir SESSION_CAP_MIN
      : reste un simple repère informatif affiché, jamais un plafond qui
      réduirait le volume programmé) — le nombre de séances/semaine doit
      piloter le volume, pas l'inverse.

   Sert de point de départ éditable — pour les machines déjà dans un
   programme, voir requestSwap/swapCard (remplacement) ou proposePlacement/
   applyPlacement (ajout) ; jamais appliqué sans une action explicite de
   l'utilisateur (changer l'objectif, confirmer un remplacement/ajout). */
var GOALS = [
  { k: "loss", label: "Perte de gras" },
  { k: "hyper", label: "Hypertrophie" },
  { k: "strength", label: "Force" },
  { k: "loss_hyper", label: "Perte de gras + Hypertrophie" },
  { k: "loss_strength", label: "Perte de gras + Force" },
  { k: "hyper_strength", label: "Hypertrophie + Force" },

   plus spécifique (force > hypertrophie > perte de gras seule), exercice

var TEMPO_ADVICE = {

function goalPreset(goal) { return GOAL_PRESETS[goal] || GOAL_PRESETS.loss_hyper; }
function tierDefaultsForGoal(goal, tier) { var g = goalPreset(goal); return g.tiers[tier] || g.tiers[2]; }

/* Réappliquer un objectif à TOUT le programme déjà en place — pas le
   comportement par défaut d'un changement d'objectif (voir applyGoal dans
   OptionsTab, qui ne touche que la nutrition + les repères pour les
   PROCHAINS ajouts/remplacements), mais une action explicite proposée
   juste après avoir changé d'objectif, à confirmer avant d'écraser quoi
   que ce soit (voir OptionsTab > bouton "Appliquer aux séances
   actuelles"). Recalcule séries/reps/repos de CHAQUE machine déjà
   programmée à partir de son palier (poly/semi/isolation) et du nouveau
   preset — ne les fait pas hériter de leurs anciennes valeurs comme le
   fait un remplacement de machine "même palier" (swapRecommendation) :
   ici on veut vraiment repartir des repères du nouvel objectif partout.

   Corrigé le 4 sept. 2026 (2e signalement, avec capture d'écran de
   "Volume prévu par semaine" à l'appui — la plupart des muscles encore
   sous VOL_MIN après avoir uniformisé les séries par palier, voir plus
   haut) : uniformiser les séries par palier retire le déséquilibre qui
   BOUGE selon l'objectif, mais pas le déséquilibre STRUCTUREL entre
   muscles qui ont plus ou moins d'exercices déjà programmés (ex.
   Ischio-jambiers : 3 exercices vs Pectoraux : 2) — à séries-par-exercice
   identiques, un muscle avec moins d'exercices reste mécaniquement en
   dessous. Plutôt que de laisser ça à corriger à la main à chaque fois,
   la même règle que proposePlacement (ajout d'un exercice : +1 série si
   le muscle est sous VOL_MIN) est appliquée ici à tout le programme :
   pour chaque muscle, si le volume hebdo total avec les séries de base du
   palier reste sous VOL_MIN, la ou les séries manquantes sont réparties à
   parts égales sur SES exercices déjà en place (jamais en ajoutant un
   nouvel exercice, jamais en descendant sous le repère du palier). Reps
   et repos restent ceux du palier dans tous les cas — seul le nombre de
   séries peut monter pour sortir un muscle de la zone rouge.

   Mise à jour du 4 sept. 2026 (volume/fréquence, voir le commentaire au-
   dessus de GOAL_PRESETS) : la redistribution vise maintenant
   goalPreset(goal).targetSets — un repère PAR OBJECTIF (12 pour
   hypertrophie/perte de gras/recomposition — baissé de 14 à 12 le 4 sept.
   2026, 2e révision, voir GOAL_PRESETS pour le détail — 6 pour force, 8-10
   pour les associations, voir GOAL_PRESETS) — au lieu du plancher générique
   VOL_MIN=5. VOL_MIN reste utilisé ailleurs (couleur rouge de "Volume prévu
   par semaine") comme plancher de sécurité universel, mais ce n'était pas
   le bon repère pour une redistribution censée optimiser la vitesse de
   progression selon l'objectif choisi — 5 séries/semaine, c'est le minimum
   pour ne pas perdre du muscle, pas une cible d'hypertrophie. `avgSessions`
   (voir avgSessionsPerWeek) remplace aussi la constante figée
   SESSIONS_PER_WEEK, pour que la redistribution reflète la vraie fréquence
   choisie dans Options plutôt qu'un chiffre moyen déconnecté. */
function applyGoalToProgram(program, exercises, goal, avgSessions) {
  var exMap = {}; exercises.forEach(function(e){ exMap[e.id]=e; });
  var factor = (avgSessions||SESSIONS_PER_WEEK) / Math.max(1, program.length);
  var target = goalPreset(goal).targetSets || VOL_MIN;
  var muscleCount = {}, muscleBaseSets = {};
  /* Multi-muscle (voir allMuscles, 5 sept. 2026) : une machine comme Chest
     Press contribue au volume de base de CHACUN de ses muscles, donc elle
     compte dans muscleCount/muscleBaseSets de chacun. */
  program.forEach(function(d){ d.items.forEach(function(it){
    var ex = exMap[it.ex]; if (!ex) return;
    var tierDef = tierDefaultsForGoal(goal, exerciseOrderTier(ex));
    allMuscles(ex).forEach(function(mu){
      var w = muscleWeight(ex, mu);
      muscleCount[mu] = (muscleCount[mu]||0) + w;
      muscleBaseSets[mu] = (muscleBaseSets[mu]||0) + tierDef.sets*w;
    });
  }); });
  var muscleExtra = {};
  Object.keys(muscleBaseSets).forEach(function(mu){
    var neededTotal = Math.ceil(target / factor);
    var deficit = Math.max(0, neededTotal - muscleBaseSets[mu]);
    muscleExtra[mu] = deficit > 0 ? Math.ceil(deficit / muscleCount[mu]) : 0;
  });
  return program.map(function(d){
    return Object.assign({}, d, { items: d.items.map(function(it){
      var ex = exMap[it.ex];
      var tierDef = tierDefaultsForGoal(goal, ex ? exerciseOrderTier(ex) : 2);
      /* Le plus grand besoin parmi ses muscles (voir allMuscles) : ajouter ce
         nombre de séries couvre le déficit de chacun, quitte à dépasser
         légèrement celui qui avait le moins besoin — jamais l'inverse. */
      var extra = ex ? Math.max.apply(null, allMuscles(ex).map(function(mu){return muscleExtra[mu]||0;}).concat([0])) : 0;
      return Object.assign({}, it, { sets: tierDef.sets + extra, min: tierDef.min, max: tierDef.max, rest: tierDef.rest });
    }) });
  });
}

/* Simule (SANS RIEN PERSISTER) ce que donnerait un objectif + un nombre de
   séances/semaine donnés sur CE catalogue de machines : durée moyenne de
   séance et fréquence réelle par muscle. Ajouté le 5 sept. 2026 suite à la
   discussion "combien de séances par semaine pour être opti" — plutôt que de
   deviner un chiffre générique, l'appli calcule la vraie réponse pour TON
   programme actuel et l'affiche dans Options (voir OptionsTab > repère
   "séances recommandées"). Pure fonction, ne modifie ni program ni exercises
   — applyGoalToProgram est déjà pur (retourne un nouveau tableau), donc
   l'appeler ici pour prévisualiser est sans risque. */
function previewSessionStats(program, exercises, goal, avgSessions) {
  var simulated = applyGoalToProgram(program, exercises, goal, avgSessions);
  var exMap = {}; exercises.forEach(function(e){ exMap[e.id]=e; });
  var dayMinutes = simulated.map(function(d){ return estimateDayMinutes(d, exMap); });
  var avgDayMin = dayMinutes.length ? Math.round(dayMinutes.reduce(function(a,b){return a+b;},0) / dayMinutes.length) : 0;
  var vol = plannedVolume(simulated, exercises, avgSessions);
  var avgFreq = vol.length ? vol.reduce(function(a,v){return a+v.freq;},0) / vol.length : 0;
  var minFreqActual = vol.length ? Math.min.apply(null, vol.map(function(v){return v.freq;})) : 0;
  return { avgDayMin: avgDayMin, avgFreq: avgFreq, minFreqActual: minFreqActual };
}

function applySwap(oldExId, newExId, program, overrides) {
  return program.map(function(d){
    return Object.assign({}, d, { items: d.items.map(function(it){
      if (it.ex !== oldExId) return it;
      var patch = { ex: newExId };
      if (overrides) { patch.sets = overrides.sets; patch.min = overrides.min; patch.max = overrides.max; patch.rest = overrides.rest; }
      return Object.assign({}, it, patch);
    }) });
  });
}

/* Adding a machine: propose where it belongs, based on where that muscle is
   already trained, and what sets/reps/repos to start it at — dérivés du
   palier de la machine (poly/semi/iso) ET de l'objectif d'entraînement
   actuel (voir GOAL_PRESETS/tierDefaultsForGoal ci-dessus), pas d'un
   10-15 reps générique fixe comme avant ce menu. `goal` est optionnel :
   à défaut, se comporte comme avant (recomposition). `avgSessions` (voir
   avgSessionsPerWeek) pilote la conversion volume/séance → volume/semaine —
   avant le 4 sept. 2026 c'était figé à SESSIONS_PER_WEEK, sans lien avec le
   réglage réel de fréquence dans Options (voir la note sur SESSIONS_PER_WEEK
   plus haut). Le seuil "en dessous de la cible" utilise maintenant
   goalPreset(goal).targetSets (repère par objectif, voir GOAL_PRESETS) au
   lieu du plancher générique VOL_MIN — un objectif Hypertrophie vise plus
   haut qu'un objectif Force, ça doit se voir dès l'ajout d'une machine. */
function proposePlacement(newEx, exercises, program, goal, avgSessions) {
  var withNew = exercises.concat([newEx]);
  var vol = plannedVolume(program, withNew, avgSessions);
  var newMuscles = allMuscles(newEx);
  var target = goalPreset(goal).targetSets || VOL_MIN;
  /* Multi-muscle (voir allMuscles) : une machine comme Chest Press ajoute du
     volume à CHAQUE muscle qu'elle sollicite en même temps, donc "current"
     retient le muscle le plus en retard des deux (celui qui a le plus besoin
     de cette machine) plutôt qu'un seul muscle arbitraire — perMuscle garde
     le détail de chacun pour l'affichage (voir describePlacement). */
  var perMuscle = newMuscles.map(function(mu){
    var cur = vol.find(function(v){return v.muscle===mu;});
    return { muscle: mu, current: cur ? cur.sets : 0, target: target };
  });
  var current = perMuscle.length ? Math.min.apply(null, perMuscle.map(function(p){return p.current;})) : 0;
  var daysTraining = program.filter(function(d){ return d.items.some(function(it){
    var ex = withNew.find(function(e){return e.id===it.ex;});
    return ex && allMuscles(ex).some(function(mu){ return newMuscles.indexOf(mu)>=0; });
  }); });
  var targets = daysTraining.length > 0 ? daysTraining.slice(0,2)
    : program.slice().sort(function(a,b){return a.items.length-b.items.length;}).slice(0,2);
  var tierDef = tierDefaultsForGoal(goal, exerciseOrderTier(newEx));
  var setsEach = current >= target ? tierDef.sets : tierDef.sets + 1;
  return { targets: targets.map(function(d){return d.key;}), targetLabels: targets.map(function(d){return d.label;}),
    setsEach: setsEach, min: tierDef.min, max: tierDef.max, rest: tierDef.rest, current: current, target: target, perMuscle: perMuscle };
}
/* Texte affiché quand on propose où placer une machine qu'on vient d'ajouter
   (voir proposePlacement) — une ligne simple pour un muscle unique, le détail
   de chaque muscle quand la machine en sollicite plusieurs (voir allMuscles). */
function describePlacement(placement) {
  var pm = placement.perMuscle || [];
  if (pm.length <= 1) {
    var only = pm[0] || { muscle:"Ce muscle", current: placement.current, target: placement.target };
    return only.muscle+" est actuellement à "+only.current+" séries/semaine"+(only.current<only.target?" — en dessous de la cible "+only.target+" séries/semaine visée par ton objectif actuel.":".");
  }
  return "Cette machine sollicite "+pm.map(function(p){return p.muscle;}).join(" + ")+", actuellement à "+
    pm.map(function(p){return p.muscle+" "+p.current+"×/sem"+(p.current<p.target?" (sous la cible "+p.target+")":"");}).join(", ")+".";
}
function applyPlacement(newEx, placement, exercises, program) {
  return program.map(function(d){
    return placement.targets.indexOf(d.key) >= 0
      ? Object.assign({}, d, { items: d.items.concat([{ ex: newEx.id, sets: placement.setsEach, min: placement.min, max: placement.max, rest: placement.rest }]) })
      : d;
  });
}

/* ============================================================
   NUTRITION — Mifflin-St Jeor + activity multipliers + evidence
   ranges for protein and deficit (see Programme tab for sources).
   ============================================================ */
var ACTIVITY_LEVELS = [
  { k: 1.2, label: "Sédentaire", desc: "Peu ou pas d'exercice, travail de bureau" },
  { k: 1.375, label: "Légèrement actif", desc: "Exercice léger 1–2 j/semaine" },
  { k: 1.55, label: "Modérément actif", desc: "Exercice modéré 3–5 j/semaine" },
  { k: 1.725, label: "Très actif", desc: "Exercice intense 6–7 j/semaine" },
  { k: 1.9, label: "Extrêmement actif", desc: "Exercice quotidien intense + métier physique" },
];
function mifflinBMR(weightKg, heightCm, age, sex) {
  var s = sex === "F" ? -161 : 5;
  return 10*weightKg + 6.25*heightCm - 5*age + s;
}
/* Kcal burned per step, scaled by body weight — derived from the commonly-
   cited reference point "~0.04 kcal/step for a ~70 kg adult at a normal
   walking pace" (Omnicalculator's steps-to-calories tool, itself citing
   Brooks et al. 2005 walking-energy-expenditure research) rather than a
   fixed number, so it scales sensibly for a different bodyweight. It's a
   simplification — real per-step cost also depends on pace and incline,
   which this app doesn't ask for — so treat the steps-based nutrition mode
   as a reasonable estimate, not a lab measurement. */
var KCAL_PER_STEP_PER_KG = 0.04 / 70;
/* Kcal/minute-per-kg coefficients for a general resistance-training session
   (machines, moderate intensity, ~90s rest between sets) — from a metabolic-
   cart study of 52 participants (via StrengthLog's calorie-burn calculator):
   men ≈ 0.0713 kcal/min/kg, women ≈ 0.0637. When sex isn't set, this app
   averages the two rather than guessing. */
var TRAINING_KCAL_COEF = { M: 0.0713, F: 0.0637, DEFAULT: 0.0675 };
/* profile.targetMode: "manual" (fixed target, e.g. from a coach) | "deficit"
   (BMR × activity multiplier, minus a manual deficit slider — the original
   calculator) | "steps" (BMR/DER + estimated kcal from daily steps + from
   average training volume, see Options tab). avgSessionMinutes is only used
   by "steps" mode and is derived from the actual program (estimateDayMinutes
   averaged across days), passed in by the caller. */
function computeNutrition(profile, avgSessionMinutes) {
  var bmr = (!profile.useBmrFormula && profile.bmrMeasured)
    ? profile.bmrMeasured
    : (profile.heightCm && profile.age && profile.sex ? mifflinBMR(profile.weightKg, profile.heightCm, profile.age, profile.sex) : null);
  var mode = profile.targetMode || (profile.manualTarget ? "manual" : "deficit");
  var target, proteinG, tdee, breakdown = null;

  if (mode === "steps") {
    if (!bmr) return null;
    var stepsKcal = Math.round((profile.dailySteps||0) * profile.weightKg * KCAL_PER_STEP_PER_KG);
    var avgSessions = ((profile.sessionsMin||0) + (profile.sessionsMax||0)) / 2;
    var coef = profile.sex === "F" ? TRAINING_KCAL_COEF.F : profile.sex === "M" ? TRAINING_KCAL_COEF.M : TRAINING_KCAL_COEF.DEFAULT;
    var trainingKcal = Math.round((avgSessionMinutes||0) * profile.weightKg * coef * avgSessions / 7);
    tdee = bmr + stepsKcal + trainingKcal;
    breakdown = { stepsKcal: stepsKcal, trainingKcal: trainingKcal, avgSessions: avgSessions, avgSessionMinutes: avgSessionMinutes||0 };
  } else {
    tdee = bmr ? bmr * profile.activityMultiplier : null;
  }

  if (mode === "manual") {
    // Cible fixe fournie directement (ex. par un coach/diététicien) plutôt
    // que dérivée du calcul BMR/TDEE/déficit — celui-ci reste affiché à
    // titre indicatif quand dispo, mais ne pilote plus la cible.
    target = profile.manualTargetKcal;
    proteinG = profile.manualProteinG;
  } else {
    if (!bmr) return null;
    target = tdee - (profile.deficitKcal||0);
    proteinG = Math.round(profile.weightKg * profile.proteinPerKg);
  }
  var proteinKcal = proteinG * 4;
  var fatG = Math.round(target * 0.25 / 9);
  var fatKcal = fatG * 9;
  var carbKcal = Math.max(0, target - proteinKcal - fatKcal);
  var carbG = Math.round(carbKcal / 4);
  return { bmr: bmr?Math.round(bmr):null, tdee: tdee?Math.round(tdee):null, target: Math.round(target), proteinG: proteinG, fatG: fatG, carbG: carbG, breakdown: breakdown };
}

   here to SEED_PROGRAM — republishing the page changes the code but not what
   an existing user actually sees. Bumping the number forces a one-time merge
   that replaces exercises+program with the latest SEED_* while preserving
   everything the user has logged (sessions, bodyLog, profile, active set). */

      { id: "b2", date: todayISO(), weightKg: 85.1, fatKg: 22.4, muscleKg: 59.5, bmr: 1860, source: "Boditrax" },

/* An in-progress session started before a program migration can be stuck
   with a stale row shape (e.g. the old double-row-per-unilateral-exercise
   layout, from before v3). Rather than discard whatever the user already
   logged, collapse each entry down to the exercise's *current* set count:
   keep the first nSets already-filled-in rows (padding with empty rows if
   there are fewer), so real numbers survive and the UI matches today's
   program. This only fires once, right when programVersion bumps. */
function migrateActiveSession(active, program) {
  if (!active || !active.entries) return active;
  var byExId = {};
  program.forEach(function(d){ d.items.forEach(function(it){ byExId[it.ex] = it; }); });
  var entries = active.entries.map(function(entry){
    var it = byExId[entry.ex];
    var nSets = it ? it.sets : entry.sets.length;
    var sets = entry.sets.slice(0, nSets);
    while (sets.length < nSets) sets.push({weight:null, reps:null, rir:null, weakSide:null});
    return { ex: entry.ex, sets: sets };
  });
  return Object.assign({}, active, { entries: entries });
}
function withLatestProgram(state) {
  if (!state) return state;
  if ((state.programVersion || 0) >= PROGRAM_VERSION) return state;
  return Object.assign({}, state, {
    programVersion: PROGRAM_VERSION,
    exercises: SEED_EXERCISES,
    program: SEED_PROGRAM,
    active: state.active ? migrateActiveSession(state.active, SEED_PROGRAM) : state.active,
    _justMigrated: true,
  });
}
/* One-time, version-independent fill-in for profile fields added after a
   user's state already existed (currently: the fixed-target nutrition
   fields). Only sets a field when it's missing — never touches a value the
   user already has, so this is safe to run on every load. */
function withNutritionDefaults(state) {
  if (!state || !state.profile) return state;
  if (state.profile.manualTarget !== undefined) return state;
  return Object.assign({}, state, {
    profile: Object.assign(
      { manualTarget: true, manualTargetKcal: 2250, manualProteinG: 175 },
      state.profile

    _justMigrated: true,

}
/* One-time, version-independent fill-in for the Options-tab fields (target
   mode, daily steps, session-count range, rest-alert volume) — same
   additive pattern as withNutritionDefaults: only sets a field when it's
   missing, safe to run on every load, defaults targetMode from the older
   manualTarget boolean so existing choices carry over untouched. */
function withOptionsDefaults(state) {
  if (!state || !state.profile) return state;
  if (state.profile.targetMode !== undefined) return state;
  return Object.assign({}, state, {
    profile: Object.assign(
      {
        targetMode: state.profile.manualTarget ? "manual" : "deficit",
        dailySteps: 8000, sessionsMin: 3, sessionsMax: 4, alertVolume: 1,
      },
      state.profile
    ),
    _justMigrated: true,

}
/* An earlier version of this fix silently defaulted every exercise missing
   `order` to a flat, uniform 2 (semi-isolation) — that flattened distinctly
   different machines to the same value in one shot and reshuffled the
   session sequence, so it got reverted (see git history / prior session).
   This version runs the real name-based classifier (inferOrderTier —
   validated against all 29 catalog machines plus 18 common real-world
   machine-name patterns, see its comment) against each exercise's own
   name, so different machines get different, reasoned answers instead of
   one blind guess.
   ORDER_INFERENCE_VERSION makes this a versioned RE-classification, not a
   one-time fill-in: inferOrderTier's keyword coverage was widened after
   the first pass left custom machines with no keyword match falling back
   to a generic guess (user-reported: too many machines landing in poly or
   semi with none in isolation). Bumping the version reruns the (now
   broader) classifier over EVERY exercise, replacing whatever `order` is
   already there — including a value set by the previous, narrower pass,
   and including a value you corrected by hand via the badge/picker since
   then. Bump the version again in the future only when the keyword list
   itself changes meaningfully; a version bump should be rare precisely
   because it overwrites manual corrections. */
var ORDER_INFERENCE_VERSION = 2;
function withInferredOrderDefaults(state) {
  if (!state || !state.exercises) return state;
  if ((state.orderInferenceVersion||0) >= ORDER_INFERENCE_VERSION) return state;
  return Object.assign({}, state, {
    orderInferenceVersion: ORDER_INFERENCE_VERSION,
    exercises: state.exercises.map(function(e){ return Object.assign({}, e, {order: inferOrderTier(e.name, allMuscles(e).join(" "))}); }),
    _justMigrated: true,

/* Ajout ponctuel et additif (pas de gate sur un champ existant, juste une
   présence-check sur ce champ précis) : bodyFatPctManual permet d'affiner la

/* Ajout ponctuel et additif : profile.goal (voir GOALS/GOAL_PRESETS). Défaut

/* Ajout ponctuel et additif : profile.theme ("dark"|"light", voir Options >

function withThemeDefault(state) {

/* Ajout ponctuel et additif : profile.gyms/currentGymId (voir OptionsTab >

   identique (tout est "disponible partout") jusqu'à ce qu'il configure

function withGymsDefault(state) {
  if (!state || !state.profile || state.profile.gyms !== undefined) return state;

}
function withAllMigrations(state) { return withGymsDefault(withThemeDefault(withGoalDefault(withBodyFatDefault(withInferredOrderDefaults(withOptionsDefaults(withNutritionDefaults(withLatestProgram(state)))))))); }
async function loadInitialState() {
  try {
    var res = await fetch("data/state.json", { cache: "no-store" });
    if (res.ok) { var j = await res.json(); if (j && j.v) return withAllMigrations(j); }
  } catch (e) {}
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) { var parsed = JSON.parse(raw); if (parsed && parsed.v) return withAllMigrations(parsed); }
  } catch (e) {}
  return seedState();
}
var publishTimer = null;
function scheduleSave(state, onStatus) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  if (publishTimer) clearTimeout(publishTimer);
  publishTimer = setTimeout(function(){ doPublish(state, onStatus); }, 1200);
}
async function doPublish(state, onStatus) {
  var cap = await getCap();
  if (!cap) { onStatus && onStatus("local"); return; }
  try {
    await cap.publish({ "data/state.json": JSON.stringify(state) });
    onStatus && onStatus("cloud");
  } catch (e) {
    onStatus && onStatus(e && e.code === "conflict" ? "cloud" : "local");
  }
}

/* Difficulté ressentie plutôt qu'un chiffre précis de reps en réserve —

var ORDER_TIER_LABEL = { 1:"Polyarticulaire — à faire en premier", 2:"Semi-isolation", 3:"Isolation — à faire en dernier" };
function exerciseOrderTier(ex){ return (ex && ex.order) || 3; }
function stripAccents(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }
/* Devine le palier poly/semi/isolation d'une machine à partir de son nom
   (et, en repli, de son muscle) — pour que ce soit l'app qui détermine ça,
   pas l'utilisateur, à la création comme pour corriger les machines
   existantes sans palier. Validé pour reproduire exactement le classement
   des 29 machines d'origine du catalogue (SEED_EXERCISES), et élargi avec
   des synonymes FR/EN et noms de marque courants (Technogym, Life Fitness,
   Hammer Strength) pour mieux couvrir des machines ajoutées manuellement
   avec un nom différent. Les motifs les plus SPÉCIFIQUES sont testés en
   premier — ex. "leg curl" doit être reconnu comme semi-isolation (ischios)
   avant que le mot générique "curl" plus bas ne le classe à tort en
   isolation (biceps). C'est une estimation par mots-clés, pas une
   classification anatomique certifiée — reste modifiable à tout moment via
   le badge (séance) ou le sélecteur (onglet Machines) si elle tombe à côté
   pour une machine précise. */
function inferOrderTier(name, muscle){
  var n = stripAccents(name);
  // --- Motifs spécifiques d'abord, pour lever les ambiguïtés avec les
  //     motifs génériques plus bas (ex. "curl", "presse", "extension"). ---
  if (/leg curl|hamstring curl|flexion des jambes|ischio|nordic/.test(n)) return 2;
  if (/leg extension|extension.*jambe|quad.*extension/.test(n)) return 3;
  if (/calf|mollet/.test(n)) return 2;
  if (/glute|fessier|hip thrust|hip bridge/.test(n)) return 2;
  if (/lower back|lombaire|hyperextension|back extension|extension du dos/.test(n)) return 2;
  if (/rear delt|deltoide arriere|reverse fly|face pull/.test(n)) return 2;
  if (/trapez|shrug/.test(n)) return 2;
  if (/pull-?up|pull-?over|chin-?up/.test(n)) return 1;
  if (/pector|pec deck|butterfly|papillon|ecarte|\bfly\b/.test(n)) return 3;
  if (/elevation laterale|lateral raise|elevation frontale|front raise/.test(n)) return 3;
  if (/abduction|adduction/.test(n)) return 3;
  if (/crunch|abdomina|gainage|sit.?up|rotation du torse/.test(n)) return 3;
  if (/pushdown|kickback/.test(n)) return 3;
  // --- Callisthénie / street workout — mêmes paliers que leurs équivalents
  //     machine (une traction reste polyarticulaire, faite au poids du
  //     corps ou guidée) ; testés avant les motifs génériques ci-dessous
  //     pour éviter tout conflit avec eux. Les tenues statiques avancées
  //     (planche, front/back lever, drapeau) ne sont volontairement PAS
  //     reconnues ici — trop ambiguës par mots-clés ("planche" désigne
  //     aussi bien la figure que la planche abdominale) et pas vraiment
  //     compatibles avec un objectif séries×reps de toute façon ; palier à
  //     corriger à la main pour ces mouvements-là.
  //     Au passage, deux bugs trouvés en testant sur des noms de
  //     callisthénie réels : "dips" (pluriel) ne matchait pas le \bdip\b
  //     du motif générique plus bas (corrigé en \bdips?\b) — aucun exercice
  //     du catalogue d'origine ne s'appelait "dip", donc jamais remarqué
  //     avant ; et "nordic curl" tombait sur le motif générique "curl" (→
  //     isolation biceps) avant d'atteindre le repli par muscle, corrigé en
  //     l'ajoutant au motif ischio-jambiers ci-dessus (comme "leg curl"). */
  if (/muscle.?up|burpee/.test(n)) return 1;
  if (/pompe|push.?up|pushup/.test(n)) return 1;
  if (/fente|lunge/.test(n)) return 1;
  // --- Motifs génériques ensuite. ---
  if (/biceps|triceps|curl/.test(n)) return 3;
  if (/press|developpe|presse|squat|deadlift|souleve de terre|\bdips?\b/.test(n)) return 1;
  if (/tirage|traction|\brow\b|rowing|pulldown/.test(n)) return 1;
  if (/upper back|tronc/.test(n)) return 1;
  // Rien reconnu dans le nom : repli par muscle, sinon semi-isolation neutre.

/* Microwave-style alert: 4 short, sharp square-wave beeps (a harsher, more
   "kitchen timer" tone than a single sine chime) + a matching vibration
   pattern. `volume` is 0–1 (from profile.alertVolume, see Options tab); at
   0 there's no point creating an AudioContext, just vibrate. Called once
   per repeat cycle by RestTimerBar — see the comment there for why it
   repeats instead of firing only once. */
function restAlert(volume) {
  var vol = volume == null ? 1 : Math.max(0, Math.min(1, volume));

      var Ctx = window.AudioContext || window.webkitAudioContext;

          g.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
          g.gain.exponentialRampToValueAtTime(0.3 * vol, ctx.currentTime + delay + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + beepDur);
          o.connect(g); g.connect(ctx.destination);
          o.start(ctx.currentTime + delay); o.stop(ctx.currentTime + delay + beepDur + 0.02);

        setTimeout(function(){ ctx.close(); }, (beeps * (beepDur + gap) + 0.3) * 1000);

  }

}

function OptionsTab(props){
  var profile=props.profile, setProfile=props.setProfile, program=props.program, exercises=props.exercises, bodyLog=props.bodyLog||[], persistConfig=props.persistConfig;
  function set(patch){ setProfile(Object.assign({}, profile, patch)); }

  /* "Mes salles" (voir exerciseAvailableAtGym, adaptDayItems, la section
     "Mes salles" plus bas) — un profil migré (withGymsDefault) a toujours au
     moins une salle, ce fallback ne sert qu'en cas de state très ancien pas
     encore migré au moment du rendu. */
  var gyms = profile.gyms || [{id:"g1", name:"Salle principale"}];
  var currentGymId = profile.currentGymId || gyms[0].id;
  var _ng = useState(""), newGymName=_ng[0], setNewGymName=_ng[1];
  var _erg = useState(null), editGymId=_erg[0], setEditGymId=_erg[1];
  var _egn = useState(""), editGymName=_egn[0], setEditGymName=_egn[1];
  function addGym(){
    var name = newGymName.trim();
    if (!name) return;
    set({ gyms: gyms.concat([{id:"gym"+Date.now(), name:name}]) });
    setNewGymName("");
  }
  function startRenameGym(g){ setEditGymId(g.id); setEditGymName(g.name); }
  function confirmRenameGym(){
    var name = editGymName.trim();
    if (name) set({ gyms: gyms.map(function(g){ return g.id===editGymId ? Object.assign({},g,{name:name}) : g; }) });
    setEditGymId(null);
  }
  /* Supprimer une salle nettoie aussi les gymIds qui la référençaient sur
     toutes les machines (voir MachinesTab > updateGyms) — sinon un id orphelin
     reste dans e.gymIds sans jamais plus rien matcher, ce qui n'est pas FAUX
     (exerciseAvailableAtGym ignore un id inconnu) mais encombre les données
     pour rien. */
  function removeGym(id){
    if (gyms.length<=1) return;
    var nextGyms = gyms.filter(function(g){return g.id!==id;});
    set({ gyms: nextGyms, currentGymId: currentGymId===id ? nextGyms[0].id : currentGymId });
    persistConfig(exercises.map(function(e){ return (e.gymIds && e.gymIds.indexOf(id)>=0) ? Object.assign({},e,{gymIds: e.gymIds.filter(function(x){return x!==id;})}) : e; }), program);
  }

    : 0;
  var nut = computeNutrition(profile, avgSessionMinutes);
  /* Aperçu "combien de séances/semaine pour être opti" — voir
     previewSessionStats plus haut et la discussion qui l'a motivé.
     currentSessionPreview = ce que donne TON réglage actuel de séances/
     semaine ; recommendedSessionPreview = ce que donnerait le milieu de la
     plage recommendedSessions du preset actuel (GOAL_PRESETS). Comparés
     dans la Section "Réglages personnels" juste après le champ "Séances par
     semaine", pour que tu voies le compromis fréquence/durée réel plutôt
     qu'un repère générique. */
  var goalNow = profile.goal || "loss_hyper";
  var currentAvgSessions = avgSessionsPerWeek(profile);
  var currentSessionPreview = previewSessionStats(program, exercises, goalNow, currentAvgSessions);
  var recSessions = goalPreset(goalNow).recommendedSessions || {min:4, max:5};
  var recAvgSessions = (recSessions.min + recSessions.max) / 2;
  var recSessionPreview = previewSessionStats(program, exercises, goalNow, recAvgSessions);
  var meetsFreqFloor = currentSessionPreview.minFreqActual >= (goalPreset(goalNow).minFreq||1) - 0.01;
  /* Repère masse maigre pour la cible protéique — voir la Section "Cible
     calorique et protéique" plus bas. On ne redéfinit PAS ce que veut dire
     proteinPerKg (toujours g/kg de poids total, comme depuis le début) :
     ça reste un simple comparatif informatif, jamais une réinterprétation
     silencieuse d'une valeur déjà réglée par l'utilisateur. % masse grasse :
     priorité au champ manuel (bodyFatPctManual) si renseigné, sinon le plus
     récent bodyLog qui a un fatKg (ex. scan Boditrax) — le % est recalculé
     sur le poids ACTUEL du profil plutôt que celui du jour du scan, pour
     rester à jour si le poids a bougé depuis. */
  var latestFatEntry = bodyLog.filter(function(b){return b.fatKg!=null && b.weightKg;})
    .sort(function(a,b){ return (a.date||"")<(b.date||"") ? 1 : -1; })[0];
  var bfPct = profile.bodyFatPctManual!=null ? profile.bodyFatPctManual
    : (latestFatEntry ? latestFatEntry.fatKg/latestFatEntry.weightKg*100 : null);
  var leanKg = (bfPct!=null && profile.weightKg) ? profile.weightKg*(1-bfPct/100) : null;

  // in "steps" mode) so we don't render the same numbers twice, and it
  // never silently touches profile.manualTargetKcal/manualProteinG —
  // adopting it is an explicit action via the button below.
  var stepsNut = (profile.targetMode !== "steps")
    ? computeNutrition(Object.assign({}, profile, {targetMode:"steps"}), avgSessionMinutes)
    : null;

     changer d'objectif n'a AUCUN effet visible (bug remonté le 4 sept.

     Repassait d'abord sur "Déficit manuel" (targetMode:"deficit"), qui
     calcule le TDEE avec un multiplicateur d'activité FIXE (ex. ×1,55

     voulu) : les nouveaux repères sets/reps/repos par palier ne s'appliquent
     qu'aux PROCHAINS ajouts ou remplacements de machine (voir GOAL_PRESETS/

     déjà en place — SAUF si tu confirmes explicitement via le bouton
     "Appliquer aux séances actuelles" proposé juste après (voir
     reapplyPrompt/applyGoalToProgram ci-dessous) : demandé le 4 sept. 2026
     après avoir d'abord gardé l'ancien comportement (jamais toucher
     l'existant) — l'utilisateur a changé d'avis et veut pouvoir tout
     réappliquer d'un coup, tant que ça reste une action confirmée et pas
     automatique. */
  function applyGoal(g){ set(Object.assign({goal:g, targetMode:"steps", manualTarget:false}, goalPreset(g).nutrition)); setReapplyPrompt(true); }
  function reapplyGoalToProgram(){ persistConfig(exercises, applyGoalToProgram(program, exercises, profile.goal, avgSessionsPerWeek(profile))); setReapplyPrompt(false); }
