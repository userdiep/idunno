<!-- crossorigin="anonymous" : sans lui, toute erreur JS dont la pile passe par
     React est masquée par le navigateur en un simple "Script error." sans
     fichier ni ligne (politique d'origine croisée). C'est exactement ce qui a
     rendu illisible le ReferenceError du 6 sept. 2026 sur le choix de
     répartition des séances — signalé par une capture de console, pas par un
     message exploitable. cdnjs renvoie bien Access-Control-Allow-Origin. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script>
"use strict";
var h = React.createElement;
var useState = React.useState, useEffect = React.useEffect, useMemo = React.useMemo,
    useCallback = React.useCallback, useRef = React.useRef,
    /* useLayoutEffect s'exécute AVANT que le navigateur ne peigne : c'est ce
       qu'il faut pour restaurer une position de défilement, sinon on voit
       l'onglet s'afficher en haut puis sauter. Repli sur useEffect pour les
       tests, dont le React stubé n'expose pas forcément les deux. */
    useLayoutEffect = React.useLayoutEffect || React.useEffect;

/* ============================================================
   PALETTE — machine shroud charcoal, taupe cap, selector-pin amber,
   stack-plate bone. Deux variantes du même "gym equipment" theme (sombre/
   clair, voir Options > Apparence), pas un thème par app système : le choix
   reste explicite plutôt que suivre l'OS.
   `C` est l'objet VIVANT lu partout dans le rendu (styles inline) — changer
   de thème MUTE ses propriétés (voir applyTheme) plutôt que de remplacer la
   référence, pour que tout composant qui lit C.xxx pendant son rendu prenne
   la nouvelle valeur sans avoir à passer le thème en prop partout.
   `ink` est un ajout : plusieurs boutons/badges posent du texte foncé sur un
   fond accent clair (pin/green/rust/steel, ex. bouton "Ajouter" en amber
   avec texte foncé) — ce texte doit rester foncé dans les DEUX thèmes pour
   garder un contraste correct sur ces fonds accent, contrairement à
   shroudDeep/bone qui inversent leur luminosité entre les deux thèmes. */
var C_DARK = {
  shroud: "#20262D", shroudDeep: "#171C21", panel: "#262D34",
  taupe: "#8A8079", taupeDim: "#5A544F",
  pin: "#F0A62E", pinDim: "#7A5A22",
  bone: "#EDEAE3", green: "#6E9E6B", rust: "#C4674A", steel: "#6C93A6",
  ink: "#171C21",
};
var C_LIGHT = {
  shroud: "#FFFFFF", shroudDeep: "#F2EEE7", panel: "#FFFFFF",
  taupe: "#6B6058", taupeDim: "#D8D0C4",
  pin: "#F0A62E", pinDim: "#7A5A22",
  bone: "#20262D", green: "#6E9E6B", rust: "#C4674A", steel: "#6C93A6",
  ink: "#171C21",
};
var C = Object.assign({}, C_DARK);
function applyTheme(theme) { Object.assign(C, theme === "light" ? C_LIGHT : C_DARK); }
var sansBody = "'Barlow', ui-sans-serif, system-ui, sans-serif";
var sansCond = "'Barlow Semi Condensed', 'Barlow', ui-sans-serif, sans-serif";

/* Complétée le 5 sept. 2026 (demande : "il manque dans les muscles
   sollicités abducteurs non ? vérifie s'il manque d'autres muscles") — 4
   groupes musculaires standards manquaient à l'appel :
   - Abducteurs (moyen/petit fessier, "hip abductors") : signalé par
     l'utilisateur — la machine "Abduction des Hanches" du catalogue de
     base n'avait que "Fessiers" comme muscle, alors que l'abduction de
     hanche cible en premier les abducteurs, pas le grand fessier (voir
     BodyKore, MusclesWorked, RevivoHub sur "hip abduction machine muscles
     worked" — recherche web du 5 sept. 2026). Corrigé plus bas dans
     SEED_EXERCISES/MUSCLE_GUESS_RULES/withMuscleCorrections.
   - Obliques : même souci pour "Rotation du Torse", classée "Abdominaux"
     seule alors que la rotation du tronc à hanches bloquées cible en
     premier les obliques externes/internes, le grand droit restant
     secondaire (voir fitliferegime.com "torso rotation machine muscles
     worked", vérifié par recherche web du 5 sept. 2026).
   - Trapèzes : jusqu'ici les shrugs/tirages hauts retombaient sur "Dos"
     (voir MUSCLE_GUESS_RULES, motif "trapez|shrug") faute de catégorie
     dédiée — un muscle assez sollicité et distinct pour mériter la sienne.
   - Avant-bras : aucune machine du catalogue de base ne le cible
     spécifiquement, mais c'est un groupe standard pour qui ajoute du
     poids libre (curls poignet, ports de charge) — désormais disponible
     si besoin, sans rien changer pour qui ne l'utilise pas.
   Purement additif : aucun muscle existant renommé ni retiré, donc aucune
   machine déjà configurée n'est affectée par ce changement de liste en
   lui-même (voir withMuscleCorrections plus bas pour les 2 corrections de
   contenu qui, elles, changent des données existantes). */
var MUSCLES = [
  "Pectoraux", "Dos", "Trapèzes", "Deltoïdes post.", "Épaules", "Biceps", "Triceps", "Avant-bras",
  "Quadriceps", "Ischio-jambiers", "Mollets", "Fessiers", "Adducteurs", "Abducteurs",
  "Abdominaux", "Obliques", "Lombaires", "Autre",
];
var SESSIONS_PER_WEEK = 3.2; /* valeur de repli si profile.sessionsMin/Max n'est pas
   disponible (voir avgSessionsPerWeek) — l'app a un vrai réglage éditable
   pour ça (Options > "Séances par semaine"), ce chiffre ne sert plus que de
   filet de sécurité. */
var VOL_MIN = 5, VOL_MAX = 20;
/* Fréquence hebdomadaire RÉELLE à utiliser pour convertir un volume "par
   séance planifiée" en volume "par semaine" (plannedVolume,
   applyGoalToProgram, proposePlacement) — corrigé le 4 sept. 2026 : ces
   trois fonctions utilisaient jusqu'ici la constante SESSIONS_PER_WEEK figée
   à 3,2, complètement déconnectée du réglage "Séances par semaine (min-max)"
   qu'on peut pourtant régler dans Options (profile.sessionsMin/sessionsMax,
   déjà utilisé pour la nutrition — voir computeNutrition). Résultat concret
   du bug : la zone verte/rouge de "Volume prévu par semaine" ne bougeait
   JAMAIS quand on changeait sa fréquence réelle d'entraînement, alors que
   c'est exactement le param qui doit piloter combien de séries programmer
   par séance pour atteindre une cible hebdomadaire (demande explicite :
   "les séances doivent être adaptées selon le nb de séances par semaine").
   Repli sur SESSIONS_PER_WEEK uniquement si le profil n'a pas encore ces
   champs (ne devrait plus arriver, ils ont une valeur par défaut à la
   création du profil). */
function avgSessionsPerWeek(profile) {
  if (!profile || profile.sessionsMin==null || profile.sessionsMax==null) return SESSIONS_PER_WEEK;
  var avg = (profile.sessionsMin + profile.sessionsMax) / 2;
  /* Même filet que pickOptimalAvgSessions (14 sept. 2026) : une fréquence
     aberrante venue d'un profil enregistré ne doit pas se propager dans tous
     les calculs de volume. */
  if (!isFinite(avg) || avg <= 0) return SESSIONS_PER_WEEK;
  return Math.min(avg, SESSIONS_MAX_PLAUSIBLE);
}
/* Ancien seuil d'alerte "séance trop longue" (90 min) — retiré du calcul de
   volume le 4 sept. 2026 ("les séances doivent être adaptées selon le nb de
   séances par semaine SANS se soucier du temps") : la durée estimée
   (estimateDayMinutes) reste affichée à titre indicatif partout où elle
   l'était déjà, mais ne colore plus rien en rouge ni n'affiche de ⚠ — le
   nombre de séries programmées suit maintenant uniquement les cibles de la
   littérature (GOAL_PRESETS.targetSets) et la fréquence réelle choisie
   (avgSessionsPerWeek), jamais un plafond de durée. Constante gardée
   (inutilisée en logique) au cas où un futur réglage voudrait la
   réintroduire explicitement. */
var SESSION_CAP_MIN = 90;
/* Complété le 6 sept. 2026 — BUG RÉEL trouvé en auditant le volume
   effectivement compté : ces deux tables n'avaient jamais été mises à jour
   après l'ajout des muscles Trapèzes / Avant-bras / Abducteurs / Obliques à
   MUSCLES le 5 sept. 2026. Or regionBalance et pushPullBalance ignorent
   silencieusement tout muscle absent de la table (`if (r==="haut"||r==="bas")`
   / `if (c)`) : les séries de ces 4 muscles n'entraient donc dans AUCUN des
   deux plateaux de la balance "Haut / Bas" et "Poussée / Tirage" de l'onglet
   Analyse. Mesuré sur le programme d'origine : 132,6 séries comptées sur
   188,1 réellement programmées, soit ~30% du volume hebdomadaire invisible
   dans l'indicateur d'équilibre — et le trou s'est aggravé le 6 sept. avec
   l'ajustement EMG du Reverse Fly (Trapèzes passé de 0 à 0,9× sur deux
   machines, ~11 séries/semaine qui ne comptaient nulle part).
   Trapèzes et Avant-bras -> haut (ceinture scapulaire / avant-bras) ;
   Abducteurs -> bas (hanche) ; Obliques -> core, comme Abdominaux et
   Lombaires. PUSHPULL reste volontairement limité au HAUT du corps (la
   distinction poussée/tirage n'a pas de sens pour les jambes et le tronc,
   d'où l'absence de quadriceps/fessiers ici — ce n'est pas un oubli) :
   Trapèzes et Avant-bras y sont ajoutés en "pull", tous deux étant recrutés
   sur les mouvements de tirage (rowing, tractions, port de la charge). */
var REGION = {
  "Pectoraux":"haut", "Dos":"haut", "Trapèzes":"haut", "Deltoïdes post.":"haut", "Épaules":"haut",
  "Biceps":"haut", "Triceps":"haut", "Avant-bras":"haut",
  "Quadriceps":"bas", "Ischio-jambiers":"bas", "Mollets":"bas", "Fessiers":"bas",
  "Adducteurs":"bas", "Abducteurs":"bas",
  "Abdominaux":"core", "Obliques":"core", "Lombaires":"core", "Autre": null,
};
var PUSHPULL = {
  "Pectoraux":"push", "Épaules":"push", "Triceps":"push",
  "Dos":"pull", "Trapèzes":"pull", "Deltoïdes post.":"pull", "Biceps":"pull", "Avant-bras":"pull",
};
/* Ajouté le 5 sept. 2026 : certaines machines sollicitent plusieurs muscles
   (ex. Chest Press = pectoraux ET triceps) — demande explicite pour pouvoir
   assigner plusieurs muscles à une machine, à la création comme après coup.
   Plutôt que de réécrire les 29 machines du catalogue d'origine (dont on n'a
   pas vérifié la biomécanique précise une par une), le champ historique
   `muscle` (singulier) reste la source de vérité pour les machines qui n'ont
   qu'un seul muscle ; `muscles` (tableau) s'y ajoute quand il y en a
   plusieurs. `allMuscles` centralise la lecture : tout le reste du code (volume,
   fréquence, recherche de substitut, affichage) passe par cette fonction au
   lieu de lire `.muscle` ou `.muscles` directement, pour ne jamais désynchroniser
   les deux représentations. Par défaut (sans intensité précisée, voir
   muscleWeight ci-dessous) un set d'un exercice multi-muscle compte pour la
   totalité de son volume dans CHAQUE muscle listé (une série de Chest Press
   vaut une série entière de pectoraux ET une série entière de triceps) — c'est
   la convention usuelle des outils de suivi de volume pour les mouvements
   composés, pas une charge divisée entre les muscles. */
function allMuscles(ex) {
  if (!ex) return [];
  if (ex.muscles && ex.muscles.length) return ex.muscles;
  return ex.muscle ? [ex.muscle] : [];
}
/* Ajouté le 5 sept. 2026 (demande : "selon l'intensité par machine") :
   `muscleIntensity` (optionnel, {nomMuscle: fraction 0-1}) pondère la
   contribution d'un muscle secondaire — ex. Chest Press avec Triceps à 0.5
   compte pour une demi-série de triceps par série réellement faite, contre
   une série entière de pectoraux (poids par défaut 1, muscle "principal").
   Défaut 1 pour tout muscle non précisé : un exercice créé avant cet ajout,
   ou dont l'intensité n'a jamais été touchée, se comporte EXACTEMENT comme
   avant (crédit plein pour chaque muscle listé) — voir allMuscles. */
function muscleWeight(ex, mu) {
  if (!ex || !ex.muscleIntensity || ex.muscleIntensity[mu]==null) return 1;
  return ex.muscleIntensity[mu];
}
/* Ajouté le 5 sept. 2026 (demande : "choisir la proportion de chaque muscle
   travaillé ou choisir de tout équilibrer") — NE PAS confondre avec
   muscleWeight ci-dessus (poids Principal/Secondaire d'UN muscle sur UNE
   machine) : focusMultiplier lit le réglage global "Priorité par muscle"
   (profile.muscleFocus, voir OptionsTab) et donne le multiplicateur de
   volume hebdomadaire visé pour CE muscle sur TOUT le programme, via
   applyGoalToProgram. 1 par défaut (muscle absent de la table, ou table
   absente/vide) = équilibré, comme avant l'ajout de ce réglage — donc tous
   les appels existants qui ne passent pas encore muscleFocus continuent de
   se comporter exactement comme avant. */
function focusMultiplier(muscleFocus, mu) {
  if (!muscleFocus || muscleFocus[mu] == null) return 1;
  return muscleFocus[mu];
}
/* Ajouté le 5 sept. 2026 (demande : "il faut pas forcément que tous les
   muscles aient le même nombre de séries par semaine... cherche dans la
   littérature les réponses et applique"), RETIRÉ le 6 sept. 2026 (demande
   explicite : "il faudrait pas monter plus les triceps par rapport aux
   autres, il faut que l'équilibre demandé prime") — résumé de ce qui avait
   été trouvé, gardé ici pour mémoire plutôt que supprimé sans trace :

   Baz-Valle et al. 2022 (revue systématique, PubMed 35291645) trouve que le
   triceps continue de progresser au-delà de 20 séries/semaine (p=0.01),
   contrairement au quadriceps (p=0.19) et au biceps (p=0.59) qui plafonnent
   déjà dans la zone 12-20 — la seule différence par muscle trouvée dans une
   revue systématique publiée. Un ajustement automatique (+40% de cible pour
   le triceps sur les objectifs hypertrophie) avait été ajouté sur cette
   base, PUIS retiré : la donnée reste vraie, mais l'utilisateur a tranché
   que l'équilibre qu'IL demande (cible uniforme par défaut, ou "Priorité
   par muscle" s'il règle lui-même une priorité) doit toujours primer sur un
   ajustement automatique décidé par l'app à sa place — cohérent avec le
   reste de cette fonction (focusMultiplier), qui n'agit que sur ce que
   l'utilisateur règle explicitement. Si tu veux quand même viser plus haut
   sur le triceps personnellement, règle-le toi-même dans Options >
   "Priorité par muscle". */
/* Ajouté le 5 sept. 2026 (demande : "mettre les machines en fonction d'une
   salle") : `gymIds` (optionnel, tableau d'ids de profile.gyms) restreint une
   machine à une ou plusieurs salles. Tableau vide/absent = disponible PARTOUT
   — c'est le défaut pour les 29 machines du catalogue d'origine et pour tout
   ce qui a été ajouté avant cette fonctionnalité, donc rien ne disparaît pour
   qui n'utilise qu'une seule salle. gymId=null (utilisateur sans salle
   configurée, ne devrait plus arriver après la migration withGymsDefault)
   est traité comme "pas de filtre" plutôt que d'exclure les machines
   explicitement rattachées à une salle. */
function exerciseAvailableAtGym(ex, gymId) {
  if (!ex) return false;
  if (!gymId) return true;
  if (!ex.gymIds || !ex.gymIds.length) return true;
  return ex.gymIds.indexOf(gymId) >= 0;
}

/* ============================================================
   SEED DATA — machines only. kind/kg-increment already support
   cable & free-weight additions later; unilateral marks single-
   arm/leg movements (none yet in the seed, all current machines
   are bilateral seated units).
   ============================================================ */
/* order: 1 = polyarticulaire (plusieurs articulations, ex. développé, tirage,
   presse à cuisses), 2 = semi-isolation (une seule articulation mais un
   muscle biarticulaire ou beaucoup de synergistes recrutés — ischios,
   mollets, fessiers, lombaires, oiseau/deltoïde arrière), 3 = isolation
   (une seule articulation, un seul muscle ciblé). Sert à trier l'ordre des
   exercices dans une séance (poly d'abord, isolation en dernier).
   Le découpage en 3 paliers (plutôt que juste poly/isolation) est une
   convention pratique, pas une catégorie validée par la littérature en
   tant que telle.

   Vérifié (re-recherché pour la question "meilleures machines par objectif") :
   Nunes et al. 2020 (European Journal of Sport Science, méta-analyse sur
   l'ORDRE des exercices) trouve que pour l'HYPERTROPHIE, l'ordre n'a
   quasiment aucun effet (taille d'effet combinée ≈0.03, "zero effect").
   Pour la FORCE en revanche, l'exercice placé EN PREMIER progresse le plus
   — et ce bénéfice de position est même un peu plus marqué pour les
   exercices d'isolation que pour les polyarticulaires (ES ≈0.58 vs 0.32)
   quand on inverse l'ordre. Autrement dit la littérature ne dit PAS
   "commencer par le polyarticulaire fait plus progresser" — le vrai levier
   est "commencer par ce qu'on veut prioriser". La règle poly-avant-
   isolation gardée ici est donc surtout une convention pratique de
   fraîcheur/technique/sécurité (mouvements pluri-articulaires plus lourds
   et plus exigeants en coordination, mieux faits frais) plutôt qu'un
   levier de performance validé par la littérature — modifiable à la main
   pour un exercice précis via le rond numéroté si tu veux prioriser
   volontairement une isolation. */
/* CATALOGUE DE DÉPART — mis à jour le 13 sept. 2026 à la demande de
   l'utilisateur : "je veux que toutes les machines que j'ai dans mon local
   storage soient disponibles à tous les utilisateurs". Les 29 machines
   ci-dessous sont exactement celles de son export (Fitness Park théâtre /
   Rambouillet / Maurepas), y compris les 8 qu'il a ajoutées à la main
   (Matrix de Maurepas, Tirage vertical Technogym, Extension dorsale, Corde
   triceps), avec SES incréments réels mesurés machine par machine (pas de

   générique ne pouvait pas deviner.

   Trois choix explicites :
   - `gymIds` volontairement ABSENT : ses ids de salle (g1,
     gym1788618063482, gym1788618102052) ne veulent rien dire pour un autre
     utilisateur, et une machine sans salle est considérée disponible
     partout. Lui garde ses propres affectations : la migration ne touche
     jamais une machine qu'il a déjà (voir withLatestProgram).
   - les 8 anciennes fiches "(à vérifier)" et les modèles qu'il a supprimés
     (x-pulldown, x-assisted, x-row, x-lombaires, tg-wide-chest,
     lf-pectoraux, lf-fessiers, tg-shoulder-press) sont retirées : c'étaient
     des suppositions, remplacées par du matériel réellement constaté. Les
     garder les aurait aussi fait RÉAPPARAÎTRE chez lui au bump de version.
   - `unilateral` : l'export ne transporte pas ce champ. Les 21 machines
     déjà au catalogue gardent leur valeur d'origine ; les 8 ajoutées à la
     main gardent le défaut de l'app pour une machine créée par
     l'utilisateur (false). Non vérifié, modifiable machine par machine dans
     l'onglet Machines. */
var SEED_EXERCISES = [
  { id: "tg-chest-press", name: "Chest Press", brand: "Technogym", muscle: "Pectoraux", muscles: ["Pectoraux", "Épaules", "Triceps"], muscleIntensity: {"Pectoraux": 1, "Épaules": 0.75, "Triceps": 0.5}, kind: "machine", inc: 5, unilateral:true, order:1 },
  { id: "lf-dev-tronc", name: "Développé du Tronc", brand: "Life Fitness", muscle: "Pectoraux", muscles: ["Pectoraux", "Épaules", "Triceps"], muscleIntensity: {"Pectoraux": 1, "Épaules": 0.75, "Triceps": 0.5}, kind: "machine", inc: 7.5, unilateral:true, order:1 },

/* PROGRAMME VOYAGE — 23 sept. 2026. Deux séances complètes (tout le corps),
   à alterner, 2 à 3 fois par semaine, 35 à 45 min chacune.

   Pourquoi ce format, sources vérifiées ce jour :
   - ENTRETENIR coûte peu : chez des adultes jeunes, une seule séance par
     semaine, soit environ un tiers du volume habituel, a suffi à maintenir la
     masse musculaire pendant 32 semaines (Bickel et al., Med Sci Sports
     Exerc 2011). Deux séances par semaine de ce programme couvrent donc
     largement l'entretien ; trois laissent de la marge pour progresser.
   - Une pause de 3 semaines coûte de toute façon très peu : chez des
     débutants, 6 mois avec une pause de 3 semaines toutes les 6 semaines ont
     donné une prise de muscle comparable à 6 mois sans pause (Ogasawara et
     al. 2013).
   - La CHARGE compte peu pour le muscle tant que la série est menée près de
     l'échec (Schoenfeld et al., JSCR 2017) — c'est ce qui rend le poids du
     corps efficace, avec des fourchettes de reps plus hautes qu'en salle.
   - Pompes contre développé couché à charge comparable, 8 semaines :
     +18,3 % d'épaisseur du grand pectoral contre +19,4 %, +9,5 % de triceps
     contre +10,3 % (Kikuchi & Nakazato, J Exerc Sci Fit 2017).
   Trois séries par exercice (le minimum de l'appli, Krieger 2010), repos de
   60 à 75 s : au-delà de 60 s, léger gain de muscle, au-delà de 90 s plus de
   différence détectable (Singer et al. 2024) — et une séance qui tient en
   35-45 min a plus de chances d'être faite en vacances.
   Les exercices non retenus (curl au sac, etc.) restent au catalogue pour
   remplacer un exercice impossible à faire sur place. */
var VOYAGE_PROGRAM = [

   ("brand") n'a jamais vraiment de sens pour du poids libre générique
   (haltères) ou de la callisthénie (tractions, pompes, gainage...) : avant
   ce jour, ManualAdd forçait quand même "—" si le champ était laissé vide
   (voir son bouton "Ajouter au matériel"), ce qui s'affichait ensuite
   partout comme un placeholder visible et un peu cassé ("Pompes (—) —
   Abdominaux"). Le champ marque reste dans le formulaire (utile pour
   distinguer deux machines Technogym vs Life Fitness du même nom), mais
   n'est plus obligatoire : brand peut être une chaîne vide, et ces deux
   fonctions donnent un affichage propre partout où la marque apparaît
   (dropdowns d'ajout, fiche machine, séance...), en retombant sur le type
   d'équipement (KIND_LABEL) plutôt que sur un tiret vide. "?" (marque "à
   vérifier", voir bestCandidate > verified) reste affiché tel quel — ce
   n'est pas la même chose qu'une marque volontairement absente. */
/* Corrigé le 6 sept. 2026 — les machines du catalogue de départ dont la
   marque reste à confirmer portent brand:"?" (un placeholder, pas une
   marque). hasBrand les considérait comme renseignées, et la ligne sous le
   nom de la machine affichait donc un "?" tout seul dans "Ce qui t'attend",
   dans la séance en cours et dans Machines — illisible, et rien n'indiquait
   qu'il s'agissait d'une info manquante et non d'un bug. Tous les
   placeholders usuels sont maintenant traités comme "pas de marque", ce qui
   fait retomber l'affichage sur le type de matériel ("Machine guidée",
   "Poulie"...), une information vraie et utile. */
var BRAND_PLACEHOLDERS = { "?":1, "-":1, "–":1, "—":1, "n/a":1, "na":1, "?????":1 };
function hasBrand(ex) {
  if (!ex || !ex.brand) return false;
  var b = String(ex.brand).trim();
  return b !== "" && !BRAND_PLACEHOLDERS[b.toLowerCase()];
}
/* Formulations de la fusion de deux lignes d'une même journée — voir
   adaptDayItems, qui pose le marqueur dans item.gymMergedFrom. */
function mergedNote(mark){
  if (mark === "__SAME__") return "Cette machine est enregistrée deux fois dans ton matériel, sans rien qui les distingue — les séries des deux lignes sont réunies ici. Si ce sont bien deux machines différentes, précise leur marque dans l'onglet Machines.";
  if (String(mark).indexOf("__ALT__") === 0) return "Tu as aussi la version " + String(mark).slice(7) + " de cette machine, dans une autre salle : elle n'est pas ici, ses séries sont reprises sur celle-ci. Rien à corriger.";
  return "Reprend aussi les séries de " + mark + ", indisponible dans cette salle et sans équivalent libre — même muscle, inutile de chercher une autre machine.";
}
function mergedNoteShort(mark){
  if (mark === "__SAME__") return "machine en double, séries réunies";
  if (String(mark).indexOf("__ALT__") === 0) return "reprend les séries de la version " + String(mark).slice(7) + " (autre salle)";
  return "reprend les séries de " + mark;
}
function brandLabel(ex) { if (!ex) return "—"; return hasBrand(ex) ? ex.brand : (KIND_LABEL[ex.kind] || "Machine guidée"); }

/* ============================================================
   ENGINE — progressive overload, stalls, effort, deload,
   symmetry, and upper/lower + push/pull volume balance.
   ============================================================ */
function historyFor(sessions, exId) {
  return sessions.filter(function(s){return s.done;})
    .map(function(s){ return { date: s.date, entry: s.entries.find(function(e){return e.ex===exId;}) }; })
    .filter(function(r){ return r.entry && r.entry.sets.some(function(x){return x.weight!=null && x.reps!=null;}); })
    .sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
}
var INC_CACHE = {};
/* Le plus petit incrément de charge de la machine. La MACHINE elle-même fait
   foi quand on l'a sous la main (c'est le cas partout où prescribe est
   appelé) ; INC_CACHE n'est plus qu'un repli pour les quelques endroits qui
   ne manipulent qu'un item de programme. Renforcé le 7 sept. 2026 : quand ce
   cache n'était pas encore rempli, tout retombait silencieusement sur 2,5 kg
   et proposait des charges introuvables sur une colonne à pas de 5. */
function itemInc(item, ex){
  if (ex && typeof ex.inc === "number" && isFinite(ex.inc) && ex.inc > 0) return ex.inc;
  return INC_CACHE[item.ex] != null ? INC_CACHE[item.ex] : 2.5;
}
function round(n){ return Math.round(n*2)/2; }
/* Arrondi ALIGNÉ SUR LE PAS du compteur — ajouté le 22 sept. 2026 (demande :
   "faudrait pouvoir régler par des pas de 0,1 les équilibres entre les
   muscles"). `round` arrondit au demi-kilo, ce qui est juste pour une charge
   (aucune salle n'a de plaque de 0,1 kg) mais rendait tout pas plus fin
   inopérant : appuyer sur + avec un pas de 0,1 renvoyait la même valeur, le
   bouton semblait cassé. En dessous de 0,5 on arrondit donc sur la grille du
   pas lui-même ; à 0,5 et au-delà, comportement d'origine, inchangé pour les
   charges. */
function arrondiPas(v, step){
  if (!(step > 0) || step >= 0.5) return round(v);
  var f = Math.round(1/step);
  return Math.round(v*f)/f;
}

function prescribeBase(sessions, item, ex) {
  var isTime = ex && ex.trackBy === "time";
  /* POIDS DU CORPS (23 sept. 2026, mode voyage) : "monter la charge" n'a pas
     de sens quand il n'y a pas de charge. Une fois la fourchette dépassée, on
     progresse en passant à une variante plus dure (voir ex.conseil) ou en
     mettant du poids dans le sac — l'appli le DIT au lieu d'afficher un
     "+2 kg" qu'on ne saurait pas où mettre. La charge prescrite reste celle
     de la dernière fois : si tu changes de variante, tu repars du bas de la
     fourchette ; si tu remplis le sac, tu saisis son poids. */
  var corps = ex && ex.kind === "bodyweight";
  var hist = historyFor(sessions, item.ex);
  if (hist.length === 0 && corps) {
    return { weight: null, targetReps: item.min, state: "new",
      note: isTime
        ? "Premier passage — choisis la variante que tu tiens " + item.min + " s en gardant de la marge. Laisse 0 kg."
        : "Premier passage — choisis la variante qui te permet environ " + item.min + " reps en gardant 2 en réserve. Laisse 0 kg, ou le poids du sac si tu en mets un." };
  }
  if (hist.length === 0) {
    return { weight: null, targetReps: item.min, state: "new",
      note: isTime
        ? "Premier passage — charge/position que tu tiens " + item.min + " s en gardant de la marge."
        : "Premier passage — charge que tu tiens " + item.min + " reps en gardant 2 reps en réserve." };
  }
  var last = hist[hist.length-1].entry.sets.filter(function(s){return s.weight!=null;});
  var w = Math.max.apply(null, last.map(function(s){return s.weight;}));
  var atW = last.filter(function(s){return s.weight===w;});
  var rirs = atW.map(function(s){return s.rir;}).filter(function(r){return r!=null;});
  var avgRir = rirs.length ? rirs.reduce(function(a,b){return a+b;},0)/rirs.length : null;

  if (corps && avgRir != null && avgRir >= 3) {
    return { weight: w, targetReps: item.min, state: "up",
      note: "Tu as fini à " + avgRir.toFixed(1).replace(".", ",") + " reps en réserve — trop facile. Passe à la variante plus difficile, ou ajoute ~" + fmtNombre(itemInc(item, ex)*2) + " kg dans le sac." };
  }
  if (corps && atW.length >= item.sets && atW.every(function(s){return s.reps>=item.max;})) {
    return { weight: w, targetReps: item.min, state: "up",
      note: "Toutes les séries au plafond — passe à la variante plus difficile, ou ajoute ~" + fmtNombre(itemInc(item, ex)) + " kg dans le sac, et repars de " + item.min + (isTime ? " s." : " reps.") };
  }
  if (avgRir != null && avgRir >= 3) {
    var jump = itemInc(item, ex) * 2;
    return { weight: round(w+jump), targetReps: item.min, state: "up",
      note: "Tu as fini à " + avgRir.toFixed(1).replace(".", ",") + " reps en réserve — trop léger. On monte de " + fmtNombre(jump) + " kg d'un coup." };
  }
  if (atW.length >= item.sets && atW.every(function(s){return s.reps>=item.max;})) {
    return { weight: round(w+itemInc(item, ex)), targetReps: item.min, note: "Toutes les séries au plafond — on monte la charge.", state: "up" };
  }
  if (atW.some(function(s){return s.reps<item.min;}) && hist.length >= 2) {
    var prev = hist[hist.length-2].entry.sets.filter(function(s){return s.weight!=null;});
    var pw = Math.max.apply(null, prev.map(function(s){return s.weight;}));
    if (pw === w && prev.some(function(s){return s.reps<item.min;}) && corps) {
      return { weight: w, targetReps: item.min, state: "down",
        note: "Deux séances sous la fourchette — passe à la variante plus facile (voir le conseil), ou enlève du poids du sac." };
    }
    if (pw === w && prev.some(function(s){return s.reps<item.min;})) {
      return { weight: round(Math.max(itemInc(item, ex), w-itemInc(item, ex))), targetReps: item.min, note: "Deux séances sous la fourchette — on redescend d'un cran.", state: "down" };
    }
  }
  /* CORRIGÉ le 21 sept. 2026 (capture : "vise 7 reps sur chaque série" juste
     sous un objectif "4×10-15" — "c'est mal fait"). La cible était "ta pire
     série de la dernière fois + 1", sans jamais la ramener dans la fourchette :
     après une séance à 6 reps, l'appli demandait 7, c'est-à-dire de rester
     SOUS l'objectif affiché trois centimètres plus haut. La double progression
     (monter les reps jusqu'au haut de la fourchette, puis la charge) suppose
     d'être DANS la fourchette : la cible ne descend donc jamais sous le bas de
     celle-ci. Si tu n'y arrives pas deux séances de suite, la règle juste
     au-dessus redescend la charge d'un cran — elle existait déjà. */
  var pire = Math.min.apply(null, atW.map(function(s){return s.reps;}));
  var next = Math.max(item.min, Math.min(item.max, pire + 1));
  var unite = isTime ? " s" : " reps";
  var note;
  if (pire < item.min) {
    note = "Dernière fois " + pire + unite + " au plus bas, sous la fourchette " + item.min + "-" + item.max + ". Même charge — vise au moins " + item.min + unite + " sur chaque série ; si ça ne passe pas deux fois de suite, l'appli redescend d'un cran.";
  } else {
    note = isTime ? "Même charge — vise " + next + " s tenues sur chaque série." : "Même charge — vise " + next + " reps sur chaque série.";
  }
  return { weight: w, targetReps: next, state: "hold", note: note };
}

function prescribe(sessions, item, deload, ex) {
  var p = prescribeBase(sessions, item, ex);
  if (!deload) return p;
  if (p.weight == null) return { weight: null, targetReps: item.min, state: "deload",
    note: "Décharge : première fois, reste léger et garde 3 reps en réserve." };
  var w2 = round(p.weight * 0.8);
  return { weight: w2, targetReps: item.min, state: "deload", setsOverride: Math.max(2, item.sets-1),
    note: "Semaine de décharge — environ 80% de la charge habituelle, une série de moins, technique propre." };
}

function stallInfo(sessions, exId) {
  var hist = historyFor(sessions, exId);
  if (hist.length < 4) return null;
  var weights = hist.map(function(hh){ return Math.max.apply(null, hh.entry.sets.filter(function(s){return s.weight!=null;}).map(function(s){return s.weight;})); });
  var recent = weights.slice(-4);
  return Math.max.apply(null, recent) <= recent[0] ? { sessions: recent.length, weight: recent[0] } : null;
}
function effortInfo(sessions, exId) {
  var hist = historyFor(sessions, exId).slice(-4);
  if (hist.length < 3) return null;
  var all = [];
  hist.forEach(function(hh){ hh.entry.sets.forEach(function(s){ if (s.rir!=null) all.push(s.rir); }); });
  if (all.length < 6) return null;
  var avg = all.reduce(function(a,b){return a+b;},0) / all.length;
  return avg >= 3 ? { avg: Math.round(avg*10)/10 } : null;
}
function symmetryInfo(sessions, exId) {
  /* Tu commences déjà par le côté faible et égalises la charge/reps sur le
     fort — donc comparer le poids logué des deux côtés ne révélerait jamais
     rien (il est identique par construction). Le signal vient plutôt d'un
     repérage volontaire et léger : sur chaque série tu peux, en option,
     indiquer quel côté a semblé plus dur ce jour-là. On compte juste lequel
     revient le plus souvent sur les dernières séances. */
  var hist = historyFor(sessions, exId).slice(-6);
  var flags = { L: 0, R: 0, total: 0 };
  hist.forEach(function(hh){ hh.entry.sets.forEach(function(s){
    if (s.weakSide === "L") { flags.L++; flags.total++; }
    if (s.weakSide === "R") { flags.R++; flags.total++; }
  }); });
  if (flags.total < 3) return null;
  var dominant = flags.L > flags.R ? "L" : flags.R > flags.L ? "R" : null;
  if (!dominant) return null;
  var pct = Math.round((Math.max(flags.L, flags.R) / flags.total) * 100);
  if (pct < 60) return null;
  return { weaker: dominant==="L" ? "gauche" : "droit", pct: pct, count: flags.total };
}

function stalledCount(sessions, exercises){ return exercises.filter(function(e){return stallInfo(sessions,e.id);}).length; }
function trackedCount(sessions, exercises){ return exercises.filter(function(e){return historyFor(sessions,e.id).length>=4;}).length; }
function reactiveDeloadDue(sessions, exercises){
  var tracked = trackedCount(sessions, exercises);
  if (tracked < 3) return false;
  return stalledCount(sessions, exercises) / tracked >= 0.5;
}
/* `musculationDays` et pas `program` : une séance de cardio ne fatigue pas les
   mêmes tissus et ne doit ni avancer le compteur de cycles ni déclencher une
   décharge (voir musculationDays). */
function sessionsMuscu(sessions, program){
  var cles = {}; musculationDays(program).forEach(function(d){ cles[d.key] = true; });
  return (sessions||[]).filter(function(s){ return s.done && cles[s.dayKey]; });
}
function cyclesCompleted(sessions, program){ return Math.floor(sessionsMuscu(sessions, program).length / rotationLength(program)); }
function proactiveDeloadDue(sessions, program){
  var done = sessionsMuscu(sessions, program).length;
  var c = cyclesCompleted(sessions, program);
  return c > 0 && c % 6 === 0 && done % rotationLength(program) === 0;
}

/* Estimated real session length: ~40s of work per set + its rest, plus ~70s
   de transition entre machines et 5 min d'échauffement/attente. Rough but
   directional — real gym time also depends on how busy it is, so treat
   this as a floor, not a promise.

   Calculé en BILATÉRAL (demandé le 4 sept. 2026) : ne double plus les
   séries pour les exercices unilatéraux (bras/jambe par bras). Avant, un
   exercice unilatéral comptait chaque série deux fois (une par côté), ce
   qui gonflait l'estimation (~96 min vu en Options) — cohérent avec la
   phase 1 (voir plus haut, unilatéral partout le temps de vérifier
   l'équilibre gauche/droite) mais plus ce que l'utilisateur veut voir
   affiché ici. `exMap` gardé en paramètre pour ne pas casser les appels
   existants, même s'il ne sert plus dans cette fonction. */
function estimateDayMinutes(day, exMap) {
  var total = 0;
  (day.items || []).forEach(function(it) {
    total += it.sets * (40 + it.rest);
  });
  /* Au poids du corps (mode voyage), pas de machine à rejoindre ni à régler :
     ~30 s de transition au lieu de 70, et 3 min d'échauffement au lieu de 5. */
  var toutCorps = !!exMap && (day.items || []).length > 0 && (day.items || []).every(function(it){ var e = exMap[it.ex]; return e && e.kind === "bodyweight"; });
  total += Math.max(0, (day.items || []).length - 1) * (toutCorps ? 30 : 70);
  total += toutCorps ? 180 : 300;
  var min = Math.round(total / 60);
  /* Cardio du jour (voir applyCardioToProgram) : durée prescrite + 3 min
     d'installation par appareil. Un jour de cardio pur n'a pas d'items, donc
     pas les 5 min d'échauffement/rangement comptées ci-dessus — mais il a bien
     ces 3 min-là. */
  var c = cardioMinutesOfDay(day);
  if (c > 0) {
    if (!(day.items || []).length) min = 0;
    min += c + 3 * dayCardio(day).length;
  }
  return min;
}

/* Planned weekly volume, by muscle, from the program as configured.
   avgSessions = fréquence hebdomadaire réelle (voir avgSessionsPerWeek) —
   optionnel, retombe sur SESSIONS_PER_WEEK si omis (compat des rares appels
   qui n'ont pas encore le profil sous la main). Retourne aussi `freq` :
   une estimation du nombre de fois/semaine où CE muscle est entraîné
   (nb de jours du programme qui le sollicitent × assiduité réelle) — ajouté
   suite à la recherche sur la fréquence d'entraînement (Pelland et al. 2025 ;
   Ralston et al. 2018) : le volume total ne dit rien de la répartition dans
   la semaine, or ≥2×/semaine/muscle reste la recommandation pratique pour
   l'hypertrophie (voir GOAL_PRESETS.minFreq et la note plus bas). */
/* Deux entrées d'un MÊME jour qui désignent la même machine (voir
   sameMachineLikely) ne peuvent pas être faites deux fois : tu es dans UNE
   salle, tu passes UNE fois sur la machine. L'onglet Séance le sait déjà — il
   fusionne les deux lignes en une (voir adaptDayItems / mergedNote). Le calcul
   de volume, lui, comptait les deux.

   BUG RÉEL, trouvé le 13 sept. 2026 sur "non, ça compte bien mal". Avec trois
   salles et la même machine enregistrée une fois par salle — sa situation
   exacte — un jour contenant Upper Back (théâtre) 5 séries + Upper Back
   (Rambouillet) 5 séries + Tirage vertical ×2 affichait :
     onglet Séance  : Upper Back 5, Tirage vertical 5  = 10 séries
     onglet Machines: Dos 18 séries/semaine
   Presque le double. Et ce n'était pas qu'un affichage faux : c'est ce chiffre
   gonflé qui pilote le score, les diagnostics et la recomposition automatique.
   L'appli retirait donc des machines pour corriger un dépassement qui n'existe
   PAS dans la séance réellement faite — puis l'écran Machines proposait de les
   remettre, faute de volume. Les deux contradictions signalées viennent de là,
   pas du réglage que je corrigeais depuis deux jours.

   Le volume compte maintenant la séance TELLE QU'ELLE SERA FAITE, avec la même
   règle de fusion que l'affichage (somme plafonnée à MAX_SETS_PER_EXERCISE),
   pour que les deux écrans ne puissent plus diverger. */
function effectiveDayItems(items, exMap) {
  var out = [], seen = {};
  (items||[]).forEach(function(it){
    var ex = exMap[it.ex];
    var key = ex ? normalizedExName(ex.name) : it.ex;
    var prev = seen[key];
    /* On ne fusionne QUE ce que l'affichage fusionne : deux machines portant
       une vraie marque différente restent deux machines distinctes. */
    if (prev && ex && exMap[prev.ex] && !sameMachineLikely(ex, exMap[prev.ex])) prev = null;
    if (prev) { prev.sets = Math.min(MAX_SETS_PER_EXERCISE, (prev.sets||0) + (it.sets||0)); return; }
    var copy = Object.assign({}, it);
    seen[key] = copy;
    out.push(copy);
  });
  return out;
}
/* `gymId` ajouté le 13 sept. 2026 — deuxième moitié du "ça compte mal".

   Le volume comptait le programme BRUT. Mais dans une salle donnée, certaines
   machines du programme n'existent pas : l'appli les remplace à la volée par
   l'équivalent disponible (voir adaptDayItems). Au Fitness park théâtre, le
   programme "Upper Back + machine indisponible" devient donc "Upper Back +
   Tirage vertical" à l'écran et dans la séance réellement faite — mais le
   tableau, lui, comptait le programme brut et affichait un dos deux fois plus
   bas que ce qui allait vraiment être fait.
   Le tableau compte maintenant la séance TELLE QU'ELLE SERA FAITE dans la
   salle sélectionnée, substitutions et fusions de doublons comprises. Sans
   gymId (appels internes de simulation), comportement d'avant. */
function plannedVolume(program, exercises, avgSessions, gymId) {
  var exMap = {}; exercises.forEach(function(e){ exMap[e.id]=e; });
  var freqFactor = (avgSessions||SESSIONS_PER_WEEK) / rotationLength(program);
  var factor = freqFactor;
  var m = {}, daysWith = {};
  program.forEach(function(d){
    var musclesToday = {};
    var duJour = gymId ? adaptDayItems(d.items, exercises, exMap, gymId) : effectiveDayItems(d.items, exMap);
    duJour.forEach(function(it){
      var ex = exMap[it.ex]; if (!ex) return;
      allMuscles(ex).forEach(function(mu){
        m[mu] = (m[mu]||0) + it.sets * muscleWeight(ex, mu);
        musclesToday[mu] = true; // fréquence : ce muscle est sollicité ce jour-là, peu importe l'intensité
      });
    });
    Object.keys(musclesToday).forEach(function(mu){ daysWith[mu] = (daysWith[mu]||0) + 1; });
  });
  return Object.keys(m).map(function(muscle){
    return { muscle: muscle, sets: Math.round(m[muscle]*factor*10)/10,
      freq: Math.round((daysWith[muscle]||0)*freqFactor*10)/10 };
  }).sort(function(a,b){ return b.sets-a.sets; });
}
function regionBalance(vol){
  var sums = {haut:0, bas:0};
  vol.forEach(function(v){ var r=REGION[v.muscle]; if (r==="haut"||r==="bas") sums[r]+=v.sets; });
  return sums;
}
function pushPullBalance(vol){
  var sums = {push:0, pull:0};
  vol.forEach(function(v){ var c=PUSHPULL[v.muscle]; if (c) sums[c]+=v.sets; });
  return sums;
}

/* Score d'optimisation (demande du 5 sept. 2026 : "une barre où 100%
   correspond à 100% opti selon l'objectif, qui met en % l'optimisation
   selon la littérature et les différents objectifs selon les paramètres
   que l'utilisateur a choisi") — 0-100%, calculé sur le programme PRÉVU tel
   qu'il est configuré maintenant (voir plannedVolume), pas sur l'historique
   réel (voir recalibrateProgramFromHistory pour la partie historique).

   Deux repères par muscle, tous deux déjà utilisés ailleurs dans l'appli et
   sourcés (voir GOAL_PRESETS) :
   - targetSets (Pelland et al. 2025 pour hypertrophie/perte de gras,
     Androulakis-Korakakis et al. 2021 pour la force) : volScore = sets
     prévus / target, plafonné à 100% — aucune preuve qu'aller au-delà de la
     cible apporte un bénéfice supplémentaire (voir InfoTip "Volume prévu
     par semaine"), donc pas de pénalité pour un dépassement, juste pas de
     bonus non plus.
   - minFreq (Ralston et al. 2018 ; Pelland et al. 2025 — repère pratique,
     pas un effet indépendant démontré, voir la note sur GOAL_PRESETS.strength
     plus haut) : freqScore = fréquence prévue / minFreq, même plafond à 100%.
   Score par muscle = moyenne des deux ; score global = moyenne des muscles
   du catalogue actuel (chacun compte pour un, pas pondéré par nb de
   machines). Un muscle sans aucune machine dans le catalogue n'a pas de
   ligne dans plannedVolume, donc ne compte pas dans le score — ce n'est pas
   un défaut caché, "Volume prévu par semaine" resterait de toute façon vide
   pour lui.

   Changé le 6 sept. 2026 (demande : priorité objectif > équilibrage > temps,
   avec "possibilité de descendre l'efficacité d'objectif d'entraînement pour
   être en accord avec l'équilibrage [ou le temps], on verra alors le %
   optimisation baisser") — volScore se calcule maintenant contre baseTarget
   (le repère générique de l'objectif, SANS le multiplicateur muscleFocus),
   et non plus contre la cible déjà personnalisée par "Priorité par muscle".
   Avant ce changement, `target` suivait automatiquement le réglage de
   focusMultiplier, donc baisser la priorité d'un muscle ne faisait JAMAIS
   baisser son score (le repère bougeait avec le réglage) — ça cachait
   justement le compromis que ce réglage représente. Maintenant, un muscle
   volontairement mis en retrait (focus < 1×) affiche un score plus bas : pas
   un bug, c'est la mesure honnête de "combien de l'optimum pur pour ton
   objectif tu sacrifies pour cet équilibrage" (voir l'InfoTip du Score
   d'optimisation, qui explique ce compromis, et "En retrait" dans
   MachinesTab, qui annote les muscles concernés). `target` (la cible
   personnalisée) reste renvoyée à titre informatif, pas comme base du score.
   Ce changement ne modifie AUCUN comportement de applyGoalToProgram /
   _applyGoalToProgramRaw : le volume RÉELLEMENT programmé pour un muscle mis
   en avant continue de viser sa cible personnalisée (focusMultiplier) comme
   avant — seul l'AFFICHAGE du score de conformité à l'objectif générique
   change. */
function optimizationScore(program, exercises, goal, avgSessions, muscleFocus) {
  var vol = plannedVolume(program, exercises, avgSessions);
  if (vol.length===0) return { score: null, perMuscle: [] };
  var baseTarget = goalPreset(goal).targetSets || VOL_MIN;
  var minFreq = goalPreset(goal).minFreq || 0;
  var perMuscle = vol.map(function(v){
    var customTarget = baseTarget * focusMultiplier(muscleFocus, v.muscle);
    var volScore = baseTarget>0 ? Math.min(100, (v.sets/baseTarget)*100) : 100;
    var freqScore = minFreq>0 ? Math.min(100, (v.freq/minFreq)*100) : 100;
    return { muscle: v.muscle, sets: v.sets, target: Math.round(customTarget*10)/10, baseTarget: Math.round(baseTarget*10)/10, freq: v.freq, minFreq: minFreq,
      volScore: Math.round(volScore), freqScore: Math.round(freqScore), score: Math.round((volScore+freqScore)/2),
      deprioritized: focusMultiplier(muscleFocus, v.muscle) < 0.999 };
  });
  var overall = Math.round(perMuscle.reduce(function(a,p){return a+p.score;},0) / perMuscle.length);
  return { score: overall, perMuscle: perMuscle.sort(function(a,b){return a.score-b.score;}) };
}

/* Choisit la meilleure machine de remplacement parmi des candidats pour le
   même muscle — au lieu de prendre juste la première de la liste (ordre
   d'ajout au catalogue, qui n'a aucun rapport avec la qualité de l'exercice
   pour l'objectif). Deux critères, dans cet ordre :
   1) une machine CONFIRMÉE (brand !== "?") plutôt qu'une encore "à
      vérifier" — remplacer par une machine dont on n'est même pas sûr
      qu'elle existe à la salle ne sert à rien ;
   2) le même palier polyarticulaire/semi-isolation/isolation (voir `order`
      dans SEED_EXERCISES et exerciseOrderTier) que l'exercice remplacé, pour
      ne pas casser l'ordre poly-avant-isolation de la séance (voir Séance >
      petit badge numéroté sur chaque machine).
   À égalité sur ces deux critères, l'ordre du catalogue tranche — ça reste
   déterministe et prévisible.

   Objectif d'entraînement (goal) délibérément PAS un critère ici — question
   vérifiée spécifiquement (recherche faite pour "quelles sont les
   meilleures machines pour chaque objectif") plutôt que supposée. Trois
   études trouvées comparant des machines polyarticulaires à des machines
   d'isolation pour LE MÊME muscle :
   - un essai croisé randomisé chez des hommes entraînés (International
     Journal of Exercise Science, 2020) ne trouve AUCUNE différence
     significative de gain de force (1RM développé couché, squat) entre un
     protocole polyarticulaire et un protocole en isolation ;
   - une méta-analyse dédiée à l'hypertrophie (mono- vs poly-articulaire,
     membres) ne trouve pas non plus de différence significative sur la
     croissance musculaire globale (mais suggère un possible intérêt de
     CUMULER les deux types pour le développement régional du muscle,
     piste encore peu étudiée) ;
   - une méta-analyse sur l'ORDRE des exercices (Nunes et al. 2020, voir
     note plus haut sur `order`) confirme que l'ordre n'affecte pas
     l'hypertrophie, et que pour la force c'est LA POSITION (premier de la
     séance) qui compte, pas le fait que l'exercice soit poly ou isolation.
   Conclusion retenue : pas de base solide pour préférer une machine
   polyarticulaire à une machine d'isolation ciblant le même muscle selon
   l'objectif (force/hypertrophie/perte de gras) — bestCandidate reste donc
   volontairement identique pour les 6 objectifs. Ce qui varie réellement
   par objectif, et qui est bien implémenté ailleurs, c'est le nombre de
   séries/reps/repos par palier (GOAL_PRESETS/tierDefaultsForGoal) et la
   cible kcal/protéines — pas le choix de LA machine. */
/* referenceMuscles (ajouté 5 sept. 2026, voir allMuscles) : nombre de muscles
   partagés avec l'exercice remplacé/bloqué — un candidat qui couvre PLUSIEURS
   des mêmes muscles est un meilleur substitut qu'un candidat qui n'en
   partage qu'un seul, donc ce critère passe juste après "vérifiée" et avant
   le palier. Optionnel : omis, tous les candidats sont à égalité dessus
   (comportement identique à avant l'ajout). */
function bestCandidate(candidates, referenceOrder, referenceMuscles) {
  if (!candidates.length) return null;
  /* Une machine de cardio ne remplace pas une machine de muscu, ni l'inverse
     (17 sept. 2026) : elles partagent le muscle fourre-tout "Autre", ce qui
     suffirait à les rendre candidates l'une pour l'autre. */
  candidates = candidates.filter(function(e){ return !isCardio(e); });
  if (!candidates.length) return null;
  var refM = referenceMuscles || [];
  var scored = candidates.map(function(e, i){
    var overlap = allMuscles(e).filter(function(mu){ return refM.indexOf(mu) >= 0; }).length;
    return { e: e, i: i, verified: e.brand !== "?" ? 1 : 0, overlap: overlap, sameTier: exerciseOrderTier(e) === referenceOrder ? 1 : 0 };
  });
  scored.sort(function(a, b){
    if (a.verified !== b.verified) return b.verified - a.verified;
    if (a.overlap !== b.overlap) return b.overlap - a.overlap;
    if (a.sameTier !== b.sameTier) return b.sameTier - a.sameTier;
    return a.i - b.i;
  });
  return scored[0].e;
}

/* Removing a machine: keep the volume by swapping in the BEST equivalent
   sharing at least one muscle (see bestCandidate), not just the first one on
   the list. Un exercice multi-muscle (voir allMuscles) est un candidat valable
   dès qu'il partage AU MOINS un muscle avec celui qu'on retire — bestCandidate
   priorise ensuite celui qui en partage le plus. */
function removeWithSubstitution(exId, exercises, program) {
  var gone = exercises.find(function(e){return e.id===exId;});
  var goneMuscles = allMuscles(gone);
  var remaining = exercises.filter(function(e){return e.id!==exId;});
  var report = [];
  var nextProgram = program.map(function(day){
    var items = [];
    day.items.forEach(function(it){
      if (it.ex !== exId) { items.push(it); return; }
      var taken = {}; day.items.forEach(function(x){taken[x.ex]=true;}); items.forEach(function(x){taken[x.ex]=true;});
      var candidates = remaining.filter(function(e){ return !taken[e.id] && allMuscles(e).some(function(mu){ return goneMuscles.indexOf(mu)>=0; }); });
      var cand = bestCandidate(candidates, exerciseOrderTier(gone), goneMuscles);
      if (cand) { items.push(Object.assign({}, it, {ex: cand.id})); report.push({day: day.label, to: cand.name, sets: it.sets}); }
      else { report.push({day: day.label, to: null, sets: it.sets}); }
    });
    return Object.assign({}, day, {items: items});
  });
  return { exercises: remaining, program: nextProgram, report: report, gone: gone };
}

/* An exercise is stalled (same weight 4+ séances) and it's the only one blocking:
   look for the BEST other machine already in the catalog, sharing at least one
   muscle (see allMuscles), that isn't already used anywhere in the program
   (see bestCandidate for what "best" means here). Returns null if nothing
   suitable exists. */
/* `alsoUsedIds` (12 sept. 2026) : les machines ajoutées à la volée pendant la
   séance en cours ne sont PAS dans le programme, donc rien ne les excluait des
   remplaçants proposés. Concrètement : le poste est pris, tu ajoutes une autre
   machine à la séance et tu y logges 3 séries ; plus tard tu demandes un
   remplaçant pour la machine d'origine, l'appli te propose celle que tu es en
   train d'utiliser, et la carte affiche alors les séries (vides) de l'ancienne
   — tes 3 séries disparaissent de l'écran (le rendu ne trouve que la PREMIÈRE
   entrée portant cet id) tout en restant enregistrées, d'où une séance en
   double dans l'historique et un volume compté deux fois dans Analyse. */
function suggestSwap(exId, exercises, program, gymId, alsoUsedIds) {
  var ex = exercises.find(function(e){return e.id===exId;});
  if (!ex) return null;
  var usedIds = {};
  program.forEach(function(d){ d.items.forEach(function(it){ usedIds[it.ex]=true; }); });
  (alsoUsedIds||[]).forEach(function(id){ if (id !== exId) usedIds[id] = true; });
  var exMuscles = allMuscles(ex);
  /* gymId ajouté le 7 sept. 2026 — BUG signalé : "quand je change une machine
     pendant une séance la nouvelle machine n'apparaît pas même quand j'appuie
     sur remplacer". Reproduit : avec plusieurs salles, le remplaçant proposé
     pouvait être une machine ABSENTE de la salle où l'on se trouve. Elle
     entrait bien dans le programme et dans la séance, puis adaptDayItems la
     remplaçait aussitôt par une autre pour cause d'indisponibilité, et la
     ligne disparaissait purement et simplement de l'écran (7 machines -> 6).
     On ne propose donc que ce qui est réellement utilisable ici. */
  var candidates = exercises.filter(function(e){
    return e.id!==exId && !usedIds[e.id] && exerciseAvailableAtGym(e, gymId)
      && allMuscles(e).some(function(mu){ return exMuscles.indexOf(mu)>=0; });
  });
  return bestCandidate(candidates, exerciseOrderTier(ex), exMuscles);
}
/* Ajouté le 5 sept. 2026 (demande : "adapter les séances selon quelle salle
   où je suis") — un jour de programme peut contenir une machine non
   disponible dans la salle actuellement sélectionnée (voir
   exerciseAvailableAtGym, profile.gyms/currentGymId). Plutôt que de bloquer
   ou de faire disparaître silencieusement l'exercice, on la remplace ICI (à
   l'affichage/au démarrage de la séance, PAS dans le programme permanent —
   même logique que removeWithSubstitution/l'ajout à la volée) par la
   meilleure machine dispo dans cette salle partageant au moins un muscle
   (voir bestCandidate) ; si aucune n'existe, l'item est gardé tel quel avec
   `gymMissing:true` pour que l'UI prévienne plutôt que de faire comme si de
   rien n'était. Sans salle sélectionnée (gymId falsy) ou sans aucune machine
   avec des gymIds restreints, retourne les items inchangés — comportement
   identique à avant cette fonctionnalité pour qui n'utilise qu'une salle. */
/* Nom de machine "normalisé" pour comparer deux entrées du matériel :
   accents et casse ignorés, mention entre parenthèses retirée ("Tirage
   Vertical (à vérifier)" et "Tirage vertical" sont la même machine), reste
   de la ponctuation réduit à des espaces. */
function normalizedExName(name){
  return stripAccents(name).replace(/\([^)]*\)/g," ").replace(/[^a-z0-9]+/g," ").trim();
}
/* Deux entrées portant le même nom sont-elles la MÊME machine ?
   Précision ajoutée le 7 sept. 2026 après retour de l'utilisateur : « je
   préfère garder les 2 machines parce que c'est pas la même marque et ça
   fait pas exactement pareil entre 2 salles ». C'est un cas parfaitement
   légitime — "Tirage vertical" est un nom générique, chaque salle a le sien,
   les charges et les réglages ne se transposent pas d'une marque à l'autre,
   et il est normal de vouloir un historique séparé. Deux marques réelles et
   différentes = deux machines, on n'y touche pas. En revanche, si l'une des
   deux n'a pas de marque (placeholder "à vérifier" du catalogue de départ,
   champ laissé vide), rien ne permet de les distinguer : c'est probablement
   la même machine saisie deux fois. */
function sameMachineLikely(a, b){
  if (!a || !b) return false;
  if (normalizedExName(a.name) !== normalizedExName(b.name)) return false;
  if (hasBrand(a) && hasBrand(b)) return stripAccents(a.brand) === stripAccents(b.brand);
  return true;
}
/* Machines du matériel qui portent le même nom normalisé — voir
   adaptDayItems et l'encadré "Doublons" de l'onglet Machines. */
function duplicateExerciseGroups(exercises){
  var by = {};
  (exercises||[]).forEach(function(e){
    var k = normalizedExName(e.name);
    if (!k) return;
    if (!by[k]) by[k] = [];
    by[k].push(e);
  });
  return Object.keys(by).filter(function(k){ return by[k].length > 1; }).map(function(k){ return by[k]; });
}
/* Adapte la journée à la salle où l'on est : une machine indisponible ici est
   remplacée par la meilleure équivalente disponible.

   CORRIGÉ le 7 sept. 2026 sur signalement (capture de l'écran Séance) : la
   version précédente traitait chaque ligne isolément, sans jamais regarder ce
   que la journée contenait déjà. Deux conséquences, toutes deux visibles à
   l'écran.

   1. Le remplaçant choisi pouvait DÉJÀ être dans la journée : on se retrouvait
      avec la même machine deux fois, dont une portant "Remplace X".
   2. Si le matériel contient deux entrées pour la MÊME machine — cas typique :
      garder "Tirage Vertical (à vérifier)" du catalogue de départ ET ajouter à
      la main le vrai "Tirage vertical" de sa salle, ce qui est exactement ce
      qui s'est produit — l'entrée fantôme n'était rattachée à aucune salle,
      donc jugée indisponible, donc remplacée par une TROISIÈME machine de dos.
      L'écran affichait alors "Upper Back — remplace Tirage vertical" juste
      au-dessus de "Tirage vertical", ce qui se contredit tout seul.

   L'ordre de résolution est maintenant : (a) si une machine du même nom est
   disponible ici, c'est la même machine, on fusionne les séries dedans ;
   (b) sinon on cherche une équivalente qui n'est pas déjà dans la journée ;
   (c) sinon, si la journée couvre déjà ce muscle principal, on y fusionne les
   séries plutôt que d'afficher une ligne fantôme ; (d) sinon seulement, on
   signale la machine comme introuvable ici. Les fusions sont plafonnées à
   MAX_SETS_PER_EXERCISE, et annoncées à l'écran. */
/* Fusionne deux entrées du matériel qui désignent la MÊME machine (voir
   duplicateExerciseGroups). keepId absorbe dropId : les salles des deux sont
   réunies (une liste vide veut dire "partout", elle l'emporte donc), toutes
   les références du programme basculent sur keepId, et si un jour se
   retrouvait avec la machine deux fois les séries sont additionnées puis
   plafonnées à MAX_SETS_PER_EXERCISE. L'historique n'est PAS réécrit : c'est
   un journal de ce qui a été fait, on n'y touche pas — c'est pour ça que
   l'écran conseille de garder l'entrée qui a déjà des séances derrière elle. */
/* Sous-ensemble des homonymes qu'il vaut VRAIMENT la peine de signaler :
   ceux que rien ne distingue (voir sameMachineLikely). Deux "Tirage vertical"
   de marques différentes ne sont plus signalés du tout. */
function likelyDuplicateGroups(exercises){
  var out = [];
  duplicateExerciseGroups(exercises).forEach(function(g){
    g.forEach(function(a, i){
      var grp = [a];
      g.forEach(function(b, j){ if (j>i && sameMachineLikely(a,b)) grp.push(b); });
      if (grp.length > 1 && !out.some(function(prev){ return prev.indexOf(a) >= 0; })) out.push(grp);
    });
  });
  return out;
}
function mergeDuplicateExercises(keepId, dropId, exercises, program){
  var keep = exercises.filter(function(e){return e.id===keepId;})[0];
  var drop = exercises.filter(function(e){return e.id===dropId;})[0];
  if (!keep || !drop || keepId===dropId) return { exercises: exercises, program: program };
  var gymIds;
  if (!keep.gymIds || !keep.gymIds.length || !drop.gymIds || !drop.gymIds.length) gymIds = [];
  else {
    gymIds = keep.gymIds.slice();
    drop.gymIds.forEach(function(g){ if (gymIds.indexOf(g)<0) gymIds.push(g); });
  }
  var nextExercises = exercises
    .filter(function(e){ return e.id!==dropId; })
    .map(function(e){ return e.id===keepId ? Object.assign({}, e, {gymIds: gymIds}) : e; });
  var nextProgram = (program||[]).map(function(d){
    var seen = null, items = [];
    d.items.forEach(function(it){
      var id = it.ex===dropId ? keepId : it.ex;
      if (id===keepId && seen) {
        seen.sets = Math.min(MAX_SETS_PER_EXERCISE, (seen.sets||0) + (it.sets||0));
        return;
      }
      var copy = Object.assign({}, it, {ex:id});
      if (id===keepId) seen = copy;
      items.push(copy);
    });
    return Object.assign({}, d, {items: items});
  });
  return { exercises: nextExercises, program: nextProgram };
}
function adaptDayItems(items, exercises, exMap, gymId) {
  if (!gymId) return items;
  var taken = {};
  var nameCount = {};
  items.forEach(function(it){
    var ex = exMap[it.ex];
    if (!ex) return;
    if (exerciseAvailableAtGym(ex, gymId)) taken[ex.id] = true;
    var k = normalizedExName(ex.name);
    if (k) nameCount[k] = (nameCount[k]||0) + 1;
  });
  var out = items.map(function(it){
    var ex = exMap[it.ex];
    if (!ex || exerciseAvailableAtGym(ex, gymId)) return Object.assign({}, it);
    /* La journée contient DÉJÀ une autre entrée du même nom : c'est la même
       machine en double dans le matériel, pas une machine à remplacer. On ne
       cherche donc aucun substitut — la passe de fusion plus bas réunit les
       deux lignes en une. Sans cette priorité, on partait chercher une
       troisième machine du même muscle et on affichait "Upper Back — remplace
       Tirage vertical" juste au-dessus du vrai Tirage vertical. */
    var key = normalizedExName(ex.name);
    if (key && nameCount[key] > 1) return Object.assign({}, it, { _absent: ex });
    var exM = allMuscles(ex);
    var candidates = exercises.filter(function(x){
      return x.id!==ex.id && !taken[x.id] && exerciseAvailableAtGym(x, gymId)
        && allMuscles(x).some(function(mu){ return exM.indexOf(mu)>=0; });
    });
    var sub = bestCandidate(candidates, exerciseOrderTier(ex), exM);
    if (sub) { taken[sub.id] = true; return Object.assign({}, it, { ex: sub.id, gymSwappedFrom: ex.name }); }
    return Object.assign({}, it, { _absent: ex });
  });
  /* Fusions, dans cet ordre :
     (a) HOMONYMES — deux lignes qui désignent la même machine, qu'elles
         soient disponibles ou non. Le cas se produit dès qu'il y a un doublon
         dans le matériel, et il prend deux formes selon la façon dont le
         doublon a été rattaché aux salles : soit une des deux entrées n'est
         dispo nulle part ici et se faisait remplacer par une TROISIÈME
         machine du même muscle, soit les deux sont dispo et la machine
         apparaissait bêtement deux fois de suite. Les deux se règlent
         pareil : une seule ligne, les séries additionnées.
     (b) machine absente sans remplaçant libre, mais dont le muscle principal
         est déjà couvert dans la journée : on y fusionne les séries plutôt
         que d'afficher une ligne inutilisable. */
  var kept = [];
  var hostByName = {};
  out.forEach(function(o){
    var ex = o._absent || exMap[o.ex];
    var key = ex ? normalizedExName(ex.name) : "";
    var host = key ? hostByName[key] : null;
    if (!host && o._absent) {
      var mu = allMuscles(o._absent)[0];
      kept.forEach(function(c){
        if (host) return;
        var ce = exMap[c.ex]; if (!ce) return;
        if (allMuscles(ce)[0] === mu) host = c;
      });
    }
    if (host) {
      /* Laquelle des deux entrées survit ? Celle qui est RÉELLEMENT
         disponible ici — sinon la séance serait enregistrée sur l'entrée
         fantôme et l'historique de la machine se couperait en deux. Le
         placeholder du catalogue de départ, rattaché à aucune des salles
         d'aujourd'hui, cède donc sa place à la vraie machine même s'il
         apparaissait en premier dans la journée. */
      var hostEx = host._absent || exMap[host.ex];
      /* Score de "c'est celle-là, la vraie" : explicitement rattachée à la
         salle où l'on est (2) > disponible partout, donc sans rattachement
         (1) > pas dispo ici (0) ; à égalité, celle qui porte une vraie marque
         plutôt qu'un placeholder du catalogue de départ. */
      function realness(e, item){
        if (!e) return -1;
        var sc = 0;
        if (item && (item._absent || item.gymMissing)) sc = 0;
        else if (e.gymIds && e.gymIds.length) sc = e.gymIds.indexOf(gymId)>=0 ? 2 : 0;
        else sc = 1;
        return sc + (hasBrand(e) ? 0.5 : 0);
      }
      var absorbed;
      if (realness(ex, o) > realness(hostEx, host)) {
        absorbed = hostEx;
        host.ex = o.ex;
        delete host._absent;
        delete host.gymMissing;
        delete host.gymSwappedFrom;
      } else {
        absorbed = ex;
      }
      host.sets = Math.min(MAX_SETS_PER_EXERCISE, (host.sets||0) + (o.sets||0));
      var keptEx = exMap[host.ex];
      /* Trois formulations distinctes, parce que ce sont trois situations
         différentes et que les confondre induit en erreur (corrigé le
         7 sept. 2026) :
         - vrai doublon (rien ne distingue les deux entrées) → à ranger ;
         - même nom mais marque différente → l'équivalent d'une autre salle,
           parfaitement légitime, il n'y a RIEN à corriger ;
         - machine sans équivalent libre, repli sur le même muscle. */
      var label = null;
      if (absorbed) {
        if (keptEx && sameMachineLikely(absorbed, keptEx)) label = "__SAME__";
        else if (keptEx && normalizedExName(absorbed.name) === normalizedExName(keptEx.name))
          label = "__ALT__" + (hasBrand(absorbed) ? absorbed.brand : "sans marque");
        else label = absorbed.name;
      }
      if (label) host.gymMergedFrom = host.gymMergedFrom ? (host.gymMergedFrom + ", " + label) : label;
      return; /* la ligne en trop disparaît */
    }
    if (o._absent) { delete o._absent; o.gymMissing = true; }
    if (key) hostByName[key] = o;
    kept.push(o);
  });
  return kept;
}
/* Séries/reps/repos à proposer quand on remplace oldEx par newEx dans le
   programme, quel que soit l'endroit d'où vient la demande (bouton "Changer
   de machine" en Séance, ou suggestion de remplacement sur un exercice
   bloqué en Analyse — les deux doivent s'adapter pareil, sinon un des deux
   chemins garde un ancien réglage qui ne correspond plus à la machine).
   Même palier (poly/semi/iso) que l'exercice remplacé : le réglage déjà en
   place reste pertinent, pas de raison d'y toucher. Palier différent : on
   repart des repères par palier ET par objectif (GOAL_PRESETS ci-dessus),
   plutôt que de garder des reps/repos pensés pour un autre type de
   mouvement. Le nombre de séries en cours (sampleItem.sets) est conservé
   même en cas de palier différent, seuls reps/repos changent — on ne
   réduit pas le volume programmé juste parce que la machine change. */
function swapRecommendation(oldEx, newEx, program, goal) {
  var oldTier = exerciseOrderTier(oldEx), newTier = exerciseOrderTier(newEx);
  var sampleItem = null;
  program.some(function(d){ var it = d.items.find(function(x){return x.ex===oldEx.id;}); if (it) { sampleItem = it; return true; } return false; });
  var d2 = tierDefaultsForGoal(goal, newTier);
  return (newTier === oldTier && sampleItem)
    ? { sets: sampleItem.sets, min: sampleItem.min, max: sampleItem.max, rest: sampleItem.rest }
    : { sets: sampleItem ? sampleItem.sets : d2.sets, min: d2.min, max: d2.max, rest: d2.rest };
}
/* ============================================================

   l'utilisateur (perte de gras, hypertrophie, force, et les 3 associations
   entre deux de ces trois). "loss_hyper" reste la valeur par défaut ET
   reste EXACTEMENT ce qui était déjà en place avant ce menu (recomposition,
   voir l'audit dans la conversation) — volontairement non retouché ici,
   même si une source plus bas suggère qu'un repos un peu plus long
   profiterait aussi à ce preset (voir note repos).

   Sources vérifiées pour les 5 autres presets (recherchées et lues pour ce
   changement, pas des chiffres inventés) :
   - Force — charge/volume : mise à jour ACSM 2026 des recommandations de
     musculation (première révision en 17 ans) : force ≈ ≥80% 1RM, 2-3
     séries/exercice. ≥80% 1RM correspond conventionnellement à une zone
     d'environ 4-6 répétitions avant échec technique. Repos : la convention
     de longue date (NSCA Essentials of Strength Training, ACSM) pour des
     charges quasi-maximales reste 2-5 min, pour permettre une récupération
     quasi complète de la filière ATP-PC entre séries — pas de remise en
     cause récente trouvée sur ce point précis.
   - Hypertrophie — charge/volume : la même mise à jour ACSM 2026 constate
     que l'hypertrophie se produit sur une large plage de charges (30-100%
     1RM) tant que l'effort est suffisant (proche de l'échec) — donc le "rep
     range hypertrophie 6-12" n'est plus considéré comme une zone magique,
     plutôt une zone pratique parmi d'autres qui marchent aussi bien ;
     volume cible ≥10 séries/muscle/semaine (repère qui s'applique au volume
     hebdomadaire total, voir VOL_MIN/VOL_MAX/plannedVolume — les tiers
     ci-dessous ne fixent que le point de départ par exercice).
   - Repos et hypertrophie : une méta-analyse bayésienne récente (Robinson
     et al., Frontiers in Sports and Active Living, 2024, "Give it a Rest")
     trouve un léger avantage hypertrophique aux repos >60s, sans bénéfice
     supplémentaire net au-delà de ~90s — ce qui va à l'encontre de l'ancien
     repère NSCA "30-90s pour l'hypertrophie". Preuve qualifiée de faible
     certitude par les auteurs eux-mêmes (intervalles crédibles larges,

     60s", pas comme une règle stricte.
   - Perte de gras — déficit : revue Helms/Aragon/Fitschen 2014 (contest
     prep naturel). Converti en kcal/jour pour CE profil (poids actuel dans
     l'appli, ~85,1 kg) avec l'équivalence usuelle ~7700 kcal/kg de masse
     grasse : 0,5%/sem ≈ 470 kcal/j, 0,7%/sem ≈ 650 kcal/j, 1%/sem ≈ 935
     kcal/j — des ordres de grandeur, pas des chiffres validés au kg près.

     RAMENÉ DE 925 À 650 kcal/j LE 12 SEPT. 2026, en revérifiant les six
     objectifs source par source. Le commentaire précédent présentait 1%/sem
     comme "le haut d'une fourchette 0,5-1%" que viserait légitimement un
     preset orienté vitesse. En relisant les textes eux-mêmes, ce n'est pas

     vitesses "moins extrêmes" — 0,5 kg/semaine ou 0,7% de la masse
     corporelle — comme étant les plus protectrices de la masse maigre, et
     la revue plus récente des mêmes auteurs sur les athlètes de physique

     la masse corporelle par semaine. 1%/sem n'est donc pas "le haut d'une
     plage recommandée", c'est au-delà de ce que ces sources conseillent.

     proches d'un schéma hypertrophie générique plutôt que d'inventer un rep

   - Protéines en déficit : CONVERGENCE de deux sources indépendantes — la
     position de l'ISSN "Diets and Body Composition" (Aragon et al. 2017) et

     construire ET préserver en même temps.

     maintenance. La version précédente mettait ces 3 presets à déficit 0
     en expliquant qu'"une vraie prise de masse bénéficierait d'un léger
     surplus mais l'appli n'a qu'un curseur de déficit (0-600 kcal)" — ce
     n'est plus vrai : le curseur "Déficit calorique" (Options) accepte
     maintenant aussi des valeurs négatives, interprétées comme un surplus

     valeur négative ajoute au lieu de soustraire — aucun changement de
     formule nécessaire, juste la plage du curseur et son affichage).
     Source pour la TAILLE du surplus : Oranchuk, Helms & Spence et al.
     2023, Sports Medicine - Open, "Effect of Small and Large Energy
     Surpluses on Strength, Muscle, and Skinfold Thickness in
     Resistance-Trained Individuals: A Parallel Groups Design" — ESSAI

     (1RM développé couché) des 3 groupes, devant la maintenance ET devant
     le gros surplus ; l'épaisseur musculaire n'a PAS différé
     significativement entre les 3 groupes (un surplus plus gros ne
     construit pas plus de muscle) ; la prise de gras (plis cutanés) était
     plus élevée dans les 2 groupes en surplus que maintenance. Conclusion
     des auteurs : une prise de poids plus rapide (donc un plus gros
     surplus) augmente surtout la vitesse de prise de poids, pas le gain de
     muscle ni de force. D'où le choix ici d'un surplus modéré (~5% du
     TDEE, ≈125 kcal/j pour ce profil à ~2430 kcal de TDEE en mode "DER +
     pas + séances") pour les 3 presets ci-dessous, plutôt que la
     maintenance d'avant ou un surplus plus large. Nuance à garder en tête :
     Slater et al. 2019 (Frontiers in Nutrition, "Is an Energy Surplus
     Required to Maximize Skeletal Muscle Hypertrophy...") notent que la
     taille de surplus qui maximiserait spécifiquement l'hypertrophie
     restait, au moment de leur revue, non validée expérimentalement — ce
     choix de 5% s'appuie donc sur l'essai contrôlé le plus direct trouvé à
     ce jour sur cette question précise (2023, postérieur à cette revue),
     pas sur un consensus ancien et large. Protéines dans ces 3 cas :
     ~1,8-1,9 g/kg de poids total, cohérent à la fois avec le seuil
     ≥1,6 g/kg validé par méta-analyse (Morton et al. 2018) pour la prise de
     masse maigre, et avec la fourchette 1,8-2,7 g/kg que Iraki et al. 2019
     (Sports, "Nutrition Recommendations for Bodybuilders in the
     Off-Season") donnent pour la phase de prise de masse SPÉCIFIQUEMENT —
     cette revue trouve la même fourchette qu'en cutting, donc pas de
     majoration "cutting" à retirer ici, elle n'existait déjà pas.

     sur les 6 presets — c'est un reflet du mode de vie (niveau d'activité
     hors entraînement), pas de l'objectif d'entraînement ; le faire varier
     par objectif n'aurait aucune justification.

     mode d'entraînement"). Vérifié en recalculant plannedVolume sur le
     programme réel pour les 6 objectifs : "loss_hyper" (tier 3 à 4 séries
     au lieu de 3, hérité tel quel de l'ancien réglage historique
     pré-presets) et "loss_strength" (tier 1 à 4 séries au lieu de 3,
     ajouté sans vérifier cet effet de bord) donnaient 1 série de PLUS à un
     seul palier — or les muscles de ce catalogue sont chacun entraînés par
     un mélange FIXE et différent de paliers (Dos = 100% poly, Ischio-
     jambiers = 100% semi-isolation, Adducteurs = 100% isolation,
     Pectoraux/Épaules/Quadriceps = mélange) : donner un bonus à UN palier
     précis avantage mécaniquement les muscles qui tombent sur ce palier,
     UNIQUEMENT quand cet objectif est actif. Aucune source trouvée ne
     justifie de faire varier le NOMBRE DE SÉRIES selon poly/semi/isolation
     (contrairement aux reps/repos, qui en dépendent bien, voir ACSM 2026 /
     Robinson 2024 cités plus haut) — seul le nombre de séries total par
     objectif a une base dans la littérature. Les 6 presets donnent donc
     maintenant le même nombre de séries sur les 3 paliers (seuls reps et
     repos restent différents par palier, partout) : un changement
     d'objectif fait donc varier le volume de TOUS les muscles dans la
     même proportion, sans avantager tel ou tel muscle selon son mélange de
