  }); });
  refs.forEach(function(ref){ ref.muscles.forEach(function(m){ achieved[m.mu] += ref.base*m.w; }); });
  /* Remplace le point de départ par le volume RÉELLEMENT fait pour les muscles
     dont on a la mesure (converti séries/semaine -> séries par tour complet de
     rotation, mêmes unités que `achieved`). Les muscles absents de la mesure
     gardent l'hypothèse catalogue calculée juste au-dessus. */
  if (baselineByMuscle) {
    Object.keys(achieved).forEach(function(mu){
      if (baselineByMuscle[mu] != null) achieved[mu] = baselineByMuscle[mu] / factor;
    });
  }

  /* "Équilibre" prioritaire sur "objectif" (voir PRIORITY_KEYS) : dès qu'un
     muscle ne PEUT plus progresser (catalogue insuffisant, ou toutes ses
     machines au plafond), on arrête aussi les autres à SON niveau plutôt que
     de les laisser filer jusqu'à leur cible. Résultat : tout le monde au même
     pourcentage de sa cible, personne devant. Avec l'ordre inverse (par
     défaut), chaque muscle va aussi haut qu'il peut indépendamment — d'où des
     écarts quand une machine manque quelque part. */
  var bounds = setsBoundsForGoal(goal);
  var order = priorityOrderOf({priorityOrder: priorityOrder});
  var balanceFirst = priorityRank(order,"balance") < priorityRank(order,"goal");
  var MAX_ROUNDS = 4000; // filet de sécurité — converge toujours bien avant (voir la note ci-dessus)
  var blocked = {}; // muscles qu'aucune machine disponible ne peut plus servir (voir bug 3 ci-dessus)
  for (var round = 0; round < MAX_ROUNDS; round++) {
    var worstMu = null, worstRatio = 1;
    Object.keys(needed).forEach(function(mu){
      if (needed[mu] <= 0 || blocked[mu]) return;
      var ratio = achieved[mu] / needed[mu];
      if (ratio < worstRatio - 1e-9) { worstRatio = ratio; worstMu = mu; }
    });
    if (worstMu == null) break; // tous les muscles servables ont atteint leur cible

    /* Départage lexicographique, du plus important au moins important :
       1) poids le plus FORT du muscle visé sur cette machine (la plus dédiée) ;
       2) à poids égal, la machine la MOINS chargée jusqu'ici -> répartition
          en alternance au lieu de l'empilement (bug 1) ;
       3) à charge égale, celle dont les AUTRES muscles sont le plus en retard
          (l'ajout sert double emploi au lieu d'être un pur effet de bord) ;
       4) sinon l'ordre du catalogue, pour rester déterministe. */
    var best = null, bestW = -1, bestSets = Infinity, bestOtherNeed = -1;
    refs.forEach(function(ref){
      var m = null;
      for (var k=0; k<ref.muscles.length; k++) { if (ref.muscles[k].mu===worstMu) { m = ref.muscles[k]; break; } }
      if (!m || m.w <= 1e-9) return;                            // garde-fou poids nul (bug 3)
      if (ref.base + ref.extra >= bounds.max) return; // plafond par exercice, propre à l'objectif (bug 2)
      var sets = ref.base + ref.extra;
      var otherNeed = 0;
      ref.muscles.forEach(function(mm){
        if (mm.mu===worstMu) return;
        var r = needed[mm.mu] ? achieved[mm.mu]/needed[mm.mu] : 1;
        otherNeed += Math.max(0, 1-r);
      });
      var better;
      if (best === null) better = true;
      else if (Math.abs(m.w-bestW) > 1e-9) better = m.w > bestW;
      else if (sets !== bestSets) better = sets < bestSets;
      else better = otherNeed > bestOtherNeed + 1e-9;
      if (better) { best = ref; bestW = m.w; bestSets = sets; bestOtherNeed = otherNeed; }
    });
    /* Plus aucune machine disponible pour ce muscle (catalogue insuffisant, ou
       toutes déjà au plafond par exercice) : on le marque bloqué et on CONTINUE
       avec les autres au lieu d'arrêter toute la redistribution (bug 3). Le
       manque restant est visible dans le Score d'optimisation, et expliqué par
       cappedMuscles ci-dessous. */
    if (!best) { blocked[worstMu] = true; continue; }
    best.extra += 1;
    best.muscles.forEach(function(m){ achieved[m.mu] += m.w; });
  }

  /* PASSE DE RETRAIT — ajoutée le 6 sept. 2026 en réponse directe à "pourquoi
     c'est pas équilibré, regarde le screen" (triceps à 15,0 pour une cible de
     12, pendant que les abducteurs plafonnaient à 5,0).

     Diagnostic reproduit exactement : sur ce programme, le triceps reçoit 9
     séries/semaine en pur EFFET DE BORD — il est secondaire à 0,5× sur les six
     machines de poussée (Chest Press, Wide Chest Press, Développé du Tronc ×2,
     Shoulder Press, Développé des Épaules), qui montent chacune pour servir
     LEUR muscle principal. S'y ajoutent les 6 séries des deux créneaux
     "Extension des Triceps" du programme, d'où 15. L'algorithme n'attribuait
     pourtant aucune série au triceps : il n'en ajoute jamais à un muscle déjà
     au-dessus de sa cible. Le problème est qu'il n'en RETIRAIT jamais non plus
     — chaque machine gardait au minimum les séries de son palier
     (tierDefaultsForGoal), même devenues redondantes.

     Cette passe retire donc des séries tant qu'AUCUN muscle ne repasse sous sa
     cible : à chaque tour, la machine dont tous les muscles ont le plus de
     marge perd une série. Un dépassement ne peut jamais être corrigé au prix
     d'un manque ailleurs, et on ne descend jamais sous MIN_SETS_PER_EXERCISE.
     Concrètement ici, un des deux créneaux de triceps passe à 1 série : ce
     n'est pas une erreur d'affichage mais le bon nombre — tes machines de
     poussée couvrent déjà les trois quarts du travail de triceps. */
  /* ÉQUILIBRAGE FIN — remplace le 6 sept. 2026 la simple "passe de retrait",
     après un nouveau signalement ("pourquoi c'est pas équilibré comme il
     faut", capture à l'appui : épaules 146% de la cible, dos et biceps 125%,
     pendant qu'obliques, avant-bras et abducteurs restaient sous 70%).

     Deux limites de la version précédente, toutes deux visibles sur cet
     exemple :
     1) La construction gloutonne servait le muscle le plus en retard sans
        jamais regarder le DÉPASSEMENT qu'elle créait au passage sur les autres
        muscles de la même machine. Or les muscles sont fortement couplés
        depuis l'ajout des secondaires : monter les pectoraux monte aussi les
        épaules (0,75× sur chaque développé), monter le dos monte aussi les
        biceps et les trapèzes. Le déséquilibre était donc fabriqué par
        l'algorithme lui-même.
     2) La passe de retrait n'acceptait d'enlever une série que si AUCUN muscle
        ne repassait sous sa cible. Dès qu'une machine touchait un muscle déjà
        en retard — le cas de presque toutes, ici — elle devenait intouchable,
        et un dépassement de 46% ne pouvait plus jamais être corrigé.

     Remplacé par une recherche locale qui optimise directement ce qu'on veut :
     l'écart global aux cibles. Chaque muscle contribue au coût par son écart
     relatif au carré, avec un poids plus fort quand il est SOUS sa cible que
     quand il la dépasse — manquer du volume prive d'un stimulus, en faire un
     peu trop ne coûte que du temps (aucun bénéfice supplémentaire démontré
     au-delà de la cible, voir GOAL_PRESETS et Remmert et al. 2025). À chaque
     tour on essaie ±1 série sur chaque machine et on applique le meilleur
     mouvement tant qu'il améliore l'équilibre ; les bornes par exercice
     restent des contraintes dures. Un retrait qui fait descendre un muscle un
     peu sous sa cible est donc désormais possible, mais SEULEMENT s'il corrige
     un déséquilibre plus grand ailleurs — ce que l'ancienne règle interdisait
     par principe. Départ depuis le résultat glouton ci-dessus, qui reste une
     bonne initialisation. */
  /* Poids asymétriques : être SOUS sa cible coûte beaucoup plus cher que la
     dépasser. Sans ça (essai à 1,0 / 0,5), la recherche locale acceptait de
     faire descendre un muscle pile à sa cible juste en dessous pour rogner le
     dépassement d'un autre — un mauvais échange quand l'objectif
     d'entraînement est la priorité n°1. En mode "équilibre d'abord", les deux
     poids s'égalisent : là, niveler compte autant que d'atteindre. */
  /* "Objectif d'abord" (3,0 / 0,5) : sacrifier un muscle déjà à sa cible pour
     rogner le dépassement d'un autre est un mauvais échange, donc le manque
     coûte six fois plus cher que l'excès. "Équilibre d'abord" (1,0 / 1,0) :
     manque et excès pèsent pareil, l'appli accepte donc de descendre un muscle
     un peu sous sa cible si ça rapproche l'ensemble — c'est exactement le
     compromis que ce mode annonce. */
  var UNDER_W = balanceFirst ? 1.0 : 3.0, OVER_W = balanceFirst ? 1.0 : 0.5;
  /* Simplifié le 6 sept. 2026 : "équilibre d'abord" était implémenté en
     rabattant les cibles au niveau du muscle le plus contraint. Mesuré, ça
     donnait l'inverse de l'effet voulu depuis que le minimum par exercice est
     à 3 séries — les cibles effectives descendaient si bas que presque tout se
     retrouvait "au-dessus", tout était rogné jusqu'au plancher, et l'écart
     entre muscles s'ÉLARGISSAIT (1,00 contre 0,93 en mode objectif). La
     différence entre les deux priorités tient maintenant uniquement aux poids
     de la recherche locale ci-dessous, ce qui est à la fois plus simple et
     réellement conforme à ce que chaque mode annonce. */
  var effNeeded = needed;
  function pen(a, n){ if (!(n > 0)) return 0; var d = (a-n)/n; return d < 0 ? UNDER_W*d*d : OVER_W*d*d; }
  function moveGain(ref, delta){
    var g = 0;
    for (var i=0;i<ref.muscles.length;i++){
      var m = ref.muscles[i], n = effNeeded[m.mu];
      if (!(n > 0)) continue;
      g += pen(achieved[m.mu], n) - pen(achieved[m.mu] + delta*m.w, n);
    }
    return g; // > 0 = amélioration
  }
  for (var t = 0; t < MAX_ROUNDS; t++) {
    var bestRef = null, bestDelta = 0, bestGain = 1e-9;
    for (var r = 0; r < refs.length; r++) {
      var ref = refs[r], sets = ref.base + ref.extra;
      if (sets > bounds.min) {
        var gm = moveGain(ref, -1);
        if (gm > bestGain) { bestGain = gm; bestRef = ref; bestDelta = -1; }
      }
      if (sets < bounds.max) {
        var gp = moveGain(ref, +1);
        if (gp > bestGain) { bestGain = gp; bestRef = ref; bestDelta = +1; }
      }
    }
    if (!bestRef) break;
    bestRef.extra += bestDelta;
    bestRef.muscles.forEach(function(m){ achieved[m.mu] += bestDelta*m.w; });
  }

  var byIt = new Map(); refs.forEach(function(ref){ byIt.set(ref.it, ref); });
  return program.map(function(d){
    return Object.assign({}, d, { items: d.items.map(function(it){
      var ref = byIt.get(it);
      if (!ref) { var ex = exMap[it.ex]; var tierDef = tierDefaultsForGoal(goal, ex?exerciseOrderTier(ex):2);
        return Object.assign({}, it, { sets: tierDef.sets, min: tierDef.min, max: tierDef.max, rest: tierDef.rest }); }
      var ex2 = exMap[it.ex];
      var tierDef2 = tierDefaultsForGoal(goal, ex2 ? exerciseOrderTier(ex2) : 2);
      return Object.assign({}, it, { sets: ref.base + ref.extra, min: tierDef2.min, max: tierDef2.max, rest: tierDef2.rest });
    }) });
  });
}
/* Applique après coup, sur le programme fraîchement redistribué ci-dessus,
   le plafond par-séance issu de Remmert et al. 2025 (voir capSessionVolume
   plus haut) — jamais avant, pour que le calcul du déficit hebdomadaire
   parte bien des séries de palier normales, pas d'une base déjà tronquée. */
/* `profile` (optionnel, ajouté le 6 sept. 2026) : sert uniquement à lire
   l'ordre de priorité choisi (voir PRIORITY_KEYS) et, si "temps" passe devant
   "objectif", la durée de séance à ne pas dépasser. Omis -> comportement
   d'avant : priorité par défaut (objectif > équilibre > temps) et aucun
   plafond de durée, comme demandé le 6 sept. 2026 ("dépasser le temps visé
   plutôt que rogner l'équilibrage"). Ce choix reste le défaut ; il devient
   simplement réglable. */
function applyGoalToProgram(program, exercises, goal, avgSessions, muscleFocus, profile) {
  var order = priorityOrderOf(profile);
  var out = capSessionVolume(
    _applyGoalToProgramRaw(program, exercises, goal, avgSessions, muscleFocus, null, order),
    exercises, goal);
  if (profile && priorityRank(order,"time") < priorityRank(order,"goal")) {
    out = trimToTimeBudget(out, exercises, profile.sessionMinutesMax, goal);
  }
  return clampSetsToBounds(out, goal);
}
/* Garde-fou final, ajouté le 6 sept. 2026 après le bug du plafond par séance
   qui ramenait des machines à 1 série : quatre fonctions différentes écrivent
   le nombre de séries (_applyGoalToProgramRaw, capSessionVolume,
   trimToTimeBudget, recalibrateProgramFromHistory), et il a suffi qu'UNE
   d'elles garde un plancher codé en dur pour défaire silencieusement la règle.
   Plutôt que de compter sur la vigilance à chaque ajout futur, l'invariant est
   maintenant appliqué une fois pour toutes à la sortie. Ne concerne que les
   programmes calculés par l'appli : une valeur réglée à la main dans
   "Composer les séances" ne passe pas par ici (voir persistConfig,
   reoptimize:false) et reste donc libre. */
function clampSetsToBounds(program, goal) {
  var b = setsBoundsForGoal(goal);
  var touched = false;
  var out = program.map(function(d){
    return Object.assign({}, d, { items: d.items.map(function(it){
      var n = Math.max(b.min, Math.min(b.max, it.sets));
      if (n === it.sets) return it;
      touched = true;
      return Object.assign({}, it, { sets: n });
    }) });
  });
  return touched ? out : program;
}
/* "Temps" prioritaire sur "objectif" (voir PRIORITY_KEYS) : on retire des
   séries jusqu'à ce que la séance la plus longue tienne dans la durée visée.
   C'est l'inverse exact du comportement par défaut, où l'appli dépasse le
   temps plutôt que de rogner le volume — d'où le fait que ce soit un choix
   explicite de l'utilisateur et jamais une décision de l'app.
   On retire toujours la série de la machine la PLUS chargée de la journée la
   plus longue : c'est là que ça coûte le moins par série perdue, et ça évite
   de vider une machine pendant qu'une autre en garde cinq. */
function trimToTimeBudget(program, exercises, maxMinutes, goal) {
  if (!(maxMinutes > 0)) return program;
  var floor = setsBoundsForGoal(goal).min;
  var exMap = {}; exercises.forEach(function(e){ exMap[e.id]=e; });
  var days = program.map(function(d){ return Object.assign({}, d, { items: d.items.map(function(it){ return Object.assign({}, it); }) }); });
  /* `done` : jours qu'on ne peut plus raccourcir (toutes leurs machines au
     plancher). Sans ça, tomber sur un tel jour arrêtait TOUTE la réduction —
     les autres jours, eux encore réductibles, restaient trop longs. Même motif
     d'abandon prématuré que celui corrigé dans _applyGoalToProgramRaw. */
  var done = {};
  for (var guard = 0; guard < 2000; guard++) {
    var worst = null, worstMin = -1;
    days.forEach(function(d){
      if (done[d.key]) return;
      var m = estimateDayMinutes(d, exMap);
      if (m > maxMinutes && m > worstMin) { worstMin = m; worst = d; }
    });
    if (!worst) break;
    var target = null;
    worst.items.forEach(function(it){
      if (it.sets <= floor) return;
      if (!target || it.sets > target.sets) target = it;
    });
    if (!target) { done[worst.key] = true; continue; } // ce jour est au minimum, on passe au suivant
    target.sets -= 1;
  }
  return days;
}
/* Ajouté le 6 sept. 2026, en même temps que MAX_SETS_PER_EXERCISE (voir la
   note sur _applyGoalToProgramRaw) : quand un muscle reste sous sa cible
   hebdomadaire UNIQUEMENT parce que toutes les machines qui le travaillent
   dans le programme sont déjà au plafond par exercice, le Score
   d'optimisation affichait un pourcentage bas sans dire pourquoi ni quoi
   faire — l'utilisateur ne pouvait pas deviner que le blocage vient du
   nombre de MACHINES placées dans le programme, pas d'un réglage.

   Cette fonction est PURE et travaille sur le programme déjà appliqué : pour
   chaque muscle sous sa cible, elle regarde si tous les exercices du
   programme qui le sollicitent sont au plafond. Si oui, elle renvoie de quoi
   afficher un diagnostic actionnable ("2 machines de dos déjà à 5 séries :
   ajoute-en une 3e"). Sinon le muscle n'apparaît pas — son manque a une autre
   cause (priorité baissée, plafond par séance, catalogue vide pour ce muscle),
   déjà signalée ailleurs. */
function cappedMuscles(appliedProgram, exercises, goal, avgSessions, muscleFocus) {
  var exMap = {}; exercises.forEach(function(e){ exMap[e.id]=e; });
  var baseTarget = goalPreset(goal).targetSets || VOL_MIN;
  var vol = plannedVolume(appliedProgram, exercises, avgSessions);
  var itemsByMuscle = {};
  appliedProgram.forEach(function(d){ d.items.forEach(function(it){
    var ex = exMap[it.ex]; if (!ex) return;
    allMuscles(ex).forEach(function(mu){ (itemsByMuscle[mu] = itemsByMuscle[mu]||[]).push(it); });
  }); });
  var out = [];
  vol.forEach(function(v){
    var target = baseTarget * focusMultiplier(muscleFocus, v.muscle);
    if (v.sets >= target - 0.05) return;               // cible atteinte, rien à expliquer
    var items = itemsByMuscle[v.muscle] || [];
    if (!items.length) return;                          // aucune machine : autre diagnostic
    var atCap = items.filter(function(it){ return it.sets >= setsBoundsForGoal(goal).max; }).length;
    if (atCap < items.length) return;                   // il reste de la marge : le manque vient d'ailleurs
    out.push({ muscle: v.muscle, sets: v.sets, target: Math.round(target*10)/10, machines: items.length });
  });
  return out;
}

/* Simule (SANS RIEN PERSISTER) ce que donnerait un objectif + un nombre de
   séances/semaine donnés sur CE catalogue de machines : durée moyenne de
   séance et fréquence réelle par muscle. Ajouté le 5 sept. 2026 suite à la
   discussion "combien de séances par semaine pour être opti" — plutôt que de
   deviner un chiffre générique, l'appli calcule la vraie réponse pour TON
   programme actuel et l'affiche dans Options (voir OptionsTab > repère
   "séances recommandées"). Pure fonction, ne modifie ni program ni exercises
   — applyGoalToProgram est déjà pur (retourne un nouveau tableau), donc
   l'appeler ici pour prévisualiser est sans risque. */
function previewSessionStats(program, exercises, goal, avgSessions, muscleFocus) {
  var simulated = applyGoalToProgram(program, exercises, goal, avgSessions, muscleFocus);
  var exMap = {}; exercises.forEach(function(e){ exMap[e.id]=e; });
  var dayMinutes = simulated.map(function(d){ return estimateDayMinutes(d, exMap); });
  var avgDayMin = dayMinutes.length ? Math.round(dayMinutes.reduce(function(a,b){return a+b;},0) / dayMinutes.length) : 0;
  var vol = plannedVolume(simulated, exercises, avgSessions);
  var avgFreq = vol.length ? vol.reduce(function(a,v){return a+v.freq;},0) / vol.length : 0;
  var minFreqActual = vol.length ? Math.min.apply(null, vol.map(function(v){return v.freq;})) : 0;
  return { avgDayMin: avgDayMin, avgFreq: avgFreq, minFreqActual: minFreqActual };
}
/* Ajouté le 5 sept. 2026 (demande : "temps par séance min-max... conseille ce
   qu'il faudrait pour être opti") — il n'existe pas de durée de séance
   plafond validée par la littérature (voir OptionsTab > info-bulle "Temps
   par séance" ; le mythe des 45-60 min lié au cortisol est réfuté par de
   larges cohortes, ex. West & Phillips 2012, qui ne trouvent aucun lien
   entre réponse hormonale aiguë et gains à long terme). Ce qui pilote
   vraiment la durée, c'est le nombre de séries à faire pour la cible
   hebdomadaire (GOAL_PRESETS.targetSets) réparti sur le nombre de séances/
   semaine (voir previewSessionStats) : plus de séances/semaine, à volume
   hebdo égal, donne des séances plus courtes. Cette fonction cherche le plus
   petit avgSessions (pas de 0.5, de 2 à 7×/semaine) qui ramène la durée
   moyenne simulée sous maxMinutes SUR TON catalogue de machines actuel — pas
   une estimation générique. Retourne null si même 7×/semaine ne suffit pas
   (catalogue trop limité en machines pour ce muscle, ou plafond trop bas). */
function sessionsNeededForMaxMinutes(program, exercises, goal, maxMinutes, muscleFocus) {
  for (var n=2; n<=7; n+=0.5) {
    if (previewSessionStats(program, exercises, goal, n, muscleFocus).avgDayMin <= maxMinutes) return n;
  }
  return null;
}
/* Ajouté le 5 sept. 2026 (demande : "à chaque réglage de nb de séances et
   temps par séance, il faut que ce soit les séances les plus opti... et
   équilibré") — jusqu'ici, "Appliquer aux séances actuelles" (voir
   reapplyGoalToProgram dans OptionsTab) utilisait toujours le MILIEU de la
   fourchette séances/semaine (avgSessionsPerWeek), sans tenir compte du temps
   par séance visé (sessionMinutesMin/Max) : deux réglages affichés côte à
   côte dans Options mais jamais réellement combinés au moment d'appliquer.
   Cette fonction cherche, PARMI les fréquences comprises DANS la fourchette
   séances/semaine réglée par l'utilisateur (contrairement à
   sessionsNeededForMaxMinutes ci-dessus, qui teste jusqu'à 7×/semaine même
   hors fourchette, à titre de diagnostic seulement) :
     1) celle qui tombe dans la fourchette temps/séance visée, si au moins une
        le permet ;
     2) parmi celles-là, en priorité la plus HAUTE qui respecte aussi le
        repère fréquence/muscle de l'objectif (goalPreset.minFreq) — une
        fréquence plus haute à volume hebdomadaire égal répartit mieux les
        séries (voir Ralston et al. 2018 ; Pelland et al. 2025, déjà cités
        dans l'info-bulle "Séances par semaine") ;
     3) si aucune fréquence de la fourchette ne respecte le repère fréquence,
        celle qui s'en approche le plus (minFreqActual le plus élevé) ;
     4) si aucune fréquence de la fourchette ne tombe dans la fenêtre de
        temps visée, la moins mauvaise (distance minimale à cette fenêtre) —
        reste un point de départ actionnable plutôt que de ne rien proposer.
   Volontairement, ça ne réorganise JAMAIS quel exercice est sur quel jour du
   programme (l'ordre reste celui choisi manuellement dans Programme) : ça
   ajuste uniquement séries/reps/repos par machine via applyGoalToProgram, qui
   répartit déjà l'effort équitablement entre TOUS les muscles sollicités
   (voir allMuscles/muscleWeight) — l'"équilibre" demandé porte sur le volume
   par muscle sur la semaine, pas sur une réorganisation des séances. Pure
   fonction : ne modifie ni program ni exercises. */
function pickOptimalAvgSessions(program, exercises, goal, sessionsMin, sessionsMax, minutesMin, minutesMax, muscleFocus) {
  var lo = Math.min(sessionsMin||0, sessionsMax||0);
  var hi = Math.max(sessionsMin||0, sessionsMax||0);
  if (!(hi > 0)) { lo = 2; hi = 4; }
  if (!(lo > 0)) lo = hi;
  var minFreq = goalPreset(goal).minFreq || 1;
  var candidates = [];
  for (var n = lo; n < hi - 1e-9; n += 0.5) candidates.push(n);
  candidates.push(hi);
  var scored = candidates.map(function(n){
    var stats = previewSessionStats(program, exercises, goal, n, muscleFocus);
    var inWindow = stats.avgDayMin >= (minutesMin||0) && stats.avgDayMin <= (minutesMax==null?9999:minutesMax);
    var meetsFreq = stats.minFreqActual >= minFreq - 0.01;
    return { n:n, stats:stats, inWindow:inWindow, meetsFreq:meetsFreq };
  });
  var inWinAndFreq = scored.filter(function(s){ return s.inWindow && s.meetsFreq; });
  if (inWinAndFreq.length) return inWinAndFreq.sort(function(a,b){ return b.n-a.n; })[0];
  var inWin = scored.filter(function(s){ return s.inWindow; });
  if (inWin.length) return inWin.sort(function(a,b){ return b.stats.minFreqActual - a.stats.minFreqActual; })[0];
  var mx = minutesMax==null?9999:minutesMax, mn = minutesMin||0;
  return scored.slice().sort(function(a,b){
    var da = a.stats.avgDayMin > mx ? a.stats.avgDayMin-mx : (mn-a.stats.avgDayMin);
    var db = b.stats.avgDayMin > mx ? b.stats.avgDayMin-mx : (mn-b.stats.avgDayMin);
    return da - db;
  })[0];
}

function applySwap(oldExId, newExId, program, overrides) {
  return program.map(function(d){
    return Object.assign({}, d, { items: d.items.map(function(it){
      if (it.ex !== oldExId) return it;
      var patch = { ex: newExId };
      if (overrides) { patch.sets = overrides.sets; patch.min = overrides.min; patch.max = overrides.max; patch.rest = overrides.rest; }
      return Object.assign({}, it, patch);
    }) });
  });
}

/* Adding a machine: propose where it belongs, based on where that muscle is
   already trained, and what sets/reps/repos to start it at — dérivés du
   palier de la machine (poly/semi/iso) ET de l'objectif d'entraînement
   actuel (voir GOAL_PRESETS/tierDefaultsForGoal ci-dessus), pas d'un
   10-15 reps générique fixe comme avant ce menu. `goal` est optionnel :
   à défaut, se comporte comme avant (recomposition). `avgSessions` (voir
   avgSessionsPerWeek) pilote la conversion volume/séance → volume/semaine —
   avant le 4 sept. 2026 c'était figé à SESSIONS_PER_WEEK, sans lien avec le
   réglage réel de fréquence dans Options (voir la note sur SESSIONS_PER_WEEK
   plus haut). Le seuil "en dessous de la cible" utilise maintenant
   goalPreset(goal).targetSets (repère par objectif, voir GOAL_PRESETS) au
   lieu du plancher générique VOL_MIN — un objectif Hypertrophie vise plus
   haut qu'un objectif Force, ça doit se voir dès l'ajout d'une machine. */
function proposePlacement(newEx, exercises, program, goal, avgSessions) {
  var withNew = exercises.concat([newEx]);
  var vol = plannedVolume(program, withNew, avgSessions);
  var newMuscles = allMuscles(newEx);
  var target = goalPreset(goal).targetSets || VOL_MIN;
  /* Multi-muscle (voir allMuscles) : une machine comme Chest Press ajoute du
     volume à CHAQUE muscle qu'elle sollicite en même temps, donc "current"
     retient le muscle le plus en retard des deux (celui qui a le plus besoin
     de cette machine) plutôt qu'un seul muscle arbitraire — perMuscle garde
     le détail de chacun pour l'affichage (voir describePlacement). */
  var perMuscle = newMuscles.map(function(mu){
    var cur = vol.find(function(v){return v.muscle===mu;});
    return { muscle: mu, current: cur ? cur.sets : 0, target: target };
  });
  var current = perMuscle.length ? Math.min.apply(null, perMuscle.map(function(p){return p.current;})) : 0;
  var daysTraining = program.filter(function(d){ return d.items.some(function(it){
    var ex = withNew.find(function(e){return e.id===it.ex;});
    return ex && allMuscles(ex).some(function(mu){ return newMuscles.indexOf(mu)>=0; });
  }); });
  var targets = daysTraining.length > 0 ? daysTraining.slice(0,2)
    : program.slice().sort(function(a,b){return a.items.length-b.items.length;}).slice(0,2);
  var tierDef = tierDefaultsForGoal(goal, exerciseOrderTier(newEx));
  var setsEach = current >= target ? tierDef.sets : tierDef.sets + 1;
  return { targets: targets.map(function(d){return d.key;}), targetLabels: targets.map(function(d){return d.label;}),
    setsEach: setsEach, min: tierDef.min, max: tierDef.max, rest: tierDef.rest, current: current, target: target, perMuscle: perMuscle };
}
/* Texte affiché quand on propose où placer une machine qu'on vient d'ajouter
   (voir proposePlacement) — une ligne simple pour un muscle unique, le détail
   de chaque muscle quand la machine en sollicite plusieurs (voir allMuscles). */
function describePlacement(placement) {
  var pm = placement.perMuscle || [];
  if (pm.length <= 1) {
    var only = pm[0] || { muscle:"Ce muscle", current: placement.current, target: placement.target };
    return only.muscle+" est actuellement à "+only.current+" séries/semaine"+(only.current<only.target?" — en dessous de la cible "+only.target+" séries/semaine visée par ton objectif actuel.":".");
  }
  return "Cette machine sollicite "+pm.map(function(p){return p.muscle;}).join(" + ")+", actuellement à "+
    pm.map(function(p){return p.muscle+" "+p.current+"×/sem"+(p.current<p.target?" (sous la cible "+p.target+")":"");}).join(", ")+".";
}
/* ============================================================
   TYPES DE SPLIT — ajouté le 6 sept. 2026 (demande : "il faudrait pouvoir
   choisir entre full body / lower upper / PPL / et méthode avec rappel que je
   connais pas, et aider l'utilisateur à choisir entre ces différentes options,
   de plus il faut qu'à chaque fois qu'on change de mode, que le programme
   s'ajuste automatiquement").

   Ce que dit la littérature, et ce qu'elle ne dit pas : AUCUN découpage n'est
   supérieur en soi. À volume hebdomadaire égal, les comparaisons directes ne
   trouvent pas de différence robuste entre les découpages (Schoenfeld et al.
   2016 ; Ralston et al. 2018 ; Pelland et al. 2025, déjà cités dans
   GOAL_PRESETS). Ce qui change réellement d'un split à l'autre, c'est la
   FRÉQUENCE par muscle qu'il produit avec TON nombre de séances : un full body
   fait 3 séances/semaine voit chaque muscle 3 fois, un PPL en 3 jours une
   seule fois. C'est pour ça que l'appli ne classe pas les splits dans
   l'absolu : elle SIMULE chacun sur ton matériel et ton rythme réels
   (previewSessionStats) et affiche la fréquence et la durée obtenues, pour que
   le choix se fasse sur des chiffres et pas sur une réputation.

   Les groupes ci-dessous s'appuient sur les tables REGION et PUSHPULL déjà
   utilisées ailleurs, plus un groupe "jambes" et un groupe "tronc" pour ne
   perdre aucun muscle. Le tronc est rattaché à chaque jour des splits courts
   (il ne fatigue pas les mêmes structures) et à un jour sur deux ailleurs. */
var SPLIT_GROUPS = {
  all: function(){ return true; },
  upper: function(mu){ return REGION[mu]==="haut"; },
  lower: function(mu){ return REGION[mu]==="bas"; },
  legs: function(mu){ return REGION[mu]==="bas"; },
  push: function(mu){ return PUSHPULL[mu]==="push"; },
  pull: function(mu){ return PUSHPULL[mu]==="pull"; },
  core: function(mu){ return REGION[mu]==="core"; },
  chestback: function(mu){ return mu==="Pectoraux"||mu==="Dos"||mu==="Trapèzes"; },
  shoulderarms: function(mu){ return mu==="Épaules"||mu==="Deltoïdes post."||mu==="Biceps"||mu==="Triceps"||mu==="Avant-bras"; },
};
var SPLIT_TEMPLATES = [
  { k:"full", label:"Full body", sessions:"3 séances/semaine",
    summary:"Tous les muscles à chaque séance.",
    why:"La fréquence par muscle la plus haute pour un petit nombre de séances : 3 séances = 3 passages par muscle. Séances longues et variées, peu de place pour le volume par muscle dans une même séance.",
    days:[{label:"Full A",g:["all"]},{label:"Full B",g:["all"]},{label:"Full C",g:["all"]}] },
  { k:"upper_lower", label:"Haut / Bas", sessions:"4 séances/semaine",
    summary:"Le haut du corps un jour, le bas le lendemain.",
    why:"Le meilleur compromis à 4 séances : chaque muscle revient 2 fois par semaine, avec assez de place dans la séance pour du volume par muscle.",
    days:[{label:"Haut A",g:["upper","core"]},{label:"Bas A",g:["lower"]},{label:"Haut B",g:["upper"]},{label:"Bas B",g:["lower","core"]}] },
  { k:"ppl", label:"Push / Pull / Legs", sessions:"3 séances/semaine",
    summary:"Poussée (pecs, épaules, triceps), tirage (dos, biceps), jambes.",
    why:"Regroupe les muscles qui travaillent ensemble, donc peu de chevauchement d'une séance à l'autre. En 3 séances/semaine chaque muscle n'est vu qu'UNE fois — en dessous du repère de 2×/semaine.",
    days:[{label:"Poussée",g:["push"]},{label:"Tirage",g:["pull"]},{label:"Jambes",g:["legs","core"]}] },
  { k:"ppl6", label:"Push / Pull / Legs ×2", sessions:"6 séances/semaine",
    summary:"Le PPL parcouru deux fois par semaine.",
    why:"Même logique que le PPL, mais chaque muscle revient 2 fois par semaine. Demande 6 séances : à moins, la rotation avance trop lentement et la fréquence retombe.",
    days:[{label:"Poussée A",g:["push"]},{label:"Tirage A",g:["pull"]},{label:"Jambes A",g:["legs","core"]},
          {label:"Poussée B",g:["push"]},{label:"Tirage B",g:["pull"]},{label:"Jambes B",g:["legs","core"]}] },
  { k:"arnold", label:"Pecs-Dos / Épaules-Bras / Jambes", sessions:"3 à 6 séances/semaine",
    summary:"Une variante classique (dite « Arnold ») qui associe les antagonistes.",
    why:"Alterner un exercice de pecs et un de dos permet de récupérer d'un groupe pendant qu'on travaille l'autre, donc des séances un peu plus denses à temps égal. Le reste ne diffère pas d'un PPL sur le fond.",
    days:[{label:"Pecs / Dos",g:["chestback"]},{label:"Épaules / Bras",g:["shoulderarms","core"]},{label:"Jambes",g:["legs"]}] },
  { k:"fullbody4", label:"Full body ×4", sessions:"4 séances/semaine",
    summary:"Full body, mais réparti sur quatre séances plus courtes.",
    why:"La fréquence la plus élevée possible (4 passages par muscle) avec des séances courtes. Peu de volume par muscle et par séance, ce qui limite la fatigue accumulée en fin de séance.",
    days:[{label:"Full A",g:["all"]},{label:"Full B",g:["all"]},{label:"Full C",g:["all"]},{label:"Full D",g:["all"]}] },
];
function splitTemplate(k){ return SPLIT_TEMPLATES.find(function(t){ return t.k===k; }) || null; }
function dayAcceptsMuscle(dayDef, mu){
  return dayDef.g.some(function(g){ var f = SPLIT_GROUPS[g]; return f && f(mu); });
}
/* Construit un programme à partir d'un modèle de split et du matériel
   disponible. Chaque machine est rattachée au jour qui accepte son muscle
   PRINCIPAL (allMuscles[0]) ; quand plusieurs jours l'acceptent (full body,
   ou les jours A/B d'un même groupe), elle est répartie en alternance pour
   équilibrer les journées plutôt que de tout empiler sur la première. Les
   séries/reps/repos sont ensuite calculés normalement par applyGoalToProgram,
   donc le résultat respecte l'objectif, l'ordre de priorité et les bornes. */
function buildProgramFromSplit(tplKey, exercises, goal, gymId){
  var tpl = splitTemplate(tplKey);
  if (!tpl) return null;
  var accents = [C.pin, C.green, C.steel, C.rust, C.bone, C.taupe];
  var days = tpl.days.map(function(d, i){
    return { key: tplKey+"-"+i, label: d.label, accent: accents[i % accents.length], items: [], def: d };
  });
  var pool = exercises.filter(function(e){ return exerciseAvailableAtGym(e, gymId); });
  /* Répartition — corrigée le 6 sept. 2026 après mesure : la première version
     alternait par MUSCLE (1re machine de pectoraux au jour 1, 2e au jour 2...).
     Sur un full body, où chaque jour accepte tous les muscles, la plupart des
     muscles n'ont qu'une ou deux machines : elles atterrissaient donc presque
     toutes sur le premier jour — 17 machines le jour 1 contre 7 et 5 ensuite.
     On choisit maintenant, parmi les jours qui acceptent ce muscle, celui qui
     a le MOINS de machines au total ; à égalité, celui qui en a le moins pour
     ce muscle précis (pour ne pas concentrer un muscle sur un seul jour) ;
     puis l'ordre des jours, pour rester déterministe. */
  var perDayMuscle = days.map(function(){ return {}; });
  pool.forEach(function(e){
    var mu = allMuscles(e)[0];
    if (!mu) return;
    var best = null, bestIdx = -1;
    days.forEach(function(d, i){
      if (!dayAcceptsMuscle(d.def, mu)) return;
      if (best === null) { best = d; bestIdx = i; return; }
      var a1 = d.items.length, b1 = best.items.length;
      if (a1 !== b1) { if (a1 < b1) { best = d; bestIdx = i; } return; }
      var a2 = perDayMuscle[i][mu] || 0, b2 = perDayMuscle[bestIdx][mu] || 0;
      if (a2 < b2) { best = d; bestIdx = i; }
    });
    if (!best) return; // muscle non couvert par ce split (rare)
    perDayMuscle[bestIdx][mu] = (perDayMuscle[bestIdx][mu] || 0) + 1;
    var tierDef = tierDefaultsForGoal(goal, exerciseOrderTier(e));
    best.items.push({ ex: e.id, sets: tierDef.sets, min: tierDef.min, max: tierDef.max, rest: tierDef.rest });
  });
  var exMap = {}; exercises.forEach(function(e){ exMap[e.id]=e; });
  return days.filter(function(d){ return d.items.length > 0; })
    .map(function(d){ return { key:d.key, label:d.label, accent:d.accent,
      items: sortByExerciseOrder(d.items, function(it){return it.ex;}, exMap) }; });
}
/* Simule chaque split sur le matériel et le rythme réels, pour que le choix se
   fasse sur des chiffres (voir la note en tête de section). Renvoie pour
   chacun : fréquence moyenne par muscle, durée moyenne de séance, score
   d'optimisation et nombre de muscles sous leur cible. */
/* Écart de récupération — ajouté le 6 sept. 2026 en réponse à "si je m'entraîne
   3 jours à la suite, vaut mieux quel split ?". L'appli ne regardait que la
   FRÉQUENCE, donc elle aurait conseillé un full body même à quelqu'un qui
   enchaîne ses séances — c'est-à-dire les mêmes muscles trois jours de rang,
   sans récupération. C'était un angle mort réel.

   Repère utilisé : MacDougall et al., "The time course for elevated muscle
   protein synthesis following heavy resistance exercise", Canadian Journal of
   Applied Physiology 1995 — la synthèse protéique musculaire monte à +50% à
   4 h, culmine à +109% à 24 h, puis redescend et n'est plus significativement
   différente du repos à 36 h. Réentraîner un muscle AVANT ~36-48 h revient
   donc à empiler des séries sur une réponse déjà en cours, sur un muscle
   encore fatigué de la veille — d'où un écart d'au moins 2 jours entre deux
   séances touchant le même muscle quand on s'entraîne en jours consécutifs.

   Cette fonction renvoie, pour un programme donné et en supposant les séances
   faites À LA SUITE, le plus petit nombre de jours séparant deux séances qui
   travaillent un même muscle (en tenant compte du bouclage de la rotation).
   Full body = 1 (mêmes muscles le lendemain), PPL 3 jours = 3, Haut/Bas
   4 jours = 2. */
function minRecoveryGap(program, exercises){
  var exMap = {}; exercises.forEach(function(e){ exMap[e.id]=e; });
  /* Un muscle ne "compte" pour un jour que s'il y reçoit une sollicitation
     RÉELLE — corrigé le 6 sept. 2026 après mesure : la première version
     comptait tout muscle listé, secondaires compris, et concluait donc qu'un
     PPL faisait revenir un muscle dès le lendemain. En cause, le trapèze à
     0,5× sur le développé épaules (jour poussée) alors qu'il est un muscle de
     tirage : une trace de 1,5 série ne justifie pas de dire qu'on "retravaille
     le trapèze". Un muscle est retenu s'il est le muscle PRINCIPAL d'au moins
     une machine du jour, ou si ce jour lui apporte au moins un tiers de son
     volume sur tout le programme. */
  var total = {};
  program.forEach(function(d){ d.items.forEach(function(it){
    var ex = exMap[it.ex]; if (!ex) return;
    allMuscles(ex).forEach(function(mu){ total[mu] = (total[mu]||0) + it.sets*muscleWeight(ex,mu); });
  }); });
  var dayMuscles = program.map(function(d){
    var load = {}, primary = {};
    d.items.forEach(function(it){
      var ex = exMap[it.ex]; if (!ex) return;
      var ms = allMuscles(ex);
      if (ms.length) primary[ms[0]] = true;
      ms.forEach(function(mu){ load[mu] = (load[mu]||0) + it.sets*muscleWeight(ex,mu); });
    });
    var set = {};
    Object.keys(load).forEach(function(mu){
      if (primary[mu] || (total[mu] > 0 && load[mu] >= total[mu]/3)) set[mu] = true;
    });
    return set;
  });
  var n = dayMuscles.length;
  if (n <= 1) return n === 1 ? 1 : 0;
  var min = n;
  for (var i=0;i<n;i++) for (var j=i+1;j<n;j++) {
    var shared = Object.keys(dayMuscles[i]).some(function(mu){ return dayMuscles[j][mu]; });
    if (!shared) continue;
    var gap = Math.min(j-i, n-(j-i)); // la rotation boucle
    if (gap < min) min = gap;
  }
  return min;
}
/* Ajouté le 6 sept. 2026 — l'écran "Type de split" expliquait longuement
   qu'aucun découpage n'est supérieur à un autre, listait les alternatives et
   proposait "Changer"... sans jamais NOMMER celui qui est actif. Pour le
   savoir il fallait ouvrir le sélecteur et repérer celui qui portait la
   pastille. Le découpage n'est stocké nulle part (le programme est la seule
   source de vérité, et il reste modifiable jour par jour dans "Composer les
   séances") : on le retrouve donc en comparant les libellés de jours du
   programme à ceux de chaque modèle. Si rien ne correspond — programme
   remanié à la main — on le dit au lieu d'inventer un nom. */
function detectSplitKind(program){
  if (!program || !program.length) return null;
  var labels = program.map(function(d){ return String(d.label||"").toLowerCase().trim(); });
  for (var i=0;i<SPLIT_TEMPLATES.length;i++){
    var t = SPLIT_TEMPLATES[i];
    if (t.days.length !== labels.length) continue;
    var want = t.days.map(function(d){ return String(d.label).toLowerCase().trim(); });
    var same = want.every(function(w,j){ return w === labels[j]; });
    if (same) return t;
  }
  return null;
}
function evaluateSplits(exercises, goal, avgSessions, muscleFocus, gymId, profile){
  return SPLIT_TEMPLATES.map(function(tpl){
    var prog = buildProgramFromSplit(tpl.k, exercises, goal, gymId);
    if (!prog || !prog.length) return { tpl: tpl, ok: false };
    var applied = applyGoalToProgram(prog, exercises, goal, avgSessions, muscleFocus, profile);
    var exMap = {}; exercises.forEach(function(e){ exMap[e.id]=e; });
    var vol = plannedVolume(applied, exercises, avgSessions);
    var mins = applied.map(function(d){ return estimateDayMinutes(d, exMap); });
    var target = goalPreset(goal).targetSets || VOL_MIN;
    return { tpl: tpl, ok: true, program: applied,
      days: applied.length,
      avgMin: Math.round(mins.reduce(function(a,b){return a+b;},0)/mins.length),
      minFreq: vol.length ? Math.min.apply(null, vol.map(function(v){return v.freq;})) : 0,
      avgFreq: vol.length ? vol.reduce(function(a,v){return a+v.freq;},0)/vol.length : 0,
      score: optimizationScore(applied, exercises, goal, avgSessions, muscleFocus).score,
      gap: minRecoveryGap(applied, exercises),
      under: vol.filter(function(v){ return v.sets < target*focusMultiplier(muscleFocus,v.muscle) - 0.05; }).length };
  });
}
function applyPlacement(newEx, placement, exercises, program) {
  return program.map(function(d){
    return placement.targets.indexOf(d.key) >= 0
      ? Object.assign({}, d, { items: d.items.concat([{ ex: newEx.id, sets: placement.setsEach, min: placement.min, max: placement.max, rest: placement.rest }]) })
      : d;
  });
}

/* Ajouté le 6 sept. 2026 — conséquence directe de l'audit qui a introduit
   MAX_SETS_PER_EXERCISE et cappedMuscles (voir ces deux notes).

   Le constat, mesuré sur le programme livré : 11 muscles restent sous la
   cible hebdomadaire de l'objectif UNIQUEMENT parce que trop peu de machines
   les travaillent dans les séances — les pectoraux, le dos et les épaules
   plafonnent tous à 8,8 séries/semaine sur 12 visées avec seulement 2
   machines chacun. Or le catalogue contient déjà 6 machines qui ne sont dans
   AUCUNE séance (Développé du Tronc, les deux butterfly pectoraux, Upper
   Back, Tirage Horizontal, Élévation Latérale) : de quoi combler exactement
   les trois muscles les plus en retard, sans rien acheter ni rien découvrir
   en salle. Le programme d'origine a simplement été écrit à la main avant
   que ces machines soient toutes renseignées, et rien ne reliait les deux.

   Cette fonction fait ce rapprochement : pour chaque muscle plafonné, elle
   cherche une machine du catalogue absente du programme qui le travaille, et
   renvoie de quoi la placer via applyPlacement (déjà utilisé par le flux
   "Ajouter du matériel"). Choix du candidat, dans l'ordre : le poids le plus
   fort sur le muscle en retard (une machine dédiée plutôt qu'un secondaire),
   puis une machine confirmée plutôt qu'une encore "à vérifier" (même critère
   que bestCandidate), puis le nombre de muscles plafonnés qu'elle couvre
   d'un coup, puis l'ordre du catalogue pour rester déterministe.
   Une machine n'est proposée qu'UNE fois, et les muscles qu'elle couvre sont
   considérés comme traités pour les tours suivants — sinon un Upper Back
   (Dos + Biceps) serait proposé deux fois.
   Pure fonction : ne modifie ni program ni exercises, et ne propose que des
   machines réellement disponibles dans la salle en cours (voir
   exerciseAvailableAtGym) — inutile de suggérer une machine d'une autre
   salle pour combler un manque ici. */
/* Élargi le 6 sept. 2026 (demande : "mettre à jour le programme pour optimiser
   encore avec ces nouvelles machines") : la version précédente ne proposait une
   machine que pour un muscle PLAFONNÉ, c'est-à-dire dont toutes les machines du
   programme étaient déjà à 5 séries. Conséquence : ajouter une machine au
   matériel ne servait à rien tant que ce cas précis n'était pas atteint, alors
   qu'un muscle simplement SOUS SA CIBLE profiterait tout autant d'un créneau de
   plus. On part maintenant de tous les muscles sous leur cible, du plus en
   retard au moins en retard. cappedMuscles reste utilisé à part, pour EXPLIQUER
   pourquoi un muscle bloque. */
function musclesBelowTarget(program, exercises, goal, avgSessions, muscleFocus) {
  var baseTarget = goalPreset(goal).targetSets || VOL_MIN;
  return plannedVolume(program, exercises, avgSessions).map(function(v){
    var target = baseTarget * focusMultiplier(muscleFocus, v.muscle);
    return { muscle: v.muscle, sets: v.sets, target: Math.round(target*10)/10 };
  }).filter(function(v){ return v.sets < v.target - 0.05; });
}
function suggestProgramCompletion(program, exercises, goal, avgSessions, muscleFocus, gymId) {
  var capped = musclesBelowTarget(program, exercises, goal, avgSessions, muscleFocus);
  if (!capped.length) return [];
  var inProgram = {};
  program.forEach(function(d){ d.items.forEach(function(it){ inProgram[it.ex] = true; }); });
  var pool = exercises.filter(function(e){ return !inProgram[e.id] && exerciseAvailableAtGym(e, gymId); });
  if (!pool.length) return [];

  var pending = {}; capped.forEach(function(c){ pending[c.muscle] = c; });
  var chosen = {}, out = [];
  // Muscles traités du plus en retard au moins en retard (ratio sets/cible).
  var order = capped.slice().sort(function(a,b){ return (a.sets/a.target) - (b.sets/b.target); });
  order.forEach(function(c){
    if (!pending[c.muscle]) return;
    var best = null, bestKey = null;
    pool.forEach(function(e, i){
      if (chosen[e.id]) return;
      var w = allMuscles(e).indexOf(c.muscle) >= 0 ? muscleWeight(e, c.muscle) : 0;
      if (w <= 1e-9) return;
      var alsoCovers = allMuscles(e).filter(function(mu){ return mu!==c.muscle && pending[mu]; }).length;
      var key = [ -w, e.brand === "?" ? 1 : 0, -alsoCovers, i ];
      if (best === null) { best = e; bestKey = key; return; }
      for (var k=0; k<key.length; k++) {
        if (key[k] !== bestKey[k]) { if (key[k] < bestKey[k]) { best = e; bestKey = key; } return; }

   comme la cause des "18 séries de triceps" et remplacé le 6 sept. 2026 dans

  if (!isFinite(target) || !isFinite(proteinG)) return null;
  return { bmr: bmr?Math.round(bmr):null, tdee: tdee?Math.round(tdee):null, target: Math.round(target), proteinG: proteinG, fatG: fatG, carbG: carbG, breakdown: breakdown };

   existantes sans palier. Validé pour reproduire exactement le classement
   des 29 machines d'origine du catalogue (SEED_EXERCISES), et élargi avec
   des synonymes FR/EN et noms de marque courants (Technogym, Life Fitness,
   Hammer Strength) pour mieux couvrir des machines ajoutées manuellement
   avec un nom différent. Les motifs les plus SPÉCIFIQUES sont testés en
   premier — ex. "leg curl" doit être reconnu comme semi-isolation (ischios)

  //     motifs génériques plus bas (ex. "curl", "presse", "extension"). ---
  if (/leg curl|hamstring curl|flexion des jambes|ischio|nordic/.test(n)) return 2;
  if (/leg extension|extension.*jambe|quad.*extension/.test(n)) return 3;
  if (/calf|mollet/.test(n)) return 2;
  if (/glute|fessier|hip thrust|hip bridge/.test(n)) return 2;
  if (/lower back|lombaire|hyperextension|back extension|extension du dos/.test(n)) return 2;
  if (/rear delt|deltoide arriere|reverse fly|face pull/.test(n)) return 2;
  if (/trapez|shrug/.test(n)) return 2;
  if (/pull-?up|pull-?over|chin-?up/.test(n)) return 1;
  if (/pector|pec deck|butterfly|papillon|ecarte|\bfly\b/.test(n)) return 3;
  if (/elevation laterale|lateral raise|elevation frontale|front raise/.test(n)) return 3;
  if (/abduction|adduction/.test(n)) return 3;

  //     (planche, front/back lever, drapeau) ne sont volontairement PAS

  //     avant ; et "nordic curl" tombait sur le motif générique "curl" (→

  if (/muscle.?up|burpee/.test(n)) return 1;

function guessMuscles(name) {
  var n = stripAccents(name||"");
  if (!n) return [];
  for (var i=0; i<MUSCLE_GUESS_RULES.length; i++) {
    if (MUSCLE_GUESS_RULES[i].test.test(n)) return MUSCLE_GUESS_RULES[i].muscles;
  }
  return [];
}
/* Trie une liste d'items/entries de séance par palier d'exercice (1
   polyarticulaire → 2 semi-isolation → 3 isolation), à égalité de palier
   l'ordre d'origine est conservé (tri stable). getExId(item) doit renvoyer
   l'id de l'exercice pour cet item. */
function sortByExerciseOrder(list, getExId, exMap) {
  return list.map(function(item, i){ return { item: item, i: i }; })
    .sort(function(a, b){
      var ta = exerciseOrderTier(exMap[getExId(a.item)]), tb = exerciseOrderTier(exMap[getExId(b.item)]);
      return ta !== tb ? ta - tb : a.i - b.i;
    })
    .map(function(w){ return w.item; });
}
function sortedDayItems(day, exMap) { return sortByExerciseOrder(day.items, function(it){return it.ex;}, exMap); }
/* Badge affiché partout où une machine apparaît (aperçu de séance, séance
   en cours, séance libre). Touchable quand onChange est fourni — un tap
   fait tourner 1→2→3→1, pour corriger le palier d'une machine directement
   là où on la voit, sans devoir aller dans l'onglet Machines. Sans
   onChange (ex. historique), reste un simple indicateur non cliquable. */
function OrderBadge(props){
  var order = props.order, onChange = props.onChange;
  if (!order) return null;
  var title = (onChange ? "Palier : " : "Ordre conseillé dans la séance : ")+order+"/3 — "+(ORDER_TIER_LABEL[order]||"")+(onChange ? " — touche pour changer" : "");
  var style = {display:"inline-flex",alignItems:"center",justifyContent:"center",width:19,height:19,borderRadius:"50%",
    flexShrink:0,marginTop:1,background:C.shroud,border:"1px solid "+(onChange?C.pin:C.taupeDim),
    fontFamily:sansCond,fontSize:11,fontWeight:700,color:C.pin};
  if (!onChange) return h("span",{title:title, style:style}, order);
  return h("button",{title:title, onClick:function(){ onChange(order>=3?1:order+1); },
    style:Object.assign({},style,{padding:0,cursor:"pointer"})}, order);
}
/* Palier de POIDS — le plus petit incrément (kg) entre deux charges d'une
   machine (2.5 kg pour la plupart, 5 kg sur certaines Leg Press, 1 kg voire
   moins sur des poids libres...). À ne pas confondre avec OrderBadge
   ci-dessus (le palier poly/semi/isolation) — deux réglages différents qui
   utilisent tous les deux le mot "palier". Affiché en compact partout où
   une machine apparaît (séance + Machines) pour pouvoir le corriger sans

function IncStepper(props){
  var value=props.value, onChange=props.onChange, step=props.step||0.5, min=props.min!=null?props.min:0.25;
  return h("div",{style:{display:"inline-flex",alignItems:"center",gap:3,marginTop:2}},

      style:{width:16,height:16,display:"flex",alignItems:"center",justifyContent:"center",borderRadius:3,background:C.shroud,color:C.taupe,border:"1px solid "+C.taupeDim,padding:0,fontSize:10,lineHeight:1,flexShrink:0}}, "−"),
    h("span",{style:{fontFamily:sansCond,fontSize:11,color:C.taupe,whiteSpace:"nowrap"}}, "pas "+value+" kg"),
    h("button",{onClick:function(e){e.stopPropagation(); onChange(round((value||0)+step));}, "aria-label":"Augmenter le palier de poids",
      style:{width:16,height:16,display:"flex",alignItems:"center",justifyContent:"center",borderRadius:3,background:C.shroud,color:C.taupe,border:"1px solid "+C.taupeDim,padding:0,fontSize:10,lineHeight:1,flexShrink:0}}, "+"));

/* Microwave-style alert: 4 short, sharp square-wave beeps (a harsher, more
   "kitchen timer" tone than a single sine chime) + a matching vibration

     vient d'ouvrir sans rien saisir reste un simple appui. */
  function loggedSetCount(){
    if (!active || !active.entries) return 0;
    return active.entries.reduce(function(a,e){
      return a + (e.sets||[]).filter(function(s){ return s && (s.weight!=null || s.reps!=null); }).length;
    }, 0);
  }
  /* Ajouté le 6 sept. 2026 après avoir regardé l'écran de séance rendu sur un
     téléphone : ce rappel occupait TROIS lignes pleines en haut de CHAQUE
     séance, indéfiniment, pour une information qu'on lit une seule fois. Et
     depuis que les boutons de difficulté n'apparaissent plus qu'une fois la
     série commencée (voir plus bas), il n'y a même plus rien à expliquer tant
     qu'on n'a rien saisi. Ramené à une ligne, avec une croix qui le range
     pour de bon (mémorisé dans le profil, donc plus jamais réaffiché). */
  var effortHintHidden = !!(profile && profile.hideEffortHint);
  function dismissEffortHint(){ if (setProfile && profile) setProfile(Object.assign({}, profile, {hideEffortHint:true})); }
  function effortHint(){
    if (effortHintHidden) return null;
    return h("div",{style:{marginBottom:14,padding:"8px 10px",borderRadius:8,background:C.shroudDeep,border:"1px solid "+C.taupeDim,display:"flex",alignItems:"center",gap:8}},
      h(Icon,{name:"gauge",size:14,color:C.pin}),
      h("div",{style:{fontSize:12,color:C.taupe,lineHeight:1.4,flex:1,minWidth:0}},
        "« Facile / Correct / Dur » est optionnel : poids et reps suffisent."),
      h("button",{onClick:dismissEffortHint, "aria-label":"Ne plus afficher",
        style:{padding:6,borderRadius:6,color:C.taupe,border:"none",background:"transparent",flexShrink:0}}, h(Icon,{name:"x",size:13})));
  }
  function abortButton(){
    var n = loggedSetCount();
    if (abortArmed) {
      return h("div",{style:{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,flexShrink:0}},
        h("button",{onClick:function(){ setAbortArmed(false); setActive(null); },
          style:{padding:"8px 12px",borderRadius:6,display:"flex",alignItems:"center",gap:5,color:C.ink,border:"1px solid "+C.rust,background:C.rust,fontFamily:sansCond,fontSize:13,fontWeight:700}},
          h(Icon,{name:"x",size:14}), "Confirmer l'abandon"),
        h("button",{onClick:function(){ setAbortArmed(false); },
          style:{padding:"2px 4px",color:C.taupe,border:"none",background:"transparent",fontFamily:sansCond,fontSize:11.5}}, "Annuler"));
    }
    return h("button",{onClick:function(){ if (n>0) setAbortArmed(true); else setActive(null); },
      title: n>0 ? n+" séries saisies seront perdues" : "Abandonner cette séance",
      style:{padding:"8px 12px",borderRadius:6,display:"flex",alignItems:"center",gap:5,color:C.taupe,border:"1px solid "+C.taupeDim,background:"transparent",fontFamily:sansCond,fontSize:13,flexShrink:0}},
      h(Icon,{name:"x",size:14}), "Abandonner");
  }
  var day = program.find(function(d){return d.key === (active ? active.dayKey : nextDayKey);}) || program[0];
  /* Salle actuellement sélectionnée (voir OptionsTab > "Mes salles",
     exerciseAvailableAtGym, adaptDayItems) — pilote le filtrage des listes
     "ajouter une machine" et le remplacement automatique d'une machine
     programmée indisponible ici. null seulement si le profil n'a pas encore
     migré (ne devrait jamais arriver, withGymsDefault tourne au chargement). */
  var currentGymId = (profile && profile.gyms && profile.gyms.length) ? (profile.currentGymId || profile.gyms[0].id) : null;

  /* Changer de machine à la volée, "quand j'en ai envie" — pas seulement
     quand l'app détecte un plateau (voir Analyse). Propose la meilleure
     alternative du même muscle (voir bestCandidate) ; si on confirme, ça
     remplace la machine dans toute la rotation (comme "Remplacer dans le
     programme" ailleurs dans l'app — pas juste pour cette séance) et, si
     une séance est en cours, met aussi à jour l'entrée déjà commencée pour
     qu'on puisse continuer à logger dessus tout de suite. */
  function requestSwap(ex){
    if (!ex) return;
    var cand = suggestSwap(ex.id, exercises, program);
    var rec = cand ? swapRecommendation(ex, cand, program, goal) : null;
    setSwapPending({ exId: ex.id, oldName: ex.name, muscles: allMuscles(ex).join(" + "), candidate: cand, rec: rec });
  }
  function setSwapRec(patch){ setSwapPending(Object.assign({}, swapPending, {rec: Object.assign({}, swapPending.rec, patch)})); }
  function confirmSwap(){
    if (!swapPending || !swapPending.candidate) { setSwapPending(null); return; }
    var oldId = swapPending.exId, newId = swapPending.candidate.id;
    persistConfig(exercises, applySwap(oldId, newId, program, swapPending.rec));
    if (active && !active.freeform) {
      setActive(Object.assign({}, active, { entries: active.entries.map(function(e){
        return e.ex===oldId ? Object.assign({}, e, {ex: newId}) : e;
      }) }));
    }
    setSwapPending(null);
  }
  function cancelSwap(){ setSwapPending(null); }
  function swapCard(){
    if (!swapPending) return null;
    return h("div",{style:{marginBottom:16,borderRadius:10,padding:12,background:C.shroudDeep,border:"1px solid "+(swapPending.candidate?C.green:C.rust)}},
      swapPending.candidate ? h("div",null,
        h("div",{style:{fontSize:13.5,color:C.bone,lineHeight:1.5,marginBottom:10}},
          "Remplacer "+swapPending.oldName+" par "+swapPending.candidate.name+" ? Ça change la machine dans toute la rotation à partir de maintenant"+(active && !active.freeform?" (et dans la séance en cours)":"")+"."),
        swapPending.rec ? h("div",{style:{marginBottom:10}},
          h("div",{style:{fontSize:11,color:C.taupe,marginBottom:6}}, "Séries/reps/repos recommandés pour cette machine — ajustables :"),
          h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}},
            h("div",null,
              h("label",{style:{fontFamily:sansCond,fontSize:10.5,color:C.taupe}}, "Séries"),
              h(Stepper,{value:swapPending.rec.sets, step:1, min:1, onChange:function(v){setSwapRec({sets:v});}})),
            h("div",null,
              h("label",{style:{fontFamily:sansCond,fontSize:10.5,color:C.taupe}}, "Repos (s)"),
              h(Stepper,{value:swapPending.rec.rest, step:5, min:15, onChange:function(v){setSwapRec({rest:v});}}))),
          h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
            h("div",null,
              h("label",{style:{fontFamily:sansCond,fontSize:10.5,color:C.taupe}}, "Reps min"),
              h(Stepper,{value:swapPending.rec.min, step:1, min:1, onChange:function(v){setSwapRec({min:v, max:Math.max(v, swapPending.rec.max)});}})),
            h("div",null,
              h("label",{style:{fontFamily:sansCond,fontSize:10.5,color:C.taupe}}, "Reps max"),
              h(Stepper,{value:swapPending.rec.max, step:1, min:swapPending.rec.min, onChange:function(v){setSwapRec({max:v});}})))
        ) : null,
        h("div",{style:{display:"flex",gap:8}},
          h("button",{onClick:confirmSwap, style:{flex:1,padding:"8px 0",borderRadius:6,background:C.green,color:C.ink,fontFamily:sansCond,fontSize:14,fontWeight:700,border:"none"}}, "Remplacer"),
          h("button",{onClick:cancelSwap, style:{flex:1,padding:"8px 0",borderRadius:6,color:C.taupe,border:"1px solid "+C.taupeDim,background:"transparent",fontFamily:sansCond,fontSize:14}}, "Annuler")))
      : h("div",null,
        h("div",{style:{fontSize:13.5,color:C.bone,lineHeight:1.5,marginBottom:10}}, "Aucune autre machine disponible pour "+swapPending.muscles+" pour remplacer "+swapPending.oldName+"."),
        h("button",{onClick:cancelSwap, style:{width:"100%",padding:"8px 0",borderRadius:6,color:C.taupe,border:"1px solid "+C.taupeDim,background:"transparent",fontFamily:sansCond,fontSize:14}}, "Compris")));
  }

  function startFreeform() {
    setActive({ id:"s"+Date.now(), date:new Date().toISOString(), dayKey:FREEFORM_LABEL, done:false, deload:false, freeform:true, entries:[] });
    setPickerOpen(false);
  }
  function addFreeformExercise() {
    if (!freePick) return;
    if (active.entries.some(function(e){return e.ex===freePick;})) { setFreePick(""); return; }
    /* Retrié après chaque ajout : polyarticulaire d'abord, isolation en
       dernier, comme pour les séances de rotation (voir sortByExerciseOrder). */
    var next = sortByExerciseOrder(active.entries.concat([{ex:freePick, sets:[]}]), function(e){return e.ex;}, exMap);
    setActive(Object.assign({}, active, { entries: next }));
    setFreePick("");
  }
  function removeFreeformEntry(idx) {
    setActive(Object.assign({}, active, { entries: active.entries.filter(function(e,i){return i!==idx;}) }));
  }
  /* Retirer une machine de la séance PROGRAMMÉE en cours, sans y aller par
     l'échange (requestSwap remplace pour toute la rotation à venir). Ça ne
     touche que active.entries — le programme (program/day.items) n'est pas
     modifié, donc la machine revient normalement à la prochaine fois que ce
     jour tombe. Marche aussi bien pour une machine du programme que pour une
     ajoutée à la volée ci-dessous (voir addToActiveSession). */
  function removeFromActiveSession(idx) {
    setActive(Object.assign({}, active, { entries: active.entries.filter(function(e,i){return i!==idx;}) }));
  }
  /* Ajouter une machine à la séance programmée en cours, pour cette séance
     seulement — sans toucher au programme (contrairement à "Ajouter du
     matériel" > "Composer les séances" qui, lui, modifie la rotation pour
     toujours). Les séries/reps/repos par défaut viennent du palier poly/
     semi/isolation de la machine pour l'objectif actuel (tierDefaultsForGoal
     — même logique que pour un ajout permanent via AddToDay), et sont
     stockés sur l'entrée elle-même (e.adhoc) puisqu'il n'y a pas de "it" de
     programme pour cette machine aujourd'hui. */
  function addToActiveSession(exId) {
    if (!exId || !active) return;
    if (active.entries.some(function(e){return e.ex===exId;})) { setSessionPick(""); return; }
    var ex = exMap[exId];
    var tierDef = tierDefaultsForGoal(goal, ex?exerciseOrderTier(ex):2);
    var sets = Array.from({length:tierDef.sets}, function(){ return {weight:null, reps:null, rir:null, weakSide:null}; });
    var newEntry = { ex: exId, sets: sets, adhoc: { min: tierDef.min, max: tierDef.max, rest: tierDef.rest, sets: tierDef.sets } };
    setActive(Object.assign({}, active, { entries: active.entries.concat([newEntry]) }));
    setSessionPick("");
  }
  function addFreeformSet(idx) {
    setActive(Object.assign({}, active, { entries: active.entries.map(function(e,i){
      if (i!==idx) return e;
      return Object.assign({}, e, { sets: e.sets.concat([{weight:null, reps:null, rir:null, weakSide:null}]) });
    }) }));
  }
  function removeFreeformSet(idx, si) {
    setActive(Object.assign({}, active, { entries: active.entries.map(function(e,i){
      if (i!==idx) return e;
      return Object.assign({}, e, { sets: e.sets.filter(function(s,j){return j!==si;}) });
    }) }));
  }
  function lastTimeNote(exId) {
    var hist = historyFor(sessions, exId);
    if (!hist.length) return null;
    var last = hist[hist.length-1];
    var withWeight = last.entry.sets.filter(function(s){return s.weight!=null;});
    if (!withWeight.length) return null;
    var w = Math.max.apply(null, withWeight.map(function(s){return s.weight;}));
    var atW = withWeight.filter(function(s){return s.weight===w;});
    var reps = atW.map(function(s){return s.reps;}).filter(function(r){return r!=null;});
    var unit = unitLabel(exMap[exId])==="s" ? "s" : "";
    var repsTxt = reps.length ? " × "+Math.min.apply(null,reps)+(reps.length>1 && Math.max.apply(null,reps)!==Math.min.apply(null,reps) ? "-"+Math.max.apply(null,reps) : "")+unit : "";
    return "Dernière fois (" + new Date(last.date).toLocaleDateString("fr-FR") + ") : " + w + " kg" + repsTxt;
  }

  function start(dayKey, deload) {
    var d = program.find(function(x){return x.key===dayKey;});
    /* Adapte les machines de ce jour à la salle actuelle AVANT de figer les
       entries (voir adaptDayItems) — le programme permanent (d.items) n'est
       jamais modifié, seule la séance qui démarre l'est, comme pour un
       remplacement manuel. Fait ICI (pas seulement au rendu) pour que
       active.entries pointe déjà vers le bon id de machine — sinon le rendu
       de la séance en cours (sessionItems) et ces entries désignent deux
       machines différentes et rien ne s'affiche pour cet exercice. */
    var adaptedItems = adaptDayItems(d.items, exercises, exMap, currentGymId);
    var entries = sortByExerciseOrder(adaptedItems, function(it){return it.ex;}, exMap).map(function(it){
      var p = prescribe(sessions, it, deload, exMap[it.ex]);
      var nSets = p.setsOverride || it.sets;
      /* One row per set, whether the exercise is unilateral or not — you do
         the weak side then match the strong side to it, so there's one
         weight/reps to log per set, not two. estimateDayMinutes still
         doubles unilateral sets for wall-clock time (that part is real:
         each side is still executed separately), but there's nothing to
         double in the logging itself. weakSide is an optional per-set flag
         (see WeakSideToggle) for noting which side felt harder that set. */
      var sets = Array.from({length:nSets}, function(){ return {weight:null, reps:null, rir:null, weakSide:null}; });
      return { ex: it.ex, sets: sets };
    });
    setActive({ id:"s"+Date.now(), date:new Date().toISOString(), dayKey:dayKey, done:false, deload: !!deload, entries: entries });
    setPickerOpen(false);
  }

  if (!active) {
    /* "Ce qui t'attend" doit montrer la séance TELLE QU'ELLE SE FERA dans la
       salle actuelle, pas le programme brut — même adaptation que start()
       (voir adaptDayItems), recalculée à chaque rendu (rien n'est encore
       figé tant que la séance n'a pas démarré). */
    var previewItems = sortByExerciseOrder(adaptDayItems(day.items, exercises, exMap, currentGymId), function(it){return it.ex;}, exMap);
    return h("div", null,
      swapCard(),
      (profile && profile.gyms && profile.gyms.length>1) ? h("div",{style:{marginBottom:16}},
        h("div",{style:{fontFamily:sansCond,fontSize:12,color:C.taupe,marginBottom:6}}, "Salle actuelle"),
        h("div",{style:{display:"flex",flexWrap:"wrap",gap:6}},
          profile.gyms.map(function(g){
            var on = g.id === currentGymId;
            return h("button",{key:g.id, onClick:function(){setProfile(Object.assign({},profile,{currentGymId:g.id}));},
              style:{padding:"6px 12px",borderRadius:6,background:on?C.pin:C.shroudDeep,color:on?C.ink:C.taupe,border:"1px solid "+(on?"transparent":C.taupeDim),fontFamily:sansCond,fontSize:12.5,fontWeight:600}}, g.name);
          }))) : null,
      deloadSuggested ? h(DeloadBanner,{ reason: deloadReason,
        onActivate: function(){ setDeloadForNextStart(true); },
        onSnooze: snoozeDeload }) : null,
      deloadForNextStart ? h("div",{style:{marginBottom:16,padding:"10px 14px",borderRadius:8,background:C.shroudDeep,border:"1px solid "+C.steel,fontSize:13,color:C.steel,display:"flex",alignItems:"center",gap:8}},
        h(Icon,{name:"gauge",size:15,color:C.steel}), "Décharge activée pour ta prochaine séance.") : null,
      h(Section, {title:"Prochaine séance"},
        h("div",{style:{borderRadius:10,padding:20,background:C.shroudDeep,border:"1px solid "+C.taupeDim}},
          /* L'ENCADRÉ LUI-MÊME est le bouton qui ouvre tout le programme du
             split (demande du 6 sept. 2026, redemandée : "je veux pouvoir
             regarder tout le programme du split en cliquant sur l'encadré").
             La version précédente n'avait rendu dépliables que les jours DANS
             le sélecteur "Choisir une autre séance" — il fallait donc encore
             passer par un bouton pour y arriver. Un appui n'importe où sur le
             bloc titre déroule maintenant les quatre jours avec toutes leurs
             machines, d'un coup. Le bouton "Commencer" reste une cible
             séparée, donc aucun risque de lancer une séance en voulant juste
             regarder. */
          h("button",{onClick:function(){ toggleSplit(); }, "aria-expanded":pickerOpen?"true":"false",
            style:{width:"100%",padding:0,background:"transparent",border:"none",textAlign:"left",display:"block"}},
            h("div",{style:{display:"flex",alignItems:"flex-start",gap:10}},
              h("div",{style:{flex:1,minWidth:0}},
                h("div",{style:{fontFamily:sansCond,fontSize:12,color:C.taupe,marginBottom:4}}, "Rotation — reprends où tu t'es arrêté"),
                h("div",{style:{fontFamily:sansCond,fontSize:32,fontWeight:700,color:day.accent,lineHeight:1.1}}, day.label),
                h("div",{style:{fontSize:14,color:C.taupe,marginTop:8}}, day.items.length+" exercices · "+day.items.reduce(function(a,b){return a+b.sets;},0)+" séries · ~"+estimateDayMinutes(day,exMap)+" min estimées")),
              h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:2,flexShrink:0,color:C.taupe,paddingTop:2}},
                h("span",{style:{lineHeight:0,transform:peekNext?"rotate(180deg)":"none",transition:"transform .2s"}}, h(Icon,{name:"chevronDown",size:20})),
                h("span",{style:{fontFamily:sansCond,fontSize:9.5,whiteSpace:"nowrap"}}, peekNext?"fermer":"voir"))),
            peekNext ? h("div",{style:{marginTop:10,paddingTop:10,borderTop:"1px solid "+C.taupeDim}},
              h(DayItemList,{items: sortByExerciseOrder(adaptDayItems(day.items, exercises, exMap, currentGymId), function(it){return it.ex;}, exMap), exMap:exMap})) : null),
          h("button",{onClick:function(){ start(day.key, deloadForNextStart); setDeloadForNextStart(false); },
            style:{width:"100%",marginTop:20,padding:"12px 0",borderRadius:6,background:deloadForNextStart?C.steel:C.pin,color:C.ink,fontFamily:sansCond,fontSize:16,fontWeight:700,border:"none"}},
            (deloadForNextStart?"Commencer "+day.label+" (décharge)":"Commencer "+day.label)),
          h("button",{onClick:function(){ setPickerOpen(!pickerOpen); if(pickerOpen) setOpenDays({}); }, style:{width:"100%",marginTop:8,padding:"8px 0",borderRadius:6,color:C.taupe,fontFamily:sansCond,fontSize:14,border:"1px solid "+C.taupeDim,background:"transparent"}},
            pickerOpen ? "Masquer les autres séances" : "Choisir une autre séance"),
          /* Refait le 6 sept. 2026 (demande : "il faudrait pouvoir voir toutes
             les machines des split haut/bas si besoin en appuyant sur
             l'encadré") — c'était une grille de quatre boutons qui LANÇAIENT la
             séance au premier appui : aucun moyen de voir ce qu'il y avait
             dedans avant de s'engager, et un appui de travers démarrait une
             séance qu'il fallait ensuite abandonner. Chaque jour devient un
             encadré qu'on déplie pour lire ses machines (dans l'ordre réel de
             la séance, adapté à la salle en cours comme "Ce qui t'attend"),
             avec le bouton de démarrage à l'intérieur — donc plus de départ
             involontaire non plus. */
          pickerOpen ? h("div",{style:{marginTop:8,display:"flex",flexDirection:"column",gap:6}},
            program.filter(function(d){ return d.key !== day.key; }).map(function(d){
              return h(DayCard,{key:d.key, day:d, exMap:exMap, open:!!openDays[d.key],
                items: sortByExerciseOrder(adaptDayItems(d.items, exercises, exMap, currentGymId), function(it){return it.ex;}, exMap),
                onToggle:function(){toggleDay(d.key);},
                onStart:function(){ start(d.key, deloadForNextStart); setDeloadForNextStart(false); }});
            })) : null
        )),
      h(Section, {title:"Séance libre"},
        h("div",{style:{borderRadius:10,padding:16,background:C.shroudDeep,border:"1px solid "+C.taupeDim,display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}},
          /* Raccourci le 6 sept. 2026 : cinq lignes de texte pour un bouton
             qu'on connaît après la première fois, ça repoussait "Ce qui
             t'attend" hors de l'écran d'accueil. Le détail passe en info-bulle. */
          h("div",{style:{fontSize:13,color:C.taupe,lineHeight:1.5}}, "Une séance hors rotation — chez la kiné, par exemple.",
            h(InfoTip,{label:"Comment ça marche ?"},
              "Tu ajoutes les machines une par une au fur et à mesure, avec leurs séries — rien n'est prévu à l'avance. La séance est suivie dans l'historique et compte dans le volume par muscle exactement comme une séance de la rotation.")),
          h("button",{onClick:startFreeform, style:{flexShrink:0,padding:"10px 16px",borderRadius:6,color:C.bone,fontFamily:sansCond,fontSize:14,fontWeight:600,border:"1px solid "+C.taupeDim,background:"transparent",whiteSpace:"nowrap"}}, "Démarrer"))),
      h(Section, {title:"Ce qui t'attend"},
        h("div",{style:{borderRadius:10,overflow:"hidden",border:"1px solid "+C.taupeDim}},
          previewItems.map(function(it,i){
            var ex = exMap[it.ex];
            var p = prescribe(sessions, it, deloadForNextStart, ex);
            /* Même réorganisation que la carte de séance en cours (voir plus
               bas) : nom sur sa propre ligne pleine largeur, repère de charge
               en dessous — sinon "Tirage Vertical (à vérifier)" passait sur
               trois lignes dans les ~140 px que lui laissait le bloc de droite. */
            return h("div",{key:i, style:{borderTop:i?"1px solid "+C.shroud:"none",background:C.shroudDeep}},
              h("div",{style:{padding:"11px 12px 10px"}},
                h("div",{style:{display:"flex",alignItems:"flex-start",gap:8}},
                  h(OrderBadge,{order: ex?exerciseOrderTier(ex):null, onChange: (ex && updateExerciseOrder) ? function(v){updateExerciseOrder(ex.id, v);} : undefined}),
                  h("div",{style:{flex:1,minWidth:0}},
                    h("div",{style:{fontSize:15.5,fontWeight:600,lineHeight:1.25}}, ex?ex.name:"Machine supprimée"),
                    h("div",{style:{fontFamily:sansCond,fontSize:12,color:C.taupe,marginTop:1}}, brandLabel(ex))),
                  ex ? h("button",{onClick:function(){requestSwap(ex);}, title:"Changer de machine",
                    style:{padding:7,borderRadius:6,color:C.taupe,border:"1px solid "+C.taupeDim,background:"transparent",flexShrink:0}}, h(Icon,{name:"repeat",size:14})) : null),
                h("div",{style:{display:"flex",alignItems:"center",gap:10,marginTop:8,paddingLeft:27,flexWrap:"wrap",rowGap:8}},
                  h(StackPlate,{weight:p.weight, repMin:it.min, repMax:it.max, sets:p.setsOverride||it.sets, state:p.state, unit:unitLabel(ex)==="s"?"s":"", block:true}),
                  (ex && updateExerciseInc) ? h(IncStepper,{value:ex.inc, onChange:function(v){updateExerciseInc(ex.id, v);}}) : null)),
              it.gymSwappedFrom ? h("div",{style:{padding:"0 12px 10px",fontSize:12,color:C.steel}}, "Remplace "+it.gymSwappedFrom+" — indisponible dans cette salle.") : null,
              it.gymMissing ? h("div",{style:{padding:"0 12px 10px",fontSize:12,color:C.rust}}, "Indisponible dans cette salle et aucune autre machine équivalente trouvée.") : null);
          })
        ),
        /* Ajouté le 6 sept. 2026 — la pastille ronde devant chaque machine
           affiche son PALIER (1 poly / 2 semi / 3 isolation), et son seul
           explicatif était un attribut title, c'est-à-dire une infobulle au
           SURVOL : inaccessible sur un téléphone, où il n'y a pas de curseur.
           Résultat, la colonne se lisait "1, 2, 2, 2, 2, 3, 3, 3" à l'endroit
           exact où l'œil attend une numérotation d'exercices — donc comme un
