     d'exercices déjà programmés (indépendant de l'objectif — visible dans
     Machines > "Volume prévu par semaine") reste, lui, à corriger à la
     main en ajoutant/retirant des exercices, pas par ce système de presets.

   MISE À JOUR du 4 sept. 2026 — volume/fréquence/proximité de l'échec.
   Nouvelle recherche demandée spécifiquement sur "comment progresser le
   plus vite en hypertrophie", puis étendue à force/perte de gras/
   associations par souci de cohérence. Trois leviers regardés, dans l'ordre
   d'impact trouvé dans la littérature :
   1) VOLUME hebdomadaire par muscle — la méta-régression la plus récente et
      la plus large à ce jour (Pelland et al. 2025, Sports Medicine,
      "The Resistance Training Dose-Response") confirme une relation
      dose-réponse à rendements décroissants marqués : la plupart du gain
      d'hypertrophie est capté entre 12 et 20 séries/muscle/semaine, au-delà
      les données restent trop rares pour trancher. Ça AFFINE (sans le
      contredire) le repère ACSM "≥10 séries/semaine" déjà utilisé ici —
      d'où le nouveau champ `targetSets` par preset (utilisé par
      applyGoalToProgram et proposePlacement à la place du plancher
      générique VOL_MIN=5, qui reste lui un plancher de sécurité universel
      "ne pas perdre le muscle", pas une cible d'optimisation).
   2) FRÉQUENCE — la même méta-régression 2025 trouve qu'une fois le volume
      total contrôlé, la fréquence n'a PLUS d'effet indépendant sur
      l'hypertrophie (contrairement à une méta-analyse plus ancienne de
      Schoenfeld qui trouvait un léger avantage à 2×/semaine vs 1×/semaine à
      volume égal). Son intérêt reste pratique : répartir le volume sur
      ≥2 séances/semaine/muscle plutôt qu'une seule évite d'entasser 15+
      séries d'affilée avec une qualité d'exécution qui se dégrade en fin de
      séance — d'où `minFreq` (repère informatif affiché, pas une règle
      stricte) plutôt qu'un vrai levier de volume. Pour la FORCE, la
      fréquence par mouvement a un effet moins net et moins constant sur le
      gain de 1RM une fois le volume égalisé (Ralston et al. 2018, Sports
      Medicine - Open ; corroboré par Pelland et al. 2025) — avec une
      nuance : le haut du corps semble bénéficier un peu plus d'une
      fréquence ≥3×/semaine que le bas du corps dans cette même
      méta-analyse, mais l'effet reste trop inconsistant pour en faire une
      règle par muscle ici. D'où `minFreq` plus bas pour "strength" seul.
   3) PROXIMITÉ DE L'ÉCHEC (reps en réserve, RIR) — nouvelle méta-régression
      dédiée (Jukic et al. 2024, Sports Medicine, "Exploring the
      Dose-Response Relationship Between Estimated Resistance Training
      Proximity to Failure...") : plus une série est proche de l'échec, plus
      l'hypertrophie est importante — relation dose-réponse claire. Pour la
      FORCE en revanche, la proximité de l'échec ne change quasiment rien au
      gain de 1RM (le modèle "colle" bien à l'hypertrophie, beaucoup moins à
      la force). Nuance importante : un essai contrôlé de 8 semaines chez
      des sujets entraînés (2024, "Similar muscle hypertrophy following
      eight weeks of resistance training to momentary muscular failure or
      with repetitions-in-reserve") ne trouve PAS de différence d'hypertrophie
      entre échec strict et entraînement à 1-3 reps en réserve — donc "très
      proche de l'échec" suffit, pas besoin de l'échec technique à chaque
      série (qui ajoute de la fatigue sans bénéfice net). Voir EFFORT_ADVICE
      ci-dessous (même mécanique d'affichage que TEMPO_ADVICE, sous les
      boutons d'objectif dans Options).
   4) VOLUME PENDANT UN DÉFICIT CALORIQUE — un essai contrôlé chez des sujets
      entraînés en restriction énergétique (Roth et al. 2023, Scandinavian
      Journal of Medicine & Science in Sports, "Resistance training volume
      does not influence lean mass preservation during energy restriction")
      ne trouve AUCUNE différence de préservation de masse maigre entre un
      volume modéré (1-3 séries/exercice) et plus élevé (3-5 séries/exercice)
      sur 6 semaines de restriction. Conclusion retenue : pas de raison de
      réduire le volume en "Perte de gras" seule par rapport à
      "Hypertrophie" — d'où targetSets aligné sur celui de "hyper" pour
      "loss" (avant cette mise à jour, "loss" avait 3 séries/palier contre 4
      pour "hyper", un écart qui n'a plus de justification dans cette
      littérature). Ce qui préserve le mieux le muscle en déficit reste
      l'effort (proximité de l'échec, point 3) et les protéines (déjà
      couvert plus haut), pas un volume gonflé artificiellement.
   5) VOLUME DÉCONNECTÉ DE LA FRÉQUENCE RÉELLE CHOISIE — bug distinct trouvé
      en marge de cette recherche : plannedVolume, applyGoalToProgram et
      proposePlacement utilisaient une constante figée
      (SESSIONS_PER_WEEK=3,2) au lieu du réglage réel "Séances par semaine
      (min-max)" de Options (profile.sessionsMin/sessionsMax, déjà utilisé
      pour la nutrition mais jamais pour le volume d'entraînement).
      Concrètement : changer sa fréquence réelle dans Options ne faisait
      RIEN bouger dans "Volume prévu par semaine" ni dans les suggestions
      d'ajout de séries. Corrigé via avgSessionsPerWeek(profile), maintenant
      utilisé partout où SESSIONS_PER_WEEK l'était — voir cette fonction
      plus haut pour le détail. Répartition des séries par SÉANCE reste
      volontairement libre de toute contrainte de durée (voir SESSION_CAP_MIN
      : reste un simple repère informatif affiché, jamais un plafond qui
      réduirait le volume programmé) — le nombre de séances/semaine doit
      piloter le volume, pas l'inverse.

   Sert de point de départ éditable — pour les machines déjà dans un
   programme, voir requestSwap/swapCard (remplacement) ou proposePlacement/
   applyPlacement (ajout) ; jamais appliqué sans une action explicite de
   l'utilisateur (changer l'objectif, confirmer un remplacement/ajout). */
var GOALS = [
  { k: "loss", label: "Perte de gras" },
  { k: "hyper", label: "Hypertrophie" },

    var items = itemsByMuscle[v.muscle] || [];
    if (!items.length) return;                          // aucune machine : autre diagnostic
    var atCap = items.filter(function(x){ return x.it.sets >= setsBoundsForGoal(goal).max; }).length;
    if (atCap < items.length) return;                   // il reste de la marge : le manque vient d'ailleurs
    out.push({ muscle: v.muscle, sets: v.sets, target: Math.round(target*10)/10, machines: items.length });
  });
  return out;
}

/* Simule (SANS RIEN PERSISTER) ce que donnerait un objectif + un nombre de
   séances/semaine donnés sur CE catalogue de machines : durée moyenne de
   séance et fréquence réelle par muscle. Ajouté le 5 sept. 2026 suite à la
   discussion "combien de séances par semaine pour être opti" — plutôt que de
   deviner un chiffre générique, l'appli calcule la vraie réponse pour TON
   programme actuel et l'affiche dans Options (voir OptionsTab > repère
   "séances recommandées"). Pure fonction, ne modifie ni program ni exercises
   — applyGoalToProgram est déjà pur (retourne un nouveau tableau), donc
   l'appeler ici pour prévisualiser est sans risque. */
/* `profile` ajouté le 12 sept. 2026 — BUG RÉEL trouvé en auditant l'arité des
   appels : cette fonction simulait le programme SANS le profil, donc sans
   l'ordre de priorité choisi (voir applyGoalToProgram, dont le 6e paramètre ne
   sert qu'à ça). Conséquence mesurée sur le programme livré avec "Temps et
   nombre de séances" classé en premier et un plafond à 55 min : l'aperçu
   d'Options annonçait 79 min/séance pendant que le programme réellement
   appliqué tenait à 58 min. L'écart apparaissait exactement sur l'écran où on
   règle ce plafond — l'endroit où il induit le plus en erreur. Paramètre
   optionnel : omis, comportement d'avant (priorité par défaut). */
function previewSessionStats(program, exercises, goal, avgSessions, muscleFocus, profile) {
  var simulated = applyGoalToProgram(program, exercises, goal, avgSessions, muscleFocus, profile);
  var exMap = {}; exercises.forEach(function(e){ exMap[e.id]=e; });
  var dayMinutes = simulated.map(function(d){ return estimateDayMinutes(d, exMap); });
  var avgDayMin = dayMinutes.length ? Math.round(dayMinutes.reduce(function(a,b){return a+b;},0) / dayMinutes.length) : 0;
  var vol = plannedVolume(simulated, exercises, avgSessions);
  var avgFreq = vol.length ? vol.reduce(function(a,v){return a+v.freq;},0) / vol.length : 0;
  var minFreqActual = vol.length ? Math.min.apply(null, vol.map(function(v){return v.freq;})) : 0;
  return { avgDayMin: avgDayMin, avgFreq: avgFreq, minFreqActual: minFreqActual };
}
/* Ajouté le 5 sept. 2026 (demande : "temps par séance min-max... conseille ce
   qu'il faudrait pour être opti") — il n'existe pas de durée de séance
   plafond validée par la littérature (voir OptionsTab > info-bulle "Temps
   par séance" ; le mythe des 45-60 min lié au cortisol est réfuté par de
   larges cohortes, ex. West & Phillips 2012, qui ne trouvent aucun lien
   entre réponse hormonale aiguë et gains à long terme). Ce qui pilote
   vraiment la durée, c'est le nombre de séries à faire pour la cible
   hebdomadaire (GOAL_PRESETS.targetSets) réparti sur le nombre de séances/
   semaine (voir previewSessionStats) : plus de séances/semaine, à volume
   hebdo égal, donne des séances plus courtes. Cette fonction cherche le plus
   petit avgSessions (pas de 0.5, de 2 à 7×/semaine) qui ramène la durée
   moyenne simulée sous maxMinutes SUR TON catalogue de machines actuel — pas
   une estimation générique. Retourne null si même 7×/semaine ne suffit pas
   (catalogue trop limité en machines pour ce muscle, ou plafond trop bas). */
/* Volontairement SANS profil (voir previewSessionStats) : cette fonction et
   pickOptimalAvgSessions cherchent la fréquence qui fait tenir la séance dans
   le plafond SANS rogner de séries. Leur passer le profil appliquerait le
   rognage par le temps à chaque candidat testé, donc toutes les fréquences
   "rentreraient" et la recherche ne voudrait plus rien dire. */
function sessionsNeededForMaxMinutes(program, exercises, goal, maxMinutes, muscleFocus) {
  for (var n=2; n<=7; n+=0.5) {
    if (previewSessionStats(program, exercises, goal, n, muscleFocus).avgDayMin <= maxMinutes) return n;
  }
  return null;
}
/* Ajouté le 5 sept. 2026 (demande : "à chaque réglage de nb de séances et
   temps par séance, il faut que ce soit les séances les plus opti... et
   équilibré") — jusqu'ici, "Appliquer aux séances actuelles" (voir
   reapplyGoalToProgram dans OptionsTab) utilisait toujours le MILIEU de la
   fourchette séances/semaine (avgSessionsPerWeek), sans tenir compte du temps
   par séance visé (sessionMinutesMin/Max) : deux réglages affichés côte à
   côte dans Options mais jamais réellement combinés au moment d'appliquer.
   Cette fonction cherche, PARMI les fréquences comprises DANS la fourchette
   séances/semaine réglée par l'utilisateur (contrairement à
   sessionsNeededForMaxMinutes ci-dessus, qui teste jusqu'à 7×/semaine même
   hors fourchette, à titre de diagnostic seulement) :
     1) celle qui tombe dans la fourchette temps/séance visée, si au moins une
        le permet ;
     2) parmi celles-là, en priorité la plus HAUTE qui respecte aussi le
        repère fréquence/muscle de l'objectif (goalPreset.minFreq) — une
        fréquence plus haute à volume hebdomadaire égal répartit mieux les
        séries (voir Ralston et al. 2018 ; Pelland et al. 2025, déjà cités
        dans l'info-bulle "Séances par semaine") ;
     3) si aucune fréquence de la fourchette ne respecte le repère fréquence,
        celle qui s'en approche le plus (minFreqActual le plus élevé) ;
     4) si aucune fréquence de la fourchette ne tombe dans la fenêtre de
        temps visée, la moins mauvaise (distance minimale à cette fenêtre) —
        reste un point de départ actionnable plutôt que de ne rien proposer.
   Volontairement, ça ne réorganise JAMAIS quel exercice est sur quel jour du
   programme (l'ordre reste celui choisi manuellement dans Programme) : ça
   ajuste uniquement séries/reps/repos par machine via applyGoalToProgram, qui
   répartit déjà l'effort équitablement entre TOUS les muscles sollicités
   (voir allMuscles/muscleWeight) — l'"équilibre" demandé porte sur le volume
   par muscle sur la semaine, pas sur une réorganisation des séances. Pure
   fonction : ne modifie ni program ni exercises. */
/* SESSIONS_MAX_PLAUSIBLE — plafond dur ajouté le 14 sept. 2026. Cette
   fonction énumère les fréquences candidates de 0,5 en 0,5 entre le min et le
   max réglés, et recalcule un programme complet pour chacune. Avec une valeur
   aberrante dans le profil (999999 tapé dans Options, ou un fichier importé),
   ça fait des millions d'itérations : l'appli se fige et l'onglet finit par
   mourir — et comme la valeur est enregistrée, elle remeurt à chaque
   ouverture. Deux séances par jour, 14 par semaine, est déjà au-delà de tout
   ce qui se pratique : au-dessus, on borne au lieu de calculer. */
var SESSIONS_MAX_PLAUSIBLE = 14;
function pickOptimalAvgSessions(program, exercises, goal, sessionsMin, sessionsMax, minutesMin, minutesMax, muscleFocus) {
  var lo = Math.min(sessionsMin||0, sessionsMax||0);
  var hi = Math.max(sessionsMin||0, sessionsMax||0);
  if (!isFinite(lo) || lo < 0) lo = 0;
  if (!isFinite(hi) || hi < 0) hi = 0;
  lo = Math.min(lo, SESSIONS_MAX_PLAUSIBLE);
  hi = Math.min(hi, SESSIONS_MAX_PLAUSIBLE);
  if (!(hi > 0)) { lo = 2; hi = 4; }
  if (!(lo > 0)) lo = hi;
  var minFreq = goalPreset(goal).minFreq || 1;
  var candidates = [];
  for (var n = lo; n < hi - 1e-9; n += 0.5) candidates.push(n);
  candidates.push(hi);
  var scored = candidates.map(function(n){
    var stats = previewSessionStats(program, exercises, goal, n, muscleFocus);
    var inWindow = stats.avgDayMin >= (minutesMin||0) && stats.avgDayMin <= (minutesMax==null?9999:minutesMax);
    var meetsFreq = stats.minFreqActual >= minFreq - 0.01;
    return { n:n, stats:stats, inWindow:inWindow, meetsFreq:meetsFreq };
  });
  var inWinAndFreq = scored.filter(function(s){ return s.inWindow && s.meetsFreq; });
  if (inWinAndFreq.length) return inWinAndFreq.sort(function(a,b){ return b.n-a.n; })[0];
  var inWin = scored.filter(function(s){ return s.inWindow; });
  if (inWin.length) return inWin.sort(function(a,b){ return b.stats.minFreqActual - a.stats.minFreqActual; })[0];
  var mx = minutesMax==null?9999:minutesMax, mn = minutesMin||0;
  return scored.slice().sort(function(a,b){
    var da = a.stats.avgDayMin > mx ? a.stats.avgDayMin-mx : (mn-a.stats.avgDayMin);
    var db = b.stats.avgDayMin > mx ? b.stats.avgDayMin-mx : (mn-b.stats.avgDayMin);
    return da - db;
  })[0];
}

/* Les `overrides` viennent de quatre Stepper éditables (carte "Remplacer X par
   Y ?"). Un Stepper vidé renvoie null — et null était recopié tel quel dans le
   programme, DÉFINITIVEMENT (corrigé le 12 sept. 2026). Effacer "90" dans
   "Repos (s)" sans retaper de valeur, puis appuyer sur Remplacer, donnait
   rest:null : startRestTimer(null) part alors déjà expiré et la sonnerie se
   déclenche à chaque série, à chaque séance, sur cette machine. Même geste sur
   "Séries" donnait sets:null, donc Array.from({length:null}) = aucune ligne à
   remplir : la machine devenait impossible à logger. On ne reprend donc qu'une
   valeur numérique valide, sinon on garde celle déjà en place. */
function applySwap(oldExId, newExId, program, overrides) {
  function pick(v, fallback, floor) {
    return (typeof v === "number" && isFinite(v) && v >= floor) ? v : fallback;
  }
  return program.map(function(d){
    return Object.assign({}, d, { items: d.items.map(function(it){
      if (it.ex !== oldExId) return it;
      var patch = { ex: newExId };
      if (overrides) {
        patch.sets = pick(overrides.sets, it.sets, 1);
        patch.min  = pick(overrides.min,  it.min,  1);
        patch.max  = Math.max(pick(overrides.max, it.max, 1), patch.min);
        patch.rest = pick(overrides.rest, it.rest, 5);
      }
      return Object.assign({}, it, patch);
    }) });
  });
}

/* Adding a machine: propose where it belongs, based on where that muscle is
   already trained, and what sets/reps/repos to start it at — dérivés du
   palier de la machine (poly/semi/iso) ET de l'objectif d'entraînement
   actuel (voir GOAL_PRESETS/tierDefaultsForGoal ci-dessus), pas d'un
   10-15 reps générique fixe comme avant ce menu. `goal` est optionnel :
   à défaut, se comporte comme avant (recomposition). `avgSessions` (voir
   avgSessionsPerWeek) pilote la conversion volume/séance → volume/semaine —
   avant le 4 sept. 2026 c'était figé à SESSIONS_PER_WEEK, sans lien avec le
   réglage réel de fréquence dans Options (voir la note sur SESSIONS_PER_WEEK
   plus haut). Le seuil "en dessous de la cible" utilise maintenant
   goalPreset(goal).targetSets (repère par objectif, voir GOAL_PRESETS) au
   lieu du plancher générique VOL_MIN — un objectif Hypertrophie vise plus
   haut qu'un objectif Force, ça doit se voir dès l'ajout d'une machine. */
function proposePlacement(newEx, exercises, program, goal, avgSessions) {
  var withNew = exercises.concat([newEx]);
  var vol = plannedVolume(program, withNew, avgSessions);
  var newMuscles = allMuscles(newEx);
  var target = goalPreset(goal).targetSets || VOL_MIN;
  /* Multi-muscle (voir allMuscles) : une machine comme Chest Press ajoute du
     volume à CHAQUE muscle qu'elle sollicite en même temps, donc "current"
     retient le muscle le plus en retard des deux (celui qui a le plus besoin
     de cette machine) plutôt qu'un seul muscle arbitraire — perMuscle garde
     le détail de chacun pour l'affichage (voir describePlacement). */
  var perMuscle = newMuscles.map(function(mu){
    var cur = vol.find(function(v){return v.muscle===mu;});
    return { muscle: mu, current: cur ? cur.sets : 0, target: target };
  });
  var current = perMuscle.length ? Math.min.apply(null, perMuscle.map(function(p){return p.current;})) : 0;
  /* Filtre de région ajouté le 13 sept. 2026 (voir machineFitsDay) : une
     machine de hanches n'a rien à faire dans un jour du haut du corps, même si
     ce jour a de la place. */
  var exMapP = {}; withNew.forEach(function(e){ exMapP[e.id] = e; });
  var daysTraining = program.filter(function(d){ return d.items.some(function(it){
    var ex = withNew.find(function(e){return e.id===it.ex;});
    return ex && allMuscles(ex).some(function(mu){ return newMuscles.indexOf(mu)>=0; });
  }); }).filter(function(d){ return machineFitsDay(newEx, d, exMapP); });
  /* Corrigé le 12 sept. 2026 (signalement : "pourquoi y a 2 exos de triceps
     alors que c'est beaucoup plus que 12 séries par semaine ?"). La machine
     ajoutée était placée sur DEUX jours quoi qu'il arrive — y compris quand
     tous ses muscles étaient DÉJÀ au-dessus de leur cible. Sur un triceps
     sollicité en secondaire par trois développés et déjà à 14 séries pour une
     cible de 12, ajouter une deuxième machine dédiée sur deux jours le pousse
     vers 19-22 : chaque machine impose son plancher de 3 séries (Krieger
     2010), donc plus il y a de machines sur un muscle, plus son plancher monte
     — et l'appli ne peut plus redescendre, quoi qu'elle fasse ensuite. Un seul
     jour quand le muscle est déjà servi, et on le DIT (voir
     describePlacement) : ajouter une machine à un muscle déjà au-dessus de sa
     cible, c'est un remplacement qu'on veut, pas un ajout. */
  var allCovered = perMuscle.length > 0 && perMuscle.every(function(p){ return p.current >= p.target; });
  var nDays = allCovered ? 1 : 2;
  var repli = program.filter(function(d){ return machineFitsDay(newEx, d, exMapP); });
  if (!repli.length) repli = program.slice();
  var targets = daysTraining.length > 0 ? daysTraining.slice(0, nDays)
    : repli.sort(function(a,b){return a.items.length-b.items.length;}).slice(0, nDays);
  var tierDef = tierDefaultsForGoal(goal, exerciseOrderTier(newEx));
  var setsEach = current >= target ? tierDef.sets : tierDef.sets + 1;
  return { targets: targets.map(function(d){return d.key;}), targetLabels: targets.map(function(d){return d.label;}),
    setsEach: setsEach, min: tierDef.min, max: tierDef.max, rest: tierDef.rest, current: current, target: target,
    perMuscle: perMuscle, alreadyCovered: allCovered };
}
/* Texte affiché quand on propose où placer une machine qu'on vient d'ajouter
   (voir proposePlacement) — une ligne simple pour un muscle unique, le détail
   de chaque muscle quand la machine en sollicite plusieurs (voir allMuscles). */
function describePlacement(placement) {
  var pm = placement.perMuscle || [];
  /* Phrase ajoutée le 12 sept. 2026 (voir proposePlacement) : quand tous les
     muscles de la machine sont déjà au-dessus de leur cible, le dire tout de
     suite et nommer le vrai remède — remplacer une machine plutôt qu'en
     ajouter une. Sinon l'appli place la machine sans broncher et le
     dépassement n'apparaît que plus tard, dans un tableau d'un autre onglet. */
  var warn = "";
  if (placement.alreadyCovered) {
    var worst = pm.slice().sort(function(a,b){ return (b.current-b.target)-(a.current-a.target); })[0];
    warn = " ATTENTION : "+(pm.length>1?"tous ses muscles sont":"ce muscle est")+" déjà au-dessus de la cible de ton objectif"
      + (worst ? " ("+worst.muscle+" "+worst.current+" pour "+worst.target+" visées)" : "")
      + ", donc elle n'a été mise que sur UN jour, et elle va quand même augmenter ce dépassement : chaque machine impose un plancher de séries que l'appli ne peut plus redescendre. Si tu la préfères à une machine déjà en place, retire l'autre de ce jour (onglet Machines > « Composer les séances ») plutôt que de garder les deux.";
  }
  if (pm.length <= 1) {
    var only = pm[0] || { muscle:"Ce muscle", current: placement.current, target: placement.target };
    return only.muscle+" est actuellement à "+only.current+" séries/semaine"+(only.current<only.target?" — en dessous de la cible "+only.target+" séries/semaine visée par ton objectif actuel.":".")+warn;
  }
  return "Cette machine sollicite "+pm.map(function(p){return p.muscle;}).join(" + ")+", actuellement à "+
    pm.map(function(p){return p.muscle+" "+p.current+"×/sem"+(p.current<p.target?" (sous la cible "+p.target+")":"");}).join(", ")+"."+warn;
}
/* ============================================================
   TYPES DE SPLIT — ajouté le 6 sept. 2026 (demande : "il faudrait pouvoir
   choisir entre full body / lower upper / PPL / et méthode avec rappel que je
   connais pas, et aider l'utilisateur à choisir entre ces différentes options,
   de plus il faut qu'à chaque fois qu'on change de mode, que le programme
   s'ajuste automatiquement").

   Ce que dit la littérature, et ce qu'elle ne dit pas : AUCUN découpage n'est
   supérieur en soi. À volume hebdomadaire égal, les comparaisons directes ne
   trouvent pas de différence robuste entre les découpages (Schoenfeld et al.
   2016 ; Ralston et al. 2018 ; Pelland et al. 2025, déjà cités dans
   GOAL_PRESETS). Ce qui change réellement d'un split à l'autre, c'est la
   FRÉQUENCE par muscle qu'il produit avec TON nombre de séances : un full body
   fait 3 séances/semaine voit chaque muscle 3 fois, un PPL en 3 jours une
   seule fois. C'est pour ça que l'appli ne classe pas les splits dans
   l'absolu : elle SIMULE chacun sur ton matériel et ton rythme réels
   (previewSessionStats) et affiche la fréquence et la durée obtenues, pour que
   le choix se fasse sur des chiffres et pas sur une réputation.

   Les groupes ci-dessous s'appuient sur les tables REGION et PUSHPULL déjà
   utilisées ailleurs, plus un groupe "jambes" et un groupe "tronc" pour ne
   perdre aucun muscle. Le tronc est rattaché à chaque jour des splits courts
   (il ne fatigue pas les mêmes structures) et à un jour sur deux ailleurs. */
var SPLIT_GROUPS = {
  all: function(){ return true; },
  upper: function(mu){ return REGION[mu]==="haut"; },
  lower: function(mu){ return REGION[mu]==="bas"; },
  legs: function(mu){ return REGION[mu]==="bas"; },
  push: function(mu){ return PUSHPULL[mu]==="push"; },
  pull: function(mu){ return PUSHPULL[mu]==="pull"; },
  core: function(mu){ return REGION[mu]==="core"; },
  chestback: function(mu){ return mu==="Pectoraux"||mu==="Dos"||mu==="Trapèzes"; },
  shoulderarms: function(mu){ return mu==="Épaules"||mu==="Deltoïdes post."||mu==="Biceps"||mu==="Triceps"||mu==="Avant-bras"; },
};
var SPLIT_TEMPLATES = [
  { k:"full", label:"Full body", sessions:"3 séances/semaine",
    summary:"Tous les muscles à chaque séance.",
    why:"La fréquence par muscle la plus haute pour un petit nombre de séances : 3 séances = 3 passages par muscle. Séances longues et variées, peu de place pour le volume par muscle dans une même séance.",
    days:[{label:"Full A",g:["all"]},{label:"Full B",g:["all"]},{label:"Full C",g:["all"]}] },
  { k:"upper_lower", label:"Haut / Bas", sessions:"4 séances/semaine",
    summary:"Le haut du corps un jour, le bas le lendemain.",
    why:"Le meilleur compromis à 4 séances : chaque muscle revient 2 fois par semaine, avec assez de place dans la séance pour du volume par muscle.",
    /* Le gainage était sur "Haut A" et "Bas B", c'est-à-dire les jours 1 et 4
       d'une rotation de quatre : une fois la rotation bouclée, ça fait deux
       jours de SUITE (corrigé le 13 sept. 2026). L'écart de récupération du
       haut/bas retombait à 1 jour — or c'est précisément le chiffre sur lequel
       l'appli conseille un split quand les séances s'enchaînent. Le gainage
       passe sur les deux jours du BAS (jours 2 et 4, donc deux jours d'écart
       dans les deux sens) ; ce sont aussi les séances les plus courtes. */
    days:[{label:"Haut A",g:["upper"]},{label:"Bas A",g:["lower","core"]},{label:"Haut B",g:["upper"]},{label:"Bas B",g:["lower","core"]}] },
  { k:"ppl", label:"Push / Pull / Legs", sessions:"3 séances/semaine",
    summary:"Poussée (pecs, épaules, triceps), tirage (dos, biceps), jambes.",
    why:"Regroupe les muscles qui travaillent ensemble, donc peu de chevauchement d'une séance à l'autre. En 3 séances/semaine chaque muscle n'est vu qu'UNE fois — en dessous du repère de 2×/semaine.",
    days:[{label:"Poussée",g:["push"]},{label:"Tirage",g:["pull"]},{label:"Jambes",g:["legs","core"]}] },
  { k:"ppl6", label:"Push / Pull / Legs ×2", sessions:"6 séances/semaine",
    summary:"Le PPL parcouru deux fois par semaine.",
    why:"Même logique que le PPL, mais chaque muscle revient 2 fois par semaine. Demande 6 séances : à moins, la rotation avance trop lentement et la fréquence retombe.",
    days:[{label:"Poussée A",g:["push"]},{label:"Tirage A",g:["pull"]},{label:"Jambes A",g:["legs","core"]},
          {label:"Poussée B",g:["push"]},{label:"Tirage B",g:["pull"]},{label:"Jambes B",g:["legs","core"]}] },
  { k:"arnold", label:"Pecs-Dos / Épaules-Bras / Jambes", sessions:"3 à 6 séances/semaine",
    summary:"Une variante classique (dite « Arnold ») qui associe les antagonistes.",
    why:"Alterner un exercice de pecs et un de dos permet de récupérer d'un groupe pendant qu'on travaille l'autre, donc des séances un peu plus denses à temps égal. Le reste ne diffère pas d'un PPL sur le fond.",
    days:[{label:"Pecs / Dos",g:["chestback"]},{label:"Épaules / Bras",g:["shoulderarms","core"]},{label:"Jambes",g:["legs"]}] },
  { k:"fullbody4", label:"Full body ×4", sessions:"4 séances/semaine",
    summary:"Full body, mais réparti sur quatre séances plus courtes.",
    why:"La fréquence la plus élevée possible (4 passages par muscle) avec des séances courtes. Peu de volume par muscle et par séance, ce qui limite la fatigue accumulée en fin de séance.",
    days:[{label:"Full A",g:["all"]},{label:"Full B",g:["all"]},{label:"Full C",g:["all"]},{label:"Full D",g:["all"]}] },
];
function splitTemplate(k){ return SPLIT_TEMPLATES.find(function(t){ return t.k===k; }) || null; }
/* Région dominante d'un jour (haut / bas / core), DÉDUITE de ce qu'il contient
   déjà — pas de son libellé, qui peut être n'importe quoi après un changement
   de split. Ajouté le 13 sept. 2026 sur signalement : "y a des séries de
   hanche en upper alors qu'il faut pas, puisque j'enchaîne plusieurs séances à
   la suite".

   C'était exact et c'est un vrai trou : la recomposition ajoutait une machine
   au jour qui faisait le plus baisser son score, sans AUCUNE notion de haut ou
   de bas du corps. Sur ses données réelles, Adduction et Abduction des Hanches
   s'étaient retrouvées dans "Haut A" — donc travaillées le jour du haut PUIS
   le lendemain sur le jour du bas, exactement ce qu'un découpage haut/bas sert
   à éviter quand on enchaîne les séances.

   Le tronc (abdominaux, obliques, lombaires) n'est volontairement pas
   contraint : il se place partout, c'est déjà la convention du fichier (voir
   SPLIT_TEMPLATES, où "core" est rattaché à plusieurs jours). */
function dayRegion(day, exMap) {
  var n = { haut:0, bas:0 };
  (day.items||[]).forEach(function(it){
    var ex = exMap[it.ex]; if (!ex) return;
    var r = REGION[allMuscles(ex)[0]];
    if (r === "haut" || r === "bas") n[r] += 1;
  });
  if (n.haut === n.bas) return null;         // jour mixte ou vide : aucune contrainte
  return n.haut > n.bas ? "haut" : "bas";
}
/* Cette machine a-t-elle sa place dans ce jour-là ? */

   ou les jours A/B d'un même groupe), elle est répartie en alternance pour
   équilibrer les journées plutôt que de tout empiler sur la première. Les

   donc le résultat respecte l'objectif, l'ordre de priorité et les bornes. */

  var accents = [C.pin, C.green, C.steel, C.rust, C.bone, C.taupe];
  var days = tpl.days.map(function(d, i){
    return { key: tplKey+"-"+i, label: d.label, accent: accents[i % accents.length], items: [], def: d };
  });
  var pool = exercises.filter(function(e){ return !isCardio(e) && exerciseAvailableAtGym(e, gymId); });

     alternait par MUSCLE (1re machine de pectoraux au jour 1, 2e au jour 2...).
     Sur un full body, où chaque jour accepte tous les muscles, la plupart des
     muscles n'ont qu'une ou deux machines : elles atterrissaient donc presque
     toutes sur le premier jour — 17 machines le jour 1 contre 7 et 5 ensuite.
     On choisit maintenant, parmi les jours qui acceptent ce muscle, celui qui
     a le MOINS de machines au total ; à égalité, celui qui en a le moins pour
     ce muscle précis (pour ne pas concentrer un muscle sur un seul jour) ;
     puis l'ordre des jours, pour rester déterministe. */
  var perDayMuscle = days.map(function(){ return {}; });

    var mu = allMuscles(e)[0];

    days.forEach(function(d, i){
      if (!dayAcceptsMuscle(d.def, mu)) return;
      if (best === null) { best = d; bestIdx = i; return; }
      var a1 = d.items.length, b1 = best.items.length;
      if (a1 !== b1) { if (a1 < b1) { best = d; bestIdx = i; } return; }

      if (a2 < b2) { best = d; bestIdx = i; }

    perDayMuscle[bestIdx][mu] = (perDayMuscle[bestIdx][mu] || 0) + 1;

  });
  var exMap = {}; exercises.forEach(function(e){ exMap[e.id]=e; });
  return days.filter(function(d){ return d.items.length > 0; })
    .map(function(d){ return { key:d.key, label:d.label, accent:d.accent,
      items: sortByExerciseOrder(d.items, function(it){return it.ex;}, exMap) }; });
}
/* Placer (ou retirer) le cardio dans le programme — ajouté le 17 sept. 2026.

   RÈGLE STRUCTURELLE, à ne jamais contourner : le cardio vit dans `day.cardio`,
   JAMAIS dans `day.items`. Tout le moteur de volume (plannedVolume, allocation
   des séries, reflow, plafond par séance, diagnostics) raisonne en séries par
   muscle ; y glisser un vélo obligerait à ajouter une exception dans une
   trentaine d'endroits, et il suffirait d'en oublier un pour que le volume
   soit faux en silence — exactement le bug qui a déjà coûté deux jours ici
   ("ça compte bien mal"). Le cardio est donc une couche à part, ajoutée par
   cette fonction et lue uniquement par l'affichage, la durée et les calories.

    .filter(function(d){ return !isCardioOnlyDay(d); })
    .map(function(d){

         rendre exactement le programme d'avant, à l'octet près (test). */

function makeCardioDay(i, exId, minutes, zone) {

  if (!exId) return base;                     // aucun appareil de cardio dans cette salle

    for (i = 0; i < plan.sessions; i++) seuls.push(makeCardioDay(i, exId, plan.minutes, plan.zone));

    var creneaux = repartirCreneaux(base.length, plan.sessions);
    return base.map(function(d, idx){
      return creneaux.indexOf(idx) >= 0
        ? Object.assign({}, d, { cardio: [{ ex: exId, min: plan.minutes, zone: plan.zone }] })

/* Changer de mode d'entraînement, profil ET programme dans le même geste
   (même logique que applyBalanceOrTimeChange pour l'objectif).

   Le seul cas délicat est "cardio seul" : il n'y a plus de séance de muscu
   dans le programme. Plutôt que de jeter un programme réglé machine par
   machine, on le MET EN PAUSE dans le profil (programMuscuEnPause) et on le
   rend tel quel dès qu'on repasse en "muscu seule" ou "les 2". Rien n'est
   perdu, et faire l'aller-retour redonne exactement le programme d'avant —
   c'est vérifié par un test. */
function applyTrainingModeChange(mode, program, exercises, profile) {

    if (muscu && muscu.length) nouveau.programMuscuEnPause = muscu;
    return { profile: nouveau, program: applyCardioToProgram(program, exercises, nouveau) };
  }
  var base = program;
  if (!musculationDays(program).length && profile && profile.programMuscuEnPause && profile.programMuscuEnPause.length) {

  var total = plan.sessions * plan.minutes;
  if (plan.mode === "cardio") {
    return { mode: "cardio", plan: plan, total: total, separe: true,

/* Simule chaque split sur le matériel et le rythme réels, pour que le choix se
   fasse sur des chiffres (voir la note en tête de section). Renvoie pour
   chacun : fréquence moyenne par muscle, durée moyenne de séance, score
   d'optimisation et nombre de muscles sous leur cible. */
/* Écart de récupération — ajouté le 6 sept. 2026 en réponse à "si je m'entraîne
   3 jours à la suite, vaut mieux quel split ?". L'appli ne regardait que la
   FRÉQUENCE, donc elle aurait conseillé un full body même à quelqu'un qui
   enchaîne ses séances — c'est-à-dire les mêmes muscles trois jours de rang,
   sans récupération. C'était un angle mort réel.

   Repère utilisé : MacDougall et al., "The time course for elevated muscle
   protein synthesis following heavy resistance exercise", Canadian Journal of
   Applied Physiology 1995 — la synthèse protéique musculaire monte à +50% à
   4 h, culmine à +109% à 24 h, puis redescend et n'est plus significativement
   différente du repos à 36 h. Réentraîner un muscle AVANT ~36-48 h revient
   donc à empiler des séries sur une réponse déjà en cours, sur un muscle
   encore fatigué de la veille — d'où un écart d'au moins 2 jours entre deux
   séances touchant le même muscle quand on s'entraîne en jours consécutifs.

   Cette fonction renvoie, pour un programme donné et en supposant les séances
   faites À LA SUITE, le plus petit nombre de jours séparant deux séances qui
   travaillent un même muscle (en tenant compte du bouclage de la rotation).
   Full body = 1 (mêmes muscles le lendemain), PPL 3 jours = 3, Haut/Bas
   4 jours = 2. */
function minRecoveryGap(program, exercises){
  var exMap = {}; exercises.forEach(function(e){ exMap[e.id]=e; });
  /* Un muscle ne "compte" pour un jour que s'il y reçoit une sollicitation
     RÉELLE — corrigé le 6 sept. 2026 après mesure : la première version
     comptait tout muscle listé, secondaires compris, et concluait donc qu'un
     PPL faisait revenir un muscle dès le lendemain. En cause, le trapèze à
     0,5× sur le développé épaules (jour poussée) alors qu'il est un muscle de
     tirage : une trace de 1,5 série ne justifie pas de dire qu'on "retravaille
     le trapèze". Un muscle est retenu s'il est le muscle PRINCIPAL d'au moins
     une machine du jour, ou si ce jour lui apporte au moins un tiers de son
     volume sur tout le programme. */
  var total = {};
  program.forEach(function(d){ d.items.forEach(function(it){
    var ex = exMap[it.ex]; if (!ex) return;
    allMuscles(ex).forEach(function(mu){ total[mu] = (total[mu]||0) + it.sets*muscleWeight(ex,mu); });
  }); });
  var dayMuscles = program.map(function(d){
    var load = {}, primary = {};
    d.items.forEach(function(it){
      var ex = exMap[it.ex]; if (!ex) return;
      var ms = allMuscles(ex);
      if (ms.length) primary[ms[0]] = true;
      ms.forEach(function(mu){ load[mu] = (load[mu]||0) + it.sets*muscleWeight(ex,mu); });
    });
    var set = {};
    Object.keys(load).forEach(function(mu){
      if (primary[mu] || (total[mu] > 0 && load[mu] >= total[mu]/3)) set[mu] = true;
    });
    return set;
  });
  var n = dayMuscles.length;
  if (n <= 1) return n === 1 ? 1 : 0;
  var min = n;
  for (var i=0;i<n;i++) for (var j=i+1;j<n;j++) {
    var shared = Object.keys(dayMuscles[i]).some(function(mu){ return dayMuscles[j][mu]; });
    if (!shared) continue;
    var gap = Math.min(j-i, n-(j-i)); // la rotation boucle
    if (gap < min) min = gap;
  }
  return min;
}
/* Ajouté le 6 sept. 2026 — l'écran "Type de split" expliquait longuement
   qu'aucun découpage n'est supérieur à un autre, listait les alternatives et
   proposait "Changer"... sans jamais NOMMER celui qui est actif. Pour le
   savoir il fallait ouvrir le sélecteur et repérer celui qui portait la
   pastille. Le découpage n'est stocké nulle part (le programme est la seule
   source de vérité, et il reste modifiable jour par jour dans "Composer les
   séances") : on le retrouve donc en comparant les libellés de jours du
   programme à ceux de chaque modèle. Si rien ne correspond — programme
   remanié à la main — on le dit au lieu d'inventer un nom. */
function detectSplitKind(program){
  if (!program || !program.length) return null;
  var labels = program.map(function(d){ return String(d.label||"").toLowerCase().trim(); });
  for (var i=0;i<SPLIT_TEMPLATES.length;i++){
    var t = SPLIT_TEMPLATES[i];
    if (t.days.length !== labels.length) continue;
    var want = t.days.map(function(d){ return String(d.label).toLowerCase().trim(); });
    var same = want.every(function(w,j){ return w === labels[j]; });

function evaluateSplits(exercises, goal, avgSessions, muscleFocus, gymId, profile){
  return SPLIT_TEMPLATES.map(function(tpl){
    var prog = buildProgramFromSplit(tpl.k, exercises, goal, gymId);
    if (!prog || !prog.length) return { tpl: tpl, ok: false };
    var applied = applyGoalToProgram(prog, exercises, goal, avgSessions, muscleFocus, profile);
    var exMap = {}; exercises.forEach(function(e){ exMap[e.id]=e; });
    var vol = plannedVolume(applied, exercises, avgSessions);
    var mins = applied.map(function(d){ return estimateDayMinutes(d, exMap); });
    var target = goalPreset(goal).targetSets || VOL_MIN;
    return { tpl: tpl, ok: true, program: applied,
      days: applied.length,
      avgMin: Math.round(mins.reduce(function(a,b){return a+b;},0)/mins.length),
      minFreq: vol.length ? Math.min.apply(null, vol.map(function(v){return v.freq;})) : 0,
      avgFreq: vol.length ? vol.reduce(function(a,v){return a+v.freq;},0)/vol.length : 0,

      gap: minRecoveryGap(applied, exercises),

function applyPlacement(newEx, placement, exercises, program) {
  return program.map(function(d){

      ? Object.assign({}, d, { items: d.items.concat([{ ex: newEx.id, sets: placement.setsEach, min: placement.min, max: placement.max, rest: placement.rest }]) })
      : d;
  });
}

/* Ajouté le 6 sept. 2026 — conséquence directe de l'audit qui a introduit
   MAX_SETS_PER_EXERCISE et cappedMuscles (voir ces deux notes).

   Le constat, mesuré sur le programme livré : 11 muscles restent sous la
   cible hebdomadaire de l'objectif UNIQUEMENT parce que trop peu de machines
   les travaillent dans les séances — les pectoraux, le dos et les épaules
   plafonnent tous à 8,8 séries/semaine sur 12 visées avec seulement 2
   machines chacun. Or le catalogue contient déjà 6 machines qui ne sont dans
   AUCUNE séance (Développé du Tronc, les deux butterfly pectoraux, Upper
   Back, Tirage Horizontal, Élévation Latérale) : de quoi combler exactement
   les trois muscles les plus en retard, sans rien acheter ni rien découvrir
   en salle. Le programme d'origine a simplement été écrit à la main avant
   que ces machines soient toutes renseignées, et rien ne reliait les deux.

   Cette fonction fait ce rapprochement : pour chaque muscle plafonné, elle
   cherche une machine du catalogue absente du programme qui le travaille, et
   renvoie de quoi la placer via applyPlacement (déjà utilisé par le flux
   "Ajouter du matériel"). Choix du candidat, dans l'ordre : le poids le plus
   fort sur le muscle en retard (une machine dédiée plutôt qu'un secondaire),
   puis une machine confirmée plutôt qu'une encore "à vérifier" (même critère
   que bestCandidate), puis le nombre de muscles plafonnés qu'elle couvre
   d'un coup, puis l'ordre du catalogue pour rester déterministe.
   Une machine n'est proposée qu'UNE fois, et les muscles qu'elle couvre sont
   considérés comme traités pour les tours suivants — sinon un Upper Back
   (Dos + Biceps) serait proposé deux fois.
   Pure fonction : ne modifie ni program ni exercises, et ne propose que des
   machines réellement disponibles dans la salle en cours (voir
   exerciseAvailableAtGym) — inutile de suggérer une machine d'une autre
   salle pour combler un manque ici. */
/* Élargi le 6 sept. 2026 (demande : "mettre à jour le programme pour optimiser
   encore avec ces nouvelles machines") : la version précédente ne proposait une
   machine que pour un muscle PLAFONNÉ, c'est-à-dire dont toutes les machines du
   programme étaient déjà à 5 séries. Conséquence : ajouter une machine au
   matériel ne servait à rien tant que ce cas précis n'était pas atteint, alors
   qu'un muscle simplement SOUS SA CIBLE profiterait tout autant d'un créneau de
   plus. On part maintenant de tous les muscles sous leur cible, du plus en
   retard au moins en retard. cappedMuscles reste utilisé à part, pour EXPLIQUER
   pourquoi un muscle bloque. */
function musclesBelowTarget(program, exercises, goal, avgSessions, muscleFocus) {
  var baseTarget = goalPreset(goal).targetSets || VOL_MIN;
  return plannedVolume(program, exercises, avgSessions).map(function(v){
    var target = baseTarget * focusMultiplier(muscleFocus, v.muscle);
    return { muscle: v.muscle, sets: v.sets, target: Math.round(target*10)/10 };
  }).filter(function(v){ return v.sets < v.target - 0.05; });
}
function suggestProgramCompletion(program, exercises, goal, avgSessions, muscleFocus, gymId) {
  var baseTarget = goalPreset(goal).targetSets || VOL_MIN;
  var capped = musclesBelowTarget(program, exercises, goal, avgSessions, muscleFocus);
  if (!capped.length) return [];
  var inProgram = {};
  program.forEach(function(d){ d.items.forEach(function(it){ inProgram[it.ex] = true; }); });
  /* Compter aussi les machines que tu fais DÉJÀ dans cette salle en tant que
     remplaçantes d'une machine du programme indisponible ici (13 sept. 2026).
     Sans ça, l'appli proposait d'"ajouter" une machine que tu es en train de
     faire à chaque séance : c'est la moitié visible du va-et-vient signalé —
     on l'ajoute, la recomposition la retire (elle fait doublon avec celle
     qu'elle remplaçait), et l'écran la repropose au tour suivant. */
  if (gymId) {
    var exMapG = {}; exercises.forEach(function(e){ exMapG[e.id] = e; });
    program.forEach(function(d){
      adaptDayItems(d.items, exercises, exMapG, gymId).forEach(function(it){ inProgram[it.ex] = true; });

  /* Le cardio ne fait pas partie du volume par muscle et vit dans day.cardio,
     jamais dans day.items (voir isCardio) : il n'a rien à faire ici. */
  var pool = exercises.filter(function(e){ return !inProgram[e.id] && !isCardio(e) && exerciseAvailableAtGym(e, gymId); });
  if (!pool.length) return [];

  var pending = {}; capped.forEach(function(c){ pending[c.muscle] = c; });
  var chosen = {}, out = [];
  // Muscles traités du plus en retard au moins en retard (ratio sets/cible).
  var order = capped.slice().sort(function(a,b){ return (a.sets/a.target) - (b.sets/b.target); });
  order.forEach(function(c){
    if (!pending[c.muscle]) return;
    var best = null, bestKey = null;
    pool.forEach(function(e, i){
      if (chosen[e.id]) return;
      var w = allMuscles(e).indexOf(c.muscle) >= 0 ? muscleWeight(e, c.muscle) : 0;
      if (w <= 1e-9) return;
      var alsoCovers = allMuscles(e).filter(function(mu){ return mu!==c.muscle && pending[mu]; }).length;
      var key = [ -w, e.brand === "?" ? 1 : 0, -alsoCovers, i ];
      if (best === null) { best = e; bestKey = key; return; }
      for (var k=0; k<key.length; k++) {
        if (key[k] !== bestKey[k]) { if (key[k] < bestKey[k]) { best = e; bestKey = key; } return; }
      }
    });
    if (!best) return;
    var placement = proposePlacement(best, exercises.filter(function(e){ return e.id!==best.id; }), program, goal, avgSessions);
    /* Ajouté le 13 sept. 2026, trouvé en montant le catalogue de départ à 29
       machines : la suggestion regardait seulement le muscle EN RETARD, jamais
       ce que la machine proposée faisait aux autres. Sur un catalogue où deux
       marques proposent le même mouvement, ça donnait "ajoute l'Arm curl" pour
       remonter les AVANT-BRAS (0,5 en secondaire, et aucune machine ne les
       travaille en principal, donc la cible est de toute façon inatteignable)
       — au prix de 21 séries de biceps par semaine pour une cible de 12. C'est
       exactement le "pourquoi y a 2 exos de triceps ?!" signalé le 12 sept.,
       vu du côté de la suggestion au lieu de la recomposition.
       Une suggestion qui pousse un muscle au-dessus du plafond que la
       recomposition elle-même s'interdit (cible +15 %, cf.
       programHorsFourchette) est donc écartée : elle serait défaite au tour
       suivant, ce qui recrée le va-et-vient ajouter/retirer. */
    /* Simulation faite APRÈS application de l'objectif : c'est le nombre de
       séries que l'appli attribuerait réellement, pas les 3 séries du
       placement brut — sans ça le débordement ne se voit pas ici. */
    var avant = plannedVolume(applyGoalToProgram(program, exercises, goal, avgSessions, muscleFocus, null), exercises, avgSessions);
    var apres = plannedVolume(applyGoalToProgram(applyPlacement(best, placement, exercises, program), exercises, goal, avgSessions, muscleFocus, null), exercises, avgSessions);
    /* Même arbitrage que dans la recomposition (voir evalMove, 14 sept. 2026) :
       ce que la machine comble sous la cible compte triple, ce qu'elle crée
       au-dessus compte pour un demi, et un "gain" sur un muscle sans machine
       dédiée ne compte pas du tout. */
    var sansMachineS = musclesSansMachineDediee(exercises);
    var gainS = 0, coutS = 0;
    apres.forEach(function(v){
      var cibleV = baseTarget * focusMultiplier(muscleFocus || {}, v.muscle);
      var av = avant.find(function(x){ return x.muscle === v.muscle; });
      if (!(cibleV > 0) || !av) return;
      if (!sansMachineS[v.muscle]) gainS += Math.max(0, Math.min(v.sets, cibleV) - Math.min(av.sets, cibleV));
      coutS += Math.max(0, v.sets - Math.max(av.sets, cibleV));
    });
    if (coutS > 6 * gainS + 0.05) return;
    chosen[best.id] = true;
    out.push({ ex: best, forMuscle: c.muscle, covers: allMuscles(best).filter(function(mu){ return !!pending[mu]; }), placement: placement });
    allMuscles(best).forEach(function(mu){ delete pending[mu]; });
  });
  return out;
}

/* Remet le PROGRAMME en cohérence avec la liste des machines, après un ajout
   ou un retrait (demande du 7 sept. 2026 : "quand j'enlève une machine ou
   ajoute une machine faut que le programme se mette à jour directement pour
   correspondre et être le plus opti avec la liste rafraîchie des machines
   possibles").

   Ce qui existait avant ne faisait qu'une PARTIE du travail, et jamais tout
   seul :
   - à l'ajout, la machine entrait dans le matériel mais restait hors des
     séances tant qu'on n'avait pas repéré et validé la carte "où la placer" —
     donc une machine ajoutée puis oubliée ne servait à rien ;
   - au retrait, removeWithSubstitution remplaçait la machine par une seule
     équivalente en gardant le même nombre de séries, sans jamais reconsidérer

      .forEach(function(v){ dejaAuPlafond[v.muscle] = v.sets; });
    /* Excédent de volume PAR SÉANCE avant ce tour (SESSION_VOLUME_CAP,
       Remmert et al. 2025) — voir le refus dans evalMove ci-dessous. */
    function excesParSeance(p){
      return sessionVolumeOvershoot(p, exercises, goal)
        .reduce(function(a, o){ return a + (o.sets - o.cap); }, 0);

      if (!cand || cand === prog) return;
      var applied = applyGoalToProgram(cand, exercises, goal, avgSessions, muscleFocus, profile);
      var sc = programBalancePenalty(applied, exercises, goal, avgSessions, muscleFocus, profile, {corridor:true});
      var lg = longestDay(applied);
      /* GARDE-FOU DE DURÉE, appliqué à TOUS les ordres de priorité depuis le
         12 sept. 2026. La règle « dépasser le temps visé plutôt que rogner
         l'équilibrage » a été écrite pour le nombre de SÉRIES ; l'étendre au
         nombre de MACHINES donnait des séances de 127 min, ce que personne ne
         fera. On refuse donc un ajout qui pousse la séance la plus longue
         au-delà de la fourchette réglée, sauf s'il ne l'allonge pas davantage
         qu'elle ne l'est déjà. Le manque de volume qui en résulte n'est pas
         masqué : il reste visible dans "Volume prévu par semaine" et expliqué
         par le diagnostic de l'onglet Machines — mieux vaut le dire que
         prescrire une séance de deux heures. */

         est une borne, pas une préférence : aucun coup ne peut faire passer un
         muscle au-dessus du plafond s'il n'y était pas déjà. La pénalité seule
         ne suffisait pas (elle se laissait acheter quand le coup servait
         beaucoup un autre muscle). */
      var depasse = false;
      var baseT = goalPreset(goal).targetSets || VOL_MIN;
      plannedVolume(applied, exercises, avgSessions).forEach(function(v){
        var f = focusMultiplier(muscleFocus || {}, v.muscle);
        var plafond = Math.max(baseT * f, VOL_MAX * f);
        if (v.sets > plafond + 0.05 && !(dejaAuPlafond[v.muscle] >= v.sets - 0.05)) depasse = true;
      });
      if (depasse) return;
      /* SYMÉTRIQUE du refus ci-dessus, ajouté le 13 sept. 2026 sur signalement
         ("ça réajuste pas correctement, Dos est toujours à 10").

         Ce qui se passait : pour faire redescendre le biceps (16,5 pour une
         cible de 12, donc DANS la fourchette 12-20 acceptée), la recomposition
         retirait le Tirage vertical — qui fait aussi travailler le dos. Le dos
         tombait à 10, c'est-à-dire SOUS la cible. Puis l'écran Machines
         proposait aussitôt de remettre cette même machine pour combler le dos :
         l'appli défaisait d'un côté ce qu'elle réclamait de l'autre.

         La règle posée est "entre 12 et 20, au plus près de 12, jamais en
         dessous de 12". Le plancher n'était qu'un poids fort dans le score
         (×10), donc franchissable si le gain ailleurs était suffisant. Il
         devient un REFUS SEC : aucun mouvement ne peut faire passer un muscle
         sous sa cible s'il ne l'était pas déjà. Un muscle déjà en dessous peut
         encore bouger (sinon plus rien ne serait réparable). */
      var chute = false;
      plannedVolume(applied, exercises, avgSessions).forEach(function(v){
        var f2 = focusMultiplier(muscleFocus || {}, v.muscle);
        var cible = baseT * f2;
        var avant = dejaAuPlafond[v.muscle];
        if (v.sets < cible - 0.05 && !(avant != null && avant < cible - 0.05)) chute = true;
      });
      if (chute) return;
      /* AJOUT QUI COÛTE PLUS QU'IL NE RAPPORTE — refusé depuis le 13 sept. 2026,
         trouvé en montant le catalogue de départ à 29 machines (plusieurs fois
         le même mouvement selon la marque ou la salle).

         Mesuré sur le programme livré à 4 séances/semaine : pour remonter les
         AVANT-BRAS — qu'aucune machine ne travaille en principal, dont la cible
         est donc inatteignable — la recomposition ajoutait une SECONDE machine
         de biceps (+2,5 séries d'avant-bras, toujours sous la cible) en poussant
         le biceps de 16 à 20 séries pour une cible de 12 ; puis, la séance étant
         saturée, elle retirait le Tirage vertical et le DOS tombait à 10. C'est
         mot pour mot le double signalement du 12-13 sept. ("pourquoi y a 2 exos
         de biceps/triceps ?!" et "le dos est toujours à 10").

         Règle posée, sans seuil arbitraire : un AJOUT de machine doit rapporter
         au moins autant qu'il ne coûte. Ce qu'il rapporte = le manque comblé
         sous la cible ; ce qu'il coûte = l'excédent créé au-dessus. Un ajout qui
         creuse plus qu'il ne comble est refusé. Les déplacements et les retraits
         ne sont pas concernés : ils ne peuvent pas créer ce déséquilibre-là. */
      if (ajout) {
        /* Révisé le 14 sept. 2026 sur son état réel. Deux corrections :
           - un gain sur un muscle SANS MACHINE DÉDIÉE (voir
             musclesSansMachineDediee) ne compte pas : c'est ce qui faisait
             passer l'ajout d'une deuxième machine de biceps pour un progrès,
             au prétexte de remonter des avant-bras qui resteront sous leur
             cible de toute façon ;
           - combler un manque vaut plus cher que créer un excès, dans le même
             rapport que le reste du moteur (manque ×3 contre excès ×0,5) :
             sinon un ajout utile était refusé pour un dépassement secondaire
             plus gros que le manque comblé. Mesuré chez lui : le Reverse Fly,
             seule machine capable de remonter les deltoïdes postérieurs de 10
             à 12, était refusé parce qu'il ajoutait 2,7 séries de trapèzes
             pour 2 séries de deltoïdes gagnées. C'est pourtant exactement
             l'échange voulu : "jamais moins de 12" passe avant "au plus près
             de 12". */
        var sansMachineA = musclesSansMachineDediee(exercises);
        var gain = 0, cout = 0;
        plannedVolume(applied, exercises, avgSessions).forEach(function(v){
          var cibleV = baseT * focusMultiplier(muscleFocus || {}, v.muscle);
          var av = dejaAuPlafond[v.muscle];
          if (!(cibleV > 0) || av == null) return;
          if (!sansMachineA[v.muscle]) gain += Math.max(0, Math.min(v.sets, cibleV) - Math.min(av, cibleV));
          cout += Math.max(0, v.sets - Math.max(av, cibleV));
        });
        if (cout > 6 * gain + 0.05) return;
      }
      /* REPÈRE DE VOLUME PAR SÉANCE, ajouté le 13 sept. 2026 en montant le
         catalogue de départ à 29 machines. La recomposition raisonnait
         uniquement en volume HEBDOMADAIRE : elle regroupait volontiers quatre
         machines d'ischio-jambiers le même jour (12,5 séries fractionnaires
         dans la séance pour un repère de 11) — puis l'onglet Machines
         signalait ce dépassement que la recomposition venait elle-même de
         créer. Les deux vues de l'appli se contredisaient.
         Un coup qui AGGRAVE le dépassement par séance est donc refusé ; un
         programme déjà au-dessus peut encore bouger, sinon plus rien ne serait
         réparable. Le remède, quand le total hebdomadaire est bon, n'est pas de
         rogner des séries mais de répartir ces machines sur des jours
         différents — ce que ce refus force la recomposition à faire. */
      if (excesParSeance(applied) > excesAvant + 0.05) return;

       est pas encore. On essaie TOUTES les propositions, pas seulement la
       première : s'arrêter au premier refus laissait de côté des machines qui
       auraient comblé un autre muscle. */
    var sugg = suggestProgramCompletion(prog, exercises, goal, avgSessions, muscleFocus, gymId);
    (sugg || []).forEach(function(su){ evalMove(applyPlacement(su.ex, su.placement, exercises, prog), true); });

    /* Coup 2 — AJOUTER UN JOUR À UNE MACHINE DÉJÀ PRÉSENTE. Levier ajouté le
       12 sept. 2026, sans lequel la règle « jamais moins de 12 » est
       inatteignable pour beaucoup de muscles.

       Mesuré : les pectoraux plafonnaient à 8,8 séries/semaine pour une cible
       de 12 — deux machines seulement les travaillaient, toutes deux DÉJÀ au
       maximum de 5 séries. 2 machines × 5 séries × 0,875 (un jour revient 0,88
       fois par semaine à 3,5 séances sur 4 jours) = 8,8, et pas un dixième de
       plus. Aucun réglage de séries ne pouvait y changer quoi que ce soit :
       le plafond n'était pas dans l'algorithme, il était dans le nombre de
       créneaux disponibles. Refaire passer une machine un second jour est le
       seul moyen d'aller plus haut sans inventer du matériel — et ça monte
       aussi la fréquence hebdomadaire du muscle, ce que la littérature
       recommande par ailleurs (Ralston et al. 2018).

       Restreint aux machines qui touchent un muscle sous sa cible, sinon on
       évaluerait tout le catalogue × tous les jours à chaque tour. */
    prog.forEach(function(day, di){
      exercises.forEach(function(ex){
        if (!ex || isCardio(ex) || !exerciseAvailableAtGym(ex, gymId)) return;
        if (day.items.some(function(it){ return it.ex === ex.id; })) return;
        if (!allMuscles(ex).some(function(mu){ return sousCible[mu]; })) return;
        /* Pas de machine du bas du corps dans un jour du haut, ni l'inverse
           (voir machineFitsDay) — le découpage haut/bas ne sert à rien si la
           recomposition le traverse pour gagner quelques séries. */
        if (!machineFitsDay(ex, day, exMap)) return;
        var modele = null;
        prog.forEach(function(d){ d.items.forEach(function(it){ if (it.ex === ex.id && !modele) modele = it; }); });
        var td = tierDefaultsForGoal(goal, exerciseOrderTier(ex));
        var nouvel = modele
          ? { ex: ex.id, sets: modele.sets, min: modele.min, max: modele.max, rest: modele.rest }
          : { ex: ex.id, sets: td.sets, min: td.min, max: td.max, rest: td.rest };
        evalMove(prog.map(function(d, i){
          return i !== di ? d : Object.assign({}, d, { items: d.items.concat([nouvel]) });
        }), true);
      });
    });

    /* Coup 3 — retirer d'un jour la machine dont l'absence améliore le plus. */
    prog.forEach(function(day, di){
      if (day.items.length <= 1) return;
      day.items.forEach(function(it, ii){
        var ex = exMap[it.ex]; if (!ex) return;
        var cut = prog.map(function(d, i){
          return i !== di ? d : Object.assign({}, d, { items: d.items.filter(function(x, j){ return j !== ii; }) });
        });
        var primary = allMuscles(ex)[0];
        var stillPrimary = false;
        cut.forEach(function(d){ d.items.forEach(function(x){
          var e2 = exMap[x.ex];
          if (e2 && allMuscles(e2)[0] === primary) stillPrimary = true;
        }); });
        if (!stillPrimary) return;
        /* CORRIGÉ le 13 sept. 2026 — ce coup-ci calculait sa note lui-même et
           sautait donc TOUS les garde-fous d'evalMove, alors que la note seule
           "se laisse acheter" (c'est la raison d'être de ces refus secs).
           Le retrait pouvait ainsi faire passer un muscle SOUS sa cible :
           mesuré sur un programme surchargé, le dos tombait de 12 à 10 séries
           par semaine — exactement ce que le refus "chute", écrit le matin même
           pour le signalement "le dos est toujours à 10", était censé empêcher.
           Il croyait couvrir les retraits ; il ne les voyait pas. */
        evalMove(cut);
      });
    });

    if (!bestMove) break;
    prog = bestMove; best = bestMoveScore;
  }
  /* DERNIÈRE PASSE — égaliser les jours de MÊME type (13 sept. 2026 :
     "pourquoi Haut A et Haut B autant déséquilibrés ?").

     Constat sur son programme : Haut A à 7 exercices / 70 min contre Haut B à
     10 exercices / 101 min. Rien dans tout ce qui précède ne regardait
     l'équilibre ENTRE les jours : le score ne parle que de volume hebdomadaire
     par muscle, et deux jours du haut très inégaux le satisfont exactement
     autant qu'une répartition régulière.

     Déplacer une machine d'un jour vers un autre jour du MÊME type ne change
     RIEN au volume hebdomadaire — dans une rotation, chaque jour est parcouru
     aussi souvent que les autres. Ça ne déplace que la durée et la fréquence
     par muscle. Cette passe est donc sans risque pour l'équilibre musculaire,
     et c'est pour ça qu'elle est séparée du score : il n'y a rien à arbitrer,
     juste à ne pas laisser une séance faire 30 minutes de plus que sa jumelle.

     Ne déplace jamais une machine vers un jour qui la contient déjà (ça ferait
     un doublon), ne vide jamais un jour, et s'arrête dès que l'écart repasse
     sous 10 minutes ou qu'aucun déplacement ne l'améliore. */
  (function equilibrerJoursJumeaux(){
    for (var passe = 0; passe < 30; passe++) {
      var applique = applyGoalToProgram(prog, exercises, goal, avgSessions, muscleFocus, profile);
      var infos = prog.map(function(d, i){
        return { i: i, region: dayRegion(d, exMap), min: estimateDayMinutes(applique[i], exMap) };
      });
      var meilleur = null;
      ["haut","bas"].forEach(function(region){
        var grp = infos.filter(function(x){ return x.region === region; });
        if (grp.length < 2) return;
        var longs = grp.slice().sort(function(a,b){ return b.min - a.min; });
        var source = longs[0], cible = longs[longs.length-1];
        var ecart = source.min - cible.min;
        if (ecart <= 10) return;
        prog[source.i].items.forEach(function(it, ii){
          if (prog[source.i].items.length <= 2) return;               /* ne pas vider */
          if (prog[cible.i].items.some(function(x){ return x.ex === it.ex; })) return;
          var ex = exMap[it.ex]; if (!ex) return;
          if (!machineFitsDay(ex, prog[cible.i], exMap)) return;
          var cand = prog.map(function(d, di){
            if (di === source.i) return Object.assign({}, d, { items: d.items.filter(function(_, j){ return j !== ii; }) });
            if (di === cible.i) return Object.assign({}, d, { items: d.items.concat([Object.assign({}, it)]) });
            return d;
          });
          var ap2 = applyGoalToProgram(cand, exercises, goal, avgSessions, muscleFocus, profile);
          var g2 = cand.map(function(d, i2){ return { region: dayRegion(d, exMap), min: estimateDayMinutes(ap2[i2], exMap) }; })
            .filter(function(x){ return x.region === region; }).map(function(x){ return x.min; });
          var ecart2 = Math.max.apply(null, g2) - Math.min.apply(null, g2);
          if (ecart2 < ecart - 0.5 && (!meilleur || ecart2 < meilleur.ecart)) meilleur = { prog: cand, ecart: ecart2 };
        });
      });
      if (!meilleur) return;
      prog = meilleur.prog;
    }
  })();
  return prog;
}
/* Recomposition jusqu'au POINT FIXE — ajouté le 14 sept. 2026 pendant l'audit
   général ("checke si toutes les fonctionnalités ont pas de bug").

   reflowProgramForCatalogue est une descente : elle joue le meilleur coup tant
   qu'il améliore la note. Rien ne garantit pour autant que son résultat soit
   déjà son propre point fixe — la note de départ du tour suivant n'est pas la
   même, et certains garde-fous ("ne pas aggraver ce qui dépasse déjà", plafond
   de durée) dépendent de l'état du DÉBUT d'appel. Mesuré par tirage aléatoire
   sur 60 programmes tordus : 32 fois stable du premier coup, 24 fois au
   deuxième passage, 3 fois au troisième — et UNE fois un cycle, c'est-à-dire
   deux programmes qui alternent indéfiniment.

   Ce dernier cas est le seul vraiment gênant, mais il l'est beaucoup : la
   recomposition automatique tourne à chaque ouverture de l'appli tant que le
   programme est hors cible. Un cycle, ce sont donc des séances qui changent
   TOUTES SEULES à chaque ouverture, alternativement dans un sens puis dans
   l'autre — exactement le va-et-vient déjà signalé le 13 sept.

   D'où cette enveloppe, utilisée partout où l'appli recompose : on repasse
   jusqu'à retomber sur un état déjà vu. Si c'est le précédent, c'est un point
   fixe, on le rend. Si c'est plus ancien, c'est un cycle : on rend le
   MEILLEUR état du cycle (au sens de la note de l'appli), qui est alors stable
   au sens où il n'y a plus rien de mieux à en tirer. Coût : quelques passages
   de plus, uniquement quand le programme change vraiment. */
function reflowStable(program, exercises, goal, avgSessions, muscleFocus, gymId, profile) {
  var vus = [], etats = [], prog = program;
  function empreinte(p){ return JSON.stringify(p.map(function(d){ return d.items.map(function(i){ return i.ex+":"+i.sets; }); })); }
  /* Choix du meilleur état visité — à note ÉGALE, on départage par l'empreinte
     (ordre alphabétique). Sans ce départage, deux états de même qualité
     s'alternaient indéfiniment d'un appel à l'autre : le programme changeait à
     chaque ouverture sans que rien ne s'améliore. Avec, le choix ne dépend plus
     de l'état de départ : repartir du résultat retombe sur le même, donc c'est
     un point fixe. */
  function meilleurEtat(liste){
    var best = null, bestScore = Infinity, bestKey = null;
    liste.forEach(function(p2){
      var sc = note(p2), key = empreinte(p2);
      if (best === null || sc < bestScore - 1e-9 || (Math.abs(sc - bestScore) <= 1e-9 && key < bestKey)) {
        best = p2; bestScore = sc; bestKey = key;
      }
    });
    return best;
  }
  function note(p2){
    try {
      return programBalancePenalty(applyGoalToProgram(p2, exercises, goal, avgSessions, muscleFocus, profile),
        exercises, goal, avgSessions, muscleFocus, profile, {corridor:true});
    } catch (err) { return Infinity; }
  }
  for (var i = 0; i < 10; i++) {
    prog = reflowProgramForCatalogue(prog, exercises, goal, avgSessions, muscleFocus, gymId, profile);
    var e = empreinte(prog);
    var deja = vus.indexOf(e);
    if (deja >= 0) {
      if (deja === vus.length - 1) return prog;          // point fixe : rien ne bouge plus
      /* CYCLE — deux états (ou plus) qui alternent. On rend le MEILLEUR de
         tous ceux vus, au sens de la note de l'appli : chaque appel ne peut
         donc qu'améliorer, jamais osciller vers le pire. Ça ne garantit pas un
         point fixe du premier coup, mais une suite d'appels qui s'améliore et
         s'arrête — la note est bornée. */
      return meilleurEtat(etats.concat([prog]));
    }
    vus.push(e); etats.push(prog);
  }
  /* Budget épuisé sans point fixe : même règle, on rend le meilleur état vu. */
  return meilleurEtat(etats.concat([prog]));
}
/* ============================================================
   RECALIBRAGE AUTOMATIQUE APRÈS SÉANCE — demande du 5 sept. 2026 : "après
   chaque séance libre, l'application met en équilibre selon les objectifs
   et équilibre des muscles pour les prochaines séances, et selon
   l'historique si on a ajouté ou supprimé un exo ou plusieurs pdt une
   séance faite par l'appli". Choisi "automatique et silencieux" (pas de
   confirmation à valider) quand demandé de préciser.

   Première version de cette fonctionnalité (gardée dans l'historique du
   fichier, pas dans le code) rendait permanents les ajouts à la volée et
   retirait une machine du programme après plusieurs absences répétées.
   Rejeté explicitement par l'utilisateur juste après : "je veux pas que la
   machine ajoutee a la seance programmee devienne permanente, ou celle
   qu'on enleve qu'on ne la fasse plus mais juste pour cette seance" — un
   ajout/retrait à la volée (voir addToActiveSession/removeFromActiveSession)
   doit rester limité à LA séance en cours, jamais toucher la liste des
   machines d'un jour. Le programme (quelle machine est prévue quel jour)
   n'est donc plus jamais modifié automatiquement par cette fonction.

   Ce qui EST recalibré : le nombre de séries prescrites sur les machines
   déjà en place (comme le bouton "Optimiser mes séances", mais déclenché
   automatiquement après chaque séance terminée — libre ou programmée,
   toutes deux alimentent l'historique de volume réellement fait). Au lieu
   de supposer que le catalogue est exécuté à la lettre (comme le fait
   applyGoalToProgram pour les aperçus/le bouton manuel), ce recalibrage
   utilise le volume RÉELLEMENT loggué par muscle sur les 4 dernières
   semaines (voir actualMuscleVolumeMap) comme point de départ dès qu'il y a
   assez d'historique (au moins un tour complet de la rotation — sinon les
   toutes premières séances, très peu représentatives, feraient sur-réagir
   l'algorithme ; seuil choisi par prudence, pas issu d'une étude) : si tu
   sautes souvent une machine ou retires une machine à la volée pour UNE
   séance, le manque réel se voit dans l'historique et l'appli ajoute plus
   de séries sur les machines qui restent pour compenser ; si au contraire
   tu ajoutes souvent du volume à la volée pour un muscle, l'appli en
   ajoute moins par la suite puisque la cible est déjà mieux couverte que
   prévu. Retourne le programme tel quel (référence identique) si rien ne
   change, pour éviter une sauvegarde inutile à chaque séance. */
function actualMuscleVolumeMap(doneSessions, exMap, windowDays) {
  var days = windowDays || 28;
  var cutoff = Date.now() - days*864e5;
  var weeks = days/7;
  var m = {};
  (doneSessions||[]).forEach(function(s){
    if (new Date(s.date).getTime() < cutoff) return;
    s.entries.forEach(function(e){
      var ex = exMap[e.ex]; if (!ex) return;
      allMuscles(ex).forEach(function(mu){ m[mu] = (m[mu]||0) + e.sets.length*muscleWeight(ex, mu); });
    });
  });
  var out = {};
  Object.keys(m).forEach(function(mu){ out[mu] = m[mu]/weeks; }); // séries/semaine, moyenne sur la fenêtre
  return out;
}

/* `profile` ajouté le 12 sept. 2026 — BUG RÉEL trouvé en auditant l'arité des
