/* order: 1 = polyarticulaire (plusieurs articulations, ex. développé, tirage,
   presse à cuisses), 2 = semi-isolation (une seule articulation mais un
   muscle biarticulaire ou beaucoup de synergistes recrutés — ischios,
   mollets, fessiers, lombaires, oiseau/deltoïde arrière), 3 = isolation
   (une seule articulation, un seul muscle ciblé). Sert à trier l'ordre des
   exercices dans une séance (poly d'abord, isolation en dernier).
   Le découpage en 3 paliers (plutôt que juste poly/isolation) est une
   convention pratique, pas une catégorie validée par la littérature en
   tant que telle.

   Vérifié (re-recherché pour la question "meilleures machines par objectif") :
   Nunes et al. 2020 (European Journal of Sport Science, méta-analyse sur
   l'ORDRE des exercices) trouve que pour l'HYPERTROPHIE, l'ordre n'a
   quasiment aucun effet (taille d'effet combinée ≈0.03, "zero effect").
   Pour la FORCE en revanche, l'exercice placé EN PREMIER progresse le plus
   — et ce bénéfice de position est même un peu plus marqué pour les
   exercices d'isolation que pour les polyarticulaires (ES ≈0.58 vs 0.32)
   quand on inverse l'ordre. Autrement dit la littérature ne dit PAS
   "commencer par le polyarticulaire fait plus progresser" — le vrai levier
   est "commencer par ce qu'on veut prioriser". La règle poly-avant-
   isolation gardée ici est donc surtout une convention pratique de
   fraîcheur/technique/sécurité (mouvements pluri-articulaires plus lourds
   et plus exigeants en coordination, mieux faits frais) plutôt qu'un
   levier de performance validé par la littérature — modifiable à la main
   pour un exercice précis via le rond numéroté si tu veux prioriser
   volontairement une isolation. */

/* v3 (2026-08-31) — objectif confirmé : RECOMPOSITION (prise de muscle ET
   perte de gras en même temps), pas juste perte de gras. Ça change la cible
   de volume : la v2 avait redescendu à ~5-9 séries/semaine/muscle (volume
   d'ENTRETIEN, correct seulement si l'objectif était de préserver le muscle
   pendant un cut) — trop bas pour un vrai stimulus de croissance. La cible
   recomp est plutôt ~8-12 séries/semaine/muscle (volume de croissance
   modéré-haut — sources RP Strength / volume-landmarks, voir commit history).

   MAIS entre-temps il s'avère que quasiment tous les exercices sont faits
   bras/jambe par bras (voir `unilateral:true` dans SEED_EXERCISES) — sur un
   mécanisme bilatéral, ça double le temps réel par exercice (chaque série
   est faite deux fois, une par côté). Viser la cible recomp ET garder le
   bras par bras partout en même temps pousserait les séances à 95-134 min
   (calculé), ce qui ne rentre pas dans un créneau de salle normal.

   PLAN EN DEUX PHASES choisi avec l'utilisateur :
   Phase 1 (ACTUELLE, ce fichier) : on garde le volume d'entretien de la v2
   (~5-9 séries/semaine/muscle, sets ci-dessous) MAIS en unilatéral partout,
   le temps de vérifier objectivement où il y a un vrai déséquilibre gauche/
   droite (symmetryInfo a besoin d'un peu d'historique par côté). Séances
   ~75-100 min pendant cette phase — plus long que le plafond habituel de 90
   min, accepté temporairement.
   Phase 2 (à activer à la prochaine révision, ~12 oct. 2026, une fois les
   données de symétrie disponibles) : pour chaque exercice où les deux côtés
   sont proches (écart <8%, pas de flag symmetryInfo), repasser unilateral:
   false et REMONTER les sets vers la cible recomp ~8-12/semaine — un
   exercice bilatéral remonté en volume tient largement sous 90 min. Pour un
   exercice où un déséquilibre réel est détecté, garder l'unilatéral plus
   longtemps et appliquer la méthode "côté faible d'abord" (voir Analyse >
   Asymétrie gauche/droite) avant de repasser bilatéral.

   v4 (2026-08-31) — correctif d'équilibrage : la répartition "3 séries sur
   quasi tout, 4 sur les gros mouvements" laissait épaules/deltoïdes post./
   biceps/triceps/mollets/fessiers/adducteurs/lombaires à 4.8 séries/semaine
   (sous VOL_MIN=5, flag rouge dans l'app), pendant que quadriceps/ischios/
   pecs/dos/abdos tournaient à 6.4-8. Ce n'était pas voulu : ce n'est pas un
   problème de gauche/droite ni haut/bas (ces ratios étaient bons, ~1.05 et
   1.00), juste une répartition de séries trop concentrée sur les gros
   mouvements. Correctif : ces 8 muscles passent à 4 séries (répartis sur
   les deux jours du haut pour ne pas surcharger un seul jour), ce qui les
   remonte à 5.6-6.4 séries/semaine — aligné avec le reste. Pour limiter le
   temps ajouté, repos réduit à 60-80s sur les séries d'isolation concernées
   (justifié : petits muscles, récupération plus rapide qu'un gros mouvement
   composé). Séances UA/UB ~104-107 min (vs 97-99 avant) — accepté par
   l'utilisateur comme faisant partie du compromis temporaire de la phase 1. */

      h("path",{key:2,d:"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"})],

/* ============================================================
   ENGINE — progressive overload, stalls, effort, deload,
   symmetry, and upper/lower + push/pull volume balance.
   ============================================================ */
function historyFor(sessions, exId) {
  return sessions.filter(function(s){return s.done;})
    .map(function(s){ return { date: s.date, entry: s.entries.find(function(e){return e.ex===exId;}) }; })
    .filter(function(r){ return r.entry && r.entry.sets.some(function(x){return x.weight!=null && x.reps!=null;}); })
    .sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
}
var INC_CACHE = {};
function itemInc(item){ return INC_CACHE[item.ex] != null ? INC_CACHE[item.ex] : 2.5; }
function round(n){ return Math.round(n*2)/2; }

function prescribeBase(sessions, item) {
  var hist = historyFor(sessions, item.ex);
  if (hist.length === 0) {
    return { weight: null, targetReps: item.min, note: "Premier passage — charge que tu tiens " + item.min + " reps en gardant 2 reps en réserve.", state: "new" };
  }
  var last = hist[hist.length-1].entry.sets.filter(function(s){return s.weight!=null;});
  var w = Math.max.apply(null, last.map(function(s){return s.weight;}));
  var atW = last.filter(function(s){return s.weight===w;});
  var rirs = atW.map(function(s){return s.rir;}).filter(function(r){return r!=null;});
  var avgRir = rirs.length ? rirs.reduce(function(a,b){return a+b;},0)/rirs.length : null;

  if (avgRir != null && avgRir >= 3) {
    var jump = itemInc(item) * 2;
    return { weight: round(w+jump), targetReps: item.min, state: "up",
      note: "Tu as fini à " + avgRir.toFixed(1) + " reps en réserve — trop léger. On monte de " + jump + " kg d'un coup." };
  }
  if (atW.length >= item.sets && atW.every(function(s){return s.reps>=item.max;})) {
    return { weight: round(w+itemInc(item)), targetReps: item.min, note: "Toutes les séries au plafond — on monte la charge.", state: "up" };
  }
  if (atW.some(function(s){return s.reps<item.min;}) && hist.length >= 2) {
    var prev = hist[hist.length-2].entry.sets.filter(function(s){return s.weight!=null;});
    var pw = Math.max.apply(null, prev.map(function(s){return s.weight;}));
    if (pw === w && prev.some(function(s){return s.reps<item.min;})) {
      return { weight: round(Math.max(itemInc(item), w-itemInc(item))), targetReps: item.min, note: "Deux séances sous la fourchette — on redescend d'un cran.", state: "down" };
    }
  }
  var next = Math.min(item.max, Math.min.apply(null, atW.map(function(s){return s.reps;})) + 1);
  return { weight: w, targetReps: next, note: "Même charge — vise " + next + " reps sur chaque série.", state: "hold" };
}

function prescribe(sessions, item, deload) {
  var p = prescribeBase(sessions, item);
  if (!deload) return p;
  if (p.weight == null) return { weight: null, targetReps: item.min, state: "deload",
    note: "Décharge : première fois, reste léger et garde 3 reps en réserve." };
  var w2 = round(p.weight * 0.8);
  return { weight: w2, targetReps: item.min, state: "deload", setsOverride: Math.max(2, item.sets-1),
    note: "Semaine de décharge — environ 80% de la charge habituelle, une série de moins, technique propre." };
}

function stallInfo(sessions, exId) {
  var hist = historyFor(sessions, exId);
  if (hist.length < 4) return null;
  var weights = hist.map(function(hh){ return Math.max.apply(null, hh.entry.sets.filter(function(s){return s.weight!=null;}).map(function(s){return s.weight;})); });
  var recent = weights.slice(-4);
  return Math.max.apply(null, recent) <= recent[0] ? { sessions: recent.length, weight: recent[0] } : null;
}
function effortInfo(sessions, exId) {
  var hist = historyFor(sessions, exId).slice(-4);
  if (hist.length < 3) return null;
  var all = [];
  hist.forEach(function(hh){ hh.entry.sets.forEach(function(s){ if (s.rir!=null) all.push(s.rir); }); });
  if (all.length < 6) return null;
  var avg = all.reduce(function(a,b){return a+b;},0) / all.length;
  return avg >= 3 ? { avg: Math.round(avg*10)/10 } : null;
}
function symmetryInfo(sessions, exId) {
  /* Tu commences déjà par le côté faible et égalises la charge/reps sur le
     fort — donc comparer le poids logué des deux côtés ne révélerait jamais
     rien (il est identique par construction). Le signal vient plutôt d'un
     repérage volontaire et léger : sur chaque série tu peux, en option,
     indiquer quel côté a semblé plus dur ce jour-là. On compte juste lequel
     revient le plus souvent sur les dernières séances. */
  var hist = historyFor(sessions, exId).slice(-6);
  var flags = { L: 0, R: 0, total: 0 };
  hist.forEach(function(hh){ hh.entry.sets.forEach(function(s){
    if (s.weakSide === "L") { flags.L++; flags.total++; }
    if (s.weakSide === "R") { flags.R++; flags.total++; }
  }); });
  if (flags.total < 3) return null;
  var dominant = flags.L > flags.R ? "L" : flags.R > flags.L ? "R" : null;
  if (!dominant) return null;
  var pct = Math.round((Math.max(flags.L, flags.R) / flags.total) * 100);
  if (pct < 60) return null;
  return { weaker: dominant==="L" ? "gauche" : "droit", pct: pct, count: flags.total };
}

function stalledCount(sessions, exercises){ return exercises.filter(function(e){return stallInfo(sessions,e.id);}).length; }
function trackedCount(sessions, exercises){ return exercises.filter(function(e){return historyFor(sessions,e.id).length>=4;}).length; }
function reactiveDeloadDue(sessions, exercises){
  var tracked = trackedCount(sessions, exercises);
  if (tracked < 3) return false;
  return stalledCount(sessions, exercises) / tracked >= 0.5;
}
function cyclesCompleted(sessions, program){ return Math.floor(sessions.filter(function(s){return s.done;}).length / program.length); }
function proactiveDeloadDue(sessions, program){
  var done = sessions.filter(function(s){return s.done;}).length;
  var c = cyclesCompleted(sessions, program);
  return c > 0 && c % 6 === 0 && done % program.length === 0;
}

/* Estimated real session length: ~40s of work per set + its rest, doubled for
   unilateral exercises (each "set" is actually done twice, once per side),
   plus ~70s of transition between machines and a 5-minute warm-up/waiting
   buffer. Rough but directional — real gym time also depends on how busy it
   is, so treat this as a floor, not a promise. */
function estimateDayMinutes(day, exMap) {
  var total = 0;
  day.items.forEach(function(it) {
    var ex = exMap[it.ex];
    var physicalSets = (ex && ex.unilateral) ? it.sets * 2 : it.sets;
    total += physicalSets * (40 + it.rest);
  });
  total += Math.max(0, day.items.length - 1) * 70;
  total += 300;
  return Math.round(total / 60);
}

/* Planned weekly volume, by muscle, from the program as configured. */
function plannedVolume(program, exercises) {
  var exMap = {}; exercises.forEach(function(e){ exMap[e.id]=e; });
  var factor = SESSIONS_PER_WEEK / Math.max(1, program.length);
  var m = {};
  program.forEach(function(d){ d.items.forEach(function(it){
    var ex = exMap[it.ex]; if (!ex) return;
    m[ex.muscle] = (m[ex.muscle]||0) + it.sets;
  }); });
  return Object.keys(m).map(function(muscle){ return { muscle: muscle, sets: Math.round(m[muscle]*factor*10)/10 }; })
    .sort(function(a,b){ return b.sets-a.sets; });
}
function regionBalance(vol){
  var sums = {haut:0, bas:0};
  vol.forEach(function(v){ var r=REGION[v.muscle]; if (r==="haut"||r==="bas") sums[r]+=v.sets; });
  return sums;
}
function pushPullBalance(vol){
  var sums = {push:0, pull:0};
  vol.forEach(function(v){ var c=PUSHPULL[v.muscle]; if (c) sums[c]+=v.sets; });
  return sums;
}

/* Choisit la meilleure machine de remplacement parmi des candidats pour le
   même muscle — au lieu de prendre juste la première de la liste (ordre
   d'ajout au catalogue, qui n'a aucun rapport avec la qualité de l'exercice
   pour l'objectif). Deux critères, dans cet ordre :
   1) une machine CONFIRMÉE (brand !== "?") plutôt qu'une encore "à
      vérifier" — remplacer par une machine dont on n'est même pas sûr
      qu'elle existe à la salle ne sert à rien ;
   2) le même palier polyarticulaire/semi-isolation/isolation (voir `order`
      dans SEED_EXERCISES et exerciseOrderTier) que l'exercice remplacé, pour
      ne pas casser l'ordre poly-avant-isolation de la séance (voir Séance >
      petit badge numéroté sur chaque machine).
   À égalité sur ces deux critères, l'ordre du catalogue tranche — ça reste
   déterministe et prévisible.

   Objectif d'entraînement (goal) délibérément PAS un critère ici — question
   vérifiée spécifiquement (recherche faite pour "quelles sont les
   meilleures machines pour chaque objectif") plutôt que supposée. Trois
   études trouvées comparant des machines polyarticulaires à des machines
   d'isolation pour LE MÊME muscle :
   - un essai croisé randomisé chez des hommes entraînés (International
     Journal of Exercise Science, 2020) ne trouve AUCUNE différence
     significative de gain de force (1RM développé couché, squat) entre un
     protocole polyarticulaire et un protocole en isolation ;
   - une méta-analyse dédiée à l'hypertrophie (mono- vs poly-articulaire,
     membres) ne trouve pas non plus de différence significative sur la
     croissance musculaire globale (mais suggère un possible intérêt de
     CUMULER les deux types pour le développement régional du muscle,
     piste encore peu étudiée) ;
   - une méta-analyse sur l'ORDRE des exercices (Nunes et al. 2020, voir
     note plus haut sur `order`) confirme que l'ordre n'affecte pas
     l'hypertrophie, et que pour la force c'est LA POSITION (premier de la
     séance) qui compte, pas le fait que l'exercice soit poly ou isolation.
   Conclusion retenue : pas de base solide pour préférer une machine
   polyarticulaire à une machine d'isolation ciblant le même muscle selon
   l'objectif (force/hypertrophie/perte de gras) — bestCandidate reste donc
   volontairement identique pour les 6 objectifs. Ce qui varie réellement
   par objectif, et qui est bien implémenté ailleurs, c'est le nombre de
   séries/reps/repos par palier (GOAL_PRESETS/tierDefaultsForGoal) et la
   cible kcal/protéines — pas le choix de LA machine. */
function bestCandidate(candidates, referenceOrder) {
  if (!candidates.length) return null;
  var scored = candidates.map(function(e, i){
    return { e: e, i: i, verified: e.brand !== "?" ? 1 : 0, sameTier: exerciseOrderTier(e) === referenceOrder ? 1 : 0 };
  });
  scored.sort(function(a, b){
    if (a.verified !== b.verified) return b.verified - a.verified;
    if (a.sameTier !== b.sameTier) return b.sameTier - a.sameTier;
    return a.i - b.i;
  });
  return scored[0].e;
}

/* Removing a machine: keep the volume by swapping in the BEST equivalent for
   the same muscle (see bestCandidate), not just the first one on the list. */
function removeWithSubstitution(exId, exercises, program) {
  var gone = exercises.find(function(e){return e.id===exId;});
  var remaining = exercises.filter(function(e){return e.id!==exId;});
  var report = [];
  var nextProgram = program.map(function(day){
    var items = [];
    day.items.forEach(function(it){
      if (it.ex !== exId) { items.push(it); return; }
      var taken = {}; day.items.forEach(function(x){taken[x.ex]=true;}); items.forEach(function(x){taken[x.ex]=true;});
      var candidates = remaining.filter(function(e){ return e.muscle===gone.muscle && !taken[e.id]; });
      var cand = bestCandidate(candidates, exerciseOrderTier(gone));
      if (cand) { items.push(Object.assign({}, it, {ex: cand.id})); report.push({day: day.label, to: cand.name, sets: it.sets}); }
      else { report.push({day: day.label, to: null, sets: it.sets}); }
    });
    return Object.assign({}, day, {items: items});
  });
  return { exercises: remaining, program: nextProgram, report: report, gone: gone };
}

/* An exercise is stalled (same weight 4+ séances) and it's the only one blocking:
   look for the BEST other machine already in the catalog, targeting the same
   muscle, that isn't already used anywhere in the program (see bestCandidate
   for what "best" means here). Returns null if nothing suitable exists. */
function suggestSwap(exId, exercises, program) {
  var ex = exercises.find(function(e){return e.id===exId;});
  if (!ex) return null;
  var usedIds = {};
  program.forEach(function(d){ d.items.forEach(function(it){ usedIds[it.ex]=true; }); });
  var candidates = exercises.filter(function(e){ return e.muscle===ex.muscle && e.id!==exId && !usedIds[e.id]; });
  return bestCandidate(candidates, exerciseOrderTier(ex));
}
/* Séries/reps/repos à proposer quand on remplace oldEx par newEx dans le
   programme, quel que soit l'endroit d'où vient la demande (bouton "Changer
   de machine" en Séance, ou suggestion de remplacement sur un exercice
   bloqué en Analyse — les deux doivent s'adapter pareil, sinon un des deux
   chemins garde un ancien réglage qui ne correspond plus à la machine).
   Même palier (poly/semi/iso) que l'exercice remplacé : le réglage déjà en
   place reste pertinent, pas de raison d'y toucher. Palier différent : on
   repart des repères par palier ET par objectif (GOAL_PRESETS ci-dessus),
   plutôt que de garder des reps/repos pensés pour un autre type de
   mouvement. Le nombre de séries en cours (sampleItem.sets) est conservé
   même en cas de palier différent, seuls reps/repos changent — on ne
   réduit pas le volume programmé juste parce que la machine change. */
function swapRecommendation(oldEx, newEx, program, goal) {
  var oldTier = exerciseOrderTier(oldEx), newTier = exerciseOrderTier(newEx);
  var sampleItem = null;
  program.some(function(d){ var it = d.items.find(function(x){return x.ex===oldEx.id;}); if (it) { sampleItem = it; return true; } return false; });
  var d2 = tierDefaultsForGoal(goal, newTier);
  return (newTier === oldTier && sampleItem)
    ? { sets: sampleItem.sets, min: sampleItem.min, max: sampleItem.max, rest: sampleItem.rest }
    : { sets: sampleItem ? sampleItem.sets : d2.sets, min: d2.min, max: d2.max, rest: d2.rest };
}
/* ============================================================
   OBJECTIFS D'ENTRAÎNEMENT — presets par palier (poly/semi/iso) et
   nutrition (déficit/protéines/activité), un par combinaison choisie par
   l'utilisateur (perte de gras, hypertrophie, force, et les 3 associations
   entre deux de ces trois). "loss_hyper" reste la valeur par défaut ET
   reste EXACTEMENT ce qui était déjà en place avant ce menu (recomposition,
   voir l'audit dans la conversation) — volontairement non retouché ici,
   même si une source plus bas suggère qu'un repos un peu plus long
   profiterait aussi à ce preset (voir note repos).

   Sources vérifiées pour les 5 autres presets (recherchées et lues pour ce
   changement, pas des chiffres inventés) :
   - Force — charge/volume : mise à jour ACSM 2026 des recommandations de
     musculation (première révision en 17 ans) : force ≈ ≥80% 1RM, 2-3
     séries/exercice. ≥80% 1RM correspond conventionnellement à une zone
     d'environ 4-6 répétitions avant échec technique. Repos : la convention
     de longue date (NSCA Essentials of Strength Training, ACSM) pour des
     charges quasi-maximales reste 2-5 min, pour permettre une récupération
     quasi complète de la filière ATP-PC entre séries — pas de remise en
     cause récente trouvée sur ce point précis.
   - Hypertrophie — charge/volume : la même mise à jour ACSM 2026 constate
     que l'hypertrophie se produit sur une large plage de charges (30-100%
     1RM) tant que l'effort est suffisant (proche de l'échec) — donc le "rep
     range hypertrophie 6-12" n'est plus considéré comme une zone magique,
     plutôt une zone pratique parmi d'autres qui marchent aussi bien ;
     volume cible ≥10 séries/muscle/semaine (repère qui s'applique au volume
     hebdomadaire total, voir VOL_MIN/VOL_MAX/plannedVolume — les tiers
     ci-dessous ne fixent que le point de départ par exercice).
   - Repos et hypertrophie : une méta-analyse bayésienne récente (Robinson
     et al., Frontiers in Sports and Active Living, 2024, "Give it a Rest")
     trouve un léger avantage hypertrophique aux repos >60s, sans bénéfice
     supplémentaire net au-delà de ~90s — ce qui va à l'encontre de l'ancien
     repère NSCA "30-90s pour l'hypertrophie". Preuve qualifiée de faible
     certitude par les auteurs eux-mêmes (intervalles crédibles larges,
     seulement 9 études) — donc traité ici comme "viser plutôt ≥90s que
     60s", pas comme une règle stricte.
   - Perte de gras — déficit : revue Helms/Aragon/Fitschen 2014 (contest
     prep naturel) : viser une perte de 0,5 à 1%/semaine du poids corporel
     pour préserver au mieux la masse maigre (plus lent = mieux préservé).
     Converti en kcal/jour pour CE profil (poids actuel dans l'appli) avec
     l'équivalence usuelle ~7700 kcal/kg de masse grasse : 0,5%/sem ≈
     470 kcal/j, 1%/sem ≈ 935 kcal/j — une fourchette large, pas un chiffre
     validé au kg près. Le preset "Perte de gras" seule (priorité vitesse,
     pas de muscle à construire) prend le haut de cette fourchette ; les
     presets combinés à hypertrophie/force restent plus prudents (bas de
     fourchette), cohérent avec la recommandation "plus lent préserve
     mieux". Aucune étude trouvée ne montre qu'un rep range particulier
     accélère la perte de gras elle-même — donc les tiers ci-dessous, pour
     "Perte de gras" seule, restent proches d'un schéma hypertrophie
     générique plutôt que d'inventer un rep range "brûle-graisse" qui
     n'a pas de base solide.
   - Protéines en déficit : CONVERGENCE de deux sources indépendantes — la
     position de l'ISSN "Diets and Body Composition" (Aragon et al. 2017) et
     la revue Helms et al. 2014 citée ci-dessus recommandent toutes les deux
     2,3-3,1 g/kg de MASSE MAIGRE/jour pour les sujets entraînés en
     restriction calorique, l'extrémité haute étant pour un déficit plus
     important ou une masse grasse plus basse. Traduit en g/kg de POIDS
     TOTAL (l'unité du curseur Options) avec la masse maigre estimée de ce
     profil (~62,7 kg sur 85,1 kg, voir Options > repère masse maigre) :
     ≈1,7-2,3 g/kg de poids total. Les presets avec perte de gras utilisent
     le haut de cette plage traduite (2,1-2,3) ; ce repère spécifique à la
     recomposition (2,6-3,5 g/kg masse maigre, revue Barakat et al. 2020,
     déjà utilisé pour "loss_hyper") reste PLUS élevé que ce repère cutting
     général — cohérent avec le fait que la recomposition demande de
     construire ET préserver en même temps.
   - Sans perte de gras (Hypertrophie seule, Force seule, Hypertrophie +
     Force) : déficit à 0 (maintenance). Une vraie prise de masse
     bénéficierait d'un léger surplus calorique, mais l'appli n'a qu'un
     curseur de déficit (0-600 kcal) — limite assumée plutôt que masquée
     par un chiffre inventé. Protéines dans ces cas : ~1,8-1,9 g/kg de
     poids total, cohérent avec le seuil ≥1,6 g/kg validé par méta-analyse
     pour la prise de masse maigre hors restriction calorique (voir Options
     > sources), sans la majoration "cutting" puisqu'il n'y a pas de
     restriction à compenser.
   - Activité quotidienne (activityMultiplier) : volontairement IDENTIQUE
     sur les 6 presets — c'est un reflet du mode de vie (niveau d'activité
     hors entraînement), pas de l'objectif d'entraînement ; le faire varier
     par objectif n'aurait aucune justification.

   Sert de point de départ éditable — pour les machines déjà dans un
   programme, voir requestSwap/swapCard (remplacement) ou proposePlacement/
   applyPlacement (ajout) ; jamais appliqué sans une action explicite de
   l'utilisateur (changer l'objectif, confirmer un remplacement/ajout). */
var GOALS = [
  { k: "loss", label: "Perte de gras" },
  { k: "hyper", label: "Hypertrophie" },
  { k: "strength", label: "Force" },
  { k: "loss_hyper", label: "Perte de gras + Hypertrophie" },
  { k: "loss_strength", label: "Perte de gras + Force" },
  { k: "hyper_strength", label: "Hypertrophie + Force" },
];
var GOAL_PRESETS = {
  // Perte de gras seule : déficit haut de fourchette Helms (~1%/sem pour ce
  // poids), protéines en haut de la plage cutting traduite, tiers proches
  // d'un schéma hypertrophie générique (pas de rep range anti-graisse).
  loss:           { nutrition: { activityMultiplier: 1.55, deficitKcal: 600, proteinPerKg: 2.3 },
    tiers: { 1: {sets:3, min:8,  max:12, rest:90},  2: {sets:3, min:10, max:15, rest:75}, 3: {sets:3, min:12, max:15, rest:60} } },
  // Hypertrophie seule : maintenance, ~10 séries/muscle/semaine visées
  // (ACSM 2026), repos remonté vers ≥90s (méta-analyse 2024 sur le repos).
  hyper:          { nutrition: { activityMultiplier: 1.55, deficitKcal: 0,   proteinPerKg: 1.8 },
    tiers: { 1: {sets:4, min:6,  max:10, rest:110}, 2: {sets:4, min:8,  max:12, rest:95}, 3: {sets:4, min:10, max:15, rest:90} } },
  // Force seule : maintenance, ≥80% 1RM (≈4-6 reps)/2-3 séries (ACSM 2026),
  // repos long (2-3 min, convention NSCA/ACSM pour charge quasi-maximale).
  strength:       { nutrition: { activityMultiplier: 1.55, deficitKcal: 0,   proteinPerKg: 1.8 },
    tiers: { 1: {sets:3, min:4,  max:6,  rest:180}, 2: {sets:3, min:5,  max:8,  rest:150}, 3: {sets:3, min:8,  max:12, rest:90} } },
  loss_hyper:     { nutrition: { activityMultiplier: 1.55, deficitKcal: 350, proteinPerKg: 2.0 },  // = réglages historiques (recomposition), volontairement inchangés
    tiers: { 1: {sets:3, min:8,  max:12, rest:110}, 2: {sets:3, min:10, max:15, rest:85}, 3: {sets:4, min:12, max:15, rest:65} } },

function stripAccents(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }
/* Devine le palier poly/semi/isolation d'une machine à partir de son nom
   (et, en repli, de son muscle) — pour que ce soit l'app qui détermine ça,
   pas l'utilisateur, à la création comme pour corriger les machines
   existantes sans palier. Validé pour reproduire exactement le classement
   des 29 machines d'origine du catalogue (SEED_EXERCISES), et élargi avec
   des synonymes FR/EN et noms de marque courants (Technogym, Life Fitness,
   Hammer Strength) pour mieux couvrir des machines ajoutées manuellement
   avec un nom différent. Les motifs les plus SPÉCIFIQUES sont testés en
   premier — ex. "leg curl" doit être reconnu comme semi-isolation (ischios)
   avant que le mot générique "curl" plus bas ne le classe à tort en
   isolation (biceps). C'est une estimation par mots-clés, pas une
   classification anatomique certifiée — reste modifiable à tout moment via
   le badge (séance) ou le sélecteur (onglet Machines) si elle tombe à côté
   pour une machine précise. */

  var n = stripAccents(name);
  // --- Motifs spécifiques d'abord, pour lever les ambiguïtés avec les
  //     motifs génériques plus bas (ex. "curl", "presse", "extension"). ---
  if (/leg curl|hamstring curl|flexion des jambes|ischio/.test(n)) return 2;
  if (/leg extension|extension.*jambe|quad.*extension/.test(n)) return 3;
  if (/calf|mollet/.test(n)) return 2;
  if (/glute|fessier|hip thrust|hip bridge/.test(n)) return 2;
  if (/lower back|lombaire|hyperextension|back extension|extension du dos/.test(n)) return 2;
  if (/rear delt|deltoide arriere|reverse fly|face pull/.test(n)) return 2;
  if (/trapez|shrug/.test(n)) return 2;
  if (/pull-?up|pull-?over|chin-?up/.test(n)) return 1;
  if (/pector|pec deck|butterfly|papillon|ecarte|\bfly\b/.test(n)) return 3;
  if (/elevation laterale|lateral raise|elevation frontale|front raise/.test(n)) return 3;
  if (/abduction|adduction/.test(n)) return 3;
  if (/crunch|abdomina|gainage|sit.?up|rotation du torse/.test(n)) return 3;
  if (/pushdown|kickback/.test(n)) return 3;
  // --- Motifs génériques ensuite. ---
  if (/biceps|triceps|curl/.test(n)) return 3;
  if (/press|developpe|presse|squat|deadlift|souleve de terre|\bdip\b/.test(n)) return 1;
  if (/tirage|traction|\brow\b|rowing|pulldown/.test(n)) return 1;
  if (/upper back|tronc/.test(n)) return 1;

  var m = stripAccents(muscle);

}

/* Microwave-style alert: 4 short, sharp square-wave beeps (a harsher, more
   "kitchen timer" tone than a single sine chime) + a matching vibration

   0 there's no point creating an AudioContext, just vibrate. Called once
   per repeat cycle by RestTimerBar — see the comment there for why it
   repeats instead of firing only once. */
function restAlert(volume) {
  var vol = volume == null ? 1 : Math.max(0, Math.min(1, volume));
  if (vol > 0) {

      var Ctx = window.AudioContext || window.webkitAudioContext;

          g.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
          g.gain.exponentialRampToValueAtTime(0.3 * vol, ctx.currentTime + delay + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + beepDur);
          o.connect(g); g.connect(ctx.destination);
          o.start(ctx.currentTime + delay); o.stop(ctx.currentTime + delay + beepDur + 0.02);

  }

}

   ============================================================ */
function OptionsTab(props){
  var profile=props.profile, setProfile=props.setProfile, program=props.program, exercises=props.exercises, bodyLog=props.bodyLog||[], persistConfig=props.persistConfig;
  function set(patch){ setProfile(Object.assign({}, profile, patch)); }
  var _rp = useState(false), reapplyPrompt=_rp[0], setReapplyPrompt=_rp[1];

  var exMap = {}; exercises.forEach(function(e){exMap[e.id]=e;});
  var avgSessionMinutes = program.length
    ? Math.round(program.reduce(function(a,d){return a+estimateDayMinutes(d, exMap);},0) / program.length)
    : 0;
  var nut = computeNutrition(profile, avgSessionMinutes);
  /* Repère masse maigre pour la cible protéique — voir la Section "Cible
     calorique et protéique" plus bas. On ne redéfinit PAS ce que veut dire
     proteinPerKg (toujours g/kg de poids total, comme depuis le début) :
     ça reste un simple comparatif informatif, jamais une réinterprétation
     silencieuse d'une valeur déjà réglée par l'utilisateur. % masse grasse :
     priorité au champ manuel (bodyFatPctManual) si renseigné, sinon le plus
     récent bodyLog qui a un fatKg (ex. scan Boditrax) — le % est recalculé

    .sort(function(a,b){ return (a.date||"")<(b.date||"") ? 1 : -1; })[0];
  var bfPct = profile.bodyFatPctManual!=null ? profile.bodyFatPctManual

  var leanKg = (bfPct!=null && profile.weightKg) ? profile.weightKg*(1-bfPct/100) : null;
  // Live preview from DER + pas + séances, computed regardless of the
  // active target mode, so that changing poids/taille/DER/pas/séances
  // always visibly moves a number on this screen — even in "Cible fixe"
  // mode, which otherwise ignores those fields entirely by design (the
  // whole point of a fixed target is that it does NOT move on its own).
  // Shown only when it differs from the main display (i.e. not already
  // in "steps" mode) so we don't render the same numbers twice, and it
  // never silently touches profile.manualTargetKcal/manualProteinG —
  // adopting it is an explicit action via the button below.

     affichée reste verrouillée sur manualTargetKcal/manualProteinG et
     changer d'objectif n'a AUCUN effet visible (bug remonté le 4 sept.
     2026 : "ça change rien... sur la nutrition").

     Repassait d'abord sur "Déficit manuel" (targetMode:"deficit"), qui
     calcule le TDEE avec un multiplicateur d'activité FIXE (ex. ×1,55
     "Modérément actif") — un seul chiffre pour toute la semaine, pas lié
     aux pas ou séances réellement enregistrés. Changé pour "DER + pas +
     séances" suite à un 2e retour le même jour ("je veux que ce soit une
     moyenne, pas que les jours de sport") : ce mode calcule le TDEE à
     partir du DER + calories des pas quotidiens (profile.dailySteps) +
     calories d'entraînement, ces dernières étalées sur les 7 jours de la
     semaine au prorata du nombre RÉEL de séances/semaine
     (avgSessions/7 — voir computeNutrition, branche "steps") : une vraie
     moyenne hebdomadaire personnalisée, pas le calcul d'un jour de sport
     isolé ni un multiplicateur générique. Déficit et protéines du preset
     s'appliquent ensuite pareil par-dessus, quel que soit le mode.
     Ne touche PAS le programme déjà en place (confirmé après coup, toujours
     voulu) : les nouveaux repères sets/reps/repos par palier ne s'appliquent
     qu'aux PROCHAINS ajouts ou remplacements de machine (voir GOAL_PRESETS/
     tierDefaultsForGoal) — jamais une réécriture silencieuse d'un réglage
     déjà en place — SAUF si tu confirmes explicitement via le bouton
     "Appliquer aux séances actuelles" proposé juste après (voir
     reapplyPrompt/applyGoalToProgram ci-dessous) : demandé le 4 sept. 2026
     après avoir d'abord gardé l'ancien comportement (jamais toucher
     l'existant) — l'utilisateur a changé d'avis et veut pouvoir tout
     réappliquer d'un coup, tant que ça reste une action confirmée et pas
     automatique. */
  function applyGoal(g){ set(Object.assign({goal:g, targetMode:"steps", manualTarget:false}, goalPreset(g).nutrition)); setReapplyPrompt(true); }

      tab==="analyse" ? h(AnalyseTab,{ sessions:state.sessions, exercises:state.exercises, exMap:exMap, program:state.program, persistConfig:persistConfig, bodyLog:state.bodyLog, addBodyEntry:addBodyEntry, goal:state.profile.goal }) : null,
      tab==="options" ? h(OptionsTab,{ profile:state.profile, setProfile:setProfile, program:state.program, exercises:state.exercises, bodyLog:state.bodyLog, persistConfig:persistConfig }) : null),
    h("div",{style:{position:"fixed",bottom:0,left:0,right:0}},
      restTimer ? h(RestTimerBar,{timer:restTimer, onAdjust:adjustRestTimer, onDismiss:stopRestTimer, volume: state.profile.alertVolume}) : null,
      h("nav",{style:{display:"flex",background:C.shroudDeep,borderTop:"1px solid "+C.taupeDim}},
        TABS.map(function(t){ return h("button",{key:t.k, onClick:function(){setTab(t.k);},
          style:{flex:1,padding:"10px 0",display:"flex",flexDirection:"column",alignItems:"center",gap:3,background:"transparent",border:"none",color:tab===t.k?C.pin:C.taupe}},
          h(Icon,{name:t.icon,size:19}), h("span",{style:{fontFamily:sansCond,fontSize:10.5,fontWeight:600}}, t.label)); })))
  );
}

   BOOTSTRAP
   ============================================================ */
(function boot(){
  var rootEl = document.getElementById("root");
  rootEl.innerHTML = "";
  var loading = document.createElement("div");
  loading.style.cssText = "min-height:100vh;display:flex;align-items:center;justify-content:center;color:"+C.taupe+";font-family:"+sansCond+";font-size:15px;";
  loading.textContent = "Chargement du carnet…";
  rootEl.appendChild(loading);

  loadInitialState().then(function(state){
    var root = ReactDOM.createRoot(rootEl);
    root.render(h(App, {initialState: state}));
  }).catch(function(){
    var root = ReactDOM.createRoot(rootEl);
    root.render(h(App, {initialState: seedState()}));
  });
})();
</script>

<script>
// v2 (2026-09-04) : le fetch handler du service worker est déjà en
// network-first (voir service-worker.js), donc une simple réouverture de
// l'appli va normalement chercher index.html à jour sur GitHub Pages. Le
// trou restant : sur mobile, l'appli PWA n'est presque jamais "relancée à
// froid" — l'OS la garde gelée en arrière-plan quand tu changes d'appli,
// puis la ranime telle quelle (le JS déjà chargé continue de tourner) sans
// jamais refaire de navigation ni redéclencher la vérif de mise à jour du
// navigateur. Résultat vu par l'utilisateur : "je dois réinstaller l'appli
// pour voir mes changements" alors que le vrai problème est juste que la
// vérif ne se relance jamais toute seule. Deux ajouts pour ça :
// 1) reg.update() forcé à chaque retour au premier plan (visibilitychange)
//    — revérifie service-worker.js sur le réseau, indépendamment de tout
//    cache navigateur, à chaque fois que tu reviens sur l'appli ;
// 2) reload() automatique une seule fois quand un nouveau service worker
//    prend le contrôle (controllerchange) — sinon le nouveau code est bien
//    activé en arrière-plan mais la page déjà ouverte continue de tourner
//    avec l'ancien JS déjà en mémoire jusqu'à un rechargement.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("service-worker.js").then(function(reg){
      document.addEventListener("visibilitychange", function(){
        if (document.visibilityState === "visible") reg.update().catch(function(){});
      });
    }).catch(function(){});
    var reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if (reloaded) return;
      reloaded = true;
      window.location.reload();
    });
  });
}
</script>
