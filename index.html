/* v3 (2026-08-31) — objectif confirmé : RECOMPOSITION (prise de muscle ET

   de volume : la v2 avait redescendu à ~5-9 séries/semaine/muscle (volume
   d'ENTRETIEN, correct seulement si l'objectif était de préserver le muscle
   pendant un cut) — trop bas pour un vrai stimulus de croissance. La cible
   recomp est plutôt ~8-12 séries/semaine/muscle (volume de croissance
   modéré-haut — sources RP Strength / volume-landmarks, voir commit history).

   MAIS entre-temps il s'avère que quasiment tous les exercices sont faits
   bras/jambe par bras (voir `unilateral:true` dans SEED_EXERCISES) — sur un
   mécanisme bilatéral, ça double le temps réel par exercice (chaque série
   est faite deux fois, une par côté). Viser la cible recomp ET garder le
   bras par bras partout en même temps pousserait les séances à 95-134 min
   (calculé), ce qui ne rentre pas dans un créneau de salle normal.

   PLAN EN DEUX PHASES choisi avec l'utilisateur :
   Phase 1 (ACTUELLE, ce fichier) : on garde le volume d'entretien de la v2
   (~5-9 séries/semaine/muscle, sets ci-dessous) MAIS en unilatéral partout,
   le temps de vérifier objectivement où il y a un vrai déséquilibre gauche/
   droite (symmetryInfo a besoin d'un peu d'historique par côté). Séances
   ~75-100 min pendant cette phase — plus long que le plafond habituel de 90
   min, accepté temporairement.
   Phase 2 (à activer à la prochaine révision, ~12 oct. 2026, une fois les
   données de symétrie disponibles) : pour chaque exercice où les deux côtés
   sont proches (écart <8%, pas de flag symmetryInfo), repasser unilateral:
   false et REMONTER les sets vers la cible recomp ~8-12/semaine — un
   exercice bilatéral remonté en volume tient largement sous 90 min. Pour un
   exercice où un déséquilibre réel est détecté, garder l'unilatéral plus
   longtemps et appliquer la méthode "côté faible d'abord" (voir Analyse >
   Asymétrie gauche/droite) avant de repasser bilatéral.

/* ============================================================
   ENGINE — progressive overload, stalls, effort, deload,
   symmetry, and upper/lower + push/pull volume balance.
   ============================================================ */
function historyFor(sessions, exId) {
  return sessions.filter(function(s){return s.done;})
    .map(function(s){ return { date: s.date, entry: s.entries.find(function(e){return e.ex===exId;}) }; })
    .filter(function(r){ return r.entry && r.entry.sets.some(function(x){return x.weight!=null && x.reps!=null;}); })
    .sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
}
var INC_CACHE = {};
function itemInc(item){ return INC_CACHE[item.ex] != null ? INC_CACHE[item.ex] : 2.5; }
function round(n){ return Math.round(n*2)/2; }

function prescribeBase(sessions, item) {
  var hist = historyFor(sessions, item.ex);
  if (hist.length === 0) {
    return { weight: null, targetReps: item.min, note: "Premier passage — charge que tu tiens " + item.min + " reps en gardant 2 reps en réserve.", state: "new" };
  }
  var last = hist[hist.length-1].entry.sets.filter(function(s){return s.weight!=null;});
  var w = Math.max.apply(null, last.map(function(s){return s.weight;}));
  var atW = last.filter(function(s){return s.weight===w;});
  var rirs = atW.map(function(s){return s.rir;}).filter(function(r){return r!=null;});
  var avgRir = rirs.length ? rirs.reduce(function(a,b){return a+b;},0)/rirs.length : null;

  if (avgRir != null && avgRir >= 3) {
    var jump = itemInc(item) * 2;
    return { weight: round(w+jump), targetReps: item.min, state: "up",
      note: "Tu as fini à " + avgRir.toFixed(1) + " reps en réserve — trop léger. On monte de " + jump + " kg d'un coup." };
  }
  if (atW.length >= item.sets && atW.every(function(s){return s.reps>=item.max;})) {
    return { weight: round(w+itemInc(item)), targetReps: item.min, note: "Toutes les séries au plafond — on monte la charge.", state: "up" };
  }
  if (atW.some(function(s){return s.reps<item.min;}) && hist.length >= 2) {
    var prev = hist[hist.length-2].entry.sets.filter(function(s){return s.weight!=null;});
    var pw = Math.max.apply(null, prev.map(function(s){return s.weight;}));
    if (pw === w && prev.some(function(s){return s.reps<item.min;})) {
      return { weight: round(Math.max(itemInc(item), w-itemInc(item))), targetReps: item.min, note: "Deux séances sous la fourchette — on redescend d'un cran.", state: "down" };
    }
  }
  var next = Math.min(item.max, Math.min.apply(null, atW.map(function(s){return s.reps;})) + 1);
  return { weight: w, targetReps: next, note: "Même charge — vise " + next + " reps sur chaque série.", state: "hold" };
}

function prescribe(sessions, item, deload) {
  var p = prescribeBase(sessions, item);
  if (!deload) return p;
  if (p.weight == null) return { weight: null, targetReps: item.min, state: "deload",
    note: "Décharge : première fois, reste léger et garde 3 reps en réserve." };
  var w2 = round(p.weight * 0.8);
  return { weight: w2, targetReps: item.min, state: "deload", setsOverride: Math.max(2, item.sets-1),
    note: "Semaine de décharge — environ 80% de la charge habituelle, une série de moins, technique propre." };
}

function stallInfo(sessions, exId) {
  var hist = historyFor(sessions, exId);
  if (hist.length < 4) return null;
  var weights = hist.map(function(hh){ return Math.max.apply(null, hh.entry.sets.filter(function(s){return s.weight!=null;}).map(function(s){return s.weight;})); });
  var recent = weights.slice(-4);
  return Math.max.apply(null, recent) <= recent[0] ? { sessions: recent.length, weight: recent[0] } : null;
}
function effortInfo(sessions, exId) {
  var hist = historyFor(sessions, exId).slice(-4);
  if (hist.length < 3) return null;
  var all = [];
  hist.forEach(function(hh){ hh.entry.sets.forEach(function(s){ if (s.rir!=null) all.push(s.rir); }); });
  if (all.length < 6) return null;
  var avg = all.reduce(function(a,b){return a+b;},0) / all.length;
  return avg >= 3 ? { avg: Math.round(avg*10)/10 } : null;
}
function symmetryInfo(sessions, exId) {
  /* Tu commences déjà par le côté faible et égalises la charge/reps sur le
     fort — donc comparer le poids logué des deux côtés ne révélerait jamais
     rien (il est identique par construction). Le signal vient plutôt d'un
     repérage volontaire et léger : sur chaque série tu peux, en option,
     indiquer quel côté a semblé plus dur ce jour-là. On compte juste lequel
     revient le plus souvent sur les dernières séances. */
  var hist = historyFor(sessions, exId).slice(-6);
  var flags = { L: 0, R: 0, total: 0 };
  hist.forEach(function(hh){ hh.entry.sets.forEach(function(s){
    if (s.weakSide === "L") { flags.L++; flags.total++; }
    if (s.weakSide === "R") { flags.R++; flags.total++; }
  }); });
  if (flags.total < 3) return null;
  var dominant = flags.L > flags.R ? "L" : flags.R > flags.L ? "R" : null;
  if (!dominant) return null;
  var pct = Math.round((Math.max(flags.L, flags.R) / flags.total) * 100);
  if (pct < 60) return null;
  return { weaker: dominant==="L" ? "gauche" : "droit", pct: pct, count: flags.total };
}

function stalledCount(sessions, exercises){ return exercises.filter(function(e){return stallInfo(sessions,e.id);}).length; }
function trackedCount(sessions, exercises){ return exercises.filter(function(e){return historyFor(sessions,e.id).length>=4;}).length; }
function reactiveDeloadDue(sessions, exercises){
  var tracked = trackedCount(sessions, exercises);
  if (tracked < 3) return false;
  return stalledCount(sessions, exercises) / tracked >= 0.5;
}
function cyclesCompleted(sessions, program){ return Math.floor(sessions.filter(function(s){return s.done;}).length / program.length); }
function proactiveDeloadDue(sessions, program){
  var done = sessions.filter(function(s){return s.done;}).length;
  var c = cyclesCompleted(sessions, program);
  return c > 0 && c % 6 === 0 && done % program.length === 0;
}

/* Estimated real session length: ~40s of work per set + its rest, doubled for
   unilateral exercises (each "set" is actually done twice, once per side),
   plus ~70s of transition between machines and a 5-minute warm-up/waiting
   buffer. Rough but directional — real gym time also depends on how busy it
   is, so treat this as a floor, not a promise. */
function estimateDayMinutes(day, exMap) {
  var total = 0;
  day.items.forEach(function(it) {
    var ex = exMap[it.ex];
    var physicalSets = (ex && ex.unilateral) ? it.sets * 2 : it.sets;
    total += physicalSets * (40 + it.rest);
  });
  total += Math.max(0, day.items.length - 1) * 70;
  total += 300;
  return Math.round(total / 60);
}

/* Planned weekly volume, by muscle, from the program as configured. */
function plannedVolume(program, exercises) {
  var exMap = {}; exercises.forEach(function(e){ exMap[e.id]=e; });
  var factor = SESSIONS_PER_WEEK / Math.max(1, program.length);
  var m = {};
  program.forEach(function(d){ d.items.forEach(function(it){
    var ex = exMap[it.ex]; if (!ex) return;
    m[ex.muscle] = (m[ex.muscle]||0) + it.sets;
  }); });
  return Object.keys(m).map(function(muscle){ return { muscle: muscle, sets: Math.round(m[muscle]*factor*10)/10 }; })
    .sort(function(a,b){ return b.sets-a.sets; });
}

  var sums = {haut:0, bas:0};
  vol.forEach(function(v){ var r=REGION[v.muscle]; if (r==="haut"||r==="bas") sums[r]+=v.sets; });
  return sums;
}
function pushPullBalance(vol){
  var sums = {push:0, pull:0};
  vol.forEach(function(v){ var c=PUSHPULL[v.muscle]; if (c) sums[c]+=v.sets; });
  return sums;
}

/* Choisit la meilleure machine de remplacement parmi des candidats pour le
   même muscle — au lieu de prendre juste la première de la liste (ordre
   d'ajout au catalogue, qui n'a aucun rapport avec la qualité de l'exercice
   pour l'objectif). Deux critères, dans cet ordre :
   1) une machine CONFIRMÉE (brand !== "?") plutôt qu'une encore "à
      vérifier" — remplacer par une machine dont on n'est même pas sûr
      qu'elle existe à la salle ne sert à rien ;
   2) le même palier polyarticulaire/semi-isolation/isolation (voir `order`
      dans SEED_EXERCISES et exerciseOrderTier) que l'exercice remplacé, pour
      ne pas casser l'ordre poly-avant-isolation de la séance (voir Séance >
      petit badge numéroté sur chaque machine).
   À égalité sur ces deux critères, l'ordre du catalogue tranche — ça reste
   déterministe et prévisible. */
function bestCandidate(candidates, referenceOrder) {
  if (!candidates.length) return null;
  var scored = candidates.map(function(e, i){
    return { e: e, i: i, verified: e.brand !== "?" ? 1 : 0, sameTier: exerciseOrderTier(e) === referenceOrder ? 1 : 0 };
  });
  scored.sort(function(a, b){
    if (a.verified !== b.verified) return b.verified - a.verified;
    if (a.sameTier !== b.sameTier) return b.sameTier - a.sameTier;
    return a.i - b.i;
  });
  return scored[0].e;
}

/* Removing a machine: keep the volume by swapping in the BEST equivalent for
   the same muscle (see bestCandidate), not just the first one on the list. */
function removeWithSubstitution(exId, exercises, program) {
  var gone = exercises.find(function(e){return e.id===exId;});
  var remaining = exercises.filter(function(e){return e.id!==exId;});
  var report = [];
  var nextProgram = program.map(function(day){
    var items = [];
    day.items.forEach(function(it){
      if (it.ex !== exId) { items.push(it); return; }
      var taken = {}; day.items.forEach(function(x){taken[x.ex]=true;}); items.forEach(function(x){taken[x.ex]=true;});
      var candidates = remaining.filter(function(e){ return e.muscle===gone.muscle && !taken[e.id]; });
      var cand = bestCandidate(candidates, exerciseOrderTier(gone));
      if (cand) { items.push(Object.assign({}, it, {ex: cand.id})); report.push({day: day.label, to: cand.name, sets: it.sets}); }
      else { report.push({day: day.label, to: null, sets: it.sets}); }
    });
    return Object.assign({}, day, {items: items});
  });
  return { exercises: remaining, program: nextProgram, report: report, gone: gone };
}

/* An exercise is stalled (same weight 4+ séances) and it's the only one blocking:
   look for the BEST other machine already in the catalog, targeting the same
   muscle, that isn't already used anywhere in the program (see bestCandidate
   for what "best" means here). Returns null if nothing suitable exists. */
function suggestSwap(exId, exercises, program) {
  var ex = exercises.find(function(e){return e.id===exId;});
  if (!ex) return null;
  var usedIds = {};
  program.forEach(function(d){ d.items.forEach(function(it){ usedIds[it.ex]=true; }); });
  var candidates = exercises.filter(function(e){ return e.muscle===ex.muscle && e.id!==exId && !usedIds[e.id]; });
  return bestCandidate(candidates, exerciseOrderTier(ex));
}
function applySwap(oldExId, newExId, program) {
  return program.map(function(d){
    return Object.assign({}, d, { items: d.items.map(function(it){
      return it.ex===oldExId ? Object.assign({}, it, {ex: newExId}) : it;
    }) });
  });
}

/* Adding a machine: propose where it belongs, based on where that muscle is already trained. */
function proposePlacement(newEx, exercises, program) {
  var withNew = exercises.concat([newEx]);
  var vol = plannedVolume(program, withNew);
  var cur = vol.find(function(v){return v.muscle===newEx.muscle;});
  var current = cur ? cur.sets : 0;
  var daysTraining = program.filter(function(d){ return d.items.some(function(it){
    var ex = withNew.find(function(e){return e.id===it.ex;});
    return ex && ex.muscle === newEx.muscle;
  }); });
  var targets = daysTraining.length > 0 ? daysTraining.slice(0,2)
    : program.slice().sort(function(a,b){return a.items.length-b.items.length;}).slice(0,2);
  var setsEach = current >= VOL_MIN ? 3 : 4;
  return { targets: targets.map(function(d){return d.key;}), targetLabels: targets.map(function(d){return d.label;}), setsEach: setsEach, current: current };
}
function applyPlacement(newEx, placement, exercises, program) {
  return program.map(function(d){
    return placement.targets.indexOf(d.key) >= 0
      ? Object.assign({}, d, { items: d.items.concat([{ ex: newEx.id, sets: placement.setsEach, min: 10, max: 15, rest: 90 }]) })
      : d;
  });
}

/* ============================================================
   NUTRITION — Mifflin-St Jeor + activity multipliers + evidence
   ranges for protein and deficit (see Programme tab for sources).
   ============================================================ */
var ACTIVITY_LEVELS = [
  { k: 1.2, label: "Sédentaire", desc: "Peu ou pas d'exercice, travail de bureau" },
  { k: 1.375, label: "Légèrement actif", desc: "Exercice léger 1–2 j/semaine" },
  { k: 1.55, label: "Modérément actif", desc: "Exercice modéré 3–5 j/semaine" },
  { k: 1.725, label: "Très actif", desc: "Exercice intense 6–7 j/semaine" },
  { k: 1.9, label: "Extrêmement actif", desc: "Exercice quotidien intense + métier physique" },
];
function mifflinBMR(weightKg, heightCm, age, sex) {
  var s = sex === "F" ? -161 : 5;

}
/* Kcal burned per step, scaled by body weight — derived from the commonly-
   cited reference point "~0.04 kcal/step for a ~70 kg adult at a normal
   walking pace" (Omnicalculator's steps-to-calories tool, itself citing
   Brooks et al. 2005 walking-energy-expenditure research) rather than a
   fixed number, so it scales sensibly for a different bodyweight. It's a
   simplification — real per-step cost also depends on pace and incline,
   which this app doesn't ask for — so treat the steps-based nutrition mode
   as a reasonable estimate, not a lab measurement. */
var KCAL_PER_STEP_PER_KG = 0.04 / 70;
/* Kcal/minute-per-kg coefficients for a general resistance-training session
   (machines, moderate intensity, ~90s rest between sets) — from a metabolic-
   cart study of 52 participants (via StrengthLog's calorie-burn calculator):
   men ≈ 0.0713 kcal/min/kg, women ≈ 0.0637. When sex isn't set, this app
   averages the two rather than guessing. */
var TRAINING_KCAL_COEF = { M: 0.0713, F: 0.0637, DEFAULT: 0.0675 };
/* profile.targetMode: "manual" (fixed target, e.g. from a coach) | "deficit"
   (BMR × activity multiplier, minus a manual deficit slider — the original
   calculator) | "steps" (BMR/DER + estimated kcal from daily steps + from
   average training volume, see Options tab). avgSessionMinutes is only used
   by "steps" mode and is derived from the actual program (estimateDayMinutes
   averaged across days), passed in by the caller. */
function computeNutrition(profile, avgSessionMinutes) {
  var bmr = (!profile.useBmrFormula && profile.bmrMeasured)
    ? profile.bmrMeasured
    : (profile.heightCm && profile.age && profile.sex ? mifflinBMR(profile.weightKg, profile.heightCm, profile.age, profile.sex) : null);
  var mode = profile.targetMode || (profile.manualTarget ? "manual" : "deficit");
  var target, proteinG, tdee, breakdown = null;

  if (mode === "steps") {
    if (!bmr) return null;
    var stepsKcal = Math.round((profile.dailySteps||0) * profile.weightKg * KCAL_PER_STEP_PER_KG);
    var avgSessions = ((profile.sessionsMin||0) + (profile.sessionsMax||0)) / 2;
    var coef = profile.sex === "F" ? TRAINING_KCAL_COEF.F : profile.sex === "M" ? TRAINING_KCAL_COEF.M : TRAINING_KCAL_COEF.DEFAULT;
    var trainingKcal = Math.round((avgSessionMinutes||0) * profile.weightKg * coef * avgSessions / 7);
    tdee = bmr + stepsKcal + trainingKcal;
    breakdown = { stepsKcal: stepsKcal, trainingKcal: trainingKcal, avgSessions: avgSessions, avgSessionMinutes: avgSessionMinutes||0 };
  } else {
    tdee = bmr ? bmr * profile.activityMultiplier : null;
  }

  if (mode === "manual") {
    // Cible fixe fournie directement (ex. par un coach/diététicien) plutôt
    // que dérivée du calcul BMR/TDEE/déficit — celui-ci reste affiché à
    // titre indicatif quand dispo, mais ne pilote plus la cible.
    target = profile.manualTargetKcal;
    proteinG = profile.manualProteinG;
  } else {
    if (!bmr) return null;
    target = tdee - (profile.deficitKcal||0);
    proteinG = Math.round(profile.weightKg * profile.proteinPerKg);
  }
  var proteinKcal = proteinG * 4;
  var fatG = Math.round(target * 0.25 / 9);
  var fatKcal = fatG * 9;
  var carbKcal = Math.max(0, target - proteinKcal - fatKcal);
  var carbG = Math.round(carbKcal / 4);
  return { bmr: bmr?Math.round(bmr):null, tdee: tdee?Math.round(tdee):null, target: Math.round(target), proteinG: proteinG, fatG: fatG, carbG: carbG, breakdown: breakdown };
}

/* ============================================================
   PERSISTENCE — this page is the record. State lives in a
   published data file (`data/state.json`) via the `artifact`
   runtime capability; localStorage is a same-device fallback
   when that capability is unavailable or hasn't resolved yet.
   ============================================================ */
var LS_KEY = "carnet-fitness-park:v1";
var STATE_VERSION = 1;
/* PROGRAM_VERSION — bump this every time SEED_EXERCISES/SEED_PROGRAM change
   in a way that should reach existing users. Without this, once a session
   has been saved (to data/state.json and/or localStorage), loadInitialState()
   below loads THAT saved program forever and silently ignores any edits made
   here to SEED_PROGRAM — republishing the page changes the code but not what
   an existing user actually sees. Bumping the number forces a one-time merge
   that replaces exercises+program with the latest SEED_* while preserving
   everything the user has logged (sessions, bodyLog, profile, active set). */
var PROGRAM_VERSION = 3;

function seedState() {
  return {
    v: STATE_VERSION,
    programVersion: PROGRAM_VERSION,
    exercises: SEED_EXERCISES,
    program: SEED_PROGRAM,
    sessions: [],
    active: null,
    deloadForNextStart: false,
    meta: { deloadSnoozeUntil: 0 },
    bodyLog: [
      { id: "b1", date: null, weightKg: 84.6, fatKg: 22.4, muscleKg: 59.1, bmr: 1846, source: "Boditrax" },
      { id: "b2", date: todayISO(), weightKg: 85.1, fatKg: 22.4, muscleKg: 59.5, bmr: 1860, source: "Boditrax" },
    ],
    profile: {
      weightKg: 85.1, heightCm: null, age: 31, sex: null,
      bmrMeasured: 1860, useBmrFormula: false,
      activityMultiplier: 1.55, deficitKcal: 350, proteinPerKg: 2.0,
      manualTarget: true, manualTargetKcal: 2250, manualProteinG: 175,
      targetMode: "manual", dailySteps: 8000, sessionsMin: 3, sessionsMax: 4, alertVolume: 1,
      wheyLabel: "HSN Whey Protein Isolate (scoop 30 g)", wheyKcal: 116, wheyProtein: 27.9,
    },
  };
}
function todayISO(){ var d = new Date(); return d.toISOString().slice(0,10); }

var capPromise = null;
function getCap() {
  if (!capPromise) {
    capPromise = (window.claude && window.claude.use) ? window.claude.use("artifact").catch(function(){return null;}) : Promise.resolve(null);
  }
  return capPromise;
}
var downloadsCapPromise = null;
function getDownloadsCap() {
  if (!downloadsCapPromise) {
    downloadsCapPromise = (window.claude && window.claude.use) ? window.claude.use("downloads").catch(function(){return null;}) : Promise.resolve(null);
  }
  return downloadsCapPromise;
}
/* An in-progress session started before a program migration can be stuck
   with a stale row shape (e.g. the old double-row-per-unilateral-exercise
   layout, from before v3). Rather than discard whatever the user already
   logged, collapse each entry down to the exercise's *current* set count:
   keep the first nSets already-filled-in rows (padding with empty rows if
   there are fewer), so real numbers survive and the UI matches today's
   program. This only fires once, right when programVersion bumps. */
function migrateActiveSession(active, program) {
  if (!active || !active.entries) return active;
  var byExId = {};
  program.forEach(function(d){ d.items.forEach(function(it){ byExId[it.ex] = it; }); });
  var entries = active.entries.map(function(entry){
    var it = byExId[entry.ex];
    var nSets = it ? it.sets : entry.sets.length;
    var sets = entry.sets.slice(0, nSets);
    while (sets.length < nSets) sets.push({weight:null, reps:null, rir:null, weakSide:null});
    return { ex: entry.ex, sets: sets };
  });

}
function withLatestProgram(state) {
  if (!state) return state;
  if ((state.programVersion || 0) >= PROGRAM_VERSION) return state;
  return Object.assign({}, state, {
    programVersion: PROGRAM_VERSION,
    exercises: SEED_EXERCISES,
    program: SEED_PROGRAM,
    active: state.active ? migrateActiveSession(state.active, SEED_PROGRAM) : state.active,
    _justMigrated: true,
  });
}
/* One-time, version-independent fill-in for profile fields added after a
   user's state already existed (currently: the fixed-target nutrition
   fields). Only sets a field when it's missing — never touches a value the
   user already has, so this is safe to run on every load. */
function withNutritionDefaults(state) {
  if (!state || !state.profile) return state;
  if (state.profile.manualTarget !== undefined) return state;
  return Object.assign({}, state, {
    profile: Object.assign(
      { manualTarget: true, manualTargetKcal: 2250, manualProteinG: 175 },
      state.profile
    ),
    _justMigrated: true,
  });
}
/* One-time, version-independent fill-in for the Options-tab fields (target
   mode, daily steps, session-count range, rest-alert volume) — same
   additive pattern as withNutritionDefaults: only sets a field when it's
   missing, safe to run on every load, defaults targetMode from the older

function withOptionsDefaults(state) {
  if (!state || !state.profile) return state;

    profile: Object.assign(
      {

      state.profile

    _justMigrated: true,

}
/* NOTE — no auto-migration here on purpose (tried one, reverted it): an
   earlier version of this fix silently defaulted every exercise missing
   `order` to 2 (semi-isolation). That sounded harmless but wasn't — anyone
   who'd added several custom machines over time (via "Ajouter au matériel",
   before the order-tier picker existed) had ALL of them flattened to the
   same "2" in one shot, which reshuffled their position in the session
   sequence instead of leaving already-working data alone. Silently
   rewriting data nobody asked to change is worse than a missing badge.
   The fix now touches only what the user explicitly sets: ManualAdd asks
   for the tier on every new machine going forward, and the Machines tab
   shows an "ordre non défini" hint + picker on any existing machine still
   missing it, so each one gets corrected one at a time, on purpose, by the
   person who actually knows what it should be — nothing changes on load. */
function withAllMigrations(state) { return withOptionsDefaults(withNutritionDefaults(withLatestProgram(state))); }
async function loadInitialState() {
  try {
    var res = await fetch("data/state.json", { cache: "no-store" });
    if (res.ok) { var j = await res.json(); if (j && j.v) return withAllMigrations(j); }
  } catch (e) {}
  try {
    var raw = localStorage.getItem(LS_KEY);

}
var publishTimer = null;
function scheduleSave(state, onStatus) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  if (publishTimer) clearTimeout(publishTimer);
  publishTimer = setTimeout(function(){ doPublish(state, onStatus); }, 1200);
}
async function doPublish(state, onStatus) {
  var cap = await getCap();
  if (!cap) { onStatus && onStatus("local"); return; }
  try {
    await cap.publish({ "data/state.json": JSON.stringify(state) });
    onStatus && onStatus("cloud");
  } catch (e) {
    onStatus && onStatus(e && e.code === "conflict" ? "cloud" : "local");
  }
}

/* ============================================================
   SMALL UI PIECES

function Stepper(props) {

      style:{padding:"0 10px",display:"flex",alignItems:"center",justifyContent:"center",background:C.shroudDeep,color:C.taupe,border:"none"}},

/* Microwave-style alert: 4 short, sharp square-wave beeps (a harsher, more

function HistoriqueTab(props){
  var sessions=props.sessions, exMap=props.exMap, program=props.program, deleteSession=props.deleteSession;
  var _o = useState(null), open=_o[0], setOpen=_o[1];
  var done = sessions.filter(function(s){return s.done;}).slice().reverse();
  if (done.length===0) {
    return h("div",{style:{borderRadius:10,padding:24,textAlign:"center",background:C.shroudDeep,border:"1px dashed "+C.taupeDim}},
      h("div",{style:{fontFamily:sansCond,fontSize:17,fontWeight:600,marginBottom:6}}, "Rien d'enregistré"),
      h("div",{style:{fontSize:14,color:C.taupe,lineHeight:1.5}}, "Enregistre une séance et elle apparaîtra ici. C'est aussi ce qui alimente la progression automatique."));
  }
  return h("div", null, done.map(function(s){
    var day = program.find(function(d){return d.key===s.dayKey;});
    var tonnage = s.entries.reduce(function(a,e){ return a + e.sets.reduce(function(b,x){ return b + (x.weight||0)*(x.reps||0); },0); },0);
    var rirs = []; s.entries.forEach(function(e){ e.sets.forEach(function(x){ if (x.rir!=null) rirs.push(x.rir); }); });

      h("button",{onClick:function(){setOpen(isOpen?null:s.id);}, style:{width:"100%",padding:"12px",display:"flex",alignItems:"center",justifyContent:"space-between",background:C.shroudDeep,border:"none",textAlign:"left"}},
        h("div",null,
          h("div",{style:{fontFamily:sansCond,fontSize:16,fontWeight:600,color:day?day.accent:C.bone}}, (day?day.label:s.dayKey)+(s.deload?" · décharge":"")),
          h("div",{style:{fontFamily:sansCond,fontSize:12,color:C.taupe}},

        h(Icon,{name:isOpen?"chevronDown":"chevronRight", size:17, color:C.taupe})),

        s.entries.map(function(e,i){ var ex=exMap[e.ex]; return h("div",{key:i, style:{padding:"8px 12px",borderTop:"1px solid "+C.shroudDeep}},
          h("div",{style:{fontSize:14,fontWeight:600}}, ex?ex.name:"Machine supprimée"),
          h("div",{style:{fontSize:13.5,color:C.taupe,fontVariantNumeric:"tabular-nums"}},
            e.sets.map(function(x){ return x.weight+"×"+x.reps+(x.rir!=null?" ("+x.rir+")":"")+(x.weakSide?" ["+(x.weakSide==="L"?"G+dur":"D+dur")+"]":""); }).join("   "))); }),
        h("div",{style:{padding:"8px 12px",borderTop:"1px solid "+C.shroudDeep}},
          h("button",{onClick:function(){deleteSession(s.id);}, style:{display:"flex",alignItems:"center",gap:5,color:C.rust,fontFamily:sansCond,fontSize:13,background:"transparent",border:"none"}},
            h(Icon,{name:"trash",size:13}), "Supprimer cette séance"))

          h("div",{style:{fontSize:13,color:C.taupe,lineHeight:1.5}}, "Côté "+x.sym.weaker+" signalé plus dur sur "+x.sym.count+" des dernières séries ("+x.sym.pct+"%). Continue à commencer par ce côté et à égaliser les reps avant de monter la charge."))); })) : null,

    h(Section,{title:"Équilibre du programme"},
      h(BalanceRow,{label:"Haut du corps vs bas du corps", a:region.haut, b:region.bas, aLabel:"haut", bLabel:"bas"}),
      h(BalanceRow,{label:"Push vs pull (haut du corps)", a:pp.push, b:pp.pull, aLabel:"push", bLabel:"pull"}),
      h("p",{style:{fontSize:12,color:C.taupe,lineHeight:1.5}}, "Basé sur ce que tu as réellement fait sur 28 jours (ou sur le programme prévu si tu manques encore de données).")),

    h(Section,{title:"Séries réellement faites par semaine"},
      h("div",{style:{borderRadius:10,padding:"10px 12px",background:C.shroudDeep,border:"1px solid "+C.taupeDim}},
        setsByMuscle.length===0 ? h("div",{style:{fontSize:13,color:C.taupe,padding:"8px 0"}}, "Pas encore de séance dans les 28 derniers jours.") :
        setsByMuscle.map(function(v,i){ var low=v.sets<VOL_MIN, high=v.sets>VOL_MAX;
          return h("div",{key:v.muscle, style:{display:"flex",alignItems:"center",gap:10,padding:"6px 0",borderTop:i?"1px solid "+C.shroud:"none"}},
            h("span",{style:{fontSize:13,width:110,flexShrink:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}, v.muscle),
            h(Bar,{value:v.sets, max:Math.max(VOL_MAX*1.3,20), tone: low?C.rust:high?C.pin:C.green}),
            h("span",{style:{fontSize:13,fontWeight:600,fontVariantNumeric:"tabular-nums",width:44,textAlign:"right"}}, v.sets)); })),
      h("p",{style:{fontSize:12.5,color:C.taupe,marginTop:6,lineHeight:1.5}}, "À comparer au volume prévu dans l'onglet Machines. L'écart, c'est l'assiduité.")),

    h(Section,{title:"Charge totale par séance"},
      h("div",{style:{borderRadius:10,padding:"6px 8px",background:C.shroudDeep,border:"1px solid "+C.taupeDim}},
        h(SparkChart,{data:trend, color:C.pin, unit:" kg"}))),

    h(Section,{title:"Progression par exercice"},
      h(Select,{value:focus||"", onChange:function(v){setFocus(v||null);}},
        h("option",{value:""}, "Choisir un exercice…"),
        exercises.filter(function(e){return historyFor(sessions,e.id).length>0;}).map(function(e){ return h("option",{key:e.id,value:e.id}, e.name); })),
      focus ? h("div",{style:{borderRadius:10,padding:"6px 8px",background:C.shroudDeep,border:"1px solid "+C.taupeDim}},
        h(SparkChart,{data:focusData, color:C.pin, unit:" kg"})) : null),

    h(Section,{title:"Suivi du poids"},
      h("div",{style:{borderRadius:10,padding:"6px 8px",background:C.shroudDeep,border:"1px solid "+C.taupeDim,marginBottom:10}},
        h(SparkChart,{data:weightTrend, color:C.steel, unit:" kg"})),
      h("div",{style:{display:"flex",gap:8}},
        h("input",{type:"number", inputMode:"decimal", value:wInput, placeholder:"Poids aujourd'hui (kg)",
          onChange:function(e){setWInput(e.target.value);},
          style:{flex:1,padding:"8px 12px",borderRadius:6,background:C.shroud,color:C.bone,border:"1px solid "+C.taupeDim,fontFamily:sansBody,fontSize:15,outline:"none"}}),
        h("button",{onClick:function(){ var v=parseFloat(wInput); if(!isNaN(v)){ addBodyEntry({weightKg:v}); setWInput(""); } },
          style:{padding:"0 16px",borderRadius:6,background:C.steel,color:C.shroudDeep,fontFamily:sansCond,fontSize:14,fontWeight:700,border:"none"}}, "Ajouter")),
      h("p",{style:{fontSize:12,color:C.taupe,marginTop:8,lineHeight:1.5}}, "Pèse-toi dans les mêmes conditions (à jeun, le matin) — regarde la tendance sur 2–3 semaines, pas une pesée isolée : le poids bouge avec l'eau et la digestion.")),

    h(Section,{title:"Sortir les données"},
      h("button",{onClick:exportText, style:{width:"100%",padding:"12px 0",borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",gap:8,color:C.pin,border:"1px solid "+C.pin,background:"transparent",fontFamily:sansCond,fontSize:15,fontWeight:600}},
        h(Icon,{name:"download",size:16}), "Télécharger le carnet en texte"),
      exportMsg && exportMsg!=="saving" ? h("p",{style:{fontSize:12.5,color: exportMsg.indexOf("Téléchargé")===0?C.green:C.rust, marginTop:8}}, exportMsg) : null,
      h("p",{style:{fontSize:12.5,color:C.taupe,marginTop:8,lineHeight:1.55}}, "Toutes les 6–8 semaines, exporte ce fichier et fais-le relire."))
  );
}

/* ============================================================
   MAIN APP
   ============================================================ */
function App(props){
  var initial = props.initialState;
  var _tab = useState("seance"), tab=_tab[0], setTab=_tab[1];
  var _st = useState(initial), state=_st[0], setStateRaw=_st[1];
  var _sync = useState(initial ? "local" : "saving"), syncStatus=_sync[0], setSyncStatus=_sync[1];

  var setState = useCallback(function(patch){
    setStateRaw(function(prev){
      var next = typeof patch === "function" ? patch(prev) : Object.assign({}, prev, patch);
      setSyncStatus("saving");
      scheduleSave(next, setSyncStatus);
      return next;
    });
  }, []);

  useEffect(function(){
    if (initial && initial._justMigrated) {
      var clean = Object.assign({}, initial); delete clean._justMigrated;
      setState(function(){ return clean; });
    }
    // eslint-disable-next-line
  }, []);

  useEffect(function(){ INC_CACHE = {}; state.exercises.forEach(function(e){ INC_CACHE[e.id]=e.inc; }); }, [state.exercises]);

  var exMap = useMemo(function(){ var m={}; state.exercises.forEach(function(e){m[e.id]=e;}); return m; }, [state.exercises]);
  var nextDayKey = useMemo(function(){
    /* Skip freeform/kiné sessions (dayKey doesn't match a program day) so an
       occasional custom session doesn't derail the A/B rotation. */
    var keys = state.program.map(function(p){return p.key;});
    var d = state.sessions.filter(function(s){return s.done && keys.indexOf(s.dayKey)!==-1;});
    if (d.length===0) return state.program[0].key;
    var i = state.program.findIndex(function(p){return p.key===d[d.length-1].dayKey;});
    return state.program[(i+1)%state.program.length].key;
  }, [state.sessions, state.program]);

  var deloadReactive = reactiveDeloadDue(state.sessions, state.exercises);
  var deloadProactive = proactiveDeloadDue(state.sessions, state.program);
  var deloadSuggested = (deloadReactive || deloadProactive) && state.sessions.filter(function(s){return s.done;}).length >= (state.meta.deloadSnoozeUntil||0);
  var deloadReason = deloadReactive
    ? "Plusieurs exercices sont bloqués sur la même charge depuis 4 séances — signe classique qu'une semaine plus légère aiderait à repartir."
    : "Ça fait environ 6 tours complets du programme (~5-8 semaines selon ton rythme) — une décharge périodique aide à consolider les gains et prévenir la fatigue accumulée.";

  var _rt = useState(null), restTimer=_rt[0], setRestTimer=_rt[1];
  var restIdRef = useRef(0);
  var wakeLockRef = useRef(null);
  // Screen Wake Lock: while a rest timer runs, ask the browser to keep the
  // screen on. This ONLY prevents the screen from auto-dimming/locking on
  // its own while the app stays open and visible — it does nothing once the
  // user manually locks the phone or switches to another app (the spec
  // auto-releases the lock the instant the page becomes hidden). Wrapped in
  // try/catch and feature-detected since many mobile browsers (notably
  // Safari on iOS before 16.4, and some in-app browsers) don't support it.
  function acquireWakeLock(){
    try {
      if (navigator.wakeLock && !wakeLockRef.current) {
        navigator.wakeLock.request("screen").then(function(wl){ wakeLockRef.current = wl; }).catch(function(){});
      }
    } catch(e) {}
  }
  function releaseWakeLock(){
    try {
      if (wakeLockRef.current) { wakeLockRef.current.release().catch(function(){}); wakeLockRef.current = null; }
    } catch(e) {}
  }
  useEffect(function(){
    function onVisible(){
      if (document.visibilityState === "visible" && restTimer) acquireWakeLock();
    }
    document.addEventListener("visibilitychange", onVisible);
    return function(){ document.removeEventListener("visibilitychange", onVisible); };
  }, [restTimer]);
  function startRestTimer(seconds, label){
    restIdRef.current += 1;
    setRestTimer({ id: restIdRef.current, endTime: Date.now() + seconds*1000, duration: seconds, label: label });
    acquireWakeLock();
  }
  function adjustRestTimer(delta){
    setRestTimer(function(rt){ return rt ? Object.assign({}, rt, {endTime: rt.endTime + delta*1000}) : rt; });
  }
  function stopRestTimer(){ setRestTimer(null); releaseWakeLock(); }

  function persistConfig(exercises, program){ setState({exercises:exercises, program:program}); }
  function persistSessions(sessions){ setState({sessions:sessions}); }
  function setActive(active){ if (!active) { setRestTimer(null); releaseWakeLock(); } setState({active:active}); }
  function setDeloadForNextStart(v){ setState({deloadForNextStart:v}); }
  function snoozeDeload(){ setState(function(prev){ return Object.assign({},prev,{meta:{deloadSnoozeUntil: prev.sessions.filter(function(s){return s.done;}).length + 4}}); }); }
  function finishSession(){
    var active = state.active;
    var cleaned = Object.assign({}, active, { done:true,
      entries: active.entries.map(function(e){ return Object.assign({}, e, {sets: e.sets.filter(function(s){return s.weight!=null && s.reps!=null;})}); }).filter(function(e){return e.sets.length>0;}) });
    if (cleaned.entries.length===0) { setActive(null); return; }
    setRestTimer(null);
    releaseWakeLock();
    setState({ sessions: state.sessions.concat([cleaned]), active: null });
  }
  function deleteSession(id){ setState({sessions: state.sessions.filter(function(s){return s.id!==id;})}); }
  function setProfile(p){ setState({profile:p}); }
  /* Corrige le palier poly/semi/isolation d'une machine, appelable depuis
     n'importe quel écran qui affiche son badge (pas seulement l'onglet
     Machines) — voir OrderBadge. */
  function updateExerciseOrder(exId, order){
    setState({ exercises: state.exercises.map(function(e){ return e.id===exId ? Object.assign({},e,{order:order}) : e; }) });
  }
  /* Palier de poids (plus petit incrément, en kg) d'une machine — distinct
     du palier poly/semi/isolation ci-dessus. Même schéma : appelable depuis
     n'importe quel écran (voir IncStepper). INC_CACHE se met à jour tout
     seul via le useEffect(...[state.exercises]) plus haut. */
  function updateExerciseInc(exId, inc){
    setState({ exercises: state.exercises.map(function(e){ return e.id===exId ? Object.assign({},e,{inc:inc}) : e; }) });
  }
  function addBodyEntry(entry){
    setState({ bodyLog: (state.bodyLog||[]).concat([Object.assign({id:"b"+Date.now(), date: todayISO(), source:"manuel"}, entry)]) });
  }
  var TABS = [
    { k:"seance", label:"Séance", icon:"dumbbell" },
    { k:"programme", label:"Programme", icon:"flag" },
    { k:"historique", label:"Historique", icon:"history" },
    { k:"machines", label:"Machines", icon:"wrench" },
    { k:"analyse", label:"Analyse", icon:"trending" },
    { k:"options", label:"Options", icon:"gear" },
  ];

  return h("div",{style:{background:C.shroudDeep, fontFamily:sansBody, color:C.bone, minHeight:"100vh"}},
    h("header",{style:{padding:"16px 16px 12px", display:"flex",alignItems:"baseline",justifyContent:"space-between",borderBottom:"1px solid "+C.taupeDim}},
      h("h1",{style:{fontFamily:sansCond,fontSize:21,fontWeight:700,margin:0}}, "Sunglo sport"),
      h("div",{style:{display:"flex",alignItems:"center",gap:12}},
        h(SyncDot,{status:syncStatus}),
        h("span",{style:{fontFamily:sansCond,fontSize:12,color:C.taupe}}, state.sessions.filter(function(s){return s.done;}).length+" séances"))),
    h("main",{style:{padding:"16px",paddingBottom: restTimer?150:88, maxWidth:640, margin:"0 auto"}},
      tab==="seance" ? h(SeanceTab,{ program:state.program, exercises:state.exercises, exMap:exMap, sessions:state.sessions, nextDayKey:nextDayKey,
        active:state.active, setActive:setActive, finishSession:finishSession, startRestTimer:startRestTimer,
        deloadForNextStart:state.deloadForNextStart, setDeloadForNextStart:setDeloadForNextStart,
        snoozeDeload:snoozeDeload, deloadSuggested: !state.active && deloadSuggested, deloadReason:deloadReason,
        updateExerciseOrder:updateExerciseOrder, updateExerciseInc:updateExerciseInc, persistConfig:persistConfig }) : null,
      tab==="programme" ? h(ProgrammeTab,{ program:state.program, exercises:state.exercises, profile:state.profile, setProfile:setProfile }) : null,
      tab==="historique" ? h(HistoriqueTab,{ sessions:state.sessions, exMap:exMap, program:state.program, deleteSession:deleteSession }) : null,
      tab==="machines" ? h(MachinesTab,{ exercises:state.exercises, program:state.program, persistConfig:persistConfig, sessions:state.sessions, updateExerciseInc:updateExerciseInc }) : null,
      tab==="analyse" ? h(AnalyseTab,{ sessions:state.sessions, exercises:state.exercises, exMap:exMap, program:state.program, persistConfig:persistConfig, bodyLog:state.bodyLog, addBodyEntry:addBodyEntry }) : null,
      tab==="options" ? h(OptionsTab,{ profile:state.profile, setProfile:setProfile, program:state.program, exercises:state.exercises }) : null),
    h("div",{style:{position:"fixed",bottom:0,left:0,right:0}},
      restTimer ? h(RestTimerBar,{timer:restTimer, onAdjust:adjustRestTimer, onDismiss:stopRestTimer, volume: state.profile.alertVolume}) : null,
      h("nav",{style:{display:"flex",background:C.shroudDeep,borderTop:"1px solid "+C.taupeDim}},
        TABS.map(function(t){ return h("button",{key:t.k, onClick:function(){setTab(t.k);},
          style:{flex:1,padding:"10px 0",display:"flex",flexDirection:"column",alignItems:"center",gap:3,background:"transparent",border:"none",color:tab===t.k?C.pin:C.taupe}},
          h(Icon,{name:t.icon,size:19}), h("span",{style:{fontFamily:sansCond,fontSize:10.5,fontWeight:600}}, t.label)); })))
  );
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
(function boot(){
  var rootEl = document.getElementById("root");
  rootEl.innerHTML = "";
  var loading = document.createElement("div");
  loading.style.cssText = "min-height:100vh;display:flex;align-items:center;justify-content:center;color:"+C.taupe+";font-family:"+sansCond+";font-size:15px;";
  loading.textContent = "Chargement du carnet…";
  rootEl.appendChild(loading);

  loadInitialState().then(function(state){
    var root = ReactDOM.createRoot(rootEl);
    root.render(h(App, {initialState: state}));
  }).catch(function(){
    var root = ReactDOM.createRoot(rootEl);
    root.render(h(App, {initialState: seedState()}));
  });
})();
</script>
