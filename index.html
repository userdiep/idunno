  return h("div", null,
    h(Section, {title:"Objectif d'entraînement"},
      h("p",{style:{fontSize:12,color:C.taupe,lineHeight:1.6,marginBottom:10}},
        "Détermine le déficit/protéines/activité par défaut ci-dessous (et repasse la cible en mode \"DER + pas + séances\" si tu étais en \"Cible fixe\", sinon le changement ne se verrait pas — ce mode calcule une vraie moyenne hebdomadaire à partir de tes pas et de tes séances réelles, pas juste un multiplicateur d'activité générique), et les séries/reps/repos proposés pour les PROCHAINES machines ajoutées ou remplacées (voir Séance > icône de remplacement, et Programme > ajouter un exercice) — ainsi que la cible de volume hebdomadaire par muscle (voir Machines > \"Volume prévu par semaine\"), calculée à partir de ta fréquence réelle réglée ci-dessous, pas d'un chiffre fixe. Ne modifie les machines déjà en place que si tu le confirmes ci-dessous après avoir changé d'objectif."),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8, marginBottom:10}},

/* ============================================================
   HISTORIQUE
   ============================================================ */
function HistoriqueTab(props){
  var sessions=props.sessions, exMap=props.exMap, program=props.program, deleteSession=props.deleteSession;
  var _o = useState(null), open=_o[0], setOpen=_o[1];
  var done = sessions.filter(function(s){return s.done;}).slice().reverse();
  if (done.length===0) {
    return h("div",{style:{borderRadius:10,padding:24,textAlign:"center",background:C.shroudDeep,border:"1px dashed "+C.taupeDim}},
      h("div",{style:{fontFamily:sansCond,fontSize:17,fontWeight:600,marginBottom:6}}, "Rien d'enregistré"),
      h("div",{style:{fontSize:14,color:C.taupe,lineHeight:1.5}}, "Enregistre une séance et elle apparaîtra ici. C'est aussi ce qui alimente la progression automatique."));
  }
  return h("div", null, done.map(function(s){
    var day = program.find(function(d){return d.key===s.dayKey;});
    var tonnage = s.entries.reduce(function(a,e){ return a + e.sets.reduce(function(b,x){ return b + (x.weight||0)*(x.reps||0); },0); },0);
    var rirs = []; s.entries.forEach(function(e){ e.sets.forEach(function(x){ if (x.rir!=null) rirs.push(x.rir); }); });
    var avgRir = rirs.length ? (rirs.reduce(function(a,b){return a+b;},0)/rirs.length).toFixed(1) : null;
    var isOpen = open===s.id;
    return h("div",{key:s.id, style:{marginBottom:8,borderRadius:10,overflow:"hidden",border:"1px solid "+C.taupeDim}},
      h("button",{onClick:function(){setOpen(isOpen?null:s.id);}, style:{width:"100%",padding:"12px",display:"flex",alignItems:"center",justifyContent:"space-between",background:C.shroudDeep,border:"none",textAlign:"left"}},
        h("div",null,
          h("div",{style:{fontFamily:sansCond,fontSize:16,fontWeight:600,color:day?day.accent:C.bone}}, (day?day.label:s.dayKey)+(s.deload?" · décharge":"")),
          h("div",{style:{fontFamily:sansCond,fontSize:12,color:C.taupe}},
            new Date(s.date).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}) + " · " + Math.round(tonnage).toLocaleString("fr-FR") + " kg" + (avgRir!=null?" · "+avgRir+" en réserve":""))),
        h(Icon,{name:isOpen?"chevronDown":"chevronRight", size:17, color:C.taupe})),
      isOpen ? h("div",{style:{background:C.shroud}},
        s.entries.map(function(e,i){ var ex=exMap[e.ex]; return h("div",{key:i, style:{padding:"8px 12px",borderTop:"1px solid "+C.shroudDeep}},
          h("div",{style:{fontSize:14,fontWeight:600}}, ex?ex.name:"Machine supprimée"),
          h("div",{style:{fontSize:13.5,color:C.taupe,fontVariantNumeric:"tabular-nums"}},
            e.sets.map(function(x){ return x.weight+"×"+x.reps+(x.rir!=null?" ("+x.rir+")":"")+(x.weakSide?" ["+(x.weakSide==="L"?"G+dur":"D+dur")+"]":""); }).join("   "))); }),
        h("div",{style:{padding:"8px 12px",borderTop:"1px solid "+C.shroudDeep}},
          h("button",{onClick:function(){deleteSession(s.id);}, style:{display:"flex",alignItems:"center",gap:5,color:C.rust,fontFamily:sansCond,fontSize:13,background:"transparent",border:"none"}},
            h(Icon,{name:"trash",size:13}), "Supprimer cette séance"))
      ) : null);
  }));
}

  var wakeLockRef = useRef(null);
  // Screen Wake Lock: while a rest timer runs, ask the browser to keep the
  // screen on. This ONLY prevents the screen from auto-dimming/locking on
  // its own while the app stays open and visible — it does nothing once the
  // user manually locks the phone or switches to another app (the spec
  // auto-releases the lock the instant the page becomes hidden). Wrapped in
  // try/catch and feature-detected since many mobile browsers (notably
  // Safari on iOS before 16.4, and some in-app browsers) don't support it.
  function acquireWakeLock(){
    try {
      if (navigator.wakeLock && !wakeLockRef.current) {
        navigator.wakeLock.request("screen").then(function(wl){ wakeLockRef.current = wl; }).catch(function(){});
      }
    } catch(e) {}
  }
  function releaseWakeLock(){
    try {
      if (wakeLockRef.current) { wakeLockRef.current.release().catch(function(){}); wakeLockRef.current = null; }
    } catch(e) {}
  }
  useEffect(function(){
    function onVisible(){
      if (document.visibilityState === "visible" && restTimer) acquireWakeLock();
    }
    document.addEventListener("visibilitychange", onVisible);
    return function(){ document.removeEventListener("visibilitychange", onVisible); };
  }, [restTimer]);
  function startRestTimer(seconds, label){
    restIdRef.current += 1;
    setRestTimer({ id: restIdRef.current, endTime: Date.now() + seconds*1000, duration: seconds, label: label });
    acquireWakeLock();
  }
  function adjustRestTimer(delta){
    setRestTimer(function(rt){ return rt ? Object.assign({}, rt, {endTime: rt.endTime + delta*1000}) : rt; });
  }
  function stopRestTimer(){ setRestTimer(null); releaseWakeLock(); }

  function persistConfig(exercises, program){ setState({exercises:exercises, program:program}); }
  function persistSessions(sessions){ setState({sessions:sessions}); }
  function setActive(active){ if (!active) { setRestTimer(null); releaseWakeLock(); } setState({active:active}); }
  function setDeloadForNextStart(v){ setState({deloadForNextStart:v}); }
  function snoozeDeload(){ setState(function(prev){ return Object.assign({},prev,{meta:{deloadSnoozeUntil: prev.sessions.filter(function(s){return s.done;}).length + 4}}); }); }
  function finishSession(){
    var active = state.active;
    var cleaned = Object.assign({}, active, { done:true,
      entries: active.entries.map(function(e){ return Object.assign({}, e, {sets: e.sets.filter(function(s){return s.weight!=null && s.reps!=null;})}); }).filter(function(e){return e.sets.length>0;}) });
    if (cleaned.entries.length===0) { setActive(null); return; }
    setRestTimer(null);
    releaseWakeLock();
    setState({ sessions: state.sessions.concat([cleaned]), active: null });
  }
  function deleteSession(id){ setState({sessions: state.sessions.filter(function(s){return s.id!==id;})}); }
  function setProfile(p){ setState({profile:p}); }
  /* Corrige le palier poly/semi/isolation d'une machine, appelable depuis
     n'importe quel écran qui affiche son badge (pas seulement l'onglet
     Machines) — voir OrderBadge. */
  function updateExerciseOrder(exId, order){
    setState({ exercises: state.exercises.map(function(e){ return e.id===exId ? Object.assign({},e,{order:order}) : e; }) });
  }
  /* Palier de poids (plus petit incrément, en kg) d'une machine — distinct
     du palier poly/semi/isolation ci-dessus. Même schéma : appelable depuis
     n'importe quel écran (voir IncStepper). INC_CACHE se met à jour tout
     seul via le useEffect(...[state.exercises]) plus haut. */
  function updateExerciseInc(exId, inc){
    setState({ exercises: state.exercises.map(function(e){ return e.id===exId ? Object.assign({},e,{inc:inc}) : e; }) });
  }
  function addBodyEntry(entry){
    setState({ bodyLog: (state.bodyLog||[]).concat([Object.assign({id:"b"+Date.now(), date: todayISO(), source:"manuel"}, entry)]) });
  }
  var TABS = [
    { k:"seance", label:"Séance", icon:"dumbbell" },
    { k:"programme", label:"Programme", icon:"flag" },
    { k:"machines", label:"Machines", icon:"wrench" },
    { k:"historique", label:"Historique", icon:"history" },
    { k:"analyse", label:"Analyse", icon:"trending" },
    { k:"options", label:"Options", icon:"gear" },
  ];

  return h("div",{style:{background:C.shroudDeep, fontFamily:sansBody, color:C.bone, minHeight:"100vh"}},
    h("header",{style:{padding:"16px 16px 12px", display:"flex",alignItems:"baseline",justifyContent:"space-between",borderBottom:"1px solid "+C.taupeDim}},
      h("h1",{style:{fontFamily:sansCond,fontSize:21,fontWeight:700,margin:0}}, "Sunglo sport"),
      h("div",{style:{display:"flex",alignItems:"center",gap:12}},
        h(SyncDot,{status:syncStatus}),
        h("span",{style:{fontFamily:sansCond,fontSize:12,color:C.taupe}}, state.sessions.filter(function(s){return s.done;}).length+" séances"))),
    h("main",{style:{padding:"16px",paddingBottom: restTimer?150:88, maxWidth:640, margin:"0 auto"}},
      tab==="seance" ? h(SeanceTab,{ program:state.program, exercises:state.exercises, exMap:exMap, sessions:state.sessions, nextDayKey:nextDayKey,
        active:state.active, setActive:setActive, finishSession:finishSession, startRestTimer:startRestTimer,
        deloadForNextStart:state.deloadForNextStart, setDeloadForNextStart:setDeloadForNextStart,
        snoozeDeload:snoozeDeload, deloadSuggested: !state.active && deloadSuggested, deloadReason:deloadReason,
        updateExerciseOrder:updateExerciseOrder, updateExerciseInc:updateExerciseInc, persistConfig:persistConfig, goal:state.profile.goal,
        profile:state.profile, setProfile:setProfile }) : null,
      tab==="programme" ? h(ProgrammeTab,{ program:state.program, exercises:state.exercises, profile:state.profile, setProfile:setProfile }) : null,
      tab==="historique" ? h(HistoriqueTab,{ sessions:state.sessions, exMap:exMap, program:state.program, deleteSession:deleteSession }) : null,
      tab==="machines" ? h(MachinesTab,{ exercises:state.exercises, program:state.program, persistConfig:persistConfig, sessions:state.sessions, updateExerciseInc:updateExerciseInc, goal:state.profile.goal, profile:state.profile }) : null,
      tab==="analyse" ? h(AnalyseTab,{ sessions:state.sessions, exercises:state.exercises, exMap:exMap, program:state.program, persistConfig:persistConfig, bodyLog:state.bodyLog, addBodyEntry:addBodyEntry, goal:state.profile.goal, profile:state.profile }) : null,
      tab==="options" ? h(OptionsTab,{ profile:state.profile, setProfile:setProfile, program:state.program, exercises:state.exercises, bodyLog:state.bodyLog, persistConfig:persistConfig }) : null),
    h("div",{style:{position:"fixed",bottom:0,left:0,right:0}},
      restTimer ? h(RestTimerBar,{timer:restTimer, onAdjust:adjustRestTimer, onDismiss:stopRestTimer, volume: state.profile.alertVolume}) : null,
      h("nav",{style:{display:"flex",background:C.shroudDeep,borderTop:"1px solid "+C.taupeDim}},
        TABS.map(function(t){ return h("button",{key:t.k, onClick:function(){setTab(t.k);},
          style:{flex:1,padding:"10px 0",display:"flex",flexDirection:"column",alignItems:"center",gap:3,background:"transparent",border:"none",color:tab===t.k?C.pin:C.taupe}},
          h(Icon,{name:t.icon,size:19}), h("span",{style:{fontFamily:sansCond,fontSize:10.5,fontWeight:600}}, t.label)); })))
  );
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
(function boot(){
  var rootEl = document.getElementById("root");
  rootEl.innerHTML = "";
  var loading = document.createElement("div");
  loading.style.cssText = "min-height:100vh;display:flex;align-items:center;justify-content:center;color:"+C.taupe+";font-family:"+sansCond+";font-size:15px;";
  loading.textContent = "Chargement du carnet…";
  rootEl.appendChild(loading);

  loadInitialState().then(function(state){
    var root = ReactDOM.createRoot(rootEl);
    root.render(h(App, {initialState: state}));
  }).catch(function(){
    var root = ReactDOM.createRoot(rootEl);
    root.render(h(App, {initialState: seedState()}));
  });
})();
</script>

<script>
// v2 (2026-09-04) : le fetch handler du service worker est déjà en
// network-first (voir service-worker.js), donc une simple réouverture de
// l'appli va normalement chercher index.html à jour sur GitHub Pages. Le
// trou restant : sur mobile, l'appli PWA n'est presque jamais "relancée à
// froid" — l'OS la garde gelée en arrière-plan quand tu changes d'appli,
// puis la ranime telle quelle (le JS déjà chargé continue de tourner) sans
// jamais refaire de navigation ni redéclencher la vérif de mise à jour du
// navigateur. Résultat vu par l'utilisateur : "je dois réinstaller l'appli
// pour voir mes changements" alors que le vrai problème est juste que la
// vérif ne se relance jamais toute seule. Deux ajouts pour ça :
// 1) reg.update() forcé à chaque retour au premier plan (visibilitychange)
//    — revérifie service-worker.js sur le réseau, indépendamment de tout
//    cache navigateur, à chaque fois que tu reviens sur l'appli ;
// 2) reload() automatique une seule fois quand un nouveau service worker
//    prend le contrôle (controllerchange) — sinon le nouveau code est bien
//    activé en arrière-plan mais la page déjà ouverte continue de tourner
//    avec l'ancien JS déjà en mémoire jusqu'à un rechargement.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("service-worker.js").then(function(reg){
      document.addEventListener("visibilitychange", function(){
        if (document.visibilityState === "visible") reg.update().catch(function(){});
      });
    }).catch(function(){});
    var reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if (reloaded) return;
      reloaded = true;
      window.location.reload();
    });
  });
}
</script>
